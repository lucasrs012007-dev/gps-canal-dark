<!doctype html>
<html lang="pt-BR">
<head>

<link rel="icon" href="data:,">
<style>
/* Camada unica de tokens, espelhando tokens/colors.json (dark), spacing, typography, motion, borders, opacity. */
:root{
  --surface-page:#030712; --surface-sunken:#000000; --surface-raised:#1f2937;
  --text-primary:#f9fafb; --text-secondary:#9ca3af;
  --border-default:#1f2937; --border-strong:#6b7280; --focus-ring:#60a5fa;
  --action-primary:#2563eb; --action-primary-hover:#1d4ed8;
  --action-secondary:#111827; --action-secondary-hover:#374151;
  --space-1:4px; --space-2:8px; --space-3:12px;
  --radius-button:6px; --radius-card:8px; --border-width:1px; --focus-width:2px;
  --font-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
  --font-size-xs:12px; --font-size-sm:14px; --weight-medium:500;
  --duration-fast:100ms; --ease-out:cubic-bezier(0,0,.2,1);
  --opacity-disabled:.45; --target-min:44px; --chrome-h:128px; --press-offset:1px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}
.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-2)}
.stage{width:min(100%,calc((100dvh - var(--chrome-h)) * 9 / 16));aspect-ratio:9/16}
canvas{display:block;width:100%;height:100%;border-radius:var(--radius-card);background:var(--surface-sunken)}
.controls{width:100%;max-width:calc(var(--target-min) * 12);display:flex;align-items:center;gap:var(--space-2)}
.btn{min-height:var(--target-min);min-width:var(--target-min);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);
  padding:0 var(--space-3);border:var(--border-width) solid var(--border-default);border-radius:var(--radius-button);
  background:var(--action-secondary);color:var(--text-primary);font:var(--weight-medium) var(--font-size-sm)/1 var(--font-sans);cursor:pointer;
  transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out)}
.btn svg{width:var(--font-size-sm);height:var(--font-size-sm);fill:currentColor}
.btn:hover{background:var(--action-secondary-hover)}
.btn-primary{background:var(--action-primary);border-color:var(--action-primary)}
.btn-primary:hover{background:var(--action-primary-hover)}
.btn:focus-visible,.seek:focus-visible{outline:var(--focus-width) solid var(--focus-ring);outline-offset:var(--focus-width)}
.btn:active{transform:translateY(var(--press-offset))}
.btn:disabled{opacity:var(--opacity-disabled);cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress}
.btn[aria-pressed="true"]{background:var(--surface-raised);border-color:var(--border-strong)}
.seek{flex:1;min-width:0;min-height:var(--target-min);accent-color:var(--action-primary);cursor:pointer}
.seek:disabled{opacity:var(--opacity-disabled)}
.time{font:var(--font-size-xs)/1 var(--font-mono);color:var(--text-secondary);white-space:nowrap}
.status{margin:0;font-size:var(--font-size-xs);color:var(--text-secondary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<body>
<main class="app">
  <h1 class="sr-only">Previa do Short V3: O Pix de 1 Centavo</h1>

    </button>
    <input id="seek" class="seek" type="range" min="0" max="42" step="0.01" value="0" aria-label="Progresso" disabled>
    <output id="time" class="time" for="seek">0,0 / 42,0</output>
    <button id="cc" class="btn" type="button" aria-pressed="false">Legendas</button>
  </div>
  <p id="status" class="status" aria-live="polite">Procurando audio/mix_final.mp3 e audio/eventos.json...</p>
</main>
<script>
(() => {
'use strict';
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const main = cv.getContext('2d');
let g = main;

/* Paleta V3 (Dopamina Visual) - Video 03 "O Pix de 1 Centavo" */
const PAL = {
  bgNavy: '#0A0F1D',
  bgViolet: '#130926',
  bgRed: '#3B0A0A',
  bgYellow: '#261E0A',
  bgDeep: '#050711',
  wall: '#111629',
  wallDark: '#090c18',
  floor: '#080b14',
  wood: '#281a15',
  woodDark: '#19100c',
  woodLine: '#3b261e',
  bed: '#1d2440',
  sheet: '#2b3659',
  curtain: '#231638',
  curtainFold: '#150d24',
  skin: '#dfb394',
  skinShadow: '#b88869',
  hair: '#171522',
  ink: '#090b12',
  /* Cor de destaque fixa da protagonista Marina: blusa/pijama rosa-magenta vibrante */
  top: '#e11d6c',
  topShade: '#b01253',
  topDeep: '#780b38',
  pants: '#1e253d',
  pantsDark: '#13182a',
  pixGreen: '#00d09c',
  pixDark: '#063329',
  cyan: '#38d9ff',
  cyanCore: '#dff8ff',
  violet: '#8b5cf6',
  yellow: '#FFD400',
  alert: '#FF3B30',
  alertDark: '#991616',
  text: '#f5f7fb',
  dim: '#94a3b8',
  card: '#121828',
  phone: '#090d16',
  phoneEdge: '#32405c',
  sweat: '#9ae6ff',
  moon: '#bae6fd'
};

const MONO = '"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace';
const SANS = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const COND = '"Arial Narrow","Roboto Condensed","Liberation Sans Narrow",Impact,Arial,sans-serif';

/* Utilidades deterministicas */
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const prog = (t, a, b) => clamp((t - a) / Math.max(0.001, b - a));
const bell = (t, a, b) => Math.sin(Math.PI * prog(t, a, b));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (t, seed=0) => {
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57), hash(i + 1 + seed * 57), u) * 2 - 1;
};
const hexRgb = h => {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgba = (hex, a) => {
  const [r, gr, b] = hexRgb(hex);
  return `rgba(${r},${gr},${b},${a})`;
};
function mixHex(h1, h2, k){
  k = clamp(k);
  const a = hexRgb(h1), b = hexRgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
}
function mulberry(a){
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(x, y, w, h, r){
  const rad = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function circ(x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ell(x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function glow(x, y, r, col, a){
  if (a <= 0.002) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a));
  gr.addColorStop(1, rgba(col, 0));
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}
function vgrad(c1, c2, y0=-320, y1=H+320){
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, c1);
  gr.addColorStop(1, c2);
  g.fillStyle = gr;
  g.fillRect(-420, y0, W + 840, y1 - y0);
}
function popScale(age, dur=0.11){
  if (age <= 0) return 0.68;
  const k = clamp(age / dur);
  if (k < 0.62) return lerp(0.68, 1.10, easeOut(k / 0.62));
  return lerp(1.10, 1.0, ease((k - 0.62) / 0.38));
}

/* Helper anti-vazamento: mede sempre com a fonte real instalada (Windows/Linux/Colab) */
function drawFittedText(text, x, y, maxW, maxFs, family, weight='900', align='center'){
  let fs = maxFs;
  g.font = `${weight} ${fs}px ${family}`;
  const w = g.measureText(text).width;
  if (w > maxW && w > 0) {
    fs = Math.max(18, Math.floor(maxFs * (maxW / w)));
    g.font = `${weight} ${fs}px ${family}`;
  }
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(text, x, y);
  return fs;
}

/* Quebra multi-linha respeitando maxW sem nunca vazar da caixa */
function drawWrappedCenter(text, cx, yStart, maxW, fs, lh, family, weight='800'){
  g.font = `${weight} ${fs}px ${family}`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const cand = cur ? `${cur} ${w}` : w;
    if (g.measureText(cand).width > maxW && cur) {
      lines.push(cur);
      cur = w;
    } else {
      cur = cand;
    }
  }
  if (cur) lines.push(cur);
  let y = yStart;
  for (const ln of lines) {
    drawFittedText(ln, cx, y, maxW, fs, family, weight, 'center');
    y += lh;
  }
  return y;
}

/* ============================================================
   OTIMIZACAO V3 (video-director):
   1) Depth of Field ultrarrapido em 1/8 resolucao (135x240)
      + blur(2px) = visual identico a blur(8px), >16x menos pixels!
   2) Vinheta pre-renderizada 1 unica vez em offscreen (vigCv).
   ============================================================ */
const DOF_SCALE = 0.125;
const DOF_PAD = 4;
const dofCv = document.createElement('canvas');
dofCv.width = Math.round(W * DOF_SCALE) + DOF_PAD * 2;
dofCv.height = Math.round(H * DOF_SCALE) + DOF_PAD * 2;
const dofCtx = dofCv.getContext('2d');

const dofBlurCv = document.createElement('canvas');
dofBlurCv.width = dofCv.width;
dofBlurCv.height = dofCv.height;
const dofBlurCtx = dofBlurCv.getContext('2d');

function withBlur(px, fn){
  const m = main.getTransform();
  dofCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofCtx.globalAlpha = 1;
  dofCtx.globalCompositeOperation = 'source-over';
  dofCtx.filter = 'none';
  dofCtx.fillStyle = PAL.bgNavy;
  dofCtx.fillRect(0, 0, dofCv.width, dofCv.height);
  dofCtx.translate(DOF_PAD, DOF_PAD);
  dofCtx.scale(DOF_SCALE, DOF_SCALE);
  dofCtx.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g = dofCtx;
  fn();
  g = main;

  /* Aplica blur leve sobre apenas ~36K pixels (muito rapido em CPU) */
  const r = Math.max(1.2, px * DOF_SCALE * 1.45);
  dofBlurCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofBlurCtx.clearRect(0, 0, dofBlurCv.width, dofBlurCv.height);
  dofBlurCtx.filter = `blur(${r.toFixed(2)}px)`;
  dofBlurCtx.drawImage(dofCv, 0, 0);
  dofBlurCtx.filter = 'none';

  main.save();
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.imageSmoothingEnabled = true;
  main.imageSmoothingQuality = 'high';
  const padOut = DOF_PAD / DOF_SCALE;
  main.drawImage(dofBlurCv, -padOut, -padOut, W + padOut * 2, H + padOut * 2);
  main.restore();
}

/* Vinheta pre-renderizada uma unica vez no carregamento (zero createRadialGradient por frame) */
const vigCv = document.createElement('canvas');
vigCv.width = W; vigCv.height = H;
(() => {
  const vx = vigCv.getContext('2d');
  const gr = vx.createRadialGradient(540, 960, 260, 540, 960, 1220);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, 'rgba(0,0,0,1)');
  vx.fillStyle = gr;
  vx.fillRect(0, 0, W, H);
})();

/* ============================================================
   TIMELINE ORIENTADA A eventos.json + FALLBACK MODO PREVIA V3
   ============================================================ */
const EV_PREVIEW = {
  video_id: 3,
  slug: 'o-pix-de-um-centavo',
  titulo: 'O Pix de 1 Centavo',
  gancho: 0.0,
  vibra_cama: 2.15,
  pix_1: 3.0,
  marina_ri: 4.7,
  congela: 6.1,
  nao_acende: 7.5,
  hora_0313: 8.7,
  pix_2: 9.7,
  desc_2: 11.4,
  tranca_porta: 13.0,
  corredor_breu: 14.6,
  pix_3: 16.2,
  fecha_janela: 17.9,
  trava_janela: 20.1,
  trava_janela_duracao: 1.4,
  hora_0314: 21.5,
  pix_4: 23.2,
  msg_final: 25.0,
  plot_twist: 26.7,
  guarda_roupa: 28.0,
  guarda_roupa_duracao: 1.6,
  abre_devagar: 29.7,
  cta: 32.7,
  cta_acao: 35.1,
  duracao_total: 36.6
};

let EV = { ...EV_PREVIEW };
let duration = EV.duracao_total;
let audio = null;
let captionGroups = [];
let BLINKS = [];
let EXPR_CUES = [];
let SHOTS = [];

/* Divide cada segmento em sub-planos garantidos entre 1.0s e 1.8s (Motor V3) */
function splitShots(a, b, specs){
  const span = Math.max(0.05, b - a);
  let count = Math.ceil(span / 1.74);
  if (count < 1) count = 1;
  while (count > 1 && (span / count) < 0.90) count--;
  const out = [];
  for (let i = 0; i < count; i++) {
    const s0 = a + (span * i) / count;
    const s1 = i === count - 1 ? b : a + (span * (i + 1)) / count;
    const sp = specs[i % specs.length];
    out.push({
      start: +s0.toFixed(3),
      end: +s1.toFixed(3),
      dur: +(s1 - s0).toFixed(3),
      ...sp
    });
  }
  return out;
}

function buildShots(e){
  const end = e.duracao_total;
  const raw = [];
  const push = arr => { for (const s of arr) raw.push(s); };

  // 1. Gancho 03:12: quarto escuro + celular vibrando na cama
  push(splitShots(0, e.pix_1, [
    { scene: 'quarto_cama',   mood: 'navy',   vig: 0.56, cam0: [1.00, 540, 960], cam1: [1.10, 520, 940] },
    { scene: 'celular_vibra', mood: 'violet', vig: 0.58, cam0: [1.04, 540, 940], cam1: [1.16, 540, 910] }
  ]));

  // 2. Pix 1 (R$ 0,01 estilo app brasileiro)
  push(splitShots(e.pix_1, e.marina_ri, [
    { scene: 'pix_1_card', mood: 'navy', vig: 0.56, cam0: [1.00, 540, 920], cam1: [1.12, 540, 895] }
  ]));

  // 3. Marina abre o banco rindo (smirk)
  push(splitShots(e.marina_ri, e.congela, [
    { scene: 'marina_rindo', mood: 'violet', vig: 0.54, cam0: [1.00, 540, 950], cam1: [1.11, 540, 925] }
  ]));

  // 4. Marina congela -> descricao "Nao acende a luz"
  push(splitShots(e.congela, e.hora_0313, [

  // 5. 03:13 Outro Pix de 1 centavo -> "Eu sei que voce esta acordada"
  push(splitShots(e.hora_0313, e.tranca_porta, [

    { scene: 'pix_2_desc',   mood: 'yellow', vig: 0.66, cam0: [1.06, 540, 905], cam1: [1.18, 540, 880] },
    { scene: 'marina_olhar', mood: 'violet', vig: 0.68, cam0: [1.02, 540, 950], cam1: [1.13, 560, 925] }

  // 6. Marina tranca a porta do quarto (corpo inteiro com pes no chao)
  push(splitShots(e.tranca_porta, e.corredor_breu, [

  ]));

  // 7. Corredor la fora no breu
  push(splitShots(e.corredor_breu, e.pix_3, [
    { scene: 'corredor_breu', mood: 'dark', vig: 0.78, cam0: [1.00, 540, 940], cam1: [1.14, 540, 910] }
  ]));

  // 8. Terceiro Pix (pulso vermelho-alerta #3B0A0A): "A janela nao tem grade"
  push(splitShots(e.pix_3, e.fecha_janela, [
    { scene: 'pix_3_alerta', mood: 'red', vig: 0.68, cam0: [1.00, 540, 920], cam1: [1.10, 540, 900] },
    { scene: 'pix_3_alerta', mood: 'red', vig: 0.72, cam0: [1.14, 540, 885], cam1: [1.24, 540, 865] }
  ]));

  // 9. Marina corre ate a janela e fecha a cortina
  push(splitShots(e.fecha_janela, e.trava_janela, [
    { scene: 'marina_janela', mood: 'red',    vig: 0.66, cam0: [1.00, 515, 960], cam1: [1.12, 565, 935] },
    { scene: 'cortina_puxa',  mood: 'violet', vig: 0.70, cam0: [1.04, 540, 940], cam1: [1.15, 540, 910] }
  ]));

  // 10. Bloco SFX puro [SFX:trava_janela:1.4]: macro no trinco + cortina cerrando
  push(splitShots(e.trava_janela, e.hora_0314, [
    { scene: 'macro_trava_janela', mood: 'red', vig: 0.72, cam0: [1.02, 540, 940], cam1: [1.16, 540, 915] }
  ]));

  // 11. 03:14 Celular vibra pela ultima vez -> Quarto Pix (R$ 0,01)
  push(splitShots(e.hora_0314, e.msg_final, [
    { scene: 'celular_breu', mood: 'red', vig: 0.76, cam0: [1.00, 540, 940], cam1: [1.12, 540, 915] },
    { scene: 'pix_4_alerta', mood: 'red', vig: 0.72, cam0: [1.04, 540, 915], cam1: [1.17, 540, 885] }
  ]));

  // 12. "Obrigado por trancar a janela. Eu nao estava la fora." -> bigFace choque extremo!
  push(splitShots(e.msg_final, e.guarda_roupa, [
    { scene: 'pix_4_twist', mood: 'red', vig: 0.70, cam0: [1.00, 540, 910], cam1: [1.14, 540, 885] },
    { scene: 'big_face',    mood: 'red', vig: 0.78, cam0: [1.04, 540, 930], cam1: [1.18, 540, 905] }
  ]));

  // 13. Bloco SFX puro [SFX:guarda_roupa:1.6]: porta do guarda-roupa abre no escuro
  push(splitShots(e.guarda_roupa, e.abre_devagar, [
    { scene: 'guarda_roupa_fenda', mood: 'dark', vig: 0.80, cam0: [1.00, 540, 940], cam1: [1.14, 540, 915] }
  ]));

  // 14. "No escuro do quarto, a porta do guarda-roupa... abre devagar." -> olhos na fresta!
  push(splitShots(e.abre_devagar, e.cta, [
    { scene: 'guarda_roupa_abre',  mood: 'red', vig: 0.78, cam0: [1.04, 540, 930], cam1: [1.17, 540, 900] },
    { scene: 'guarda_roupa_olhos', mood: 'red', vig: 0.82, cam0: [1.12, 540, 900], cam1: [1.26, 540, 875] }
  ]));

  // 15. CTA final (ultimos ~3.5s, pilula amarela 100% blindada contra vazamento)
  push(splitShots(e.cta, end, [
    { scene: 'cta_engine',        mood: 'violet', vig: 0.48, cam0: [1.00, 540, 940], cam1: [1.07, 540, 925] },
    { scene: 'cta_comente',       mood: 'yellow', vig: 0.46, cam0: [1.01, 540, 940], cam1: [1.08, 540, 925] },
    { scene: 'cta_comente_pulse', mood: 'yellow', vig: 0.44, cam0: [1.04, 540, 935], cam1: [1.10, 540, 920] }
  ]));

  return raw.map((s, idx) => ({ id: idx + 1, ...s }));
}

function normalizeEvents(raw, audioDur){
  const e = { ...EV_PREVIEW, ...(raw || {}) };
  const dur = Math.max(audioDur || 0, Number(e.duracao_total) || EV_PREVIEW.duracao_total);
  e.duracao_total = dur;
  if (raw) {
    for (const k of Object.keys(EV_PREVIEW)) {
      if (typeof EV_PREVIEW[k] === 'number' && raw[k] !== undefined) e[k] = Number(raw[k]);
    }
  }
  EV = e;
  duration = dur;
  SHOTS = buildShots(EV);

  /* Expressao da Marina troca escondida na piscada 2 frames (0.067s) antes do evento */
  EXPR_CUES = [
    [0, 'neutral'],
    [EV.marina_ri, 'smirk'],
    [EV.congela, 'fear'],
    [EV.pix_3, 'fear'],
    [EV.plot_twist, 'shock']
  ];
  const bl = [];
  let bt = 0.85, bi = 0;
  while (bt < duration + 1) { bl.push(bt); bt += 2.5 + hash(bi++ * 9.7) * 1.5; }
  for (const [ct] of EXPR_CUES) if (ct > 0.2) bl.push(Math.max(0.05, ct - 0.067));
  BLINKS = bl.sort((a, b) => a - b);
}

const exprAt = t => { let ex = 'neutral'; for (const [a, b] of EXPR_CUES) if (t >= a - 0.01) ex = b; return ex; };
function faceAt(t){
  let last = -1, prev = -1;
  for (const b of BLINKS) { if (b <= t) { prev = last; last = b; } else break; }
  const d = t - last;
  const closed = last >= 0 && d < 0.16 ? Math.sin((d / 0.16) * Math.PI) : 0;
  const ref = last < 0 ? 0 : (d < 0.08 ? (prev < 0 ? 0 : prev + 0.08) : last + 0.08);
  return { ex: exprAt(ref), closed };
}

/* ============================================================
   MOTOR V3: FUNDOS VIBRANTES PULSANTES + PARTICULAS CONTINUAS
   ============================================================ */
const PARTICLES = (() => {
  const rng = mulberry(202603);
  const arr = [];
  for (let i = 0; i < 42; i++) {
    arr.push({
      x: rng() * (W + 300) - 150,
      y: rng() * (H + 300) - 150,
      vx: (rng() - 0.44) * 28,
      vy: -(14 + rng() * 38),
      r: 2.2 + rng() * 5.8,
      layer: i < 22 ? 0 : 1,
      ph: rng() * Math.PI * 2,
      a: 0.14 + rng() * 0.30
    });
  }
  return arr;
})();

function drawParticles(t, mood){
  const colPrimary = mood === 'red' ? PAL.alert : (mood === 'yellow' ? PAL.yellow : PAL.cyan);
  const colAlt = mood === 'red' ? '#ff8a5b' : (mood === 'yellow' ? '#fff3a1' : PAL.violet);
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < PARTICLES.length; i++) {
    const p = PARTICLES[i];
    const sp = p.layer === 1 ? 1.4 : 0.7;
    const spanW = W + 300, spanH = H + 300;
    const px = ((((p.x + p.vx * t * sp) + 150) % spanW) + spanW) % spanW - 150;
    const py = ((((p.y + p.vy * t * sp) + 150) % spanH) + spanH) % spanH - 150;
    const tw = 0.55 + 0.45 * Math.sin(t * (2.6 + p.layer * 1.4) + p.ph);
    const col = (i % 3 === 0) ? colAlt : colPrimary;
    const a = p.a * tw * (mood === 'dark' ? 0.50 : 1.0);
    g.fillStyle = rgba(col, a);
    circ(px, py, p.r);
  }
  g.restore();
}

function drawBackdrop(t, mood){
  const pulseSlow = 0.5 + 0.5 * Math.sin(t * 3.8);
  const pulseFast = 0.5 + 0.5 * Math.sin(t * 7.8);
  let top = PAL.bgNavy, bot = PAL.bgViolet, glowCol = PAL.cyan, glowA = 0.15;

  if (mood === 'violet') {
    top = mixHex(PAL.bgViolet, PAL.bgNavy, pulseSlow * 0.35);
    bot = PAL.bgNavy;
    glowCol = PAL.violet;
    glowA = 0.20;
  } else if (mood === 'yellow') {
    top = mixHex(PAL.bgNavy, PAL.bgYellow, 0.48 + 0.46 * pulseFast);
    bot = mixHex(PAL.bgViolet, PAL.bgYellow, 0.36 + 0.42 * pulseFast);
    glowCol = PAL.yellow;
    glowA = 0.24;
  } else if (mood === 'red') {
    top = mixHex(PAL.bgViolet, PAL.bgRed, 0.54 + 0.46 * pulseFast);
    bot = mixHex(PAL.bgNavy, PAL.bgRed, 0.44 + 0.46 * pulseFast);
    glowCol = PAL.alert;
    glowA = 0.28 + 0.12 * pulseFast;
  } else if (mood === 'dark') {
    top = PAL.bgDeep;
    bot = mixHex(PAL.bgDeep, PAL.bgNavy, 0.50);
    glowCol = PAL.cyan;
    glowA = 0.08;
  } else {
    top = mixHex(PAL.bgNavy, PAL.bgViolet, pulseSlow * 0.35);
    bot = PAL.bgDeep;
  }

  vgrad(top, bot);
  glow(540 + Math.sin(t * 0.8) * 80, 740, 620, glowCol, glowA);
  drawParticles(t, mood);
}

/* ============================================================
   RIG FLAT EM CAPSULA (10 PONTOS IK) - MARINA (BLUSA #E11D6C)
   ============================================================ */
function drawEyes(cx, cy, r, ex, closed, lookX=0){
  const lift = { neutral: 0, smirk: -0.02, worry: 0.06, fear: 0.12, shock: 0.20 }[ex] || 0;
  const tilt = { neutral: 0, smirk: -0.04, worry: 0.12, fear: 0.11, shock: 0.05 }[ex] || 0;
  const eyePositions = [[cx + r * 0.06, 1], [cx + r * 0.52, -1]];
  g.lineCap = 'round';

  for (const [x, inner] of eyePositions) {
    const y = cy - r * 0.05;
    const browY = y - r * (0.27 + lift);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.068;
    g.beginPath();
    g.moveTo(x - inner * r * 0.14, browY + (ex === 'worry' || ex === 'fear' ? r * 0.035 : 0));
    g.lineTo(x + inner * r * 0.13, browY - tilt * r);
    g.stroke();

    if (closed > 0.55) {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * 0.055;
      g.beginPath(); g.moveTo(x - r * 0.11, y); g.lineTo(x + r * 0.11, y); g.stroke();
      continue;
    }

    if (ex === 'smirk') {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * 0.064;
      g.beginPath(); g.arc(x, y + r * 0.06, r * 0.115, Math.PI * 1.12, Math.PI * 1.88); g.stroke();
      continue;
    }

    const scaleY = 1 - closed * 0.9;
    g.save();
    g.translate(x, y);
    g.scale(1, scaleY);

    if (ex === 'shock' || ex === 'fear' || ex === 'worry') {
      const rx = ex === 'shock' ? r * 0.23 : ex === 'fear' ? r * 0.19 : r * 0.15;
      const ry = ex === 'shock' ? r * 0.26 : ex === 'fear' ? r * 0.21 : r * 0.17;
      g.fillStyle = PAL.text;
      ell(0, 0, rx, ry);
      const pr = ex === 'shock' ? r * 0.056 : ex === 'fear' ? r * 0.075 : r * 0.084;
      g.fillStyle = PAL.ink;
      circ(r * 0.03 + lookX * r * 0.05, 0, pr);
      g.fillStyle = PAL.text;
      circ(r * 0.05 + lookX * r * 0.05, -pr * 0.45, pr * 0.34);
    } else {
      g.fillStyle = PAL.ink;
      ell(0, 0, r * 0.095, r * 0.12);
      g.fillStyle = PAL.text;
      circ(r * 0.03 + lookX * r * 0.03, -r * 0.045, r * 0.028);
    }
    g.restore();
  }

  if (ex === 'smirk') {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.052;
    g.beginPath(); g.arc(cx + r * 0.30, cy + r * 0.24, r * 0.17, Math.PI * 0.12, Math.PI * 0.78); g.stroke();
  } else if (ex === 'shock') {
    g.fillStyle = rgba(PAL.ink, 0.85);
    ell(cx + r * 0.29, cy + r * 0.40, r * 0.095, r * 0.13);
    /* Gota de suor frio */
    g.fillStyle = rgba(PAL.sweat, 0.92);
    const sx = cx + r * 0.82, sy = cy - r * 0.34;
    g.beginPath();
    g.moveTo(sx, sy - r * 0.18);
    g.quadraticCurveTo(sx + r * 0.09, sy + r * 0.02, sx, sy + r * 0.08);
    g.quadraticCurveTo(sx - r * 0.09, sy + r * 0.02, sx, sy - r * 0.18);
    g.fill();
  } else if (ex === 'fear' || ex === 'worry') {
    g.strokeStyle = rgba(PAL.ink, 0.72);
    g.lineWidth = r * 0.048;
    g.beginPath();
    g.moveTo(cx + r * 0.18, cy + r * 0.36);
    g.lineTo(cx + r * 0.40, cy + r * (ex === 'fear' ? 0.33 : 0.36));
    g.stroke();
  }
}

function drawHeadMarina(cx, cy, r, ex, closed, o={}){
  const tilt = o.tilt || 0;
  g.save();
  g.translate(cx, cy);
  g.rotate(tilt);

  /* Coque/rabo atras da cabeca (silhueta feminina limpa e reconhecivel) */
  g.fillStyle = PAL.hair;
  circ(-r * 0.98, -r * 0.22, r * 0.42);
  /* Elasticos discreto rosa-magenta */
  g.strokeStyle = PAL.top; g.lineWidth = r * 0.08;
  g.beginPath(); g.arc(-r * 0.76, -r * 0.18, r * 0.22, Math.PI * 0.6, Math.PI * 1.45); g.stroke();

  /* Cabeca redonda flat sem contorno preto pesado */
  g.fillStyle = PAL.skin;
  circ(0, 0, r);

  g.save();
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
  g.fillStyle = rgba(PAL.ink, 0.14);
  circ(-r * 1.08, r * 0.16, r * 0.96);
  g.restore();

  /* Cabelo sem costura cobrindo nuca e franja lateral limpa */
  g.fillStyle = PAL.hair;
  g.beginPath();
  g.arc(-r * 0.04, -r * 0.05, r * 1.04, Math.PI * 0.74, -Math.PI * 0.16, false);
  g.quadraticCurveTo(r * 0.46, -r * 0.56, -r * 0.14, -r * 0.54);
  g.quadraticCurveTo(-r * 0.56, -r * 0.46, -r * 0.64, -r * 0.06);
  g.quadraticCurveTo(-r * 0.68, r * 0.34, -r * 0.84, r * 0.72);
  g.closePath();
  g.fill();

  /* Orelha flat limpa */
  g.fillStyle = PAL.skin;
  circ(-r * 0.66, r * 0.12, r * 0.18);
  g.fillStyle = rgba(PAL.skinShadow, 0.6);
  circ(-r * 0.67, r * 0.13, r * 0.08);

  /* Rim light coerente com a fonte da cena */
  if (o.rimA > 0) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';
    g.strokeStyle = rgba(o.rimColor || PAL.cyan, o.rimA);
    g.lineWidth = r * 0.078;
    g.beginPath();
    g.arc(0, 0, r * 0.97, (o.rimAng || 0) - 0.85, (o.rimAng || 0) + 0.85);
    g.stroke();
    g.restore();
  }

  drawEyes(0, 0, r, ex, closed, o.lookX || 0);
  g.restore();
}

function ik(sx, sy, hx, hy, l1, l2, flip=1){
  const dx = hx - sx, dy = hy - sy;
  const d = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01);
  const a = Math.atan2(dy, dx);
  const c = clamp((l1*l1 + d*d - l2*l2) / (2*l1*d), -1, 1);
  const an = a + flip * Math.acos(c);
  return [sx + Math.cos(an) * l1, sy + Math.sin(an) * l1];
}
function drawLimb(s, h, l1, l2, w, col, handCol, flip=1){
  const e = ik(s[0], s[1], h[0], h[1], l1, l2, flip);
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(s[0], s[1]); g.lineTo(e[0], e[1]); g.lineTo(h[0], h[1]); g.stroke();
  if (handCol) { g.fillStyle = handCol; circ(h[0], h[1], w * 0.52); }
  return e;
}
const mix = (a, b, k) => { if (k) { a[0] = lerp(a[0], b[0], k); a[1] = lerp(a[1], b[1], k); } };

/* Marina corpo inteiro (rig 10 pontos IK com pes travados no chao gy) */
function drawMarinaStanding(x, gy, s, o){
  const t = o.t, P = o.pose || {};
  const run = P.run || 0;
  const br = Math.sin(t * 2 * Math.PI / (o.fastBreath ? 1.45 : 3.0));
  const step = Math.sin(t * 10.5) * run;

  g.save();
  g.translate(x, gy);
  g.scale(s * (o.face || 1), s);

  /* Sombra de contato firme no plano do chao (y = 0) */
  g.fillStyle = 'rgba(0,0,0,.55)';
  ell(4, 0, 114, 15);

  const hipY = -224 - Math.abs(step) * 10;
  const shY = -430 - br * 5;
  const hx = 6, hy = shY - 102 - br * 2;

  const footF = [-24 - step * 48, -14];
  const footN = [24 + step * 48, -14];
  drawLimb([-16, hipY + 8], footF, 108, 106, 34, PAL.pantsDark, null, -1);
  drawLimb([16, hipY + 8], footN, 108, 106, 36, PAL.pants, null, -1);

  for (const [fx, fy, dark] of [[footF[0] + 10, -11, true], [footN[0] + 10, -11, false]]) {
    g.fillStyle = dark ? '#1a1524' : '#2d243b';
    ell(fx, fy, 40, 12);
  }

  const SN = [-8, shY + 46], SF = [24, shY + 44];
  const hn = [-4, hipY + 26], hf = [38, hipY + 24];
  mix(hn, [88, shY + 135], P.phone); mix(hf, [62, shY + 145], P.phone);
  mix(hn, [145, shY + 55], P.reach); mix(hf, [118, shY + 105], P.reach);
  mix(hn, [68 + step * 42, hipY - 12], run); mix(hf, [-32 - step * 42, hipY - 12], run);
  const handMinY = hy + 96;
  hn[1] = Math.max(hn[1], handMinY);
  hf[1] = Math.max(hf[1], handMinY);

  drawLimb(SF, hf, 112, 108, 32, PAL.topShade, PAL.skinShadow, 1);

  /* Tronco em capsula flat limpo (blusa rosa-magenta fixa) */
  g.fillStyle = PAL.top;
  rr(-64, shY - 10, 128, (hipY - shY) + 34, 60); g.fill();
  g.save();
  rr(-64, shY - 10, 128, (hipY - shY) + 34, 60); g.clip();
  g.fillStyle = rgba(PAL.topDeep, 0.36);
  g.fillRect(-72, shY - 18, 42, 280);
  g.restore();

  g.fillStyle = PAL.skinShadow;
  rr(-10, shY - 36, 30, 36, 12); g.fill();

  drawHeadMarina(hx, hy, 78, o.ex, o.closed, {
    tilt: (o.tilt || 0) + br * 0.015,
    rimA: o.rimA ?? 0.72,
    rimColor: o.rimColor || PAL.cyan,
    rimAng: o.rimAng ?? 0.1,
    lookX: o.lookX || 0
  });

  drawLimb(SN, hn, 112, 108, 32, PAL.top, PAL.skin, 1);

  if (P.phone > 0.5) {
    g.fillStyle = PAL.phone; rr(hn[0] - 18, hn[1] - 40, 38, 70, 9); g.fill();
    g.fillStyle = rgba(PAL.cyanCore, 0.95); rr(hn[0] - 13, hn[1] - 34, 28, 56, 5); g.fill();
    glow(hn[0], hn[1] - 10, 220, o.rimColor || PAL.cyan, 0.35);
  }
  g.restore();
}

/* Cenario base do quarto escuro da Marina (cama + guarda-roupa fechado ao fundo) */
function drawBedroom(t, o={}){

  g.fillStyle = '#1d253d';
  g.fillRect(-150, 1240, W + 300, 8);

  /* Guarda-roupa ao fundo (pista visual plantada desde o inicio!) */
  const wx = o.wardrobeX ?? 695, wy = 520, ww = 295, wh = 720;
  g.fillStyle = PAL.woodDark; rr(wx, wy, ww, wh, 14); g.fill();
  g.strokeStyle = PAL.woodLine; g.lineWidth = 5; rr(wx, wy, ww, wh, 14); g.stroke();
  /* Divisao central das duas portas */
  g.beginPath(); g.moveTo(wx + ww / 2, wy + 12); g.lineTo(wx + ww / 2, wy + wh - 12); g.stroke();
  /* Puxadores */
  g.fillStyle = '#64748b';
  rr(wx + ww / 2 - 22, wy + 320, 8, 64, 4); g.fill();
  rr(wx + ww / 2 + 14, wy + 320, 8, 64, 4); g.fill();

  /* Janela a esquerda com luar entrando (se nao estiver oculta) */
  if (!o.hideWindow) {
    g.fillStyle = '#070e20'; rr(65, 440, 290, 420, 14); g.fill();
    g.strokeStyle = '#283452'; g.lineWidth = 10; rr(65, 440, 290, 420, 14); g.stroke();
    glow(210, 620, 260, PAL.moon, 0.16);
    if (o.curtainClosed) {
      g.fillStyle = PAL.curtain; rr(48, 415, 326, 495, 16); g.fill();
      g.fillStyle = PAL.curtainFold;
      for (let i = 0; i < 4; i++) g.fillRect(88 + i * 74, 425, 22, 475);
    }
  }
}

/* ============================================================
   CENAS INDIVIDUAIS DO VIDEO 03 ("O PIX DE 1 CENTAVO")
   ============================================================ */
function drawScene(shot, t){
  const localP = prog(t, shot.start, shot.end);
  const f = faceAt(t);
  drawBackdrop(t, shot.mood);

  switch (shot.scene) {
    /* 1. Quarto escuro 03:12 + celular acendendo na cama */
    case 'quarto_cama': {
      drawBedroom(t, {});
      /* Cama vista lateral com celular vibrando em cima do lencol */
      g.fillStyle = PAL.wood; rr(70, 960, 560, 285, 24); g.fill();
      g.fillStyle = PAL.sheet; rr(105, 1020, 510, 175, 44); g.fill();
      g.fillStyle = '#36446b'; rr(120, 985, 165, 78, 28); g.fill();
      /* Celular vibrando no lencol */
      const vib = Math.sin(t * 75) * 6 * (localP > 0.35 ? 1 : 0.2);
      const px = 450 + vib, py = 1045;
      glow(px, py, 240, PAL.cyan, 0.38);
      g.fillStyle = PAL.phone; rr(px - 44, py - 24, 88, 48, 12); g.fill();
      g.fillStyle = PAL.cyanCore; rr(px - 36, py - 18, 72, 36, 8); g.fill();
      /* Ondas de vibracao */
      for (let i = 0; i < 3; i++) {
        const wv = ((t * 2.4 + i * 0.33) % 1);
        g.strokeStyle = rgba(PAL.cyan, (1 - wv) * 0.75);
        g.lineWidth = 6;
        g.beginPath(); g.arc(px, py, 48 + wv * 140, 0, Math.PI * 2); g.stroke();
      }
      break;
    }

    /* 2. Close no celular vibrando sobre o lencol */
    case 'celular_vibra': {
      withBlur(8, () => {
        drawBackdrop(t, 'violet');
        drawBedroom(t, {});
      });
      const vibX = Math.sin(t * 88) * 10;
      g.save();
      g.translate(vibX, 0);
      for (let i = 0; i < 3; i++) {
        const wv = ((t * 2.6 + i * 0.33) % 1);
        g.strokeStyle = rgba(PAL.pixGreen, (1 - wv) * 0.72);
        g.lineWidth = 8;
        rr(540 - 360 - wv * 70, 835 - 500 - wv * 70, 720 + wv * 140, 1000 + wv * 140, 74); g.stroke();
      }
      drawPhone(540, 835, 720, 1000, (sx, sy, sw, sh) => {
        g.fillStyle = '#070c18'; g.fillRect(sx, sy, sw, sh);
        g.fillStyle = PAL.text;
        drawFittedText('03:12', sx + sw / 2, sy + 220, sw - 120, 130, MONO, '900', 'center');
        g.fillStyle = PAL.dim;
        drawFittedText('QUARTA-FEIRA', sx + sw / 2, sy + 325, sw - 140, 30, MONO, '700', 'center');
        /* Banner de notificacao na tela bloqueada */
        const pop = popScale(t - shot.start, 0.14);
        g.save();
        g.translate(sx + sw / 2, sy + 540);
        g.scale(pop, pop);
        g.fillStyle = rgba('#121c33', 0.96); rr(-300, -105, 600, 210, 32); g.fill();
        g.strokeStyle = PAL.pixGreen; g.lineWidth = 5; rr(-300, -105, 600, 210, 32); g.stroke();
        drawPixLogo(-225, 0, 34, PAL.pixGreen);
        g.fillStyle = PAL.pixGreen;
        drawFittedText('PIX RECEBIDO  •  AGORA', -158, -42, 420, 26, MONO, '800', 'left');
        g.fillStyle = PAL.text;
        drawFittedText('Você recebeu R$ 0,01', -158, 18, 430, 40, SANS, '800', 'left');
        g.fillStyle = PAL.dim;
        drawFittedText('Toque para abrir a mensagem', -158, 66, 430, 24, SANS, '600', 'left');
        g.restore();
      });
      g.restore();
      break;
    }

    /* 3. Pix 1 aberto no app bancario (R$ 0,01) */
    case 'pix_1_card': {
      withBlur(8, () => {
        drawBackdrop(t, 'navy');
        drawBedroom(t, {});
      });
      drawPhone(540, 835, 740, 1020, (sx, sy, sw, sh) => {
        drawPixScreen(sx, sy, sw, sh, {
          accent: PAL.pixGreen,
          time: '03:12',
          badge: 'COMPROVANTE PIX',
          header: 'PIX RECEBIDO',
          desc: 'Toque para ler a descrição...',
          descFs: 40,
          descLh: 52,
          age: t - shot.start
        });
      });
      break;
    }

    /* 4. Marina abre o banco rindo na cama */
    case 'marina_rindo': {
      drawBedroom(t, {});
      drawMarinaBed(460, 1050, 1.38, {
        t, ex: f.ex, closed: f.closed,
        rimA: 0.85, rimColor: PAL.pixGreen, lookX: 0.35
      });
      break;
    }

    /* 5. Marina congela (piscada -> fear) */
    case 'marina_congela': {
      withBlur(8, () => {
        drawBackdrop(t, 'violet');
        drawBedroom(t, {});
      });
      drawMarinaBed(470, 1130, 1.72, {
        t, ex: 'fear', closed: f.closed,

    }

    /* 6. Close na descricao do Pix 1: "NÃO ACENDE A LUZ." */
    case 'pix_1_desc': {
      withBlur(8, () => {
        drawBackdrop(t, 'red');
        drawBedroom(t, { red: true });
      });
      drawPhone(540, 835, 740, 1020, (sx, sy, sw, sh) => {
        drawPixScreen(sx, sy, sw, sh, {
          accent: PAL.alert,
          danger: true,
          time: '03:12',
          badge: 'PIX #1 - R$ 0,01',
          header: 'TRANSFERÊNCIA RECEBIDA',
          desc: 'NÃO ACENDE A LUZ.',
          descAlert: true,
          descFs: 66,
          descLh: 76,
          age: t - shot.start
        });
      });
      break;
    }

    /* 7. 03:13 - Segundo Pix chega vibrando */
    case 'pix_2_chega': {
      withBlur(8, () => {
        drawBackdrop(t, 'yellow');
        drawBedroom(t, {});
      });
      const vib = Math.sin(t * 78) * 8 * Math.exp(-(t - shot.start) * 4);
      g.save();
      g.translate(vib, 0);
      drawPhone(540, 835, 740, 1020, (sx, sy, sw, sh) => {
        drawPixScreen(sx, sy, sw, sh, {
          accent: PAL.yellow,
          time: '03:13',
          badge: '2o PIX - 1 MIN DEPOIS',
          header: 'OUTRO PIX RECEBIDO',
          desc: 'Carregando descrição...',
          descFs: 42,
          descLh: 54,
          age: t - shot.start
        });
      });
      g.restore();
      break;
    }

    /* 8. Descricao do Pix 2: "EU SEI QUE VOCÊ ESTÁ ACORDADA." */
    case 'pix_2_desc': {
      withBlur(8, () => {
        drawBackdrop(t, 'yellow');
        drawBedroom(t, {});
      });
      drawPhone(540, 835, 740, 1020, (sx, sy, sw, sh) => {
        drawPixScreen(sx, sy, sw, sh, {
          accent: PAL.yellow,
          danger: true,
          time: '03:13',
          badge: 'PIX #2 - R$ 0,01',
          header: 'NOVA MENSAGEM NO PIX',
          desc: 'EU SEI QUE VOCÊ ESTÁ ACORDADA.',
          descAlert: true,
          descLines: 3,
          descFs: 56,
          descLh: 68,
          age: t - shot.start
        });
      });
      break;
    }

    /* 9. Marina olhando para a porta assustada */
    case 'marina_olhar': {
      drawBedroom(t, {});
      drawMarinaBed(440, 1050, 1.44, {
        t, ex: 'fear', closed: f.closed,
        rimA: 0.90, rimColor: PAL.yellow, lookX: -0.45, fastBreath: true, tilt: -0.05
      });
      break;
    }

    /* 10. Marina de pe trancando a porta (corpo inteiro, pes firmes no chao gy=1310) */
    case 'tranca_porta': {
      vgrad('#0a0f1f', '#050711');
      vgrad('#0d1222', '#060811', 1290, H + 200);
      g.fillStyle = '#1e2740'; g.fillRect(-150, 1290, W + 300, 8);

      /* Porta do quarto a direita */
      const dx = 640, dy = 480, dw = 320, dh = 810;
      g.fillStyle = PAL.woodDark; rr(dx - 22, dy - 22, dw + 44, dh + 22, 16); g.fill();
      g.fillStyle = PAL.wood; rr(dx, dy, dw, dh, 10); g.fill();
      g.strokeStyle = PAL.woodLine; g.lineWidth = 6;
      rr(dx + 32, dy + 44, dw - 64, 290, 12); g.stroke();
      rr(dx + 32, dy + 380, dw - 64, 340, 12); g.stroke();
      /* Fechadura + chave girando */
      const lockAng = easeOut(localP) * Math.PI * 0.65;
      g.fillStyle = '#94a3b8'; rr(dx + 28, dy + 430, 26, 74, 8); g.fill();
      g.save();
      g.translate(dx + 41, dy + 478);
      g.rotate(lockAng);
      g.fillStyle = PAL.yellow; rr(-6, -18, 12, 36, 4); g.fill();
      g.restore();
      glow(dx + 41, dy + 478, 120, PAL.yellow, 0.30 * bell(localP, 0.2, 0.9));

      drawMarinaStanding(470, 1310, 1.24, {
        t, ex: 'fear', closed: f.closed,
        pose: { reach: 0.92 },
        rimA: 0.78, rimColor: PAL.cyan, fastBreath: true
      });
      break;
    }

    /* 11. Corredor la fora no breu absoluto */
    case 'corredor_breu': {
      vgrad('#04060d', '#090716');
      /* Perspectiva de corredor escuro e vazio */
      g.fillStyle = '#070a14';
      g.beginPath(); g.moveTo(0, 240); g.lineTo(360, 620); g.lineTo(360, 1180); g.lineTo(0, 1680); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(W, 240); g.lineTo(720, 620); g.lineTo(720, 1180); g.lineTo(W, 1680); g.closePath(); g.fill();
      /* Fundo do corredor totalmente negro */
      g.fillStyle = '#020308';
      g.fillRect(360, 620, 360, 560);
      /* Fio finissimo de luz fria sob uma porta distante */
      g.fillStyle = rgba(PAL.cyan, 0.22);
      g.fillRect(420, 1174, 240, 5);
      /* Moldura do olho magico / fresta */
      g.strokeStyle = rgba(PAL.violet, 0.35); g.lineWidth = 4;
      g.strokeRect(360, 620, 360, 560);
      break;
    }

    /* 12. Terceiro Pix (pulso vermelho-alerta #3B0A0A): "A JANELA NÃO TEM GRADE." */
    case 'pix_3_alerta': {
      withBlur(8, () => {
        drawBackdrop(t, 'red');
        drawBedroom(t, { red: true });
      });
      drawPhone(540, 835, 740, 1020, (sx, sy, sw, sh) => {
        drawPixScreen(sx, sy, sw, sh, {
          accent: PAL.alert,
          danger: true,
          time: '03:13',
          badge: '3o PIX - ALERTA',
          header: 'TERCEIRO PIX: R$ 0,01',
          desc: 'A JANELA NÃO TEM GRADE.',
          descAlert: true,
          descFs: 60,
          descLh: 72,
          age: t - shot.start
        });
      });
      break;
    }

    /* 13. Marina corre em direcao a janela aberta */
    case 'marina_janela': {
      drawBedroom(t, { red: true, hideWindow: true });
      /* Janela aberta grande a direita sem grade */
      g.fillStyle = '#070f24'; rr(660, 420, 340, 520, 14); g.fill();
      g.strokeStyle = '#334155'; g.lineWidth = 12; rr(660, 420, 340, 520, 14); g.stroke();
      /* Luar intenso entrando pela janela sem grade */
      glow(830, 580, 360, PAL.moon, 0.28);
      g.fillStyle = PAL.moon; circ(890, 530, 44);
      /* Marina correndo da esquerda para a direita com pes no chao gy=1310 */
      const mx = lerp(260, 540, easeOut(localP));
      drawMarinaStanding(mx, 1310, 1.22, {
        t, ex: 'fear', closed: f.closed,
        pose: { run: 1 },
        rimA: 0.90, rimColor: PAL.alert, fastBreath: true
      });
      break;
    }

    /* 14. Puxando a cortina sobre a janela */
    case 'cortina_puxa': {
      vgrad('#16081a', '#060812');
      /* Janela grande central */
      g.fillStyle = '#081229'; rr(170, 360, 740, 820, 20); g.fill();
      g.strokeStyle = '#334155'; g.lineWidth = 14; rr(170, 360, 740, 820, 20); g.stroke();
      g.fillStyle = PAL.moon; circ(710, 520, 52);
      /* Duas cortinas pesadas se fechando */
      const cw = lerp(140, 395, ease(localP));
      g.fillStyle = PAL.curtain;
      rr(140, 330, cw, 890, 18); g.fill();
      rr(940 - cw, 330, cw, 890, 18); g.fill();
      g.fillStyle = PAL.curtainFold;
      g.fillRect(180, 345, Math.max(0, cw - 60) * 0.28, 860);
      g.fillRect(900 - Math.max(0, cw - 60) * 0.28, 345, Math.max(0, cw - 60) * 0.28, 860);
      /* Varao da cortina */
      g.fillStyle = '#475569'; rr(110, 316, 860, 24, 12); g.fill();
      break;
    }

    /* 15. BLOCO SFX PURO [SFX:trava_janela:1.4]: macro na trava metalica + cortina fechando */
    case 'macro_trava_janela': {
      withBlur(8, () => {
        drawBackdrop(t, 'red');
        g.fillStyle = '#070e22'; g.fillRect(120, 300, 840, 900);
      });
      /* Esquadria central em macro */
      g.fillStyle = '#1e293b'; rr(455, 320, 170, 880, 24); g.fill();
      g.strokeStyle = '#475569'; g.lineWidth = 8; rr(455, 320, 170, 880, 24); g.stroke();
      /* Base metalica do trinco */
      g.fillStyle = '#334155'; rr(482, 650, 116, 260, 28); g.fill();
      /* Alavanca da trava girando 90 graus ate travar com flash */
      const lockK = easeOut(clamp((localP - 0.12) / 0.35));
      g.save();
      g.translate(540, 740);
      g.rotate(lerp(-Math.PI * 0.5, 0, lockK));
      g.fillStyle = lockK > 0.9 ? PAL.yellow : '#cbd5e1';
      rr(-24, -22, 48, 210, 22); g.fill();
      circ(0, 0, 30);
      g.restore();
      if (lockK > 0.85 && localP < 0.72) {
        glow(540, 740, 220, PAL.yellow, 0.45 * bell(localP, 0.4, 0.72));
      }
      /* Cortina pesada fechando na segunda metade do bloco SFX */
      if (localP > 0.52) {
        const ck = ease((localP - 0.52) / 0.45);
        g.fillStyle = PAL.curtain;
        g.fillRect(0, 260, W * ck * 0.52, 1080);
        g.fillRect(W - W * ck * 0.52, 260, W * ck * 0.52, 1080);
      }
      break;
    }

    /* 16. 03:14 - Celular vibra pela ultima vez no breu */
    case 'celular_breu': {
      vgrad('#04050b', '#19050b');
      const vib = Math.sin(t * 95) * 10;
      g.save();
      g.translate(vib, 0);
      glow(540, 835, 420, PAL.alert, 0.42);
      drawPhone(540, 835, 700, 980, (sx, sy, sw, sh) => {
        g.fillStyle = '#14060a'; g.fillRect(sx, sy, sw, sh);
        g.fillStyle = PAL.alert;
        drawFittedText('03:14', sx + sw / 2, sy + 240, sw - 120, 140, MONO, '900', 'center');
        g.fillStyle = PAL.yellow;
        drawFittedText('ÚLTIMA NOTIFICAÇÃO', sx + sw / 2, sy + 365, sw - 120, 32, MONO, '800', 'center');
        g.fillStyle = PAL.alert; rr(sx + 48, sy + 460, sw - 96, 220, 32); g.fill();
        g.strokeStyle = PAL.yellow; g.lineWidth = 6; rr(sx + 48, sy + 460, sw - 96, 220, 32); g.stroke();
        g.fillStyle = PAL.text;
        drawFittedText('4o PIX RECEBIDO', sx + sw / 2, sy + 535, sw - 140, 48, COND, '900', 'center');
        g.fillStyle = PAL.yellow;
        drawFittedText('R$ 0,01', sx + sw / 2, sy + 615, sw - 140, 68, MONO, '900', 'center');
      });
      g.restore();
      break;
    }

    /* 17. Quarto Pix aberto em vermelho-alerta */
    case 'pix_4_alerta': {
      withBlur(8, () => {
        drawBackdrop(t, 'red');
        drawBedroom(t, { red: true, curtainClosed: true });
      });
      drawPhone(540, 835, 740, 1020, (sx, sy, sw, sh) => {
        drawPixScreen(sx, sy, sw, sh, {
          accent: PAL.alert,
          danger: true,
          time: '03:14',
          badge: '4o PIX - R$ 0,01',
          header: 'QUARTO PIX RECEBIDO',
          desc: 'OBRIGADO POR TRANCAR A JANELA.',
          descAlert: true,
          descLines: 3,
          descFs: 54,
          descLh: 66,
          age: t - shot.start
        });
      });
      break;
    }

    /* 18. Mensagem final do Plot Twist na tela do celular */
    case 'pix_4_twist': {
      withBlur(8, () => {
        drawBackdrop(t, 'red');
        drawBedroom(t, { red: true, curtainClosed: true });
      });
      const pop = popScale(t - shot.start, 0.14);
      g.save();
      g.translate(540, 835);
      g.scale(pop, pop);
      g.fillStyle = '#18060a'; rr(-435, -285, 870, 570, 44); g.fill();
      g.strokeStyle = PAL.alert; g.lineWidth = 8; rr(-435, -285, 870, 570, 44); g.stroke();
      g.fillStyle = PAL.yellow;
      drawFittedText('PIX #4  -  R$ 0,01  -  03:14', 0, -195, 780, 34, MONO, '900', 'center');
      g.fillStyle = PAL.dim;
      drawFittedText('OBRIGADO POR TRANCAR A JANELA.', 0, -95, 790, 42, COND, '800', 'center');
      /* Frase do twist em caixa vermelha explosiva */
      g.fillStyle = PAL.alert; rr(-380, -20, 760, 230, 32); g.fill();
      g.strokeStyle = PAL.yellow; g.lineWidth = 6; rr(-380, -20, 760, 230, 32); g.stroke();
      g.fillStyle = PAL.text;
      drawFittedText('EU NÃO ESTAVA', 0, 58, 700, 76, COND, '900', 'center');
      g.fillStyle = PAL.yellow;
      drawFittedText('LÁ FORA.', 0, 148, 700, 86, COND, '900', 'center');
      g.restore();
      break;
    }

    /* 19. MODULO bigFace DE MARINA NO CHOQUE EXTREMO (blur DOF + pupilas contraidas + suor frio) */
    case 'big_face': {
      withBlur(8, () => {
        drawBackdrop(t, 'red');
        drawBedroom(t, { red: true, curtainClosed: true });
      });
      const jitX = noise(t * 48, 1) * 9;
      const jitY = noise(t * 48, 2) * 9;
      g.save();
      g.translate(540 + jitX, 920 + jitY);
      /* Ombros em capsula descendo ate fora do quadro com sombra interna clipada */
      g.fillStyle = PAL.top;
      rr(-310, 265, 620, 880, 175); g.fill();
      g.save();
      rr(-310, 265, 620, 880, 175); g.clip();
      g.fillStyle = rgba(PAL.topDeep, 0.45);
      g.fillRect(-320, 255, 165, 900);
      g.restore();
      g.fillStyle = PAL.skinShadow;
      rr(-64, 190, 128, 120, 40); g.fill();

      drawHeadMarina(0, -15, 290, 'shock', f.closed, {
        tilt: -0.04 + noise(t * 22, 3) * 0.016,
        rimA: 0.98,
        rimColor: PAL.alert,
        rimAng: 0.10,
        lookX: 0.15
      });
      glow(320, -20, 440, PAL.alert, 0.34);
      g.restore();
      break;
    }

    /* 20, 21 & 22. CLIMAX DO GUARDA-ROUPA ABRINDO DEVAGAR + OLHOS NA FRESTA */
    case 'guarda_roupa_fenda':
    case 'guarda_roupa_abre':
    case 'guarda_roupa_olhos': {
      const stage = shot.scene === 'guarda_roupa_fenda' ? 0 : (shot.scene === 'guarda_roupa_abre' ? 1 : 2);
      vgrad(stage === 2 ? '#1c050a' : '#050710', '#030408');

      const gx = 150, gy = 310, gw = 780, gh = 1140;
      /* Interior totalmente negro do guarda-roupa */
      g.fillStyle = '#020205'; rr(gx, gy, gw, gh, 20); g.fill();
      g.strokeStyle = PAL.woodLine; g.lineWidth = 10; rr(gx, gy, gw, gh, 20); g.stroke();

      /* Largura da fresta vertical abrindo devagar */
      const gap = stage === 0
        ? lerp(16, 125, ease(localP))
        : (stage === 1 ? lerp(125, 245, ease(localP)) : lerp(245, 315, ease(localP)));

      /* Porta esquerda fechada */
      g.fillStyle = PAL.wood;
      g.fillRect(gx + 8, gy + 8, gw / 2 - 12, gh - 16);
      g.strokeStyle = PAL.woodLine; g.lineWidth = 6;
      g.strokeRect(gx + 36, gy + 44, gw / 2 - 68, gh - 88);

      /* Porta direita deslizando/abrindo devagar para a direita */
      const rx = gx + gw / 2 + gap;
      const rw = Math.max(120, gw / 2 - gap - 8);
      g.fillStyle = PAL.wood;
      g.fillRect(rx, gy + 8, rw, gh - 16);
      g.strokeStyle = PAL.woodLine; g.lineWidth = 6;
      g.strokeRect(rx + 26, gy + 44, Math.max(60, rw - 52), gh - 88);
      /* Puxadores */
      g.fillStyle = '#64748b';
      rr(gx + gw / 2 - 42, gy + 510, 14, 120, 7); g.fill();
      rr(rx + 22, gy + 510, 14, 120, 7); g.fill();

      /* Fresta escura com silhueta e par de olhos palidos surgindo */
      const fCx = gx + gw / 2 + gap * 0.5;
      if (stage >= 1) {
        const eyeA = stage === 1 ? clamp((localP - 0.25) / 0.75) * 0.75 : 1.0;
        const eyeOpen = stage === 2 ? lerp(0.55, 1.0, easeOut(localP)) : 0.45;
        /* Brilho sutil vermelho-frio vindo da fenda */
        glow(fCx, 780, 260, PAL.alert, 0.25 * eyeA);
        g.save();
        g.globalAlpha = eyeA;
        /* Dois olhos palidos fixos na escuridao */
        for (const ox of [-48, 48]) {
          g.save();
          g.translate(fCx + ox, 765);
          g.scale(1, eyeOpen);
          g.fillStyle = '#e2e8f0';
          ell(0, 0, 26, 15);
          g.fillStyle = '#05060a';
          circ(0, 0, 8);
          g.fillStyle = PAL.alert;
          circ(2, -2, 3);
          g.restore();
        }
        /* Dedos agarrando a borda interna da porta */
        if (stage === 2) {
          g.fillStyle = '#524757';
          for (let d = 0; d < 4; d++) {
            rr(rx - 22, 920 + d * 32, 36, 22, 11); g.fill();
          }
        }
        g.restore();
      }
      break;
    }

    /* 23. CTA Parte 1: Motor automatico V3 (todos textos ajustados por drawFittedText) */
    case 'cta_engine': {
      withBlur(8, () => {
        drawBackdrop(t, 'violet');
        drawBedroom(t, { curtainClosed: true });
      });
      const pop = popScale(t - shot.start, 0.14);
      g.save();
      g.translate(540, 810);
      g.scale(pop, pop);
      g.fillStyle = rgba('#0d1326', 0.96); rr(-440, -330, 880, 660, 44); g.fill();
      g.strokeStyle = PAL.cyan; g.lineWidth = 5; rr(-440, -330, 880, 660, 44); g.stroke();

      g.fillStyle = '#18223d'; rr(-440, -330, 880, 84, 44); g.fill();
      g.fillRect(-440, -286, 880, 40);
      for (let i = 0; i < 3; i++) {
        g.fillStyle = [PAL.alert, PAL.yellow, PAL.cyan][i];
        circ(-380 + i * 38, -288, 12);
      }
      g.fillStyle = PAL.text;
      drawFittedText('SHORT AUTOMÁTICO // V3', -265, -288, 620, 28, MONO, '700', 'left');

      const tracks = [
        { lbl: 'CANVAS 9:16', col: PAL.cyan, y: -145 },
        { lbl: 'VOZ IA + SYNC', col: PAL.yellow, y: -25 },
        { lbl: 'SFX + -14 LUFS', col: PAL.alert, y: 95 }
      ];
      for (let i = 0; i < tracks.length; i++) {
        const tr = tracks[i];
        g.fillStyle = PAL.dim;
        drawFittedText(tr.lbl, -370, tr.y - 26, 400, 24, MONO, '700', 'left');
        g.fillStyle = '#162038'; rr(-370, tr.y, 740, 50, 14); g.fill();
        const fillW = 140 + 590 * easeOut(clamp(localP * 1.2 - i * 0.12));
        g.fillStyle = rgba(tr.col, 0.88); rr(-370, tr.y, fillW, 50, 14); g.fill();
      }

      const playX = lerp(-345, 345, localP);
      g.strokeStyle = PAL.text; g.lineWidth = 4;
      g.beginPath(); g.moveTo(playX, -205); g.lineTo(playX, 178); g.stroke();

      g.fillStyle = PAL.text;
      drawFittedText('VÍDEOS ASSIM NO AUTOMÁTICO', 0, 255, 780, 52, COND, '900', 'center');
      g.restore();
      break;
    }

    /* 24 & 25. CTA Parte 2: Pilula amarela 100% blindada (padding largo + drawFittedText) */
    case 'cta_comente':
    case 'cta_comente_pulse': {
      withBlur(8, () => {
        drawBackdrop(t, 'yellow');
      });
      const isPulse = shot.scene === 'cta_comente_pulse';
      const pop = isPulse ? (1 + 0.03 * Math.sin(t * 10)) : popScale(t - shot.start, 0.14);
      g.save();
      g.translate(540, 810);
      g.scale(pop, pop);

      glow(0, 20, 440, PAL.yellow, 0.34);
      /* Cartao amplo (880px) com margem segura de 100px em cada lado da tela de 1080px */
      g.fillStyle = rgba('#0d1224', 0.96); rr(-440, -310, 880, 620, 46); g.fill();
      g.strokeStyle = PAL.yellow; g.lineWidth = 6; rr(-440, -310, 880, 620, 46); g.stroke();

      g.fillStyle = PAL.cyan;
      drawFittedText('PASSO A PASSO COMPLETO', 0, -212, 760, 32, MONO, '800', 'center');

      g.fillStyle = PAL.text;
      drawFittedText('QUER APRENDER A FAZER', 0, -116, 770, 58, COND, '900', 'center');
      drawFittedText('NO AUTOMÁTICO?', 0, -44, 770, 58, COND, '900', 'center');

      /* Pilula amarela larga (760px x 144px) com padding lateral garantido de >= 56px de cada lado */
      const pillW = 760, pillH = 144, pillY = 44;
      g.fillStyle = PAL.yellow; rr(-pillW / 2, pillY, pillW, pillH, pillH / 2); g.fill();
      g.fillStyle = PAL.ink;
      drawFittedText('COMENTE EU QUERO', 0, pillY + pillH / 2 + 2, pillW - 112, 62, COND, '900', 'center');

      /* Seta apontando para os comentarios */
      const bob = Math.sin(t * 9) * 10;
      g.strokeStyle = PAL.yellow; g.lineWidth = 10; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath();
      g.moveTo(-26, 232 + bob); g.lineTo(0, 260 + bob); g.lineTo(26, 232 + bob);
      g.stroke();
      g.restore();
      break;
    }
  }
}

/* ============================================================
   CAMERA VIVA V3 + SCREEN SHAKE AMORTECIDO + RELOGIO UNICO
   ============================================================ */
function pickShot(t){
  for (let i = 0; i < SHOTS.length; i++) {
    const s = SHOTS[i];
    if (t < s.end || i === SHOTS.length - 1) return s;
  }
  return SHOTS[0];
}

function cameraFor(shot, t){
  const k = ease(prog(t, shot.start, shot.end));
  const z = lerp(shot.cam0[0], shot.cam1[0], k);
  const cx = lerp(shot.cam0[1], shot.cam1[1], k);
  const cy = lerp(shot.cam0[2], shot.cam1[2], k);

  const handAmp = shot.scene.startsWith('cta_') ? 2.0 : 4.6;
  let sx = noise(t * 2.1, 11) * handAmp;
  let sy = noise(t * 1.9, 29) * handAmp;

  const impacts = [
    [EV.vibra_cama, 10, 8.0],
    [EV.nao_acende, 14, 7.0],
    [EV.pix_2, 14, 7.5],
    [EV.pix_3, 20, 6.2],
    [EV.trava_janela + 0.12, 22, 6.0],
    [EV.pix_4, 22, 6.0],
    [EV.plot_twist, 28, 5.2],
    [EV.cta_acao, 8, 9.5]
  ];
  for (const [ti, amp, dec] of impacts) {
    if (t >= ti && t < ti + 0.90) {
      const dt = t - ti;
      const env = Math.exp(-dt * dec);
      sx += Math.sin(dt * 95) * amp * env;
      sy += Math.cos(dt * 83) * amp * 0.72 * env;
    }
  }
  return { z, cx, cy, sx, sy };
}

/* Um unico relogio por vez no topo (03:12 -> 03:13 -> 03:14), oculto na CTA */
function drawClock(t){
  if (t >= EV.cta - 0.08) return;
  const stops = [
    [0, '03:12', false],
    [EV.hora_0313, '03:13', false],
    [EV.pix_3, '03:13', true],
    [EV.hora_0314, '03:14', true]
  ];
  let idx = 0;
  for (let i = 0; i < stops.length; i++) if (t >= stops[i][0]) idx = i;

  const [tStart, label, isRed] = stops[idx];
  const prevLabel = idx > 0 ? stops[idx - 1][1] : label;
  const prevRed = idx > 0 ? stops[idx - 1][2] : isRed;
  const dt = t - tStart;

  let shownLabel = label, shownRed = isRed, sy = 1;
  if (idx > 0 && prevLabel !== label && dt < 0.24) {
    if (dt < 0.12) {
      shownLabel = prevLabel; shownRed = prevRed;
      sy = Math.max(0.05, 1 - dt / 0.12);
    } else {
      sy = Math.max(0.05, (dt - 0.12) / 0.12);
    }
  }

  g.save();
  g.translate(540, 148);
  g.fillStyle = rgba('#090d1a', 0.88);
  rr(-164, -56, 328, 112, 26); g.fill();
  g.strokeStyle = shownRed ? PAL.alert : rgba(PAL.cyan, 0.55);
  g.lineWidth = 4;
  rr(-164, -56, 328, 112, 26); g.stroke();

  g.scale(1, sy);
  g.fillStyle = shownRed ? PAL.alert : PAL.text;
  drawFittedText(shownLabel, 0, 3, 270, 72, MONO, '900', 'center');
  g.restore();
}

function finish(vig){
  g.save();
  g.globalAlpha = clamp(vig, 0, 1);
  g.drawImage(vigCv, 0, 0);
  g.restore();
}

/* ============================================================
   LEGENDAS V3 POP-IN (2-3 PALAVRAS, MAIUSCULAS, AMARELO/VERMELHO)
   ============================================================ */
const RED_WORDS = new Set([
  'congela', 'nao', 'acende', 'luz', 'acordada', 'tranca', 'breu',
  'janela', 'grade', 'ultima', 'quarto', 'trancar', 'fora',
  'escuro', 'guarda-roupa', 'guardaroupa', 'abre', 'devagar', 'terceiro'
]);
function normWord(w){
  return w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/gi, '').toLowerCase();
}

function buildPreviewCaptions(){
  const e = EV;
  const lines = [
    [e.gancho, e.vibra_cama - 0.2, 'Três e doze da manhã.'],
    [e.vibra_cama - 0.1, e.pix_1 - 0.16, 'O celular da Marina vibra na cama.'],
    [e.pix_1, e.marina_ri - 0.16, 'Você recebeu um Pix de um centavo.'],
    [e.marina_ri, e.congela - 0.22, 'Ela abre o banco rindo.'],
    [e.congela, e.hora_0313 - 0.16, 'Mas congela ao ler a descrição: Não acende a luz.'],
    [e.hora_0313, e.desc_2 - 0.16, 'Um minuto depois, outro Pix de um centavo.'],
    [e.desc_2, e.tranca_porta - 0.16, 'Descrição: Eu sei que você está acordada.'],
    [e.tranca_porta, e.corredor_breu - 0.16, 'Marina tranca a porta do quarto.'],
    [e.corredor_breu, e.pix_3 - 0.16, 'O corredor lá fora está no breu.'],
    [e.pix_3, e.fecha_janela - 0.16, 'Terceiro Pix: A janela não tem grade.'],
    [e.fecha_janela, e.trava_janela - 0.08, 'Ela corre, trava a janela e fecha a cortina.'],
    [e.hora_0314, e.pix_4 - 0.16, 'O celular vibra pela última vez.'],
    [e.pix_4, e.msg_final - 0.35, 'Quarto Pix. Um centavo.'],
    [e.msg_final, e.plot_twist - 0.16, 'Obrigado por trancar a janela.'],
    [e.plot_twist, e.guarda_roupa - 0.08, 'Eu não estava lá fora.'],
    [e.abre_devagar, e.cta - 0.35, 'No escuro do quarto, a porta do guarda-roupa... abre devagar.'],
    [e.cta, e.cta_acao - 0.16, 'Quer aprender a fazer vídeos assim no automático?'],
    [e.cta_acao, e.duracao_total - 0.45, 'Comente EU QUERO.']
  ];
  const groups = [];
  for (const [t0, t1, txt] of lines) {
    const words = txt.split(' ');
    const span = Math.max(0.25, t1 - t0);
    const weights = words.map(w => Math.max(2, w.length) + 1.2);
    const sum = weights.reduce((a, b) => a + b, 0);
    let cur = t0;
    const timed = words.map((w, i) => {
      const d = span * (weights[i] / sum);
      const item = { palavra: w, inicio: cur, fim: cur + d, duracao: d };
      cur += d;
      return item;
    });
    const clauses = [];
    let cl = [];
    timed.forEach((p, idx) => {
      cl.push(p);
      const rem = timed.length - idx - 1;
      if (/[:,]$/.test(p.palavra) && cl.length >= 2 && rem >= 2) { clauses.push(cl); cl = []; }
    });
    if (cl.length) clauses.push(cl);
    for (const c of clauses) {
      let i = 0;
      while (i < c.length) {
        const rem = c.length - i;
        const sz = rem <= 3 ? rem : (rem === 4 ? 2 : 3);
        const sl = c.slice(i, i + sz);
        groups.push({ inicio: sl[0].inicio, fim: sl[sl.length - 1].fim, palavras: sl });
        i += sz;
      }
    }
  }
  captionGroups = groups;
}

function drawCaptions(t){
  let grp = null;
  for (const c of captionGroups) {
    if (t >= c.inicio - 0.04 && t <= c.fim + 0.14) { grp = c; break; }
  }
  if (!grp || !grp.palavras || !grp.palavras.length) return;

  const words = grp.palavras.map(p => ({
    txt: String(p.palavra || '').toUpperCase(),
    key: normWord(String(p.palavra || '')),
    inicio: Number(p.inicio),
    fim: Number(p.fim ?? (Number(p.inicio) + Number(p.duracao || 0.25)))
  }));
  let active = 0;
  for (let i = 0; i < words.length; i++) if (t >= words[i].inicio - 0.02) active = i;

  const grpPop = popScale(t - grp.inicio + 0.02, 0.11);

  g.save();
  let fs = 78;
  g.font = `900 ${fs}px ${COND}`;
  g.textBaseline = 'middle';
  g.textAlign = 'center';
  let sp = Math.max(30, Math.round(fs * 0.44));
  let wds = words.map(w => g.measureText(w.txt).width);
  let tw = wds.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  if (tw > 900) {
    fs = Math.floor(fs * 900 / tw);
    g.font = `900 ${fs}px ${COND}`;
    sp = Math.max(22, Math.round(fs * 0.44));
    wds = words.map(w => g.measureText(w.txt).width);
    tw = wds.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  }

  const y = 1495;
  g.translate(540, y);
  g.scale(grpPop, grpPop);
  g.translate(-540, -y);

  let x = 540 - tw / 2;
  g.lineJoin = 'round';
  g.miterLimit = 2;

  words.forEach((w, i) => {
    const cx = x + wds[i] / 2;
    const isAct = i === active;
    const isRed = RED_WORDS.has(w.key);
    const fill = isAct ? (isRed ? PAL.alert : PAL.yellow) : '#FFFFFF';
    const wPop = isAct ? lerp(1.13, 1.06, easeOut(clamp((t - w.inicio) / 0.09))) : 1.0;

    g.save();
    g.translate(cx, y);
    g.scale(wPop, wPop);
    g.shadowColor = 'rgba(0,0,0,.88)';
    g.shadowBlur = 16;
    g.shadowOffsetY = 6;
    g.strokeStyle = '#000000';
    g.lineWidth = Math.max(12, Math.round(fs * 0.21));
    g.strokeText(w.txt, 0, 0);
    g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.fillStyle = fill;
    g.fillText(w.txt, 0, 0);
    g.restore();

    x += wds[i] + sp;
  });
  g.restore();
}

let ccOn = false;
function renderAt(t){
  t = clamp(+t || 0, 0, duration);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.filter = 'none';
  g.shadowBlur = 0;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);

  if (t >= duration - 0.20) return;

  const shot = pickShot(t);
  const cam = cameraFor(shot, t);

  g.save();
  g.translate(W / 2 + cam.sx, H / 2 + cam.sy);
  g.scale(cam.z, cam.z);
  g.translate(-cam.cx, -cam.cy);
  drawScene(shot, t);
  g.restore();

  drawClock(t);
  finish(shot.vig || 0.60);

  const cutAge = t - shot.start;
  if (shot.id > 1 && cutAge >= 0 && cutAge < 0.06) {
    const k = 1 - cutAge / 0.06;
    g.fillStyle = shot.mood === 'red' ? `rgba(255,59,48,${k * 0.16})` : `rgba(0,0,0,${k * 0.35})`;
    g.fillRect(0, 0, W, H);
  }

  if (ccOn) drawCaptions(t);
}
window.renderAt = renderAt;
window.getDuration = () => duration;
window.getShots = () => SHOTS.map(s => ({ id: s.id, scene: s.scene, mood: s.mood, start: s.start, end: s.end, dur: s.dur }));

/* Controles do player */
const $ = id => document.getElementById(id);
const btn = $('play'), seek = $('seek'), out = $('time'), cc = $('cc'), status = $('status');
let playing = false, cur = 0, t0 = 0, p0 = 0;
const fmt = v => v.toFixed(1).replace('.', ',');

function ui(){
  seek.value = cur;
  out.textContent = `${fmt(cur)} / ${fmt(duration)}`;
  seek.setAttribute('aria-valuetext', `${fmt(cur)} de ${fmt(duration)} segundos`);
  $('playLbl').textContent = playing ? 'Pausar' : 'Play';
  $('playIcon').setAttribute('d', playing ? 'M3 2h4v12H3zM9 2h4v12H9z' : 'M4 2l10 6-10 6z');
}
function tick(){
  if (!playing) return;
  cur = Math.min(t0 + (performance.now() - p0) / 1000, duration);
  if (audio && cur < audio.duration && Math.abs(audio.currentTime - cur) > 0.2) audio.currentTime = cur;
  renderAt(cur); ui();
  if (cur >= duration) pause(); else requestAnimationFrame(tick);
}
function play(){
  if (cur >= duration) cur = 0;
  playing = true; t0 = cur; p0 = performance.now();
  if (audio) { audio.currentTime = cur; audio.play().catch(() => {}); }
  ui(); requestAnimationFrame(tick);
}
function pause(){ playing = false; if (audio) audio.pause(); ui(); }
btn.addEventListener('click', () => playing ? pause() : play());
seek.addEventListener('input', () => {
  cur = +seek.value; t0 = cur; p0 = performance.now();
  if (audio && cur < audio.duration) audio.currentTime = cur;
  renderAt(cur); ui();
});
cc.addEventListener('click', () => {
  ccOn = !ccOn; cc.setAttribute('aria-pressed', String(ccOn)); renderAt(cur);
});

async function fetchJson(url){
  if (location.protocol === 'file:') return null;
  try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return null;
}
function probeAudio(src){
  return new Promise(res => {
    const el = new Audio(); let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    el.preload = 'auto';
    el.addEventListener('loadedmetadata', () => fin(el), { once: true });
    el.addEventListener('error', () => fin(null), { once: true });
    setTimeout(() => fin(null), 3500);
    el.src = src;
  });
}

async function load(){
  const [evData, tsData] = await Promise.all([
    fetchJson('audio/eventos.json'),
    fetchJson('audio/timestamps.json')
  ]);
  let a = await probeAudio('audio/mix_final.mp3');
  let audioSrc = 'audio/mix_final.mp3';
  if (!a) { a = await probeAudio('audio/narracao.mp3'); audioSrc = 'audio/narracao.mp3'; }

  if (a && isFinite(a.duration)) audio = a;
  normalizeEvents(evData, audio ? audio.duration : null);

  if (tsData && Array.isArray(tsData.grupos) && tsData.grupos.length) {
    captionGroups = tsData.grupos;
  } else {
    buildPreviewCaptions();
  }

  if (audio && evData) {
    status.textContent = `Audio (${audioSrc}) sincronizado com eventos.json e timestamps.json (${fmt(duration)} s).`;
  } else if (audio) {
    status.textContent = `Audio (${audioSrc}) carregado sem eventos.json (${fmt(duration)} s).`;
  } else {
    status.textContent = `Modo Previa V3: sem audio, usando marcos padrao do roteiro_03 (0 a ${fmt(duration)} s).`;
  }
  seek.max = duration;
  btn.disabled = false; seek.disabled = false; btn.removeAttribute('aria-busy');
  renderAt(cur); ui();
}

normalizeEvents(null, null);
buildPreviewCaptions();
renderAt(0); ui(); load();
})();
</script>
