.btn{min-height:var(--target-min);min-width:var(--target-min);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);

const MONO = '"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace';
const SANS = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const COND = '"Arial Narrow","Roboto Condensed","Liberation Sans Narrow",Impact,Arial,sans-serif';

/* Selo permanente PARTE 1 (configuravel via ?parte=, window.parteLabel ou eventos.json) */
const URL_PARTE = new URLSearchParams(location.search).get('parte');
let parteLabel = (URL_PARTE !== null ? URL_PARTE : (typeof window.parteLabel === 'string' ? window.parteLabel : 'PARTE 1')).trim();

/* Utilidades deterministicas */
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const prog = (t, a, b) => clamp((t - a) / Math.max(0.001, b - a));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (t, seed=0) => {
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57), hash(i + 1 + seed * 57), u) * 2 - 1;
};
const hexRgb = h => {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgba = (hex, a) => {
  const [r, gr, b] = hexRgb(hex);
  return `rgba(${r},${gr},${b},${a})`;
};
function mixHex(h1, h2, k){
  k = clamp(k);
  const a = hexRgb(h1), b = hexRgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
}
function mulberry(a){
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(x, y, w, h, r){
  const rad = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function circ(x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ell(x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function glow(x, y, r, col, a){
  if (a <= 0.002) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a));
  gr.addColorStop(1, rgba(col, 0));
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}
function vgrad(c1, c2, y0=-320, y1=H+320){
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, c1);
  gr.addColorStop(1, c2);
  g.fillStyle = gr;
  g.fillRect(-420, y0, W + 840, y1 - y0);
}
function popScale(age, dur=0.11){
  if (age <= 0) return 0.68;
  const k = clamp(age / dur);
  if (k < 0.62) return lerp(0.68, 1.10, easeOut(k / 0.62));
  return lerp(1.10, 1.0, ease((k - 0.62) / 0.38));
}

/* Helper anti-vazamento: mede sempre com a fonte real instalada (Windows/Linux/Colab) */
function drawFittedText(text, x, y, maxW, maxFs, family, weight='900', align='center'){
  let fs = maxFs;
  g.font = `${weight} ${fs}px ${family}`;
  const w = g.measureText(text).width;
  if (w > maxW && w > 0) {
    fs = Math.max(18, Math.floor(maxFs * (maxW / w)));
    g.font = `${weight} ${fs}px ${family}`;
  }
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(text, x, y);
  return fs;
}

/* ============================================================

const DOF_SCALE = 0.125;
const DOF_PAD = 4;
const dofCv = document.createElement('canvas');
dofCv.width = Math.round(W * DOF_SCALE) + DOF_PAD * 2;
dofCv.height = Math.round(H * DOF_SCALE) + DOF_PAD * 2;
const dofCtx = dofCv.getContext('2d');

const dofBlurCv = document.createElement('canvas');
dofBlurCv.width = dofCv.width;
dofBlurCv.height = dofCv.height;
const dofBlurCtx = dofBlurCv.getContext('2d');

function withBlur(px, fn){
  const m = main.getTransform();
  dofCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofCtx.globalAlpha = 1;
  dofCtx.globalCompositeOperation = 'source-over';
  dofCtx.filter = 'none';
  dofCtx.fillStyle = PAL.bgNavy;
  dofCtx.fillRect(0, 0, dofCv.width, dofCv.height);
  dofCtx.translate(DOF_PAD, DOF_PAD);
  dofCtx.scale(DOF_SCALE, DOF_SCALE);
  dofCtx.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g = dofCtx;
  fn();
  g = main;

  const r = Math.max(1.2, px * DOF_SCALE * 1.45);
  dofBlurCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofBlurCtx.clearRect(0, 0, dofBlurCv.width, dofBlurCv.height);
  dofBlurCtx.filter = `blur(${r.toFixed(2)}px)`;
  dofBlurCtx.drawImage(dofCv, 0, 0);
  dofBlurCtx.filter = 'none';

  main.save();
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.imageSmoothingEnabled = true;
  main.imageSmoothingQuality = 'high';
  const padOut = DOF_PAD / DOF_SCALE;
  main.drawImage(dofBlurCv, -padOut, -padOut, W + padOut * 2, H + padOut * 2);
  main.restore();
}

/* Divide cada segmento em sub-planos garantidos entre ~1.0s e 1.7s */
function splitShots(a, b, specs){
  const span = Math.max(0.05, b - a);
  let count = Math.ceil(span / 1.66);
  if (count < 1) count = 1;
  while (count > 1 && (span / count) < 0.92) count--;
  const out = [];
  for (let i = 0; i < count; i++) {
    const s0 = a + (span * i) / count;
    const s1 = i === count - 1 ? b : a + (span * (i + 1)) / count;
    const sp = specs[i % specs.length];
    out.push({
      start: +s0.toFixed(3),
      end: +s1.toFixed(3),
      dur: +(s1 - s0).toFixed(3),
      ...sp
    });
  }
  return out;
}

/* ============================================================
   MOTOR V4.1 KATANA: 3 HITS CIRURGICOS ("NAO PEDIU", "SUMIU", "ATRAS DELA")

function buildKatanaHits(e){
  const list = [
    {
      id: 'katana_nao_pediu',
      start: +Number(e.nao_pediu).toFixed(3),
      dur: 0.44,
      lines: ['NÃO', 'PEDIU'],
      accentIdx: 1,
      accent: PAL.alertKatana,
      tilt: -0.044,
      punch: 0.18,
      shake: 20
    },
    {
      id: 'katana_sumiu',
      start: +Number(e.portaria_vazia).toFixed(3),
      dur: 0.42,
      lines: ['SUMIU'],
      accentIdx: 0,
      accent: PAL.alertKatana,
      tilt: 0.040,
      punch: 0.18,
      shake: 20
    },
    {
      id: 'katana_atras_dela',
      start: +Number(e.atras_dela).toFixed(3),
      dur: 0.42,
      lines: ['ATRÁS', 'DELA'],
      accentIdx: 1,
      accent: PAL.alertKatana,
      tilt: -0.042,
      punch: 0.22,
      shake: 26
    }
  ];
  return list.map(h => ({ ...h, end: +(h.start + h.dur).toFixed(3) }));
}

function katanaStateAt(t){
  for (let i = 0; i < KATANA_HITS.length; i++) {
    const h = KATANA_HITS[i];
    if (t >= h.start && t < h.end) return { hit: h, dt: t - h.start };
  }
  return null;
}

function drawKatanaOverlay(t){
  const st = katanaStateAt(t);
  if (!st) return false;
  const { hit, dt } = st;
  const frame = Math.floor(dt * 30);
  const p = clamp(dt / hit.dur);

  let bg = '#05070E';
  let mainTextCol = '#FFFFFF';
  let accentTextCol = PAL.alert;
  let slashCol = PAL.alertKatana;
  let strokeCol = '#000000';
  let borderGlow = true;

  if (frame === 0) {
    bg = '#F8FAFC'; mainTextCol = '#05070E'; accentTextCol = '#05070E';
    slashCol = PAL.alertKatana; strokeCol = 'transparent'; borderGlow = false;
  } else if (frame === 1) {
    bg = '#05070E'; mainTextCol = '#FFFFFF'; accentTextCol = PAL.yellow;
    slashCol = '#FFFFFF'; borderGlow = false;
  } else if (frame === 2) {
    bg = PAL.alertKatana; mainTextCol = '#FFFFFF'; accentTextCol = '#FFFFFF';
    slashCol = '#05070E'; borderGlow = false;
  } else if (frame === 3) {
    bg = '#F8FAFC'; mainTextCol = PAL.alertKatana; accentTextCol = '#05070E';
    slashCol = '#05070E'; strokeCol = 'transparent'; borderGlow = false;
  }

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  if (borderGlow) {
    const gr = g.createRadialGradient(540, 960, 140, 540, 960, 1080);
    gr.addColorStop(0, 'rgba(225,29,46,0.22)');
    gr.addColorStop(0.65, 'rgba(59,10,10,0.45)');
    gr.addColorStop(1, 'rgba(5,7,14,0.96)');
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
  }

  const slashProg = easeOut(clamp(dt / 0.12));
  g.save();
  g.translate(540, 960);
  g.rotate(hit.tilt * 2.2);
  const slashW = lerp(120, 1520, slashProg);
  const slashH = frame <= 3 ? 28 : lerp(18, 6, p);
  g.fillStyle = slashCol;
  g.globalAlpha = frame <= 3 ? 0.95 : 0.72;
  g.fillRect(-slashW / 2, -slashH / 2, slashW, slashH);
  g.globalAlpha = frame <= 3 ? 0.65 : 0.35;
  g.fillRect(-slashW * 0.44, -slashH / 2 - 220, slashW * 0.88, 6);
  g.fillRect(-slashW * 0.44, slashH / 2 + 214, slashW * 0.88, 6);
  g.restore();

  let scaleX = 1, scaleY = 1;
  if (dt < 0.11) {
    const k = easeOut(dt / 0.11);
    scaleX = lerp(1.58, 1.00, k);
    scaleY = lerp(0.56, 1.12, k);
  } else {
    const d = dt - 0.11;
    const osc = Math.exp(-15 * d) * Math.cos(40 * d);
    scaleX = 1.0 + 0.11 * osc;
    scaleY = 1.0 - 0.08 * osc;
  }
  const rem = hit.dur - dt;
  if (rem < 0.06) {
    const ek = 1 - rem / 0.06;
    scaleX *= lerp(1.0, 1.18, ek);
    scaleY *= lerp(1.0, 0.82, ek);
  }

  const jitterX = Math.sin(dt * 120) * (frame <= 3 ? 14 : 5) * Math.exp(-dt * 6);
  const jitterY = Math.cos(dt * 105) * (frame <= 3 ? 10 : 4) * Math.exp(-dt * 6);

  g.translate(540 + jitterX, 955 + jitterY);
  g.rotate(hit.tilt);
  g.scale(scaleX, scaleY);

  const lines = hit.lines;
  const maxW = 920;
  const maxFs = lines.length === 1 ? 265 : 196;
  const stepY = lines.length === 1 ? 0 : 190;
  const startY = lines.length === 1 ? 0 : -stepY * 0.5;

  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.miterLimit = 2;

  for (let i = 0; i < lines.length; i++) {
    const txt = lines[i];
    let fs = maxFs;
    g.font = `900 ${fs}px ${COND}`;
    const mw = g.measureText(txt).width;
    if (mw > maxW && mw > 0) {
      fs = Math.max(48, Math.floor(maxFs * (maxW / mw)));
      g.font = `900 ${fs}px ${COND}`;
    }
    const ly = startY + i * stepY;
    const col = (i === hit.accentIdx) ? accentTextCol : mainTextCol;

    if (frame >= 4) {
      g.fillStyle = 'rgba(0,0,0,0.82)';
      g.fillText(txt, 10, ly + 12);
    }
    if (strokeCol !== 'transparent') {
      g.strokeStyle = strokeCol;
      g.lineWidth = Math.max(14, Math.round(fs * 0.10));
      g.strokeText(txt, 0, ly);
    }
    g.fillStyle = col;
    g.fillText(txt, 0, ly);
  }

  g.restore();
  return true;
}

/* ============================================================
   REGRA V4.1: CTA VISUAL UNICA NO MEIO (~48% A 56%, ~2.2s)
   Zona segura superior-central sem tampar rosto nem legendas
   ============================================================ */
function isMidCtaActive(t){
  const a = Number(EV.cta_meio_inicio);
  const b = Number(EV.cta_meio_fim);
  return isFinite(a) && isFinite(b) && t >= a && t < b && katanaStateAt(t) === null;
}

function drawMidCta(t){
  if (!isMidCtaActive(t)) return false;
  const a = Number(EV.cta_meio_inicio);
  const b = Number(EV.cta_meio_fim);
  const dt = t - a;
  const rem = b - t;

  /* Entrada rapida com glitch/pop elastico + saida limpa */
  let sc = popScale(dt, 0.14);
  let alpha = clamp(dt / 0.08);
  let gx = 0;
  if (dt < 0.11) {
    const fr = Math.floor(dt * 30);
    gx = (fr % 2 === 0 ? 1 : -1) * (1 - dt / 0.11) * 22;
  }
  if (rem < 0.14) {
    const ek = clamp(rem / 0.14);
    sc = lerp(0.86, 1.0, easeOut(ek));
    alpha = ek;
  }

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = alpha;
  /* Zona segura superior-central (y: 148..294), longe do rosto/celular e das legendas (y: 1495) */
  g.translate(540 + gx, 222);
  g.scale(sc, sc);

  const cardW = 884, cardH = 146;
  /* Sombra projetada e halo amarelo discreto */
  g.fillStyle = 'rgba(0,0,0,0.62)';
  rr(-cardW / 2 + 6, -cardH / 2 + 10, cardW, cardH, 26); g.fill();

  /* Glitch split ciano/vermelho somente nos 3 primeiros quadros da entrada */
  if (dt < 0.10) {
    g.fillStyle = rgba(PAL.alert, 0.45);
    rr(-cardW / 2 - 8, -cardH / 2, cardW, cardH, 26); g.fill();
    g.fillStyle = rgba(PAL.cyan, 0.40);
    rr(-cardW / 2 + 8, -cardH / 2, cardW, cardH, 26); g.fill();
  }

  /* Card principal preto com borda amarela de alto contraste */
  g.fillStyle = '#090B12';
  rr(-cardW / 2, -cardH / 2, cardW, cardH, 26); g.fill();
  g.strokeStyle = PAL.yellow;
  g.lineWidth = 5;
  rr(-cardW / 2, -cardH / 2, cardW, cardH, 26); g.stroke();

  /* Linha 1: pergunta curta em caixa alta com folga lateral ampla */
  g.fillStyle = PAL.text;
  drawFittedText('QUER FAZER NO AUTOMÁTICO?', 0, -34, cardW - 96, 36, COND, '900', 'center');

  /* Linha 2: pilula amarela interna com padding lateral >= 44px de cada lado */
  const pillW = 680, pillH = 56, pillY = 2;
  g.fillStyle = PAL.yellow;
  rr(-pillW / 2, pillY, pillW, pillH, pillH / 2); g.fill();
  g.fillStyle = PAL.ink;
  drawFittedText('COMENTE EU QUERO', 0, pillY + pillH / 2 + 2, pillW - 96, 36, COND, '900', 'center');

  g.restore();
  return true;
}

function normalizeEvents(raw, audioDur){
  const e = { ...EV_PREVIEW, ...(raw || {}) };
  const dur = Math.max(audioDur || 0, Number(e.duracao_total) || EV_PREVIEW.duracao_total);
  e.duracao_total = dur;
  if (raw) {
    for (const k of Object.keys(EV_PREVIEW)) {
      if (typeof EV_PREVIEW[k] === 'number' && raw[k] !== undefined) e[k] = Number(raw[k]);
    }
    if (typeof raw.cta_modo === 'string') e.cta_modo = raw.cta_modo;
    if (typeof raw.cta_texto === 'string') e.cta_texto = raw.cta_texto;
    if (URL_PARTE === null && typeof window.parteLabel !== 'string' && typeof raw.parte_label === 'string' && raw.parte_label.trim()) {
      parteLabel = raw.parte_label.trim();
    }
  }
  EV = e;
  duration = dur;
  SHOTS = buildShots(EV);
  KATANA_HITS = buildKatanaHits(EV);

  /* Expressao da Camila troca escondida na piscada 2 frames (0.067s) antes do evento */
  EXPR_CUES = [
    [0, 'neutral'],
    [EV.congela, 'fear'],
    [EV.entregador, 'fear'],
    [EV.portaria_vazia, 'worry'],
    [EV.impacto_twist, 'shock'],
    [EV.plot_twist, 'shock']
  ];
  const bl = [];
  let bt = 0.85, bi = 0;
  while (bt < duration + 1) { bl.push(bt); bt += 2.5 + hash(bi++ * 9.7) * 1.5; }
  for (const [ct] of EXPR_CUES) if (ct > 0.2) bl.push(Math.max(0.05, ct - 0.067));
  BLINKS = bl.sort((a, b) => a - b);
}

const exprAt = t => { let ex = 'neutral'; for (const [a, b] of EXPR_CUES) if (t >= a - 0.01) ex = b; return ex; };
function faceAt(t){
  let last = -1, prev = -1;
  for (const b of BLINKS) { if (b <= t) { prev = last; last = b; } else break; }
  const d = t - last;
  const closed = last >= 0 && d < 0.16 ? Math.sin((d / 0.16) * Math.PI) : 0;
  const ref = last < 0 ? 0 : (d < 0.08 ? (prev < 0 ? 0 : prev + 0.08) : last + 0.08);
  return { ex: exprAt(ref), closed };
}

/* ============================================================
   FUNDOS VIBRANTES PULSANTES + PARTICULAS CONTINUAS (V4.1)
   ============================================================ */
const PARTICLES = (() => {
  const rng = mulberry(202605);
  const arr = [];
  for (let i = 0; i < 40; i++) {
    arr.push({
      x: rng() * (W + 300) - 150,
      y: rng() * (H + 300) - 150,
      vx: (rng() - 0.45) * 26,
      vy: -(12 + rng() * 34),
      r: 2.2 + rng() * 5.2,
      layer: i < 20 ? 0 : 1,
      ph: rng() * Math.PI * 2,
      a: 0.13 + rng() * 0.26
    });
  }
  return arr;
})();

function drawParticles(t, mood){
  const colPrimary = mood === 'red' ? PAL.alert
    : (mood === 'yellow' ? PAL.yellow
      : (mood === 'cctv' ? PAL.cctvBright : PAL.cyan));
  const colAlt = mood === 'red' ? '#FF8A5B'
    : (mood === 'cctv' ? PAL.cctvPale : PAL.violet);
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < PARTICLES.length; i++) {
    const p = PARTICLES[i];
    const sp = p.layer === 1 ? 1.35 : 0.7;
    const spanW = W + 300, spanH = H + 300;
    const px = ((((p.x + p.vx * t * sp) + 150) % spanW) + spanW) % spanW - 150;
    const py = ((((p.y + p.vy * t * sp) + 150) % spanH) + spanH) % spanH - 150;
    const tw = 0.55 + 0.45 * Math.sin(t * (2.5 + p.layer * 1.3) + p.ph);
    const col = (i % 3 === 0) ? colAlt : colPrimary;
    const a = p.a * tw * (mood === 'dark' ? 0.35 : 1.0);
    g.fillStyle = rgba(col, a);
    circ(px, py, p.r);
  }
  g.restore();
}

function drawBackdrop(t, mood){
  const pulseSlow = 0.5 + 0.5 * Math.sin(t * 3.6);
  const pulseFast = 0.5 + 0.5 * Math.sin(t * 7.8);
  let top = PAL.bgNavy, bot = PAL.bgViolet, glowCol = PAL.cyan, glowA = 0.15;

  if (mood === 'cctv') {
    top = mixHex('#071217', PAL.bgNavy, pulseSlow * 0.35);
    bot = '#03070B';
    glowCol = PAL.cctvBright;
    glowA = 0.18;
  } else if (mood === 'violet') {
    top = mixHex(PAL.bgViolet, PAL.bgNavy, pulseSlow * 0.35);
    bot = PAL.bgNavy;
    glowCol = PAL.violet;
    glowA = 0.22;
  } else if (mood === 'yellow') {
    top = mixHex(PAL.bgNavy, PAL.bgYellow, 0.46 + 0.44 * pulseFast);
    bot = mixHex(PAL.bgViolet, PAL.bgYellow, 0.32 + 0.38 * pulseFast);
    glowCol = PAL.yellow;
    glowA = 0.22;
  } else if (mood === 'red') {
    top = mixHex(PAL.bgViolet, PAL.bgRed, 0.54 + 0.46 * pulseFast);
    bot = mixHex(PAL.bgNavy, PAL.bgRed, 0.44 + 0.46 * pulseFast);
    glowCol = PAL.alert;
    glowA = 0.28 + 0.12 * pulseFast;
  } else if (mood === 'dark') {
    top = '#05060C';
    bot = '#020306';
    glowCol = PAL.alert;
    glowA = 0.10;
  } else {
    top = mixHex(PAL.bgNavy, PAL.bgViolet, pulseSlow * 0.35);
    bot = PAL.bgDeep;
  }

  vgrad(top, bot);
  glow(540 + Math.sin(t * 0.8) * 70, 740, 620, glowCol, glowA);
  drawParticles(t, mood);
}

/* ============================================================
   RIG FLAT EM CAPSULA (10 PONTOS IK) - CAMILA (MOLETOM #7C3AED)
   ============================================================ */
function drawEyes(cx, cy, r, ex, closed, lookX=0){
  const lift = { neutral: 0, worry: 0.07, fear: 0.13, shock: 0.21 }[ex] || 0;
  const tilt = { neutral: 0, worry: 0.12, fear: 0.11, shock: 0.05 }[ex] || 0;
  const eyePositions = [[cx + r * 0.06, 1], [cx + r * 0.52, -1]];
  g.lineCap = 'round';

  for (const [x, inner] of eyePositions) {
    const y = cy - r * 0.05;
    const browY = y - r * (0.28 + lift);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.066;
    g.beginPath();
    g.moveTo(x - inner * r * 0.14, browY + (ex === 'worry' || ex === 'fear' ? r * 0.04 : 0));
    g.lineTo(x + inner * r * 0.14, browY - tilt * r);
    g.stroke();

    if (closed > 0.55) {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * 0.055;
      g.beginPath(); g.moveTo(x - r * 0.11, y); g.lineTo(x + r * 0.11, y); g.stroke();
      continue;
    }

    const scaleY = 1 - closed * 0.9;
    g.save();
    g.translate(x, y);
    g.scale(1, scaleY);

    if (ex === 'shock' || ex === 'fear' || ex === 'worry') {
      const rx = ex === 'shock' ? r * 0.23 : ex === 'fear' ? r * 0.19 : r * 0.15;
      const ry = ex === 'shock' ? r * 0.26 : ex === 'fear' ? r * 0.21 : r * 0.17;
      g.fillStyle = PAL.white;
      ell(0, 0, rx, ry);
      const pr = ex === 'shock' ? r * 0.054 : ex === 'fear' ? r * 0.075 : r * 0.085;
      g.fillStyle = PAL.ink;
      circ(r * 0.03 + lookX * r * 0.05, 0, pr);
      g.fillStyle = PAL.white;
      circ(r * 0.05 + lookX * r * 0.05, -pr * 0.45, pr * 0.34);
    } else {
      g.fillStyle = PAL.ink;
      ell(0, 0, r * 0.095, r * 0.12);
      g.fillStyle = PAL.white;
      circ(r * 0.03 + lookX * r * 0.03, -r * 0.045, r * 0.028);
    }
    g.restore();
  }

  if (ex === 'shock') {
    g.fillStyle = rgba(PAL.ink, 0.85);
    ell(cx + r * 0.29, cy + r * 0.40, r * 0.095, r * 0.13);
    g.fillStyle = rgba(PAL.sweat, 0.92);
    const sx = cx + r * 0.82, sy = cy - r * 0.34;
    g.beginPath();
    g.moveTo(sx, sy - r * 0.18);
    g.quadraticCurveTo(sx + r * 0.09, sy + r * 0.02, sx, sy + r * 0.08);
    g.quadraticCurveTo(sx - r * 0.09, sy + r * 0.02, sx, sy - r * 0.18);
    g.fill();
  } else if (ex === 'fear' || ex === 'worry') {
    g.strokeStyle = rgba(PAL.ink, 0.72);
    g.lineWidth = r * 0.048;
    g.beginPath();
    g.moveTo(cx + r * 0.18, cy + r * 0.36);
    g.lineTo(cx + r * 0.40, cy + r * (ex === 'fear' ? 0.33 : 0.36));
    g.stroke();
  }
}

function drawHeadCamila(cx, cy, r, ex, closed, o={}){
  const tilt = o.tilt || 0;
  g.save();
  g.translate(cx, cy);
  g.rotate(tilt);

  /* Cabelo escuro comprido ate os ombros atras da cabeca (silhueta propria de Camila) */
  g.fillStyle = PAL.hair;
  rr(-r * 1.08, -r * 0.18, r * 1.12, r * 1.56, r * 0.46); g.fill();

  /* Cabeca redonda flat limpa */
  g.fillStyle = PAL.skin;
  circ(0, 0, r);

  g.save();
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
  g.fillStyle = rgba(PAL.ink, 0.14);
  circ(-r * 1.08, r * 0.16, r * 0.96);
  g.restore();

  /* Franja lateral sem costura */
  g.fillStyle = PAL.hair;
  g.beginPath();
  g.arc(-r * 0.04, -r * 0.05, r * 1.04, Math.PI * 0.72, -Math.PI * 0.15, false);
  g.quadraticCurveTo(r * 0.54, -r * 0.56, -r * 0.12, -r * 0.54);
  g.quadraticCurveTo(-r * 0.58, -r * 0.44, -r * 0.64, 0);
  g.quadraticCurveTo(-r * 0.66, r * 0.46, -r * 0.78, r * 0.96);
  g.closePath();
  g.fill();

  /* Orelha flat limpa */
  g.fillStyle = PAL.skin;
  circ(-r * 0.66, r * 0.12, r * 0.18);
  g.fillStyle = rgba(PAL.skinShadow, 0.6);
  circ(-r * 0.67, r * 0.13, r * 0.08);

  if (o.rimA > 0) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';
    g.strokeStyle = rgba(o.rimColor || PAL.cyan, o.rimA);
    g.lineWidth = r * 0.078;
    g.beginPath();
    g.arc(0, 0, r * 0.97, (o.rimAng || 0) - 0.85, (o.rimAng || 0) + 0.85);
    g.stroke();
    g.restore();
  }

  drawEyes(0, 0, r, ex, closed, o.lookX || 0);
  g.restore();
}

function ik(sx, sy, hx, hy, l1, l2, flip=1){
  const dx = hx - sx, dy = hy - sy;
  const d = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01);
  const a = Math.atan2(dy, dx);
  const c = clamp((l1*l1 + d*d - l2*l2) / (2*l1*d), -1, 1);
  const an = a + flip * Math.acos(c);
  return [sx + Math.cos(an) * l1, sy + Math.sin(an) * l1];
}
function drawLimb(s, h, l1, l2, w, col, handCol, flip=1){
  const e = ik(s[0], s[1], h[0], h[1], l1, l2, flip);
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(s[0], s[1]); g.lineTo(e[0], e[1]); g.lineTo(h[0], h[1]); g.stroke();
  if (handCol) { g.fillStyle = handCol; circ(h[0], h[1], w * 0.52); }
  return e;
}
const mix = (a, b, k) => { if (k) { a[0] = lerp(a[0], b[0], k); a[1] = lerp(a[1], b[1], k); } };

/* Camila corpo inteiro (rig 10 pontos IK com pes travados no chao gy) */
function drawCamilaStanding(x, gy, s, o){
  const t = o.t, P = o.pose || {};
  const run = P.run || 0;
  const br = Math.sin(t * 2 * Math.PI / (o.fastBreath ? 1.35 : 3.0));
  const step = Math.sin(t * 11.0) * run;

  g.save();
  g.translate(x, gy);
  g.scale(s * (o.face || 1), s);

  g.fillStyle = 'rgba(0,0,0,.55)';
  ell(4, 0, 114, 15);

  const hipY = -224 - Math.abs(step) * 10;
  const shY = -430 - br * 5;
  const hx = 6, hy = shY - 102 - br * 2;

  const footF = [-24 - step * 50, -14];
  const footN = [24 + step * 50, -14];
  drawLimb([-16, hipY + 8], footF, 108, 106, 34, PAL.pantsDark, null, -1);
  drawLimb([16, hipY + 8], footN, 108, 106, 36, PAL.pants, null, -1);

  for (const [fx, fy, dark] of [[footF[0] + 10, -11, true], [footN[0] + 10, -11, false]]) {
    g.fillStyle = dark ? '#181426' : '#2A2340';
    ell(fx, fy, 40, 12);
  }

  const SN = [-8, shY + 46], SF = [24, shY + 44];
  const hn = [-4, hipY + 26], hf = [38, hipY + 24];
  mix(hn, [88, shY + 132], P.phone); mix(hf, [62, shY + 142], P.phone);
  mix(hn, [148, shY + 48], P.reach); mix(hf, [118, shY + 92], P.reach);

/* Tela realista de interfone/CCTV na chuva com entregador de capacete escuro */
function drawIntercomScreen(t, mode, localP){
  const mw = 880, mh = 760;

  g.save();

  g.fillStyle = 'rgba(0,0,0,0.62)'; rr(mx + 14, my + 24, mw, mh, 44); g.fill();
  g.fillStyle = '#151B29'; rr(mx, my, mw, mh, 44); g.fill();
  g.strokeStyle = '#334155'; g.lineWidth = 6; rr(mx, my, mw, mh, 44); g.stroke();

  /* LED de chamada + titulo no topo da moldura */
  const blink = Math.floor(t * 4) % 2 === 0;

  g.fillStyle = PAL.dim;
  drawFittedText('VIDEO PORTEIRO // PORTARIA', mx + 96, my + 46, 520, 23, MONO, '700', 'left');

  const sx = mx + 52, sy = my + 86, sw = mw - 104, sh = 550;
  g.save();
  rr(sx, sy, sw, sh, 18); g.clip();

  /* Fundo CCTV cinza-azulado noturno da portaria */
  const cg = g.createRadialGradient(sx + sw * 0.5, sy + sh * 0.25, 30, sx + sw * 0.5, sy + sh * 0.5, sw * 0.78);
  cg.addColorStop(0, '#223642');
  cg.addColorStop(0.55, '#111E26');
  cg.addColorStop(1, '#060C10');
  g.fillStyle = cg; g.fillRect(sx, sy, sw, sh);

  /* Grade do portao da portaria ao fundo + luz do poste */
  g.fillStyle = '#0B141A'; g.fillRect(sx, sy + sh - 115, sw, 120);
  g.strokeStyle = '#1F3542'; g.lineWidth = 6;
  for (let gx = sx + 48; gx < sx + sw; gx += 72) {
    g.beginPath(); g.moveTo(gx, sy + 60); g.lineTo(gx, sy + sh - 115); g.stroke();
  }
  glow(sx + sw * 0.5, sy + 70, 260, PAL.cctvPale, 0.22);

  /* ENTREGADOR DE CAPACETE ESCURO ENCARANDO A LENTE SEM PISCAR */
  if (mode === 'entregador' || mode === 'interfone_fx') {

    g.save();

    /* Mochila termica de entrega nas costas */

    g.strokeStyle = '#6B1C24'; g.lineWidth = 5; rr(-136, -34, 272, 230, 20); g.stroke();

    /* Ombros de jaqueta de chuva escura */
    g.fillStyle = '#090E14';
    rr(-150, 26, 300, 250, 88); g.fill();
    /* Faixa refletiva sutil da jaqueta */
    g.fillStyle = rgba(PAL.cctvPale, 0.32);
    g.fillRect(-135, 118, 270, 12);

    /* Capacete de moto preto encarando reto a camera */
    g.fillStyle = '#06090F';
    circ(0, -68, 96);
    g.strokeStyle = rgba(PAL.cctvBright, 0.35); g.lineWidth = 4;
    g.beginPath(); g.arc(0, -68, 95, -Math.PI * 0.85, -Math.PI * 0.15); g.stroke();

    /* Viseira escura espelhada com reflexo frio da chuva + olhar quase invisivel por tras */
    g.fillStyle = '#020408';
    rr(-72, -104, 144, 66, 22); g.fill();
    g.strokeStyle = rgba(PAL.cctvPale, 0.48); g.lineWidth = 3;
    rr(-72, -104, 144, 66, 22); g.stroke();
    /* Brilho diagonal na viseira */
    g.fillStyle = rgba(PAL.cctvPale, 0.16);
    g.beginPath();
    g.moveTo(-58, -98); g.lineTo(-18, -98); g.lineTo(-42, -44); g.lineTo(-66, -44); g.closePath(); g.fill();
    /* Dois pontos sutis de olhos fixos por dentro da viseira sem piscar */
    g.fillStyle = rgba(PAL.cctvPale, 0.55);
    circ(-24, -72, 4.5);
    circ(24, -72, 4.5);
    g.restore();
  }

  /* Chuva caindo em diagonais deterministicas na portaria */
  g.save();
  g.strokeStyle = rgba(PAL.cctvPale, 0.28);
  g.lineWidth = 2.5;
  for (let i = 0; i < 42; i++) {
    const rx = sx + ((hash(i * 11.3) * (sw + 160) - t * 140) % (sw + 160) + (sw + 160)) % (sw + 160) - 80;
    const ry = sy + ((hash(i * 7.7) * sh + t * 520) % sh);
    g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx - 10, ry + 34); g.stroke();
  }
  g.restore();

  /* Ondas do interfone posicionadas com folga acima do rodape HUD */
  if (mode === 'interfone_fx') {
    const wx = sx + 178, wy = sy + sh - 178, ww = sw - 356, wh = 72;
    g.fillStyle = rgba('#04080D', 0.80); rr(wx, wy, ww, wh, 16); g.fill();
    g.strokeStyle = rgba(PAL.cctvBright, 0.65); g.lineWidth = 3; rr(wx, wy, ww, wh, 16); g.stroke();
    for (let i = 0; i < 19; i++) {
      const h = 10 + 42 * Math.abs(Math.sin(t * 17 + i * 0.8)) * (0.4 + 0.6 * hash(Math.floor(t * 15) * 29 + i));
      g.fillStyle = h > 36 ? PAL.alert : PAL.cctvBright;
      rr(wx + 24 + i * 19.5, wy + wh / 2 - h / 2, 10, h, 4); g.fill();
    }
  }

  /* Scanlines pre-renderizadas + micro-glitch */
  g.drawImage(scanCv, sx, sy, sw, sh);
  const fr = Math.floor(t * 30);
  if (hash(fr * 4.1) > 0.65) {
    const gy = sy + hash(fr * 13.7) * (sh - 28);
    g.fillStyle = rgba(PAL.cctvPale, 0.18);
    g.fillRect(sx, gy, sw, 6 + hash(fr * 9.3) * 14);
  }

  /* HUD do interfone (UNICO relogio 02:15 neste quadro!) */
  g.strokeStyle = rgba(PAL.cctvPale, 0.56); g.lineWidth = 4;
  const brk = 26;
  for (const [cx, cy, dx, dy] of [
    [sx + 20, sy + 20, 1, 1], [sx + sw - 20, sy + 20, -1, 1],
    [sx + 20, sy + sh - 20, 1, -1], [sx + sw - 20, sy + sh - 20, -1, -1]
  ]) {
    g.beginPath(); g.moveTo(cx, cy + dy * brk); g.lineTo(cx, cy); g.lineTo(cx + dx * brk, cy); g.stroke();
  }

  if (Math.floor(t * 2.2) % 2 === 0) {
    g.fillStyle = PAL.alert; circ(sx + 52, sy + 52, 10);
  }
  g.fillStyle = PAL.cctvPale;
  drawFittedText('CAM PORTARIA', sx + 74, sy + 52, 240, 26, MONO, '800', 'left');
  drawFittedText('02:15', sx + sw - 34, sy + 52, 150, 32, MONO, '900', 'right');
  drawFittedText('CHUVA  17C', sx + 34, sy + sh - 36, 220, 22, MONO, '700', 'left');
  const tag = mode === 'vazia' ? 'PORTARIA VAZIA' : 'CHAMANDO...';
  g.fillStyle = mode === 'vazia' ? PAL.yellow : PAL.alert;
  drawFittedText(tag, sx + sw - 34, sy + sh - 36, 260, 24, MONO, '800', 'right');
  g.restore();

  /* Borda da tela e botoes do interfone */
  g.strokeStyle = '#090D16'; g.lineWidth = 5; rr(sx, sy, sw, sh, 18); g.stroke();
  g.fillStyle = '#0D1320';
  for (let i = 0; i < 6; i++) circ(mx + 120 + i * 24, my + mh - 56, 6);
  g.fillStyle = '#25314B'; rr(mx + mw - 270, my + mh - 74, 105, 36, 18); g.fill();
  g.fillStyle = PAL.alert; rr(mx + mw - 148, my + mh - 74, 90, 36, 18); g.fill();
  g.restore();
}

/* Macro na corrente metalica deslizando na trava da porta da sala */
function drawChainLockMacro(t, localP){
  vgrad('#161013', '#07080F');
  /* Batente esquerdo + folha da porta a direita cobrindo todo o quadro mesmo sob zoom */
  g.fillStyle = PAL.wood; g.fillRect(-200, -220, 520, H + 440);
  g.fillStyle = PAL.woodLight; g.fillRect(320, -220, 960, H + 440);
  g.fillStyle = '#040509'; g.fillRect(312, -220, 16, H + 440);

  /* Suporte esquerdo fixo no batente */
  g.fillStyle = PAL.steelDark; rr(160, 845, 118, 220, 16); g.fill();
  g.fillStyle = PAL.steel; rr(174, 860, 90, 190, 12); g.fill();
  circ(219, 892, 10); circ(219, 1018, 10);

  /* Trilho de aco na porta (direita) */
  g.fillStyle = PAL.steelDark; rr(385, 885, 495, 138, 20); g.fill();
  g.fillStyle = PAL.steel; rr(400, 900, 465, 108, 14); g.fill();
  g.fillStyle = '#0B0F19'; rr(442, 938, 376, 32, 16); g.fill();

  /* Pino deslizando e travando no fim do trilho */
  const slide = easeOut(clamp((localP - 0.15) / 0.55));
  const pinX = lerp(455, 795, slide);

  /* Elos da corrente metalica esticando */
  g.strokeStyle = PAL.steelLight;
  g.lineWidth = 14;
  const links = 7;
  for (let i = 0; i < links; i++) {
    const u = i / (links - 1);
    const lx = lerp(240, pinX, u);
    const sag = Math.sin(Math.PI * u) * lerp(95, 14, slide);
    const ly = 954 + sag;
    g.beginPath();
    g.ellipse(lx, ly, 34, 18, (i % 2 === 0 ? 0.18 : -0.18), 0, Math.PI * 2);
    g.stroke();
  }

  /* Pino travado + brilho metalico seco no encaixe */
  g.fillStyle = PAL.steelLight;
  circ(pinX, 954, 28);
  g.fillStyle = PAL.steelDark;
  circ(pinX, 954, 12);
  if (slide > 0.85) {
    glow(pinX, 954, 220, PAL.cyan, (1 - (slide - 0.85) / 0.15) * 0.55);
  }
}

/* ============================================================
   PLOT TWIST: FOTO DA SACOLA NA COZINHA + PULL-OUT DO CORREDOR
   ============================================================ */
function drawDeliveryPhotoScene(t, mode, localP){
  const isPullout = (mode === 'pullout');
  const pull = isPullout ? ease(localP) : 0;

  /* Moldura de visualizador de foto no celular */
  vgrad('#06070D', '#030408');

  const fx = 66, fy = 265, fw = 948, fh = 1020;
  g.save();
  rr(fx, fy, fw, fh, 26); g.clip();

  /* Cozinha iluminada fria ao fundo */
  g.fillStyle = PAL.wallKitchen; g.fillRect(fx, fy, fw, fh);
  g.strokeStyle = PAL.tileLine; g.lineWidth = 2;
  for (let y = fy + 90; y < fy + 710; y += 74) {
    g.beginPath(); g.moveTo(fx, y); g.lineTo(fx + fw, y); g.stroke();
  }
  for (let x = fx + 80; x < fx + fw; x += 96) {
    g.beginPath(); g.moveTo(x, fy); g.lineTo(x, fy + 710); g.stroke();
  }
  /* Geladeira branca a direita */
  g.fillStyle = '#CBD5E1'; rr(fx + 690, fy + 145, 210, 580, 14); g.fill();
  g.strokeStyle = '#94A3B8'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(fx + 690, fy + 355); g.lineTo(fx + 900, fy + 355); g.stroke();

  /* Mesa da cozinha com a SACOLA PARDA DE DELIVERY em cima */
  const scaleScene = isPullout ? lerp(1.0, 0.72, pull) : 1.0;
  g.save();
  g.translate(540, fy + 590);
  g.scale(scaleScene, scaleScene);
  g.translate(-540, -(fy + 590));

  /* Tampo da mesa */
  g.fillStyle = PAL.tableTop; rr(fx + 140, fy + 610, 640, 62, 12); g.fill();
  g.fillStyle = PAL.tableDark;
  g.fillRect(fx + 180, fy + 672, 34, 340);
  g.fillRect(fx + 706, fy + 672, 34, 340);

  /* Caneca azul da Camila ao lado para provar que e a cozinha dela */
  g.fillStyle = '#38BDF8'; rr(fx + 230, fy + 546, 56, 64, 10); g.fill();
  g.strokeStyle = '#38BDF8'; g.lineWidth = 8;
  g.beginPath(); g.arc(fx + 286, fy + 578, 16, -Math.PI * 0.5, Math.PI * 0.5); g.stroke();

  /* Sacola parda lacrada de delivery em cima da mesa */
  const bx = 540, by = fy + 610;
  g.fillStyle = 'rgba(0,0,0,0.42)'; ell(bx, by + 6, 138, 18);
  g.fillStyle = PAL.bagPaper;
  g.beginPath();
  g.moveTo(bx - 108, by); g.lineTo(bx - 92, by - 255);
  g.lineTo(bx + 92, by - 255); g.lineTo(bx + 108, by); g.closePath(); g.fill();
  /* Dobra superior lacrada + adesivo vermelho de delivery */
  g.fillStyle = PAL.bagFold; rr(bx - 94, by - 275, 188, 46, 8); g.fill();
  g.fillStyle = PAL.appRed; rr(bx - 34, by - 246, 68, 34, 6); g.fill();
  /* Cupom fiscal branco grampeado na sacola */
  g.fillStyle = '#F8FAFC'; rr(bx + 16, by - 190, 64, 96, 4); g.fill();
  g.fillStyle = '#64748B';
  for (let r = 0; r < 5; r++) g.fillRect(bx + 26, by - 174 + r * 14, 44, 5);
  /* Numero do pedido na sacola (evita duplicar horario 02:15 no mesmo quadro) */
  g.fillStyle = PAL.bagDeep;
  drawFittedText('#402', bx - 30, by - 100, 96, 30, MONO, '900', 'center');

  /* NO PULL-OUT: CAMILA DE COSTAS SEGURANDO O CELULAR NA FRENTE DA MESA! */
  if (isPullout && pull > 0.12) {
    const cAlpha = clamp((pull - 0.12) / 0.45);
    g.save();
    g.globalAlpha = cAlpha;
    /* Silhueta de costas da Camila (moletom violeta #7C3AED + cabelo escuro cobrindo nuca) */
    const cx = 395, cy = fy + 945;
    g.fillStyle = PAL.pantsDark; rr(cx - 48, cy - 180, 42, 220, 18); g.fill();
    g.fillStyle = PAL.pants; rr(cx + 6, cy - 180, 42, 220, 18); g.fill();
    g.fillStyle = PAL.top; rr(cx - 72, cy - 395, 144, 236, 64); g.fill();
    g.fillStyle = PAL.topShade; rr(cx - 72, cy - 395, 50, 236, 40); g.fill();

/* ============================================================
   CAMERA VIVA V4.1 + PUNCH-IN KATANA + SCREEN SHAKE AMORTECIDO
   ============================================================ */
function pickShot(t){
  for (let i = 0; i < SHOTS.length; i++) {
    const s = SHOTS[i];
    if (t < s.end || i === SHOTS.length - 1) return s;
  }
  return SHOTS[0];
}

function cameraFor(shot, t){
  const k = ease(prog(t, shot.start, shot.end));
  let z = lerp(shot.cam0[0], shot.cam1[0], k);
  const cx = lerp(shot.cam0[1], shot.cam1[1], k);
  const cy = lerp(shot.cam0[2], shot.cam1[2], k);

  let sx = noise(t * 2.1, 11) * 4.5;
  let sy = noise(t * 1.9, 29) * 4.5;

  for (let i = 0; i < KATANA_HITS.length; i++) {
    const kh = KATANA_HITS[i];
    if (t >= kh.start && t < kh.end + 0.40) {
      const dt = t - kh.start;
      z += kh.punch * Math.exp(-dt * 7.2);
      const env = Math.exp(-dt * 10.5);
      sx += Math.sin(dt * 108) * kh.shake * env;
      sy += Math.cos(dt * 94) * kh.shake * 0.72 * env;
    }
  }

  const impacts = [
    [EV.vibra_1, 10, 8.0],
    [EV.porta_impacto + 0.06, 22, 6.2],
    [EV.vibra_2, 12, 7.5],
    [EV.impacto_twist, 26, 5.2]
  ];
  for (const [ti, amp, dec] of impacts) {
    if (t >= ti && t < ti + 0.90) {
      const dt = t - ti;
      const env = Math.exp(-dt * dec);
      sx += Math.sin(dt * 95) * amp * env;
      sy += Math.cos(dt * 83) * amp * 0.72 * env;
    }
  }
  return { z, cx, cy, sx, sy };
}

function finish(vig){
  g.save();
  g.globalAlpha = clamp(vig, 0, 1);
  g.drawImage(vigCv, 0, 0);
  g.restore();
}

/* ============================================================
   LEGENDAS POP-IN (2-3 PALAVRAS, MAIUSCULAS, AMARELO/VERMELHO)
   ============================================================ */
const RED_WORDS = new Set([
  'congela', 'nao', 'pediu', 'nada', 'entregador', 'capacete', 'encara',
  'piscar', 'corrente', 'vazia', 'entregue', 'foto', 'sacola', 'cozinha',
  'corredor', 'atras', 'dela'
]);
function normWord(w){
  return w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/gi, '').toLowerCase();
}

function buildPreviewCaptions(){
  const e = EV;
  const lines = [
    [e.gancho, e.vibra_1 - 0.16, 'Duas e quinze da manhã.'],
    [e.vibra_1 - 0.1, e.congela - 0.18, 'O celular da Camila vibra: Seu pedido chegou na portaria.'],
    [e.congela, e.nao_pediu - 0.16, 'Ela congela.'],
    [e.nao_pediu - 0.1, e.tela_interfone - 0.16, 'Ela não pediu nada.'],
    [e.tela_interfone, e.interfone - 0.08, 'Na tela do interfone, um entregador de capacete encara a câmera sem piscar.'],
    [e.corre_porta, e.porta_impacto - 0.08, 'Ela corre e passa a corrente na porta da sala.'],
    [e.olha_volta, e.vibra_2 - 0.16, 'Quando olha de volta pra tela, a portaria está vazia.'],
    [e.vibra_2, e.foto_anexo - 0.16, 'O celular vibra outra vez: Pedido entregue.'],
    [e.foto_anexo, e.abre_imagem - 0.24, 'Foto de confirmação em anexo.'],
    [e.abre_imagem, e.impacto_twist - 0.08, 'Camila abre a imagem.'],
    [e.sacola_mesa, e.foto_corredor - 0.34, 'A sacola não está na portaria... está em cima da mesa da cozinha dela.'],
    [e.foto_corredor, e.duracao_total - 0.35, 'E a foto... foi tirada do corredor, bem atrás dela.']
  ];
  const groups = [];
  for (const [t0, t1, txt] of lines) {
    const words = txt.split(' ');
    const span = Math.max(0.25, t1 - t0);
    const weights = words.map(w => Math.max(2, w.length) + 1.2);
    const sum = weights.reduce((a, b) => a + b, 0);
    let cur = t0;
    const timed = words.map((w, i) => {
      const d = span * (weights[i] / sum);
      const item = { palavra: w, inicio: cur, fim: cur + d, duracao: d };
      cur += d;
      return item;
    });
    const clauses = [];
    let cl = [];
    timed.forEach((p, idx) => {
      cl.push(p);
      const rem = timed.length - idx - 1;
      if (/[:,]$/.test(p.palavra) && cl.length >= 2 && rem >= 2) { clauses.push(cl); cl = []; }
    });
    if (cl.length) clauses.push(cl);
    for (const c of clauses) {
      let i = 0;
      while (i < c.length) {
        const rem = c.length - i;
        const sz = rem <= 3 ? rem : (rem === 4 ? 2 : 3);
        const sl = c.slice(i, i + sz);
        groups.push({ inicio: sl[0].inicio, fim: sl[sl.length - 1].fim, palavras: sl });
        i += sz;
      }
    }
  }
  captionGroups = groups;
}

function drawCaptions(t){
  if (katanaStateAt(t) !== null) return;

  let grp = null;
  for (const c of captionGroups) {
    if (t >= c.inicio - 0.04 && t <= c.fim + 0.14) { grp = c; break; }
  }
  if (!grp || !grp.palavras || !grp.palavras.length) return;

  const words = grp.palavras.map(p => ({
    txt: String(p.palavra || '').toUpperCase(),
    key: normWord(String(p.palavra || '')),
    inicio: Number(p.inicio),
    fim: Number(p.fim ?? (Number(p.inicio) + Number(p.duracao || 0.25)))
  }));
  let active = 0;
  for (let i = 0; i < words.length; i++) if (t >= words[i].inicio - 0.02) active = i;

  const grpPop = popScale(t - grp.inicio + 0.02, 0.11);

  g.save();
  let fs = 78;
  g.font = `900 ${fs}px ${COND}`;
  g.textBaseline = 'middle';
  g.textAlign = 'center';
  let sp = Math.max(30, Math.round(fs * 0.44));
  let wds = words.map(w => g.measureText(w.txt).width);
  let tw = wds.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  if (tw > 900) {
    fs = Math.floor(fs * 900 / tw);
    g.font = `900 ${fs}px ${COND}`;
    sp = Math.max(22, Math.round(fs * 0.44));
    wds = words.map(w => g.measureText(w.txt).width);
    tw = wds.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  }

  const y = 1495;
  g.translate(540, y);
  g.scale(grpPop, grpPop);
  g.translate(-540, -y);

  let x = 540 - tw / 2;
  g.lineJoin = 'round';
  g.miterLimit = 2;

  words.forEach((w, i) => {
    const cx = x + wds[i] / 2;
    const isAct = i === active;
    const isRed = RED_WORDS.has(w.key);
    const fill = isAct ? (isRed ? PAL.alert : PAL.yellow) : '#FFFFFF';
    const wPop = isAct ? lerp(1.13, 1.06, easeOut(clamp((t - w.inicio) / 0.09))) : 1.0;

    g.save();
    g.translate(cx, y);
    g.scale(wPop, wPop);
    g.shadowColor = 'rgba(0,0,0,.88)';
    g.shadowBlur = 16;
    g.shadowOffsetY = 6;
    g.strokeStyle = '#000000';
    g.lineWidth = Math.max(12, Math.round(fs * 0.21));
    g.strokeText(w.txt, 0, 0);
    g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.fillStyle = fill;
    g.fillText(w.txt, 0, 0);
    g.restore();

    x += wds[i] + sp;
  });
  g.restore();
}

let ccOn = false;
function renderAt(t){
  t = clamp(+t || 0, 0, duration);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.filter = 'none';
  g.shadowBlur = 0;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);

  /* V4.1 loop seco: sem tela preta no final (mantem o climax vivo ate o ultimo quadro!) */
  const shot = pickShot(t);
  const katanaActive = drawKatanaOverlay(t);

  if (!katanaActive) {
    const cam = cameraFor(shot, t);
    g.save();
    g.translate(W / 2 + cam.sx, H / 2 + cam.sy);
    g.scale(cam.z, cam.z);
    g.translate(-cam.cx, -cam.cy);
    drawScene(shot, t);
    g.restore();

    finish(shot.vig || 0.60);
    drawClock(t, shot);

    const cutAge = t - shot.start;
    if (shot.id > 1 && cutAge >= 0 && cutAge < 0.06) {
      const k = 1 - cutAge / 0.06;
      g.fillStyle = shot.mood === 'red' ? `rgba(255,59,48,${k * 0.16})` : `rgba(0,0,0,${k * 0.35})`;
      g.fillRect(0, 0, W, H);
    }

    /* CTA visual unica no meio (~48%-58%, ~2.2s) */
    drawMidCta(t);
  }

  /* Selo permanente "PARTE 1" (x=64, y=165), oculto brevemente apenas durante a CTA do meio */
  drawParteBadge(t);

  if (ccOn) drawCaptions(t);
}

window.renderAt = renderAt;

window.getShots = () => SHOTS.map(s => ({ id: s.id, scene: s.scene, mood: s.mood, start: s.start, end: s.end, dur: s.dur }));
window.getKatanaHits = () => KATANA_HITS.map(h => ({ id: h.id, lines: h.lines, start: h.start, end: h.end, dur: h.dur }));
window.getMidCta = () => ({ modo: EV.cta_modo || 'meio', inicio: EV.cta_meio_inicio, fim: EV.cta_meio_fim, texto: EV.cta_texto || 'COMENTE EU QUERO' });
window.getParteLabel = () => parteLabel;
window.setParteLabel = v => { parteLabel = String(v ?? '').trim(); renderAt(cur); };

  seek.setAttribute('aria-valuetext', `${fmt(cur)} de ${fmt(duration)} segundos`);
  $('playLbl').textContent = playing ? 'Pausar' : 'Play';
  $('playIcon').setAttribute('d', playing ? 'M3 2h4v12H3zM9 2h4v12H9z' : 'M4 2l10 6-10 6z');
}
function tick(){
  if (!playing) return;
  cur = Math.min(t0 + (performance.now() - p0) / 1000, duration);
  if (audio && cur < audio.duration && Math.abs(audio.currentTime - cur) > 0.2) audio.currentTime = cur;
  renderAt(cur); ui();
  if (cur >= duration) pause(); else requestAnimationFrame(tick);
}
function play(){
  if (cur >= duration) cur = 0;
  playing = true; t0 = cur; p0 = performance.now();
  if (audio) { audio.currentTime = cur; audio.play().catch(() => {}); }
  ui(); requestAnimationFrame(tick);
}
function pause(){ playing = false; if (audio) audio.pause(); ui(); }
btn.addEventListener('click', () => playing ? pause() : play());
seek.addEventListener('input', () => {
  cur = +seek.value; t0 = cur; p0 = performance.now();
  if (audio && cur < audio.duration) audio.currentTime = cur;
  renderAt(cur); ui();
});
cc.addEventListener('click', () => {
  ccOn = !ccOn; cc.setAttribute('aria-pressed', String(ccOn)); renderAt(cur);
});

async function fetchJson(url){
  if (location.protocol === 'file:') return null;
  try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return null;
}
function probeAudio(src){
  return new Promise(res => {
    const el = new Audio(); let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    el.preload = 'auto';
    el.addEventListener('loadedmetadata', () => fin(el), { once: true });
    el.addEventListener('error', () => fin(null), { once: true });
    setTimeout(() => fin(null), 3500);
    el.src = src;
  });
}

async function load(){
  const [evData, tsData] = await Promise.all([
    fetchJson('audio/eventos.json'),
    fetchJson('audio/timestamps.json')
  ]);
  let a = await probeAudio('audio/mix_final.mp3');
  let audioSrc = 'audio/mix_final.mp3';
  if (!a) { a = await probeAudio('audio/narracao.mp3'); audioSrc = 'audio/narracao.mp3'; }

  if (a && isFinite(a.duration)) audio = a;
  normalizeEvents(evData, audio ? audio.duration : null);

  if (tsData && Array.isArray(tsData.grupos) && tsData.grupos.length) {
    captionGroups = tsData.grupos;
  } else {
    buildPreviewCaptions();
  }

  if (audio && evData) {
    status.textContent = `Audio (${audioSrc}) sincronizado com eventos.json e timestamps.json (${fmt(duration)} s | CTA meio).`;
  } else if (audio) {
    status.textContent = `Audio (${audioSrc}) carregado sem eventos.json (${fmt(duration)} s).`;
  } else {
    status.textContent = `Modo Previa V4.1: sem audio, usando marcos padrao do roteiro_05 (0 a ${fmt(duration)} s | CTA meio).`;
  }
  seek.max = duration;
  btn.disabled = false; seek.disabled = false; btn.removeAttribute('aria-busy');
  renderAt(cur); ui();
}

normalizeEvents(null, null);
buildPreviewCaptions();
renderAt(0); ui(); load();
})();
</script>
