<style>
/* Camada unica de tokens, espelhando tokens/colors.json (dark), spacing, typography, motion, borders, opacity. */
:root{
  --surface-page:#030712; --surface-sunken:#000000; --surface-raised:#1f2937;
  --text-primary:#f9fafb; --text-secondary:#9ca3af;
  --border-default:#1f2937; --border-strong:#6b7280; --focus-ring:#60a5fa;
  --action-primary:#2563eb; --action-primary-hover:#1d4ed8;
  --action-secondary:#111827; --action-secondary-hover:#374151;
  --space-1:4px; --space-2:8px; --space-3:12px;
  --radius-button:6px; --radius-card:8px; --border-width:1px; --focus-width:2px;

  --opacity-disabled:.45; --target-min:44px; --chrome-h:128px; --press-offset:1px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}
.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-2)}
.stage{width:min(100%,calc((100dvh - var(--chrome-h)) * 9 / 16));aspect-ratio:9/16}
canvas{display:block;width:100%;height:100%;border-radius:var(--radius-card);background:var(--surface-sunken)}
.controls{width:100%;max-width:calc(var(--target-min) * 12);display:flex;align-items:center;gap:var(--space-2)}
.btn{min-height:var(--target-min);min-width:var(--target-min);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);
  padding:0 var(--space-3);border:var(--border-width) solid var(--border-default);border-radius:var(--radius-button);
  background:var(--action-secondary);color:var(--text-primary);font:var(--weight-medium) var(--font-size-sm)/1 var(--font-sans);cursor:pointer;
  transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out)}
.btn svg{width:var(--font-size-sm);height:var(--font-size-sm);fill:currentColor}
.btn:hover{background:var(--action-secondary-hover)}
.btn-primary{background:var(--action-primary);border-color:var(--action-primary)}

.btn:focus-visible,.seek:focus-visible{outline:var(--focus-width) solid var(--focus-ring);outline-offset:var(--focus-width)}
.btn:active{transform:translateY(var(--press-offset))}
.btn:disabled{opacity:var(--opacity-disabled);cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress}
.btn[aria-pressed="true"]{background:var(--surface-raised);border-color:var(--border-strong)}
.seek{flex:1;min-width:0;min-height:var(--target-min);accent-color:var(--action-primary);cursor:pointer}
.seek:disabled{opacity:var(--opacity-disabled)}
.time{font:var(--font-size-xs)/1 var(--font-mono);color:var(--text-secondary);white-space:nowrap}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

const MONO = '"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace';
const SANS = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const COND = '"Arial Narrow","Roboto Condensed","Liberation Sans Narrow",Impact,Arial,sans-serif';

/* Selo dinamico V5.2: "PARTE 1" antes de corte_parte_2, "PARTE 2" a partir de corte_parte_2 */
const URL_PARTE = new URLSearchParams(location.search).get('parte');

/* Utilidades deterministicas */
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const prog = (t, a, b) => clamp((t - a) / Math.max(0.001, b - a));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (t, seed=0) => {
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57), hash(i + 1 + seed * 57), u) * 2 - 1;
};
const hexRgb = h => {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgba = (hex, a) => {
  const [r, gr, b] = hexRgb(hex);
  return `rgba(${r},${gr},${b},${a})`;
};
function mixHex(h1, h2, k){
  k = clamp(k);
  const a = hexRgb(h1), b = hexRgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
}
function mulberry(a){
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(x, y, w, h, r){
  const rad = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function circ(x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ell(x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function glow(x, y, r, col, a){
  if (a <= 0.002) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a));
  gr.addColorStop(1, rgba(col, 0));
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}
function vgrad(c1, c2, y0=-320, y1=H+320){
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, c1);
  gr.addColorStop(1, c2);
  g.fillStyle = gr;
  g.fillRect(-420, y0, W + 840, y1 - y0);
}
function popScale(age, dur=0.11){
  if (age <= 0) return 0.68;
  const k = clamp(age / dur);
  if (k < 0.62) return lerp(0.68, 1.10, easeOut(k / 0.62));
  return lerp(1.10, 1.0, ease((k - 0.62) / 0.38));
}

function drawFittedText(text, x, y, maxW, maxFs, family, weight='900', align='center'){
  let fs = maxFs;
  g.font = `${weight} ${fs}px ${family}`;
  const w = g.measureText(text).width;
  if (w > maxW && w > 0) {
    fs = Math.max(16, Math.floor(maxFs * (maxW / w)));
    g.font = `${weight} ${fs}px ${family}`;
  }
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(text, x, y);
  return fs;
}

/* ============================================================

   ============================================================ */

const DOF_PAD = 4;

dofCv.width = Math.round(W * DOF_SCALE) + DOF_PAD * 2;
dofCv.height = Math.round(H * DOF_SCALE) + DOF_PAD * 2;
const dofCtx = dofCv.getContext('2d');

const dofBlurCv = document.createElement('canvas');
dofBlurCv.width = dofCv.width;
dofBlurCv.height = dofCv.height;
const dofBlurCtx = dofBlurCv.getContext('2d');

function withBlur(px, fn){
  const m = main.getTransform();
  dofCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofCtx.globalAlpha = 1;
  dofCtx.globalCompositeOperation = 'source-over';
  dofCtx.filter = 'none';
  dofCtx.fillStyle = PAL.bgNavy;
  dofCtx.fillRect(0, 0, dofCv.width, dofCv.height);
  dofCtx.translate(DOF_PAD, DOF_PAD);
  dofCtx.scale(DOF_SCALE, DOF_SCALE);
  dofCtx.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g = dofCtx;
  fn();
  g = main;

  const r = Math.max(1.2, px * DOF_SCALE * 1.45);
  dofBlurCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofBlurCtx.clearRect(0, 0, dofBlurCv.width, dofBlurCv.height);
  dofBlurCtx.filter = `blur(${r.toFixed(2)}px)`;
  dofBlurCtx.drawImage(dofCv, 0, 0);
  dofBlurCtx.filter = 'none';

  main.save();
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.imageSmoothingEnabled = true;
  main.imageSmoothingQuality = 'high';
  const padOut = DOF_PAD / DOF_SCALE;
  main.drawImage(dofBlurCv, -padOut, -padOut, W + padOut * 2, H + padOut * 2);
  main.restore();
}

const vigCv = document.createElement('canvas');
vigCv.width = W; vigCv.height = H;
(() => {

/* ============================================================
   MOTOR DE CORTES RAPIDOS V5.2 (0,9s A 1,6s POR PLANO)
   ============================================================ */
function splitShots(rawList, maxDur=1.48){
  const out = [];
  let id = 1;
  for (const s of rawList) {
    const start = Math.max(0, Number(s.start));
    const end = Math.max(start + 0.30, Number(s.end));
    const span = end - start;
    const n = Math.max(1, Math.ceil(span / maxDur));
    for (let i = 0; i < n; i++) {
      const a = start + (span * i) / n;
      const b = start + (span * (i + 1)) / n;
      const alt = i % 2 === 1;
      const z0 = lerp(s.cam0[0], s.cam1[0], i / n);
      const z1 = lerp(s.cam0[0], s.cam1[0], (i + 1) / n);
      const cx0 = lerp(s.cam0[1], s.cam1[1], i / n);
      const cx1 = lerp(s.cam0[1], s.cam1[1], (i + 1) / n);
      const cy0 = lerp(s.cam0[2], s.cam1[2], i / n);
      const cy1 = lerp(s.cam0[2], s.cam1[2], (i + 1) / n);
      out.push({
        id: id++,
        scene: s.scene,
        mood: s.mood,
        vig: s.vig,
        subIdx: i,
        cam0: [alt ? z0 * 1.04 : z0, cx0 + (alt ? 16 : 0), cy0 + (alt ? -10 : 0)],
        cam1: [alt ? z1 * 1.07 : z1 * 1.02, cx1 + (alt ? -14 : 0), cy1 + (alt ? 9 : 0)],
        start: Number(a.toFixed(3)),
        end: Number(b.toFixed(3)),
        dur: Number((b - a).toFixed(3))
      });
    }
  }
  return out;
}

    { scene: 'gps_estrada_terra', mood: 'red', vig: 0.68, cam0: [1.00, 540, 955], cam1: [1.07, 540, 945], start: travaFim, end: cP2 },

    /* === CORTE AUTOMATICO PARTE 2 === */

/* ============================================================
   MOTOR KATANA V5.2 (4 HITS: NAO E ELE, TRAVADA, 4 CELULARES, O SEU VAI TOCAR)
   ============================================================ */
function buildKatanaHits(e){
  const ctaA = Number(e.cta_meio_inicio);
  const dur = Number(e.duracao_total);
  const hit1Start = Math.max(0.2, Math.min(Number(e.nao_e_ele) - 0.02, ctaA - 0.44));
  const hit4Dur = 0.34;
  const hit4Start = Math.max(
    Number(e.final_retrovisor) + 0.35,
    Math.min(Number(e.plot_twist) - 0.02, dur - hit4Dur - 0.48)
  );

  const hits = [
    {
      id: 'nao_e_ele',
      lines: ['NÃO É', 'ELE'],
      accentIdx: 1,
      start: hit1Start,
      dur: 0.38,
      tilt: -0.052,
      punch: 0.15,
      shake: 26
    },
    {
      id: 'travada',
      lines: ['TRAVADA'],
      accentIdx: 0,
      start: Math.max(0.2, Number(e.trava_acionada) - 0.02),
      dur: 0.38,
      tilt: 0.048,
      punch: 0.16,
      shake: 28
    },
    {
      id: 'quatro_celulares',
      lines: ['4', 'CELULARES'],
      accentIdx: 0,
      start: Math.max(0.2, Number(e.quatro_celulares) - 0.02),
      dur: 0.40,
      tilt: -0.046,
      punch: 0.15,
      shake: 26
    },
    {
      id: 'o_seu_vai_tocar',
      lines: ['O SEU VAI', 'TOCAR'],
      accentIdx: 1,
      start: hit4Start,
      dur: hit4Dur,
      tilt: 0.050,
      punch: 0.17,
      shake: 30
    }
  ];
  return hits.map(h => ({ ...h, end: Number((h.start + h.dur).toFixed(3)) }));
}

function katanaStateAt(t){
  for (let i = 0; i < KATANA_HITS.length; i++) {
    const h = KATANA_HITS[i];
    if (t >= h.start && t < h.end) {
      const dt = t - h.start;
      return { hit: h, dt, frame: Math.floor(dt * 30), k: clamp(dt / h.dur) };
    }
  }
  return null;
}

function drawKatanaOverlay(t){
  const ks = katanaStateAt(t);
  if (!ks) return false;
  const { hit, dt, frame } = ks;

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);

  let bgCol = '#05060B';
  let slashCol = PAL.alertKatana;
  let mainTextCol = '#FFFFFF';
  let accentTextCol = PAL.yellow;
  let strokeCol = '#000000';

  if (frame === 0) {
    bgCol = '#FFFFFF';
    slashCol = '#080A11';
    mainTextCol = '#080A11';
    accentTextCol = PAL.alertKatana;
    strokeCol = 'transparent';
  } else if (frame === 1) {
    bgCol = '#04050A';
    slashCol = '#FFFFFF';
    mainTextCol = '#FFFFFF';
    accentTextCol = PAL.yellow;
  } else if (frame === 2) {
    bgCol = PAL.alertKatana;
    slashCol = '#06070D';
    mainTextCol = '#FFFFFF';
    accentTextCol = '#FFFFFF';
  } else if (frame === 3) {
    bgCol = '#060812';
    slashCol = PAL.alertKatana;
    mainTextCol = '#FFFFFF';
    accentTextCol = PAL.yellow;
  }

  g.fillStyle = bgCol;
  g.fillRect(0, 0, W, H);

  /* Linhas de velocidade radiais */
  g.save();
  g.translate(540, 960);
  const rayCount = 24;
  g.strokeStyle = frame === 0 ? 'rgba(8,10,17,0.18)' : 'rgba(255,255,255,0.12)';
  for (let i = 0; i < rayCount; i++) {
    const ang = (i / rayCount) * Math.PI * 2 + hit.tilt * 2.2;
    const r0 = 260 + hash(i * 19 + frame) * 140;
    const r1 = 1120;
    g.lineWidth = 3 + (i % 3) * 2.5;
    g.beginPath();
    g.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
    g.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
    g.stroke();
  }
  g.restore();

  /* Faixa diagonal Katana */
  g.save();
  g.translate(540, 955);
  g.rotate(hit.tilt);
  const slashW = lerp(1750, 1460, easeOut(clamp(dt / 0.14)));
  const slashH = hit.lines.length > 1 ? 520 : 350;
  g.fillStyle = slashCol;
  g.fillRect(-slashW / 2, -slashH / 2, slashW, slashH);
  g.fillStyle = frame === 0 ? PAL.alertKatana : '#FFFFFF';
  g.fillRect(-slashW / 2, -slashH / 2 - 14, slashW, 8);
  g.fillRect(-slashW / 2, slashH / 2 + 6, slashW, 8);
  g.fillStyle = frame === 2 ? 'rgba(255,255,255,0.45)' : rgba(PAL.yellow, 0.35);
  g.fillRect(-slashW * 0.44, -slashH / 2 - 220, slashW * 0.88, 6);
  g.fillRect(-slashW * 0.44, slashH / 2 + 214, slashW * 0.88, 6);
  g.restore();

  let scaleX = 1, scaleY = 1;
  if (dt < 0.11) {
    const k = easeOut(dt / 0.11);
    scaleX = lerp(1.58, 1.00, k);
    scaleY = lerp(0.56, 1.12, k);
  } else {
    const d = dt - 0.11;
    const osc = Math.exp(-15 * d) * Math.cos(40 * d);
    scaleX = 1.0 + 0.11 * osc;
    scaleY = 1.0 - 0.08 * osc;
  }
  const rem = hit.dur - dt;
  if (rem < 0.06) {
    const ek = 1 - rem / 0.06;
    scaleX *= lerp(1.0, 1.18, ek);
    scaleY *= lerp(1.0, 0.82, ek);
  }

  const jitterX = Math.sin(dt * 120) * (frame <= 3 ? 14 : 5) * Math.exp(-dt * 6);
  const jitterY = Math.cos(dt * 105) * (frame <= 3 ? 10 : 4) * Math.exp(-dt * 6);

  g.translate(540 + jitterX, 955 + jitterY);
  g.rotate(hit.tilt);
  g.scale(scaleX, scaleY);

  const lines = hit.lines;
  const maxW = 920;
  const maxFs = lines.length === 1 ? 260 : 196;
  const stepY = lines.length === 1 ? 0 : 190;
  const startY = lines.length === 1 ? 0 : -stepY * 0.5;

  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.miterLimit = 2;

  for (let i = 0; i < lines.length; i++) {
    const txt = lines[i];
    let fs = maxFs;
    g.font = `900 ${fs}px ${COND}`;
    const mw = g.measureText(txt).width;
    if (mw > maxW && mw > 0) {
      fs = Math.max(48, Math.floor(maxFs * (maxW / mw)));
      g.font = `900 ${fs}px ${COND}`;
    }
    const ly = startY + i * stepY;
    const col = (i === hit.accentIdx) ? accentTextCol : mainTextCol;

    if (frame >= 4) {
      g.fillStyle = 'rgba(0,0,0,0.82)';
      g.fillText(txt, 10, ly + 12);
    }
    if (strokeCol !== 'transparent') {
      g.strokeStyle = strokeCol;
      g.lineWidth = Math.max(14, Math.round(fs * 0.10));
      g.strokeText(txt, 0, ly);
    }
    g.fillStyle = col;
    g.fillText(txt, 0, ly);
  }

  g.restore();
  return true;
}

function normalizeEvents(raw, audioDur){
  const e = { ...EV_PREVIEW, ...(raw || {}) };
  const dur = Math.max(audioDur || 0, Number(e.duracao_total) || EV_PREVIEW.duracao_total);
  e.duracao_total = dur;
  if (raw) {
    for (const k of Object.keys(EV_PREVIEW)) {
      if (typeof EV_PREVIEW[k] === 'number' && raw[k] !== undefined) e[k] = Number(raw[k]);
    }
    if (typeof raw.cta_modo === 'string') e.cta_modo = raw.cta_modo;
    if (typeof raw.cta_texto === 'string') e.cta_texto = raw.cta_texto;
    if (URL_PARTE === null && typeof window.parteLabel !== 'string' && typeof raw.parte_label === 'string' && raw.parte_label.trim()) {
      parteLabel = raw.parte_label.trim();
    }
  }
  EV = e;
  duration = dur;
  SHOTS = buildShots(EV);
  KATANA_HITS = buildKatanaHits(EV);

  EXPR_CUES = [
    [0, 'neutral'],
    [EV.sem_boa_noite, 'worry'],
    [EV.celular_vibra, 'worry'],
    [EV.voz_motorista_1, 'fear'],
    [EV.nao_e_ele, 'shock'],
    [EV.diego_congela, 'fear'],
    [EV.puxa_macaneta, 'shock'],
    [EV.finge_calma, 'fear'],
    [EV.velocimetro_120, 'shock'],
    [EV.olha_carona, 'shock'],
    [EV.impacto_twist, 'shock']
  ];
  const bl = [];
  let bt = 0.80, bi = 0;
  while (bt < duration + 1) { bl.push(bt); bt += 2.5 + hash(bi++ * 13.7) * 1.5; }
  for (const [ct] of EXPR_CUES) if (ct > 0.2) bl.push(Math.max(0.05, ct - 0.067));
  BLINKS = bl.sort((a, b) => a - b);
}

const exprAt = t => { let ex = 'neutral'; for (const [a, b] of EXPR_CUES) if (t >= a - 0.01) ex = b; return ex; };
function faceAt(t){
  let last = -1, prev = -1;
  for (const b of BLINKS) { if (b <= t) { prev = last; last = b; } else break; }
  const d = t - last;
  const closed = last >= 0 && d < 0.16 ? Math.sin((d / 0.16) * Math.PI) : 0;
  const ref = last < 0 ? 0 : (d < 0.08 ? (prev < 0 ? 0 : prev + 0.08) : last + 0.08);
  return { ex: exprAt(ref), closed };
}

const PARTICLES = (() => {

})();

const RAIN_DROPS = (() => {
  const rng = mulberry(3102026);
  const arr = [];
  for (let i = 0; i < 95; i++) {
    arr.push({
      x: rng() * (W + 400) - 200,

function drawRain(t, intensity=1.0, slant=-0.22){
  g.save();
  g.strokeStyle = rgba(PAL.cyan, 0.28 * intensity);
  g.lineCap = 'round';
  const spanW = W + 400, spanH = H + 400;
  for (let i = 0; i < RAIN_DROPS.length; i++) {
    const d = RAIN_DROPS[i];
    const rx = ((((d.x + d.speed * slant * t) + 200) % spanW) + spanW) % spanW - 200;
    const ry = ((((d.y + d.speed * t) + 200) % spanH) + spanH) % spanH - 200;
    g.strokeStyle = rgba('#CBE8FF', d.a * intensity);
    g.lineWidth = d.w;
    g.beginPath();
    g.moveTo(rx, ry);
    g.lineTo(rx + d.len * slant, ry + d.len);
    g.stroke();
  }
  g.restore();
}

function drawParticles(t, mood){
  const colPrimary = mood === 'red' ? PAL.alert : (mood === 'yellow' ? PAL.yellow : PAL.cyan);
  const colAlt = mood === 'red' ? PAL.amber : PAL.violet;
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < PARTICLES.length; i++) {
    const p = PARTICLES[i];
    const sp = p.layer === 1 ? 1.35 : 0.72;
    const spanW = W + 300, spanH = H + 300;
    const px = ((((p.x + p.vx * t * sp) + 150) % spanW) + spanW) % spanW - 150;
    const py = ((((p.y + p.vy * t * sp) + 150) % spanH) + spanH) % spanH - 150;
    const tw = 0.55 + 0.45 * Math.sin(t * (2.6 + p.layer * 1.2) + p.ph);
    const col = (i % 3 === 0) ? colAlt : colPrimary;
    const a = p.a * tw * (mood === 'dark' ? 0.34 : 1.0);
    g.fillStyle = rgba(col, a);
    circ(px, py, p.r);
  }
  g.restore();
}

function drawBackdrop(t, mood){
  const pulseSlow = 0.5 + 0.5 * Math.sin(t * 3.4);
  const pulseFast = 0.5 + 0.5 * Math.sin(t * 8.2);
  let top = PAL.bgNavy, bot = PAL.bgDeep, glowCol = PAL.cyan, glowA = 0.14;

  if (mood === 'violet') {
    top = mixHex(PAL.bgViolet, PAL.bgNavy, pulseSlow * 0.40);
    bot = PAL.bgDeep;
    glowCol = PAL.violet;
    glowA = 0.19;
  } else if (mood === 'yellow') {
    top = mixHex(PAL.bgNavy, PAL.bgYellow, 0.45 + 0.45 * pulseFast);
    bot = PAL.bgDeep;
    glowCol = PAL.yellow;
    glowA = 0.20;
  } else if (mood === 'red') {
    top = mixHex(PAL.bgViolet, PAL.bgRed, 0.55 + 0.45 * pulseFast);
    bot = mixHex(PAL.bgNavy, PAL.bgRed, 0.42 + 0.45 * pulseFast);
    glowCol = PAL.alert;
    glowA = 0.26 + 0.12 * pulseFast;
  } else if (mood === 'dark') {
    top = '#04060C';
    bot = '#010205';
    glowCol = PAL.alert;
    glowA = 0.09;
  } else {
    top = mixHex(PAL.bgNavy, PAL.bgStorm, pulseSlow * 0.42);
    bot = PAL.bgDeep;
  }

  vgrad(top, bot);
  glow(540 + Math.sin(t * 0.7) * 65, 740, 620, glowCol, glowA);
  drawParticles(t, mood);
}

/* ============================================================
   RIG FLAT EM CAPSULA (10 PONTOS IK) - DIEGO (MOLETOM #1E3A5F)
   ============================================================ */
function solveIK(ax, ay, bx, by, l1, l2, bend){
  const dx = bx - ax, dy = by - ay;
  const dist = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + 0.5, l1 + l2 - 0.5);
  const a0 = Math.atan2(dy, dx);
  const cosA = clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
  const ang = a0 + bend * Math.acos(cosA);
  return [ax + Math.cos(ang) * l1, ay + Math.sin(ang) * l1];
}

function drawCapsule(ax, ay, bx, by, w, col, shadeCol){
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  g.save();
  g.translate(ax, ay);
  g.rotate(ang);
  g.fillStyle = col;
  rr(-w * 0.5, -w * 0.5, len + w, w, w * 0.5); g.fill();
  if (shadeCol) {
    g.fillStyle = shadeCol;
    rr(-w * 0.4, 0, len + w * 0.8, w * 0.48, w * 0.24); g.fill();
  }
  g.restore();
}

function drawEyes(cx, cy, r, ex, closed, lookX=0, lookY=0){
  const lift = { neutral: 0, worry: 0.06, fear: 0.11, shock: 0.15 }[ex] || 0;
  const tilt = { neutral: 0, worry: 0.11, fear: 0.10, shock: 0.06 }[ex] || 0;
  const eyePositions = [[cx - r * 0.24, 1], [cx + r * 0.24, -1]];
  g.lineCap = 'round';

  for (const [x, inner] of eyePositions) {
    const y = cy - r * 0.04;
    const browY = y - r * (0.27 + lift);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.068;
    g.beginPath();
    g.moveTo(x - inner * r * 0.15, browY + (ex === 'worry' || ex === 'fear' || ex === 'shock' ? r * 0.04 : 0));
    g.lineTo(x + inner * r * 0.15, browY - tilt * r);
    g.stroke();

    if (closed > 0.55) {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * 0.055;
      g.beginPath(); g.moveTo(x - r * 0.11, y); g.lineTo(x + r * 0.11, y); g.stroke();
      continue;
    }

    const scaleY = 1 - closed * 0.9;
    g.save();
    g.translate(x, y);
    g.scale(1, scaleY);

    if (ex === 'shock' || ex === 'fear' || ex === 'worry') {
      const rx = ex === 'shock' ? r * 0.22 : (ex === 'fear' ? r * 0.19 : r * 0.15);
      const ry = ex === 'shock' ? r * 0.25 : (ex === 'fear' ? r * 0.21 : r * 0.17);
      g.fillStyle = PAL.white;
      ell(0, 0, rx, ry);
      const pr = ex === 'shock' ? r * 0.052 : (ex === 'fear' ? r * 0.075 : r * 0.085);
      g.fillStyle = PAL.ink;
      circ(lookX * r * 0.06, lookY * r * 0.05, pr);
      g.fillStyle = PAL.white;
      circ(lookX * r * 0.06 - pr * 0.35, lookY * r * 0.05 - pr * 0.35, pr * 0.30);
    } else {
      g.fillStyle = PAL.white;
      ell(0, 0, r * 0.14, r * 0.15);
      g.fillStyle = PAL.ink;
      circ(lookX * r * 0.05, lookY * r * 0.04, r * 0.082);
      g.fillStyle = PAL.white;
      circ(lookX * r * 0.05 - r * 0.03, lookY * r * 0.04 - r * 0.03, r * 0.028);
    }
    g.restore();
  }
}

function drawMouth(cx, cy, r, ex){
  const my = cy + r * 0.36;
  g.lineCap = 'round';
  if (ex === 'shock') {
    g.fillStyle = '#190C0E';
    ell(cx, my + r * 0.02, r * 0.16, r * 0.21);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.042;
    g.beginPath(); g.ellipse(cx, my + r * 0.02, r * 0.16, r * 0.21, 0, 0, Math.PI * 2); g.stroke();
  } else if (ex === 'fear') {
    g.fillStyle = '#1E1114';
    ell(cx, my + r * 0.02, r * 0.14, r * 0.11);
  } else if (ex === 'worry') {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.052;
    g.beginPath();
    g.moveTo(cx - r * 0.14, my + r * 0.03);
    g.quadraticCurveTo(cx, my - r * 0.06, cx + r * 0.14, my + r * 0.03);
    g.stroke();
  } else {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.050;
    g.beginPath();
    g.moveTo(cx - r * 0.13, my);
    g.lineTo(cx + r * 0.13, my);
    g.stroke();
  }
}

function drawHeadDiego(cx, cy, r, ex, closed, opt={}){
  const {
    tilt = 0, rimA = 0.72, rimColor = PAL.cyan, rimAng = -0.35,
    lookX = 0, lookY = 0, sweat = false, earbuds = false
  } = opt;
  g.save();
  g.translate(cx, cy);
  g.rotate(tilt);

  /* Orelhas discretas */
  g.fillStyle = PAL.skinShadow;
  circ(-r * 0.92, r * 0.06, r * 0.18);
  circ(r * 0.92, r * 0.06, r * 0.18);

  /* Cabeca redonda flat limpa (sem capacete) */
  g.fillStyle = PAL.skin;
  circ(0, 0, r);

  g.save();
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
  g.fillStyle = rgba(PAL.skinShadow, 0.24);
  circ(-r * 0.36, r * 0.18, r * 0.96);

  /* Cabelo escuro curto moderno do Diego */
  g.fillStyle = PAL.hair;
  g.beginPath();
  g.arc(0, -r * 0.14, r * 1.03, Math.PI * 1.04, Math.PI * 1.96);
  g.quadraticCurveTo(r * 0.56, -r * 0.44, r * 0.12, -r * 0.58);
  g.quadraticCurveTo(-r * 0.42, -r * 0.48, -r * 0.96, -r * 0.18);
  g.closePath();
  g.fill();
  g.restore();

  /* Topete curto natural acima da testa */
  g.fillStyle = PAL.hair;
  g.beginPath();
  g.ellipse(0, -r * 0.73, r * 0.80, r * 0.35, -0.04, Math.PI, Math.PI * 2);
  g.fill();
  g.beginPath();
  g.ellipse(r * 0.22, -r * 0.65, r * 0.40, r * 0.21, 0.20, 0, Math.PI * 2);
  g.fill();

  /* Fone de ouvido intra-auricular branco quando colocado */
  if (earbuds) {
    g.fillStyle = PAL.white;
    rr(-r * 0.99, r * 0.01, r * 0.14, r * 0.24, r * 0.06); g.fill();
    rr(r * 0.85, r * 0.01, r * 0.14, r * 0.24, r * 0.06); g.fill();
    g.fillStyle = PAL.cyan;
    circ(-r * 0.92, r * 0.07, r * 0.035);
    circ(r * 0.92, r * 0.07, r * 0.035);
  }

  /* Rim light limpa */
  if (rimA > 0.01) {
    g.strokeStyle = rgba(rimColor, rimA);
    g.lineWidth = Math.max(4, r * 0.045);
    g.lineCap = 'round';
    g.beginPath();
    g.arc(0, 0, r - g.lineWidth * 0.4, rimAng - 0.82, rimAng + 0.82);
    g.stroke();
  }

  drawEyes(0, 0, r, ex, closed, lookX, lookY);
  drawMouth(0, 0, r, ex);

  if (sweat || ex === 'shock') {
    g.fillStyle = PAL.sweat;
    g.beginPath();
    g.moveTo(r * 0.58, -r * 0.28);
    g.quadraticCurveTo(r * 0.68, -r * 0.08, r * 0.58, -r * 0.02);
    g.quadraticCurveTo(r * 0.48, -r * 0.08, r * 0.58, -r * 0.28);
    g.fill();
  }

  g.restore();
}

function drawDiegoStanding(x, footY, sc, opt={}){
  const {
    t = 0, ex = 'neutral', closed = 0, face = 1, fastBreath = false,
    pose = {}, rimColor = PAL.cyan, rimA = 0.78, lookX = 0, lookY = 0, earbuds = false
  } = opt;
  const breath = Math.sin(t * (fastBreath ? 6.8 : 2.3)) * (fastBreath ? 5.0 : 2.2);
  const walk = pose.walk ? Math.sin(t * 9.0) : 0;

  g.save();
  g.translate(x, footY);
  g.scale(sc * face, sc);

  /* Sombra de contato nos pes */
  g.fillStyle = 'rgba(0,0,0,0.48)';
  ell(0, 6, 86, 18);

  const hipY = -205 + breath * 0.35;
  const shY = -395 + breath;

  /* Pernas IK 10 pontos */
  const lFootX = -32 + walk * 26, rFootX = 32 - walk * 26;
  const lFootY = -12 - Math.max(0, walk * 16), rFootY = -12 - Math.max(0, -walk * 16);
  const lKnee = solveIK(-24, hipY, lFootX, lFootY, 102, 102, 1);
  const rKnee = solveIK(24, hipY, rFootX, rFootY, 102, 102, 1);

  drawCapsule(-24, hipY, lKnee[0], lKnee[1], 36, PAL.pantsDark);
  drawCapsule(lKnee[0], lKnee[1], lFootX, lFootY, 32, PAL.pantsDark);
  drawCapsule(24, hipY, rKnee[0], rKnee[1], 36, PAL.pants);
  drawCapsule(rKnee[0], rKnee[1], rFootX, rFootY, 32, PAL.pants);

  for (const [fx, fy] of [[lFootX, lFootY], [rFootX, rFootY]]) {
    g.fillStyle = '#090D16';
    rr(fx - 22, fy - 4, 52, 20, 9); g.fill();
    g.fillStyle = '#CBD5E1';
    rr(fx - 22, fy + 11, 52, 6, 3); g.fill();
  }

  /* Braco traseiro */
  const bHandX = pose.phone ? 72 : -68 - walk * 18;
  const bHandY = pose.phone ? (shY + 86) : (shY + 188);
  const bElbow = solveIK(-48, shY + 18, bHandX, bHandY, 92, 92, pose.phone ? -1 : 1);
  drawCapsule(-48, shY + 18, bElbow[0], bElbow[1], 30, PAL.topShade);
  drawCapsule(bElbow[0], bElbow[1], bHandX, bHandY, 26, PAL.topShade);
  g.fillStyle = PAL.skinShadow;
  circ(bHandX, bHandY, 17);

  /* Torso: moletom azul-marinho #1E3A5F com capuz cinza caido nos ombros */
  g.fillStyle = PAL.top;
  rr(-64, shY, 128, 212, 54); g.fill();
  g.save();
  rr(-64, shY, 128, 212, 54); g.clip();
  g.fillStyle = PAL.topDeep;
  g.fillRect(-66, shY, 38, 218);
  /* Bolso canguru do moletom */
  g.fillStyle = PAL.topShade;
  rr(-44, shY + 128, 88, 56, 18); g.fill();
  g.restore();

  /* Gola do capuz cinza caido nos ombros + cordoes */
  g.fillStyle = PAL.hoodGrey;
  rr(-54, shY - 8, 108, 28, 14); g.fill();
  g.strokeStyle = '#E2E8F0';
  g.lineWidth = 4;
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(-16, shY + 16); g.lineTo(-20, shY + 74); g.stroke();
  g.beginPath(); g.moveTo(16, shY + 16); g.lineTo(20, shY + 74); g.stroke();

  /* Rim light no ombro */
  g.strokeStyle = rgba(rimColor, rimA * 0.72);
  g.lineWidth = 5;
  g.beginPath();
  g.moveTo(58, shY + 26);
  g.lineTo(58, shY + 182);
  g.stroke();

  /* Pescoso e cabeca */
  g.fillStyle = PAL.skinShadow;
  rr(-18, shY - 30, 36, 40, 12); g.fill();
  drawHeadDiego(0, shY - 82, 74, ex, closed, {
    tilt: pose.phone ? 0.08 : 0,
    rimColor, rimA, lookX, lookY, earbuds
  });

  /* Braco frontal segurando celular ou andando */
  const fHandX = pose.phone ? 84 : (pose.call ? 56 : 70 + walk * 18);
  const fHandY = pose.phone ? (shY + 74) : (pose.call ? (shY - 58) : (shY + 188));
  const fElbow = solveIK(48, shY + 18, fHandX, fHandY, 92, 92, pose.phone || pose.call ? 1 : -1);
  drawCapsule(48, shY + 18, fElbow[0], fElbow[1], 30, PAL.top);
  drawCapsule(fElbow[0], fElbow[1], fHandX, fHandY, 26, PAL.top);
  g.fillStyle = PAL.skin;
  circ(fHandX, fHandY, 17);

  if (pose.phone) {
    g.save();
    g.translate(fHandX + 18, fHandY - 22);
    g.rotate(-0.30);
    g.fillStyle = PAL.phone;
    rr(-12, -26, 26, 52, 6); g.fill();
    g.fillStyle = PAL.cyan;
    rr(-8, -21, 18, 42, 4); g.fill();
    glow(4, 0, 95, PAL.cyan, 0.36);
    g.restore();
  }
  if (pose.call) {
    g.save();
    g.translate(fHandX + 12, fHandY - 12);
    g.rotate(-0.24);
    g.fillStyle = PAL.phone;
    rr(-10, -26, 22, 52, 6); g.fill();
    g.fillStyle = PAL.appGreen;
    rr(-6, -20, 14, 40, 4); g.fill();
    g.restore();
  }

  g.restore();
}

function drawDiegoSeated(cx, cy, sc, opt={}){
  const {
    t = 0, ex = 'neutral', closed = 0, fastBreath = false,
    rimColor = PAL.cyan, rimA = 0.80, lookX = 0, lookY = 0,
    earbuds = true, holdPhoneEar = false, leanForward = 0
  } = opt;
  const breath = Math.sin(t * (fastBreath ? 7.2 : 2.5)) * (fastBreath ? 5.5 : 2.2);

  g.save();
  g.translate(cx, cy + leanForward * 24);
  g.scale(sc, sc);

  /* Torso do moletom sentado no banco traseiro */
  const shY = -80 + breath;
  g.fillStyle = PAL.top;
  rr(-118, shY, 236, 330, 86); g.fill();
  g.save();
  rr(-118, shY, 236, 330, 86); g.clip();
  g.fillStyle = PAL.topDeep;
  g.fillRect(-122, shY, 68, 340);
  g.restore();

  /* Gola cinza do capuz + cordoes */
  g.fillStyle = PAL.hoodGrey;
  rr(-86, shY - 10, 172, 36, 18); g.fill();
  g.strokeStyle = '#E2E8F0';
  g.lineWidth = 5;
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(-26, shY + 24); g.lineTo(-30, shY + 108); g.stroke();
  g.beginPath(); g.moveTo(26, shY + 24); g.lineTo(30, shY + 108); g.stroke();

  /* Cinto de seguranca diagonal sobre o peito */
  g.save();
  rr(-118, shY, 236, 330, 86); g.clip();
  g.strokeStyle = '#090D16';
  g.lineWidth = 28;
  g.beginPath(); g.moveTo(-98, shY + 8); g.lineTo(106, shY + 286); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.10)';
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(-88, shY + 8); g.lineTo(114, shY + 286); g.stroke();
  g.restore();

  /* Pescoso e cabeca */
  g.fillStyle = PAL.skinShadow;
  rr(-28, shY - 46, 56, 56, 18); g.fill();
  drawHeadDiego(0, shY - 124, 114, ex, closed, {
    tilt: holdPhoneEar ? 0.06 : (leanForward * -0.05),
    rimColor, rimA, lookX, lookY, earbuds,
    sweat: ex === 'shock' || ex === 'fear'
  });

  /* Mao segurando celular no ouvido quando finge calma */
  if (holdPhoneEar) {
    const hx = 108, hy = shY - 94;
    const elb = solveIK(94, shY + 46, hx, hy, 120, 118, 1);
    drawCapsule(94, shY + 46, elb[0], elb[1], 44, PAL.top);
    drawCapsule(elb[0], elb[1], hx, hy, 38, PAL.top);
    g.save();
    g.translate(hx - 14, hy - 22);
    g.rotate(-0.18);
    g.fillStyle = PAL.phone;
    rr(-16, -42, 34, 84, 9); g.fill();
    g.fillStyle = PAL.appGreen;
    rr(-11, -34, 24, 68, 5); g.fill();
    glow(0, 0, 95, PAL.appGreen, 0.25);
    g.restore();
    g.fillStyle = PAL.skin;
    circ(hx, hy, 25);
  }

  g.restore();
}

function drawStar(cx, cy, rOut, rIn){
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + (i * Math.PI) / 5;
    const rad = i % 2 === 0 ? rOut : rIn;
    const x = cx + Math.cos(ang) * rad;
    const y = cy + Math.sin(ang) * rad;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
  g.fill();
}

/* 5. Close nos olhos do motorista no espelho retrovisor (fixo sem piscar / sorrindo) */
function drawRearviewMirrorEyes(t, mode='stare', smileProg=0){
  const isSmile = mode === 'smile';
  const isLaugh = mode === 'laugh';

  /* Fundo desfocado do para-brisa noturno */
  withBlur(9, () => {
    drawBackdrop(t, 'red');
    for (let i = 0; i < 4; i++) {
      const lx = ((t * 420 + i * 320) % 1300) - 120;
      glow(lx, 560, 240, isSmile ? PAL.alert : PAL.amber, 0.34);
    }
    drawRain(t, 0.7);
  });

  /* Haste do retrovisor abaixo de y=340 para manter folga limpa do relogio 03:10 mesmo no zoom */
  g.fillStyle = '#05070E';
  g.fillRect(512, 345, 56, 200);
  rr(476, 345, 128, 30, 12); g.fill();

  /* Moldura larga do espelho retrovisor ocupando o centro nobre (y=535..985) */
  const mx = 74, my = 535, mw = W - 148, mh = 448;
  g.fillStyle = '#04060C';
  rr(mx - 20, my - 20, mw + 40, mh + 40, 72); g.fill();
  g.strokeStyle = isSmile ? rgba(PAL.alert, 0.72) : '#334155';
  g.lineWidth = 6;
  rr(mx - 20, my - 20, mw + 40, mh + 40, 72); g.stroke();

  g.save();
  rr(mx, my, mw, mh, 54); g.clip();

  /* Fundo escuro do reflexo no vidro do espelho */
  const mg = g.createLinearGradient(0, my, 0, my + mh);
  mg.addColorStop(0, '#0D1322');
  mg.addColorStop(0.5, '#19141C');
  mg.addColorStop(1, '#070A12');
  g.fillStyle = mg;
  g.fillRect(mx, my, mw, mh);

  /* Rosto sombreado do motorista no centro do espelho */
  const cx = 540, cy = my + mh * 0.56;
  g.fillStyle = '#2A2223';
  ell(cx, cy + 40, 315, 290);
  g.fillStyle = '#18141A';
  ell(cx - 180, cy + 40, 140, 260);
  ell(cx + 180, cy + 40, 140, 260);

  /* Faixa de luz vermelha/fria atravessando exatamente a linha dos olhos */
  const bandG = g.createLinearGradient(mx, cy - 80, mx + mw, cy + 30);
  bandG.addColorStop(0, 'rgba(255,59,48,0)');
  bandG.addColorStop(0.5, isSmile ? 'rgba(255,59,48,0.28)' : 'rgba(56,217,255,0.20)');
  bandG.addColorStop(1, 'rgba(255,59,48,0)');
  g.fillStyle = bandG;
  g.fillRect(mx, cy - 115, mw, 165);

  /* Olhos do motorista (NUNCA PISCAM!) */
  const eyeY = cy - 26;
  const sp = isSmile ? clamp(smileProg) : (isLaugh ? 0.55 : 0);
  const eyePositions = [[cx - 122, 1], [cx + 122, -1]];

  for (const [ex, side] of eyePositions) {
    /* Sobrancelha pesada e sinistra */
    g.strokeStyle = '#07090F';
    g.lineWidth = 22;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(ex - side * 72, eyeY - 62 - sp * 10);
    g.quadraticCurveTo(ex, eyeY - 82 + sp * 12, ex + side * 66, eyeY - 46 + (isSmile ? -12 : 10));
    g.stroke();

    /* Globo ocular fixo, bem aberto */
    g.fillStyle = '#F8FAFC';
    g.beginPath();
    g.ellipse(ex, eyeY, 64, 34 - sp * 9, 0, 0, Math.PI * 2);
    g.fill();

    /* Palpebra inferior subindo quando os olhos sorriem! */
    if (sp > 0.05) {
      g.fillStyle = '#2A2223';
      g.beginPath();
      g.ellipse(ex, eyeY + 34 - sp * 14, 68, 22, 0, Math.PI, Math.PI * 2);
      g.fill();
      /* Linhas de expressao ("pes de galinha") dos olhos sorrindo */
      g.strokeStyle = '#0A0A10';
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(ex - side * 56, eyeY + 8);
      g.lineTo(ex - side * 82, eyeY + 14);
      g.moveTo(ex - side * 52, eyeY + 18);
      g.lineTo(ex - side * 78, eyeY + 28);
      g.stroke();
    }

    /* Pupila minuscula travada no espectador */
    g.fillStyle = '#05060B';
    circ(ex, eyeY - sp * 3, isSmile ? 13 : 11);
    g.fillStyle = isSmile ? PAL.alert : '#FFFFFF';
    circ(ex - 4, eyeY - 5 - sp * 3, 4.5);

    /* Contorno duro da palpebra superior */
    g.strokeStyle = '#05060B';
    g.lineWidth = 8;
    g.beginPath();
    g.ellipse(ex, eyeY, 65, 34 - sp * 9, 0, Math.PI * 1.05, Math.PI * 1.95);
    g.stroke();
  }

  /* Parte superior do sorriso sinistro aparecendo na base do espelho no final */
  if (isSmile || isLaugh) {
    const sy = cy + 116;
    const sw = lerp(74, 154, sp);
    const sc = lerp(16, 46, sp);
    g.fillStyle = '#07080E';
    g.beginPath();
    g.moveTo(cx - sw, sy - sc * 0.4);
    g.quadraticCurveTo(cx, sy + sc * 1.4, cx + sw, sy - sc * 0.4);
    g.quadraticCurveTo(cx, sy + sc * 0.25, cx - sw, sy - sc * 0.4);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(248, 250, 252, 0.85)';
    g.lineWidth = 7;
    g.beginPath();
    g.moveTo(cx - sw * 0.72, sy);
    g.quadraticCurveTo(cx, sy + sc * 0.62, cx + sw * 0.72, sy);
    g.stroke();
  }

  /* Reflexo diagonal de vidro sobre o espelho */
  g.fillStyle = 'rgba(255,255,255,0.06)';
  g.beginPath();
  g.moveTo(mx + 60, my);
  g.lineTo(mx + 220, my);
  g.lineTo(mx + 70, my + mh);
  g.lineTo(mx - 40, my + mh);
  g.closePath();
  g.fill();

  g.restore();

  /* Halo vermelho de tensao sob o espelho */
  glow(540, my + mh, 340, PAL.alert, isSmile ? 0.34 : 0.22);
}

/* 8. Macro no velocimetro cravando 120 km/h com painel pulsando em vermelho */
function drawSpeedometer120(t, localP){
  drawBackdrop(t, 'red');

  const cx = 540, cy = 790, R = 365;
  const pulse = 0.5 + 0.5 * Math.sin(t * 18);

  /* Painel de instrumentos escuro */
  g.fillStyle = '#060810';
  rr(76, 345, W - 152, 880, 64); g.fill();
  g.strokeStyle = rgba(PAL.alert, 0.45 + pulse * 0.45);
  g.lineWidth = 5;
  rr(76, 345, W - 152, 880, 64); g.stroke();
  glow(cx, cy, 480, PAL.alert, 0.25 + pulse * 0.18);

  /* Mostrador circular */
  g.fillStyle = '#0A0E18';
  circ(cx, cy, R);
  g.strokeStyle = '#334155';
  g.lineWidth = 10;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();

  /* Arco colorido (0 a 160 km/h) */
  const startA = Math.PI * 0.78;
  const endA = Math.PI * 2.22;
  const spanA = endA - startA;
  g.strokeStyle = 'rgba(255,255,255,0.12)';
  g.lineWidth = 24;
  g.lineCap = 'round';
  g.beginPath(); g.arc(cx, cy, R - 46, startA, endA); g.stroke();

  /* Velocidade sobe de 68 para 120+ km/h com trepidacao */
  const spd = lerp(74, 120, easeOut(clamp(localP * 1.35))) + Math.sin(t * 36) * 1.8;
  const spdFrac = clamp(spd / 160);
  g.strokeStyle = PAL.alert;
  g.lineWidth = 24;
  g.beginPath(); g.arc(cx, cy, R - 46, startA, startA + spanA * spdFrac); g.stroke();

  /* Marcacoes numericas */
  for (let v = 0; v <= 160; v += 20) {
    const ang = startA + spanA * (v / 160);
    const isRed = v >= 100;
    g.strokeStyle = isRed ? PAL.alert : PAL.steelBright;
    g.lineWidth = v % 40 === 0 ? 7 : 4;
    g.beginPath();
    g.moveTo(cx + Math.cos(ang) * (R - 82), cy + Math.sin(ang) * (R - 82));
    g.lineTo(cx + Math.cos(ang) * (R - 58), cy + Math.sin(ang) * (R - 58));
    g.stroke();

    g.fillStyle = isRed ? PAL.alert : PAL.steelBright;
    const lx = cx + Math.cos(ang) * (R - 122);
    const ly = cy + Math.sin(ang) * (R - 122);
    drawFittedText(String(v), lx, ly, 68, 30, MONO, '800', 'center');
  }

  /* Ponteiro vermelho cravando no 120 */
  const needleA = startA + spanA * spdFrac;
  g.save();
  g.translate(cx, cy);
  g.rotate(needleA);
  g.fillStyle = PAL.alert;
  g.beginPath();
  g.moveTo(-26, -10);
  g.lineTo(R - 72, -3);
  g.lineTo(R - 72, 3);
  g.lineTo(-26, 10);
  g.closePath();
  g.fill();
  g.restore();

  /* Centro do ponteiro */
  g.fillStyle = '#1E293B';
  circ(cx, cy, 34);
  g.fillStyle = PAL.alert;
  circ(cx, cy, 14);

  /* Leitor digital 120 KM/H com folga dos numeros 0 e 160 */
  g.fillStyle = '#070A12';
  rr(cx - 134, cy + 150, 268, 114, 20); g.fill();
  g.strokeStyle = PAL.alert;
  g.lineWidth = 3;
  rr(cx - 134, cy + 150, 268, 114, 20); g.stroke();
  g.fillStyle = PAL.white;
  drawFittedText(`${Math.round(spd)} KM/H`, cx, cy + 195, 232, 54, MONO, '900', 'center');
  g.fillStyle = PAL.alert;
  drawFittedText('EXCESSO DE VELOCIDADE', cx, cy + 240, 236, 18, MONO, '800', 'center');
}

    g.moveTo(w / 2 + 14, -36); g.lineTo(w / 2 + 22, 0); g.lineTo(w / 2 + 14, 36);

  }
}

/* ============================================================
   SELO DINAMICO V5.2 ("PARTE 1" -> "PARTE 2") E RELOGIO 03:10
   ============================================================ */
function getActiveParteLabel(t){
  if (!parteLabel) return '';
  const base = parteLabel.toUpperCase();
  const cP2 = Number(EV.corte_parte_2);
  if (isFinite(cP2) && cP2 > 0 && t >= cP2 - 0.001) {
    if (/\b1\b/.test(base)) return base.replace(/\b1\b/, '2');
    return 'PARTE 2';
  }
  return base;
}

function drawParteBadge(t){
  if (isFullScreenCtaActive(t)) return;
  const label = getActiveParteLabel(t);
  if (!label) return;
  const isP2 = label.includes('2');

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  const fs = 26;
  g.font = `800 ${fs}px ${SANS}`;
  const tw = g.measureText(label).width;
  const bw = Math.max(132, Math.min(280, Math.ceil(tw + 48)));
  const bh = 52;
  const bx = 64, by = 165;

  g.fillStyle = 'rgba(10, 15, 29, 0.76)';
  rr(bx, by, bw, bh, 12); g.fill();
  g.strokeStyle = isP2 ? rgba(PAL.yellow, 0.70) : 'rgba(245, 247, 251, 0.32)';
  g.lineWidth = 2;
  rr(bx, by, bw, bh, 12); g.stroke();

  g.fillStyle = isP2 ? PAL.yellow : PAL.text;
  drawFittedText(label, bx + bw / 2, by + bh / 2 + 1, bw - 28, fs, SANS, '800', 'center');
  g.restore();
}

/* ============================================================
   DESENHO DAS CENAS DO VIDEO 07 ("A Corrida das 03h10")
   ============================================================ */
function drawScene(shot, t){
  const f = faceAt(t);
  const localP = prog(t, shot.start, shot.end);

  switch (shot.scene) {
    /* 1. Calcada de madrugada com chuva: Diego pede carro no celular */
    case 'calcada_chuva_pede': {
      drawNightSidewalk(t, false, 0);
      drawDiegoStanding(495, 1348, 1.16, {
        t, ex: 'neutral', closed: f.closed, pose: { phone: 1 },
        rimColor: PAL.cyan, rimA: 0.85, lookX: 0.18, lookY: 0.25
      });
      break;
    }

    /* 2. Tela do aplicativo de corridas (03:10, Carlos, Carro Prata, 4.9) */
    case 'tela_app_corrida': {
      withBlur(9, () => { drawNightSidewalk(t, false, 0); });
      drawRideAppScreen(t, t >= EV.nota_49 - 0.15);
      break;
    }

    /* 3. Seda prata encosta na calcada sob chuva */
    case 'carro_encosta_chuva': {
      const cp = prog(t, EV.carro_encosta, EV.entra_carro);
      drawNightSidewalk(t, true, cp);
      drawDiegoStanding(795, 1348, 1.04, {
        t, ex: 'neutral', closed: f.closed, face: -1, pose: { walk: 1 },
        rimColor: PAL.amber, rimA: 0.82, lookX: -0.25
      });
      break;
    }

    /* 4. Diego entra no banco traseiro e coloca o fone + batida da porta */
    case 'diego_entra_fone': {
      withBlur(6, () => { drawCarCabinInterior(t, 0.2, false); });
      drawDiegoSeated(540, 1085, 1.18, {
        t, ex: 'neutral', closed: f.closed,
        earbuds: t >= EV.coloca_fone - 0.10,
        rimColor: PAL.cyan, rimA: 0.80, lookX: 0.10
      });
      break;
    }

    /* 5. Motorista nao da boa noite, acelera forte na avenida deserta */
    case 'interior_avenida_acelera': {
      const fast = t >= EV.acelera_avenida - 0.15 ? 2.6 : 1.1;
      drawCarCabinInterior(t, fast, t >= EV.motor_acelerando - 0.10);
      break;
    }

    /* 6. Celular vibra com ligacao do proprio aplicativo */
    case 'tela_ligacao_app': {
      withBlur(9, () => { drawCarCabinInterior(t, 1.6, false); });
      drawAppCallScreen(t, t >= EV.atende_erro - 0.15 ? 'active' : 'incoming');
      break;
    }

    /* 7. Voz telefonica do motorista real Carlos na linha */
    case 'tela_ligacao_ativa': {
      withBlur(9, () => { drawCarCabinInterior(t, 2.2, true); });
      drawAppCallScreen(t, 'active');
      break;
    }

    /* 8. Diego congela no banco traseiro apos a CTA */
    case 'diego_congela_banco': {
      withBlur(7, () => { drawCarCabinInterior(t, 2.2, true); });
      drawDiegoSeated(540, 1075, 1.24, {
        t, ex: 'fear', closed: f.closed, fastBreath: true,
        earbuds: true, rimColor: PAL.alert, rimA: 0.90, lookY: -0.22
      });
      break;
    }

    /* 9. Close nos olhos do motorista no retrovisor encarando fixo sem piscar */
    case 'retrovisor_olhos_fixos': {
      drawRearviewMirrorEyes(t, 'stare', 0);
      break;
    }

    /* 10. Diego puxa a macaneta travada (trava infantil acionada) */
    case 'macaneta_travada': {
      drawLockedDoorHandle(t, localP);
      break;
    }

    /* 11. GPS do painel desviando para estrada de terra fora da cidade (fim seco Parte 1) */
    case 'gps_estrada_terra': {
      drawDashboardGps(t, prog(t, EV.gps_desvio, EV.corte_parte_2));
      break;
    }

    /* 12. PARTE 2: Diego finge calma falando alto com o pai no telefone */
    case 'diego_finge_telefone': {
      withBlur(7, () => { drawCarCabinInterior(t, 2.1, false); });
      drawDiegoSeated(515, 1085, 1.22, {
        t, ex: 'fear', closed: f.closed, fastBreath: true,
        holdPhoneEar: true, earbuds: false, rimColor: PAL.cyan, rimA: 0.88, lookX: -0.25, lookY: -0.14
      });
      break;
    }

    /* 13. O cara no volante nao cai e ri seco */
    case 'motorista_ri_seco': {
      drawRearviewMirrorEyes(t, 'laugh', 0.55);
      break;
    }

    /* 14. Velocimetro cravando 120 km/h com painel pulsando vermelho */
    case 'velocimetro_120': {
      drawSpeedometer120(t, prog(t, EV.velocimetro_120, EV.motor_acelerando_2 + 1.0));
      break;
    }

    /* 15. Motorista real gritando na linha: olha pro banco do carona! */
    case 'ligacao_alerta_grito': {
      withBlur(9, () => { drawCarCabinInterior(t, 3.2, true); });
      drawAppCallScreen(t, 'alert');
      break;
    }

    /* 16. Diego inclina o corpo para frente em panico */
    case 'diego_inclina_frente': {
      withBlur(7, () => { drawCarCabinInterior(t, 3.0, true); });
      drawDiegoSeated(540, 1060, 1.28, {
        t, ex: 'shock', closed: f.closed, fastBreath: true,
        leanForward: ease(localP), earbuds: false, rimColor: PAL.alert, rimA: 0.92, lookX: 0.25, lookY: 0.25
      });
      break;
    }

    /* 17. POV no banco do carona escuro: 4 celulares acesos vibrando */
    case 'quatro_celulares_carona': {
      drawFourPhonesPassengerSeat(t);
      break;
    }

    /* 18. O carro entra numa rua sem saida */
    case 'rua_sem_saida': {
      drawDeadEndStreet(t, localP);
      break;
    }

    /* 19. MODULO bigFace DO DIEGO EM TERROR EXTREMO ([SFX:impacto_twist:1.4]) */
    case 'big_face': {
      withBlur(8, () => {
        drawBackdrop(t, 'red');
        drawCarCabinInterior(t, 0.3, true);
      });
      const jitX = noise(t * 50, 1) * 9;
      const jitY = noise(t * 50, 2) * 9;
      g.save();
      g.translate(540 + jitX, 920 + jitY);
      g.fillStyle = PAL.top;
      rr(-310, 265, 620, 880, 175); g.fill();
      g.save();
      rr(-310, 265, 620, 880, 175); g.clip();
      g.fillStyle = rgba(PAL.topDeep, 0.50);
      g.fillRect(-320, 255, 175, 900);
      g.restore();
      g.fillStyle = PAL.hoodGrey;
      rr(-190, 248, 380, 72, 36); g.fill();
      g.fillStyle = PAL.skinShadow;
      rr(-64, 190, 128, 120, 40); g.fill();

      drawHeadDiego(0, -15, 290, 'shock', f.closed, {
        tilt: -0.04 + noise(t * 24, 3) * 0.016,
        rimA: 0.98,
        rimColor: PAL.alert,
        rimAng: 0.14,
        lookX: 0.10,
        sweat: true
      });
      glow(0, 340, 380, PAL.cyan, 0.24);
      glow(320, -20, 420, PAL.alert, 0.38);
      g.restore();
      break;
    }

    /* 20. QUADRO FINAL SECO PARA LOOP: os olhos do homem sorriem no retrovisor! */
    case 'final_retrovisor_sorriso': {
      const sp = ease(prog(t, EV.olhos_sorriem - 0.15, EV.olhos_sorriem + 0.85));
      drawRearviewMirrorEyes(t, 'smile', sp);
      break;
    }
  }
}

/* ============================================================
   CAMERA VIVA V5.2 + PUNCH-IN KATANA + SCREEN SHAKE AMORTECIDO
   ============================================================ */
function pickShot(t){
  for (let i = 0; i < SHOTS.length; i++) {
    const s = SHOTS[i];
    if (t < s.end || i === SHOTS.length - 1) return s;
  }
  return SHOTS[0];
}

function cameraFor(shot, t){
  const k = ease(prog(t, shot.start, shot.end));
  let z = lerp(shot.cam0[0], shot.cam1[0], k);
  const cx = lerp(shot.cam0[1], shot.cam1[1], k);
  const cy = lerp(shot.cam0[2], shot.cam1[2], k);

  let sx = noise(t * 2.3, 11) * 4.5;
  let sy = noise(t * 2.1, 29) * 4.5;

  for (let i = 0; i < KATANA_HITS.length; i++) {
    const kh = KATANA_HITS[i];
    if (t >= kh.start && t < kh.end + 0.40) {
      const dt = t - kh.start;
      z += kh.punch * Math.exp(-dt * 7.2);
      const env = Math.exp(-dt * 10.5);
      sx += Math.sin(dt * 108) * kh.shake * env;
      sy += Math.cos(dt * 94) * kh.shake * 0.72 * env;
    }
  }

  const impacts = [
    [EV.porta_impacto + 0.04, 18, 7.2],
    [EV.motor_acelerando + 0.04, 16, 6.2],
    [EV.trava_porta_carro + 0.04, 24, 6.0],
    [EV.motor_acelerando_2 + 0.04, 28, 5.2],
    [EV.celular_tocando + 0.04, 14, 6.5],
    [EV.impacto_twist, 30, 4.8]
  ];
  for (const [ti, amp, dec] of impacts) {
    if (t >= ti && t < ti + 0.90) {
      const dt = t - ti;
      const env = Math.exp(-dt * dec);
      sx += Math.sin(dt * 95) * amp * env;
      sy += Math.cos(dt * 83) * amp * 0.72 * env;
    }
  }
  return { z, cx, cy, sx, sy };
}

function finish(vig){
  g.save();
  g.globalAlpha = clamp(vig, 0, 1);
  g.drawImage(vigCv, 0, 0);
  g.restore();
}

/* ============================================================
   LEGENDAS POP-IN V5.2 (ANTI-COLISAO + BARREIRA DURA PARTE 2)
   ============================================================ */
const RED_WORDS = new Set([
  'deserta', 'erro', 'cancelar', 'congela', 'retrovisor', 'piscar', 'trava',
  'infantil', 'acionada', 'vermelha', 'terra', 'delegacia', 'ri', 'cento',
  'vinte', 'gritar', 'placa', 'ontem', 'carona', 'quatro', 'celulares',
  'perdidas', 'saida', 'sorriem', 'relaxa', 'companhia', 'nao'
]);
function normWord(w){
  return w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/gi, '').toLowerCase();
}
function groupLen(slice){
  return slice.reduce((acc, p) => acc + String(p.palavra || '').length, 0) + Math.max(0, slice.length - 1);
}

function buildPreviewCaptions(){
  const e = EV;
  const lines = [
    [e.gancho, e.tela_app - 0.14, 'Três e dez da manhã. Diego pede um carro por aplicativo na saída do trabalho.'],
    [e.tela_app, e.carro_encosta - 0.14, 'O app mostra: motorista Carlos, carro prata, nota quatro ponto nove, chegando em dois minutos.'],
    [e.carro_encosta, e.porta_impacto - 0.08, 'O carro encosta. Diego entra sem olhar a placa e já coloca o fone.'],
    [e.sem_boa_noite, e.motor_acelerando - 0.08, 'O motorista não dá boa noite. Só acelera forte na avenida deserta.'],
    [e.celular_vibra, e.voz_motorista_1 - 0.12, 'Dois minutos depois, o celular do Diego vibra com uma ligação do próprio aplicativo. Ele atende achando que é erro do sistema.'],
    [e.voz_motorista_1, e.cta_meio_inicio - 0.12, 'Irmão, tô aqui na frente do seu trabalho buzinando. Você vai descer ou posso cancelar?'],
    [e.diego_congela, e.puxa_macaneta - 0.12, 'Diego congela. Ele olha pro motorista no retrovisor. O cara tá encarando ele fixo, sem piscar.'],
    [e.puxa_macaneta, e.trava_porta_carro - 0.08, 'Diego puxa a maçaneta da porta. Trava infantil acionada.'],
    [e.gps_desvio, e.corte_parte_2 - 0.08, 'O GPS no painel não tá indo pra casa dele. A linha vermelha aponta pra uma estrada de terra fora da cidade.'],
    [e.finge_calma, e.nao_cai - 0.12, 'Diego finge calma e fala alto pro telefone: Pai, já tô dobrando a esquina da delegacia, pode abrir o portão.'],
    [e.nao_cai, e.motor_acelerando_2 - 0.08, 'O cara no volante não cai. Ele ri seco e joga o carro a cento e vinte por hora.'],
    [e.motorista_grita, e.inclina_corpo - 0.12, 'Na linha, o motorista real começa a gritar: Irmão, eu vi o carro prata arrancando com você! Eu conheço essa placa, esse cara já fez isso ontem! Olha pro banco do carona agora!'],
    [e.inclina_corpo, e.celular_tocando - 0.08, 'Diego inclina o corpo e olha pro banco da frente. No escuro, a luz ilumina quatro celulares jogados ali, todos com a tela do aplicativo em corrida ativa e dezenas de ligações perdidas.'],
    [e.rua_sem_saida, e.impacto_twist - 0.08, 'O carro entra numa rua sem saída.'],
    [e.final_retrovisor, e.duracao_total - 0.16, 'No retrovisor, os olhos do homem sorriem: Relaxa, o seu já vai fazer companhia pra eles.']
  ];
  const groups = [];
  for (const [t0, t1, txt] of lines) {
    const words = txt.split(' ');
    const span = Math.max(0.25, t1 - t0);
    const weights = words.map(w => Math.max(2, w.length) + 1.2);
    const sum = weights.reduce((a, b) => a + b, 0);
    let cur = t0;
    const timed = words.map((w, i) => {
      const d = span * (weights[i] / sum);
      const item = { palavra: w, inicio: cur, fim: cur + d, duracao: d };
      cur += d;
      return item;
    });
    let i = 0;
    while (i < timed.length) {
      const rem = timed.length - i;
      let sz = rem <= 3 ? rem : (rem === 4 ? 2 : 3);
      if (sz === 3 && groupLen(timed.slice(i, i + 3)) > 20) sz = 2;
      if (sz === 2 && groupLen(timed.slice(i, i + 2)) > 22) sz = 1;
      const sl = timed.slice(i, i + sz);
      groups.push({ inicio: sl[0].inicio, fim: sl[sl.length - 1].fim, palavras: sl });
      i += sz;
    }
  }
  captionGroups = groups;
}

function layoutCaptionGroup(grp){
  const words = grp.palavras
    .map(p => ({
      txt: String(p.palavra || '').replace(/\[\/?VOZ(?::[a-zA-Z0-9_]+)?\]/gi, '').trim().toUpperCase(),
      key: normWord(String(p.palavra || '')),
      inicio: Number(p.inicio),
      fim: Number(p.fim ?? (Number(p.inicio) + Number(p.duracao || 0.25)))
    }))
    .filter(w => w.txt.length > 0);
  if (!words.length) return null;

  const POP_MAX = 1.09;
  const MAX_LINE_W = 876;
  let fs = 78;
  let lw = 16, gap = 36, wds = [], boxes = [], tw = 0;

  for (let iter = 0; iter < 16; iter++) {
    g.font = `900 ${fs}px ${COND}`;
    lw = Math.max(10, Math.round(fs * 0.20));
    gap = Math.max(26, Math.round(fs * 0.36) + Math.round(lw * 0.50));
    wds = words.map(w => g.measureText(w.txt).width);
    boxes = wds.map(w => w * POP_MAX + lw);
    tw = boxes.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
    if (tw <= MAX_LINE_W || fs <= 30) break;
    const nextFs = Math.max(30, Math.floor(fs * (MAX_LINE_W / tw)) - (iter > 2 ? 1 : 0));
    if (nextFs >= fs) fs -= 2; else fs = nextFs;
  }

  let x = 540 - tw / 2;
  const items = words.map((w, i) => {
    const cx = x + boxes[i] / 2;
    const item = { ...w, cx, w: wds[i], boxW: boxes[i] };
    x += boxes[i] + gap;
    return item;
  });
  return { fs, lw, gap, tw, items };
}

function pickCaptionGroup(t){
  const cP2 = Number(EV.corte_parte_2);
  const temCorte = isFinite(cP2) && cP2 > 0;
  const naParte2 = temCorte && t >= cP2 - 0.001;

  let candidato = null;
  for (let i = 0; i < captionGroups.length; i++) {
    const c = captionGroups[i];
    const ini = Number(c.inicio);
    const fim = Number(c.fim);
    if (temCorte) {
      const grpEhP2 = ini >= cP2 - 0.005;
      if (naParte2 && !grpEhP2) continue;
      if (!naParte2 && grpEhP2) continue;
    }
    if (t >= ini - 0.04 && t <= fim) {
      return c;
    }
    if (t > fim && t <= fim + 0.14) {
      candidato = c;
    }
  }
  return candidato;
}

function drawCaptions(t){
  if (katanaStateAt(t) !== null) return;
  if (isFullScreenCtaActive(t)) return;

  const grp = pickCaptionGroup(t);
  if (!grp || !grp.palavras || !grp.palavras.length) return;

  const lay = layoutCaptionGroup(grp);
  if (!lay) return;

  let active = 0;
  for (let i = 0; i < lay.items.length; i++) if (t >= lay.items[i].inicio - 0.02) active = i;

  const grpPop = popScale(t - grp.inicio + 0.02, 0.11);

  g.save();
  g.font = `900 ${lay.fs}px ${COND}`;
  g.textBaseline = 'middle';
  g.textAlign = 'center';

  const y = 1495;
  g.translate(540, y);
  g.scale(grpPop, grpPop);
  g.translate(-540, -y);

  g.lineJoin = 'round';
  g.miterLimit = 2;

  lay.items.forEach((w, i) => {
    const isAct = i === active;
    const isRed = RED_WORDS.has(w.key);
    const fill = isAct ? (isRed ? PAL.alert : PAL.yellow) : '#FFFFFF';
    const wPop = isAct ? lerp(1.09, 1.04, easeOut(clamp((t - w.inicio) / 0.09))) : 1.0;

    g.save();
    g.translate(w.cx, y);
    g.scale(wPop, wPop);
    g.shadowColor = 'rgba(0,0,0,.88)';
    g.shadowBlur = 16;
    g.shadowOffsetY = 6;
    g.strokeStyle = '#000000';
    g.lineWidth = lay.lw;
    g.strokeText(w.txt, 0, 0);
    g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.fillStyle = fill;
    g.fillText(w.txt, 0, 0);
    g.restore();
  });
  g.restore();
}

window.measureCaptionAt = t => {
  const grp = pickCaptionGroup(t);
  if (!grp) return null;
  g = main;
  const lay = layoutCaptionGroup(grp);
  if (!lay) return null;
  let minVisualGap = Infinity;
  for (let i = 0; i < lay.items.length - 1; i++) {
    const a = lay.items[i], b = lay.items[i + 1];
    const rightA = a.cx + a.boxW / 2;
    const leftB = b.cx - b.boxW / 2;
    minVisualGap = Math.min(minVisualGap, leftB - rightA);
  }
  return {
    texto: lay.items.map(x => x.txt).join(' '),
    palavras: lay.items.map(x => x.txt),
    fs: lay.fs,
    lw: lay.lw,
    gap: lay.gap,
    tw: Number(lay.tw.toFixed(1)),
    minVisualGap: lay.items.length > 1 ? Number(minVisualGap.toFixed(1)) : null
  };
};

let ccOn = false;
function renderAt(t){
  t = clamp(+t || 0, 0, duration);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.filter = 'none';
  g.shadowBlur = 0;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);

  /* 1. CTA dedicada em tela cheia V5.2 */
  if (drawFullScreenCta(t)) return;

  /* 2. Motor Katana + Cenas + Loop seco sem tela preta no fim */
  const shot = pickShot(t);
  const katanaActive = drawKatanaOverlay(t);

  if (!katanaActive) {
    const cam = cameraFor(shot, t);
    g.save();
    g.translate(W / 2 + cam.sx, H / 2 + cam.sy);
    g.scale(cam.z, cam.z);
    g.translate(-cam.cx, -cam.cy);
    drawScene(shot, t);
    g.restore();

    finish(shot.vig || 0.62);
    drawClock(t, shot);

    const cutAge = t - shot.start;
    if (shot.id > 1 && cutAge >= 0 && cutAge < 0.055) {
      const k = 1 - cutAge / 0.055;
      g.fillStyle = shot.mood === 'red' ? `rgba(255,59,48,${k * 0.16})` : `rgba(0,0,0,${k * 0.34})`;
      g.fillRect(0, 0, W, H);
    }
  }

  /* 3. Selo dinamico V5.2 ("PARTE 1" -> "PARTE 2") */
  drawParteBadge(t);

  /* 4. Legendas sincronizadas */
  if (ccOn) drawCaptions(t);
}

window.renderAt = renderAt;
window.getDuration = () => duration;
window.getShots = () => SHOTS.map(s => ({ id: s.id, scene: s.scene, mood: s.mood, start: s.start, end: s.end, dur: s.dur }));
window.getKatanaHits = () => KATANA_HITS.map(h => ({ id: h.id, lines: h.lines, start: h.start, end: h.end, dur: h.dur }));
window.getMidCta = () => ({
  modo: EV.cta_modo || 'pausa_meio',
  inicio: EV.cta_meio_inicio,
  fim: EV.cta_meio_fim,
  texto: EV.cta_texto || 'COMENTE EU QUERO'
});
window.getCorteParte2 = () => Number(EV.corte_parte_2);
window.getParteLabel = t => (typeof t === 'number' ? getActiveParteLabel(t) : parteLabel);
window.setParteLabel = v => { parteLabel = String(v ?? '').trim(); renderAt(cur); };

/* Controles do player */
const $ = id => document.getElementById(id);
const btn = $('play'), seek = $('seek'), out = $('time'), cc = $('cc'), status = $('status');
let playing = false, cur = 0, t0 = 0, p0 = 0;
const fmt = v => v.toFixed(1).replace('.', ',');

function ui(){
  seek.value = cur;
  out.textContent = `${fmt(cur)} / ${fmt(duration)}`;
  seek.setAttribute('aria-valuetext', `${fmt(cur)} de ${fmt(duration)} segundos`);
  $('playLbl').textContent = playing ? 'Pausar' : 'Play';
  $('playIcon').setAttribute('d', playing ? 'M3 2h4v12H3zM9 2h4v12H9z' : 'M4 2l10 6-10 6z');
}
function tick(){
  if (!playing) return;
  cur = Math.min(t0 + (performance.now() - p0) / 1000, duration);
  if (audio && cur < audio.duration && Math.abs(audio.currentTime - cur) > 0.2) audio.currentTime = cur;
  renderAt(cur); ui();
  if (cur >= duration) pause(); else requestAnimationFrame(tick);
}
function play(){
  if (cur >= duration) cur = 0;
  playing = true; t0 = cur; p0 = performance.now();
  if (audio) { audio.currentTime = cur; audio.play().catch(() => {}); }
  ui(); requestAnimationFrame(tick);
}
function pause(){ playing = false; if (audio) audio.pause(); ui(); }
btn.addEventListener('click', () => playing ? pause() : play());
seek.addEventListener('input', () => {
  cur = +seek.value; t0 = cur; p0 = performance.now();
  if (audio && cur < audio.duration) audio.currentTime = cur;
  renderAt(cur); ui();
});
cc.addEventListener('click', () => {
  ccOn = !ccOn; cc.setAttribute('aria-pressed', String(ccOn)); renderAt(cur);
});

async function fetchJson(url){
  if (location.protocol === 'file:') return null;
  try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return null;
}
function probeAudio(src){
  return new Promise(res => {
    const el = new Audio(); let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    el.preload = 'auto';
    el.addEventListener('loadedmetadata', () => fin(el), { once: true });
    el.addEventListener('error', () => fin(null), { once: true });
    setTimeout(() => fin(null), 3500);
    el.src = src;
  });
}

async function load(){
  const [evData, tsData] = await Promise.all([
    fetchJson('audio/eventos.json'),
    fetchJson('audio/timestamps.json')
  ]);
  let a = await probeAudio('audio/mix_final.mp3');
  let audioSrc = 'audio/mix_final.mp3';
  if (!a) { a = await probeAudio('audio/narracao.mp3'); audioSrc = 'audio/narracao.mp3'; }

  if (a && isFinite(a.duration)) audio = a;
  normalizeEvents(evData, audio ? audio.duration : null);

  if (tsData && Array.isArray(tsData.grupos) && tsData.grupos.length) {
    captionGroups = tsData.grupos;
  } else {
    buildPreviewCaptions();
  }

  if (audio && evData) {
    status.textContent = `Audio (${audioSrc}) sincronizado V5.2 (${fmt(duration)} s | CTA tela cheia | Corte P2 em ${fmt(EV.corte_parte_2)} s).`;
  } else if (audio) {
    status.textContent = `Audio (${audioSrc}) carregado sem eventos.json (${fmt(duration)} s).`;
  } else {
    status.textContent = `Modo Previa V5.2: sem audio, usando marcos padrao do roteiro_07 (0 a ${fmt(duration)} s | Corte P2 em ${fmt(EV.corte_parte_2)} s).`;
  }
  seek.max = duration;
  btn.disabled = false; seek.disabled = false; btn.removeAttribute('aria-busy');
  renderAt(cur); ui();
}

normalizeEvents(null, null);
buildPreviewCaptions();
renderAt(0); ui(); load();
})();
