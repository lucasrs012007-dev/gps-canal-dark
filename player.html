<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nao abra a porta: player v2</title>
<link rel="icon" href="data:,">
<style>
/* Camada unica de tokens, espelhando tokens/colors.json (dark), spacing, typography, motion, borders, opacity. */
:root{
  --surface-page:#030712; --surface-sunken:#000000; --surface-raised:#1f2937;
  --text-primary:#f9fafb; --text-secondary:#9ca3af;
  --border-default:#1f2937; --border-strong:#6b7280; --focus-ring:#60a5fa;
  --action-primary:#2563eb; --action-primary-hover:#1d4ed8;
  --action-secondary:#111827; --action-secondary-hover:#374151;
  --space-1:4px; --space-2:8px; --space-3:12px;
  --radius-button:6px; --radius-card:8px; --border-width:1px; --focus-width:2px;
  --font-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
  --font-size-xs:12px; --font-size-sm:14px; --weight-medium:500;
  --duration-fast:100ms; --ease-out:cubic-bezier(0,0,.2,1);
  --opacity-disabled:.45; --target-min:44px; --chrome-h:128px; --press-offset:1px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}
.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-2)}
.stage{width:min(100%,calc((100dvh - var(--chrome-h)) * 9 / 16));aspect-ratio:9/16}
canvas{display:block;width:100%;height:100%;border-radius:var(--radius-card);background:var(--surface-sunken)}
.controls{width:100%;max-width:calc(var(--target-min) * 12);display:flex;align-items:center;gap:var(--space-2)}
.btn{min-height:var(--target-min);min-width:var(--target-min);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);
  padding:0 var(--space-3);border:var(--border-width) solid var(--border-default);border-radius:var(--radius-button);
  background:var(--action-secondary);color:var(--text-primary);font:var(--weight-medium) var(--font-size-sm)/1 var(--font-sans);cursor:pointer;
  transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out)}
.btn svg{width:var(--font-size-sm);height:var(--font-size-sm);fill:currentColor}
.btn:hover{background:var(--action-secondary-hover)}
.btn-primary{background:var(--action-primary);border-color:var(--action-primary)}
.btn-primary:hover{background:var(--action-primary-hover)}
.btn:focus-visible,.seek:focus-visible{outline:var(--focus-width) solid var(--focus-ring);outline-offset:var(--focus-width)}
.btn:active{transform:translateY(var(--press-offset))}
.btn:disabled{opacity:var(--opacity-disabled);cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress}
.btn[aria-pressed="true"]{background:var(--surface-raised);border-color:var(--border-strong)}
.seek{flex:1;min-width:0;min-height:var(--target-min);accent-color:var(--action-primary);cursor:pointer}
.seek:disabled{opacity:var(--opacity-disabled)}
.time{font:var(--font-size-xs)/1 var(--font-mono);color:var(--text-secondary);white-space:nowrap}
.status{margin:0;font-size:var(--font-size-xs);color:var(--text-secondary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="app">
  <h1 class="sr-only">Previa do Short v2: Nao abra a porta</h1>
  <div class="stage"><canvas id="c" width="1080" height="1920" role="img" aria-label="Animacao do Short Nao abra a porta"></canvas></div>
  <div class="controls" role="group" aria-label="Controles do player">
    <button id="play" class="btn btn-primary" type="button" disabled aria-busy="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path id="playIcon" d="M4 2l10 6-10 6z"/></svg><span id="playLbl">Carregando</span>
    </button>
    <input id="seek" class="seek" type="range" min="0" max="45" step="0.01" value="0" aria-label="Progresso" disabled>
    <output id="time" class="time" for="seek">0,0 / 45,0</output>
    <button id="cc" class="btn" type="button" aria-pressed="false">Legendas</button>
  </div>
  <p id="status" class="status" aria-live="polite">Procurando audio/mix_final.mp3 e audio/eventos.json...</p>
</main>
<script>
(() => {
'use strict';
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const main = cv.getContext('2d');
let g = main;

/* Paleta flat sombria v2: 1 cor de destaque fixa (moletom laranja) + alertas vermelhos + azul frio */
const PAL = {
  bg:'#05070e', wall:'#121828', wallDark:'#090d16', floor:'#06080f',
  door:'#2d1e17', doorPanel:'#221610', frame:'#160f0b', brass:'#c9a05b',
  skin:'#d9ad8b', skinShadow:'#b38464', hair:'#161b29', ink:'#0b0e17',
  hoodie:'#eb7d24', hoodieShade:'#bd5b12', hoodieDeep:'#8f4109',
  pants:'#1e273c', pantsDark:'#141b2c', shoe:'#0c101a', sole:'#3e4a66',
  screen:'#75b2ff', screenCore:'#dbeaff', warm:'#ffb057',
  alert:'#ff3b30', alertDark:'#b81d18', yellow:'#ffd400',
  text:'#f5f7fb', dim:'#8e97ad', card:'#151a26',
  mom:'#47597a', momShade:'#31405c', sis:'#6b7ea1',
  phone:'#0b0e16', phoneEdge:'#2d3548', sweat:'#96ccff', chatSent:'#1e4b3d'
};
const MONO = '"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace';
const SANS = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const COND = '"Arial Narrow","Roboto Condensed","Liberation Sans Narrow",Impact,Arial,sans-serif';

/* Utilidades deterministicas */
const clamp = (v,a=0,b=1) => Math.min(b,Math.max(a,v));
const lerp = (a,b,k) => a+(b-a)*k;
const ease = k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
const easeOut = k => 1-Math.pow(1-clamp(k),3);
const prog = (t,a,b) => clamp((t-a)/Math.max(.001,b-a));
const bell = (t,a,b) => Math.sin(Math.PI*prog(t,a,b));
const hash = n => { const s = Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); };
const noise = (t,seed=0) => { const i=Math.floor(t), f=t-i, u=f*f*(3-2*f); return lerp(hash(i+seed*57),hash(i+1+seed*57),u)*2-1; };
const rgba = (hex,a) => { const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; };
function mulberry(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function circ(x,y,r){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
function ell(x,y,rx,ry){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); }
function glow(x,y,r,col,a){ if(a<=0) return; const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,rgba(col,a)); gr.addColorStop(1,rgba(col,0)); g.save(); g.globalCompositeOperation='lighter'; g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); g.restore(); }
function vgrad(c1,c2,y0=-300,y1=H+300){ const gr=g.createLinearGradient(0,y0,0,y1); gr.addColorStop(0,c1); gr.addColorStop(1,c2); g.fillStyle=gr; g.fillRect(-400,y0,W+800,y1-y0); }
function wrap(text,x,y,maxW,lh){ let line=''; for(const w of text.split(' ')){ const t=line?line+' '+w:w; if(g.measureText(t).width>maxW&&line){ g.fillText(line,x,y); line=w; y+=lh; } else line=t; } g.fillText(line,x,y); return y; }
const flick = (t,seed=3) => { const dip = hash(Math.floor(t*7)+seed*31)>0.86 ? .36 : 1; return (0.78+0.22*noise(t*9,seed))*dip; };

/* Profundidade de campo (Depth of Field): compoe o fundo em canvas auxiliar e aplica blur(8px) em passada unica */
const BLUR_PAD = 16;
const blurCv = document.createElement('canvas');
blurCv.width = W / 2 + BLUR_PAD * 2;
blurCv.height = H / 2 + BLUR_PAD * 2;
const blurCtx = blurCv.getContext('2d');
function withBlur(px, fn){
  const m = main.getTransform();
  blurCtx.setTransform(1, 0, 0, 1, 0, 0);
  blurCtx.globalAlpha = 1;
  blurCtx.globalCompositeOperation = 'source-over';
  blurCtx.filter = 'none';
  blurCtx.fillStyle = PAL.bg;
  blurCtx.fillRect(0, 0, blurCv.width, blurCv.height);
  blurCtx.translate(BLUR_PAD, BLUR_PAD);
  blurCtx.scale(0.5, 0.5);
  blurCtx.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g = blurCtx;
  fn();
  g = main;
  main.save();
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.filter = `blur(${px}px)`;
  main.drawImage(blurCv, -BLUR_PAD * 2, -BLUR_PAD * 2, W + BLUR_PAD * 4, H + BLUR_PAD * 4);
  main.filter = 'none';
  main.restore();
}

/* Linha do tempo orientada 100% por eventos.json (com fallback completo para Modo Previa 0..45s) */
const EV_PREVIEW = {
  mapa_apito: 1.45, alerta_1: 3.1, caio_ri: 7.4, hora_21: 10.0,
  alerta_2: 12.2, chat_mae: 15.2, hora_00: 19.0, apagao_00: 19.75,
  janelas_telas: 21.8, alerta_3: 23.8, hora_03: 26.0,
  batidas_porta: 27.1, batidas_porta_duracao: 2.1, batidas_tempos: [27.1, 27.75, 28.4],
  respiracao: 29.2, sussurro: 32.0, silencio: 35.0,
  foto_revela: 36.2, big_face: 39.4, plot_twist: 40.9, duracao_total: 45.0
};
let EV = { ...EV_PREVIEW };
let duration = EV.duracao_total;
let audio = null;
let captionGroups = [];
let BLINKS = [];
let EXPR_CUES = [];

function normalizeEvents(raw, audioDur){
  const e = { ...EV_PREVIEW, ...(raw || {}) };
  const dur = Math.max(audioDur || 0, Number(e.duracao_total) || 45);
  e.duracao_total = dur;
  if (raw) {
    e.hora_00 = raw.hora_00 ?? Math.max((e.alerta_2 || 10) + 1.2, e.apagao_00 - 0.65);
    e.mapa_apito = raw.mapa_apito ?? Math.max(0.9, e.alerta_1 * 0.48);
    e.caio_ri = raw.caio_ri ?? lerp(e.alerta_1, e.hora_21, 0.58);
    e.chat_mae = raw.chat_mae ?? lerp(e.alerta_2, e.hora_00, 0.48);
    e.janelas_telas = raw.janelas_telas ?? lerp(e.apagao_00, e.alerta_3, 0.5);
    e.batidas_porta_duracao = raw.batidas_porta_duracao ?? 2.1;
    e.batidas_tempos = Array.isArray(raw.batidas_tempos) && raw.batidas_tempos.length
      ? raw.batidas_tempos.map(Number)
      : [e.batidas_porta, e.batidas_porta + 0.65, e.batidas_porta + 1.3];
    e.respiracao = raw.respiracao ?? (e.batidas_porta + e.batidas_porta_duracao);
  }
  EV = e;
  duration = dur;

  /* Expressao troca escondida na piscada iniciada 2 frames (0.067s a 30fps) antes do marco */
  EXPR_CUES = [
    [0, 'neutral'],
    [EV.caio_ri, 'smirk'],
    [EV.hora_21, 'neutral'],
    [EV.alerta_2, 'worry'],
    [EV.hora_03, 'fear'],
    [EV.big_face, 'shock']
  ];
  const bl = [];
  let bt = 0.8, bi = 0;
  while (bt < duration + 1) { bl.push(bt); bt += 2.6 + hash(bi++ * 9.7) * 1.6; }
  for (const [ct] of EXPR_CUES) if (ct > 0.2) bl.push(Math.max(0.05, ct - 0.067));
  BLINKS = bl.sort((a,b) => a - b);
}

const exprAt = t => { let e='neutral'; for (const [a,b] of EXPR_CUES) if (t >= a - 0.01) e = b; return e; };
function faceAt(t){
  let last = -1, prev = -1;
  for (const b of BLINKS) { if (b <= t) { prev = last; last = b; } else break; }
  const d = t - last;
  const closed = last >= 0 && d < 0.16 ? Math.sin((d / 0.16) * Math.PI) : 0;
  const ref = last < 0 ? 0 : (d < 0.08 ? (prev < 0 ? 0 : prev + 0.08) : last + 0.08);
  return { ex: exprAt(ref), closed };
}

/* ============================================================
   RIG FLAT EM CAPSULA (10 PONTOS IK) - SEM EFEITO CAPACETE
   ============================================================ */
function drawEyes(cx, cy, r, ex, closed, lookX=0){
  const lift = { neutral:0, smirk:-.02, worry:.05, fear:.10, shock:.19 }[ex] || 0;
  const tilt = { neutral:0, smirk:-.04, worry:.11, fear:.10, shock:.04 }[ex] || 0;
  const eyePositions = [[cx + r*.06, 1], [cx + r*.52, -1]];
  g.lineCap = 'round';

  for (const [x, inner] of eyePositions) {
    const y = cy - r*.05;
    const browY = y - r*(.27 + lift);
    /* Sobrancelha limpa flat */
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * .068;
    g.beginPath();
    g.moveTo(x - inner*r*.14, browY + (ex==='worry'||ex==='fear' ? r*.03 : 0));
    g.lineTo(x + inner*r*.13, browY - tilt*r);
    g.stroke();

    if (closed > 0.55) {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * .055;
      g.beginPath(); g.moveTo(x - r*.11, y); g.lineTo(x + r*.11, y); g.stroke();
      continue;
    }

    if (ex === 'smirk') {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * .062;
      g.beginPath(); g.arc(x, y + r*.06, r*.11, Math.PI*1.12, Math.PI*1.88); g.stroke();
      continue;
    }

    const scaleY = 1 - closed * 0.9;
    g.save();
    g.translate(x, y);
    g.scale(1, scaleY);

    if (ex === 'shock' || ex === 'fear' || ex === 'worry') {
      const rx = ex==='shock' ? r*.23 : ex==='fear' ? r*.19 : r*.15;
      const ry = ex==='shock' ? r*.26 : ex==='fear' ? r*.21 : r*.17;
      g.fillStyle = PAL.text;
      ell(0, 0, rx, ry);
      const pr = ex==='shock' ? r*.062 : ex==='fear' ? r*.078 : r*.082;
      g.fillStyle = PAL.ink;
      circ(r*.03 + lookX*r*.04, 0, pr);
      g.fillStyle = PAL.text;
      circ(r*.05 + lookX*r*.04, -pr*.45, pr*.32);
    } else {
      g.fillStyle = PAL.ink;
      ell(0, 0, r*.095, r*.12);
      g.fillStyle = PAL.text;
      circ(r*.03, -r*.045, r*.028);
    }
    g.restore();
  }

  /* Boca minimalista sutil apenas nas emocoes fortes */
  if (ex === 'smirk') {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * .05;
    g.beginPath(); g.arc(cx + r*.30, cy + r*.26, r*.17, Math.PI*0.12, Math.PI*0.72); g.stroke();
  } else if (ex === 'shock') {
    g.fillStyle = rgba(PAL.ink, .82);
    ell(cx + r*.29, cy + r*.40, r*.09, r*.12);
    /* Gota de suor frio */
    g.fillStyle = rgba(PAL.sweat, .9);
    const sx = cx + r*.82, sy = cy - r*.34;
    g.beginPath();
    g.moveTo(sx, sy - r*.18);
    g.quadraticCurveTo(sx + r*.09, sy + r*.02, sx, sy + r*.07);
    g.quadraticCurveTo(sx - r*.09, sy + r*.02, sx, sy - r*.18);
    g.fill();
  } else if (ex === 'fear') {
    g.strokeStyle = rgba(PAL.ink, .72);
    g.lineWidth = r * .045;
    g.beginPath(); g.moveTo(cx + r*.20, cy + r*.36); g.lineTo(cx + r*.38, cy + r*.34); g.stroke();
  }
}

function drawHeadFlat(cx, cy, r, ex, closed, o={}){
  const tilt = o.tilt || 0;
  g.save();
  g.translate(cx, cy);
  g.rotate(tilt);

  /* Coque traseiro opcional (ex.: mae) */
  if (o.bun) {
    g.fillStyle = o.hair || PAL.hair;
    circ(-r*1.02, -r*0.36, r*0.36);
  }

  /* Cabeca redonda flat sem contorno preto pesado */
  g.fillStyle = PAL.skin;
  circ(0, 0, r);

  /* Sombra suave no lado oposto a luz, dentro do clip do rosto */
  g.save();
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI*2); g.clip();
  g.fillStyle = rgba(PAL.ink, .16);
  circ(-r*1.10, r*0.16, r*0.98);
  g.restore();

  /* Cabelo unico sem costura: cobre nuca, topo e franja limpa acima das sobrancelhas */
  g.fillStyle = o.hair || PAL.hair;
  g.beginPath();
  g.arc(-r*0.04, -r*0.05, r*1.04, Math.PI*0.76, -Math.PI*0.18, false);
  g.quadraticCurveTo(r*0.48, -r*0.58, -r*0.12, -r*0.56);
  g.quadraticCurveTo(-r*0.54, -r*0.52, -r*0.62, -r*0.14);
  g.quadraticCurveTo(-r*0.66, r*0.24, -r*0.80, r*0.64);
  g.closePath();
  g.fill();

  /* Orelha flat limpa sobre a costeleta */
  g.fillStyle = PAL.skin;
  circ(-r*0.68, r*0.10, r*0.19);
  g.fillStyle = rgba(PAL.skinShadow, .65);
  circ(-r*0.69, r*0.11, r*0.09);

  /* Rim light coerente com a fonte da cena */
  if (o.rimA > 0) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';
    g.strokeStyle = rgba(o.rimColor || PAL.screen, o.rimA);
    g.lineWidth = r * .075;
    g.beginPath();
    g.arc(0, 0, r * .97, (o.rimAng || 0) - .85, (o.rimAng || 0) + .85);
    g.stroke();
    g.restore();
  }

  drawEyes(0, 0, r, ex, closed, o.lookX || 0);
  g.restore();
}

function ik(sx, sy, hx, hy, l1, l2, flip=1){
  const dx = hx - sx, dy = hy - sy;
  const d = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01);
  const a = Math.atan2(dy, dx);
  const c = clamp((l1*l1 + d*d - l2*l2) / (2*l1*d), -1, 1);
  const an = a + flip * Math.acos(c);
  return [sx + Math.cos(an)*l1, sy + Math.sin(an)*l1];
}
function drawLimb(s, h, l1, l2, w, col, handCol, flip=1){
  const e = ik(s[0], s[1], h[0], h[1], l1, l2, flip);
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(s[0], s[1]); g.lineTo(e[0], e[1]); g.lineTo(h[0], h[1]); g.stroke();
  if (handCol) { g.fillStyle = handCol; circ(h[0], h[1], w * .52); }
  return e;
}
const mix = (a, b, k) => { if (k) { a[0] = lerp(a[0], b[0], k); a[1] = lerp(a[1], b[1], k); } };

function drawCaio(x, gy, s, o){
  const t = o.t, P = o.pose || {};
  const sh = P.shrug || 0;
  const walk = P.walk || 0;
  const br = Math.sin(t * 2 * Math.PI / (o.fastBreath ? 1.55 : 3.2));
  const step = Math.sin(t * 7.5) * walk;

  g.save();
  g.translate(x, gy);
  g.scale(s * (o.face || 1), s);

  /* Sombra de contato firme no plano do chao (y = 0) */
  g.fillStyle = 'rgba(0,0,0,.55)';
  ell(4, 0, 118, 15);

  /* Pontos do rig: quadril, joelhos e pes travados no chao */
  const hipY = -228 - Math.abs(step) * 8;
  const shY = -438 - br * 5 - sh * 18;
  const hx = 6, hy = shY - 102 - br * 2;

  const footF = [-24 - step * 38, -14];
  const footN = [24 + step * 38, -14];
  drawLimb([-18, hipY + 8], footF, 108, 106, 36, PAL.pantsDark, null, -1);
  drawLimb([18, hipY + 8], footN, 108, 106, 38, PAL.pants, null, -1);

  /* Tenis flat limpos no chao */
  for (const [fx, fy, dark] of [[footF[0]+10, -12, true], [footN[0]+10, -12, false]]) {
    g.fillStyle = dark ? '#090c14' : PAL.shoe;
    ell(fx, fy, 42, 13);
    g.fillStyle = PAL.sole;
    rr(fx - 36, -6, 72, 6, 3); g.fill();
  }

  /* Bracos IK (ombros, cotovelos, maos) com trava para nunca atravessar a cabeca */
  const SN = [-8, shY + 48], SF = [26, shY + 46];
  const hn = [-4, hipY + 30], hf = [42, hipY + 28];
  mix(hn, [84, shY + 148], P.phone); mix(hf, [62, shY + 154], P.phone);
  mix(hn, [-66, hipY - 52], sh);     mix(hf, [92, hipY - 52], sh);
  mix(hn, [148, shY + 34], P.knock); mix(hf, [66, shY + 158], P.knock);
  mix(hn, [16, hipY - 18], P.pocket);
  const handMinY = hy + 96;
  hn[1] = Math.max(hn[1], handMinY);
  hf[1] = Math.max(hf[1], handMinY);

  /* Braco distante (sai da lateral frontal atras do tronco) */
  drawLimb(SF, hf, 114, 110, 34, PAL.hoodieShade, PAL.skinShadow, 1);

  drawHeadFlat(hx, hy, 80, o.ex, o.closed, {

function drawDust(t, col, a){

    const x = ((hash(i)*1300 + t*sp*(hash(i*7)-.5)*2 + noise(t*.3,i)*36) % 1300 + 1300) % 1300 - 110;

  }
  g.restore();
}

/* Mapa do Brasil */
const BR=[[.52,0],[.62,.05],[.72,.1],[.86,.17],[1,.27],[.97,.36],[.9,.45],[.86,.58],[.78,.68],[.7,.73],[.62,.82],[.55,.92],[.5,1],[.45,.9],[.4,.8],[.36,.7],[.3,.62],[.22,.55],[.12,.5],[.02,.43],[0,.33],[.08,.24],[.2,.18],[.3,.14],[.38,.08],[.45,.04]];
const brPath=new Path2D(); BR.forEach(([px,py],i)=>{ const x=90+px*900, y=540+py*900; i?brPath.lineTo(x,y):brPath.moveTo(x,y); }); brPath.closePath();
const DOTS=(()=>{ const r=mulberry(7), d=[]; while(d.length<160){ const x=90+r()*900, y=540+r()*900; if(main.isPointInPath(brPath,x,y)) d.push([x,y,r()]); } return d; })();

function shakeAt(t, times, amp, decay){
  let x = 0, y = 0;
  for (const k of times) {
    if (t >= k && t < k + 0.65) {
      const e = amp * Math.exp(-(t - k) * decay);
      x += Math.sin((t - k)*95 + k)*e;
      y += Math.cos((t - k)*81 + k*2)*e;
    }
  }
  return [x, y];
}
const hand = (t, z=1) => [noise(t*.55, 1)*7*z, noise(t*.55, 2)*7*z];

/* ============================================================
   RELOGIO LIMPO: APENAS UM HORARIO VISIVEL POR VEZ (ZERO SOBREPOSICAO)
   ============================================================ */
function drawClock(t){
  const endVis = Math.max(EV.plot_twist + 1.0, EV.duracao_total - 0.35);
  const t0301 = lerp(EV.plot_twist, endVis, 0.42);
  const stops = [
    [0, '19:00', false],
    [EV.hora_21, '21:00', false],
    [EV.hora_00, '00:00', false],
    [EV.hora_03, '03:00', true],
    [t0301, '03:01', true]
  ];
  let idx = 0;
  for (let i = 0; i < stops.length; i++) if (t >= stops[i][0]) idx = i;

  const [t0, curLbl, curRed] = stops[idx];
  const dt = t - t0;
  const half = 0.12;
  let label = curLbl, isRed = curRed, scaleY = 1, alpha = 1;

  if (idx > 0 && dt < half) {
    /* Primeira metade da troca: sai apenas o horario anterior */
    label = stops[idx - 1][1];
    isRed = stops[idx - 1][2];
    const p = dt / half;
    scaleY = Math.max(0.01, 1 - p);
    alpha = 1 - p;
  } else if (idx > 0 && dt < half * 2) {
    /* Segunda metade da troca: entra apenas o novo horario */
    const p = (dt - half) / half;
    scaleY = Math.max(0.01, p);
    alpha = p;
  }

  if (label === '00:00' && t >= EV.apagao_00) {
    alpha *= ((t % 1) < 0.62 ? 1 : 0.38);
  }

  g.save();
  g.fillStyle = 'rgba(4,6,12,.72)';
  rr(290, 96, 500, 152, 26); g.fill();
  g.strokeStyle = rgba(isRed ? PAL.alert : PAL.screen, .22);
  g.lineWidth = 2; rr(290, 96, 500, 152, 26); g.stroke();

  g.translate(540, 174);
  g.scale(1, scaleY);
  g.globalAlpha = alpha;
  g.font = `700 124px ${MONO}`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = isRed ? PAL.alert : PAL.screen;
  g.shadowBlur = 26;
  g.fillStyle = isRed ? PAL.alert : PAL.text;
  g.fillText(label, 0, 2);
  g.restore();
}

const GRAIN = [0,1,2,3].map(s => {

/* ============================================================
   LEGENDAS DE RETENCAO (2-3 PALAVRAS, MAIUSCULAS, AMARELO/VERMELHO)
   ============================================================ */
const RED_WORDS = new Set([
  'ALERTA','EMERGENCIA','URGENTE','NINGUEM','NAO','ABRA','TRES','BATE','CAI',
  'MEIA-NOITE','SILENCIO','ROSTO','NUNCA','DENTRO','SUSSURRA','MAE','APITA','BAIRRO'
]);
const normWord = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9-]/g, '').toUpperCase();

function buildPreviewCaptions(){
  const frases = [
    [0.15, 2.85, 'Sete da noite, todo celular do Brasil apita ao mesmo tempo.'],
    [3.15, 7.15, 'Alerta de emergência: até o amanhecer, não abra a porta para ninguém.'],
    [7.40, 9.65, 'Caio ri, achando que é teste do governo.'],
    [10.05, 11.95, 'Nove da noite, Caio chega em casa.'],
    [12.25, 14.90, 'Segundo alerta: ele já está no seu bairro.'],
    [15.25, 18.60, 'A mãe para de responder no grupo da família.'],
    [19.05, 21.50, 'Meia-noite, a luz cai no bairro inteiro.'],
    [21.85, 23.55, 'Só as telas brilham nas janelas.'],
    [23.85, 25.75, 'Terceiro alerta: ele bate três vezes.'],
    [26.05, 26.95, 'Três da manhã.'],
    [29.25, 31.75, 'Do outro lado da porta, alguém prende a respiração.'],
    [32.05, 34.45, 'Uma voz sussurra: abre, sou eu.'],
    [35.00, 35.85, 'Silêncio.'],
    [36.20, 38.95, 'Caio finalmente abre a foto de quem não pode entrar.'],
    [39.40, 40.55, 'É o rosto dele.'],
    [40.90, 44.15, 'Caio nunca esteve do lado de dentro.']
  ];
  const groups = [];
  for (const [a, b, txt] of frases) {
    const toks = txt.split(' ');
    const weights = toks.map(w => Math.max(2, w.length) + 1.2 + (/[,:]$/.test(w) ? 1.5 : 0));
    const sum = weights.reduce((s,v) => s + v, 0);
    let cur = a;
    const wList = toks.map((w, i) => {
      const d = (b - a) * (weights[i] / sum);
      const item = { palavra: w, inicio: cur, fim: cur + d, duracao: d };
      cur += d;
      return item;
    });
    /* Quebra em blocos de 2 a 3 palavras respeitando fronteira da frase */
    const clauses = [];
    let cl = [];
    wList.forEach((w, i) => {
      cl.push(w);
      const rem = wList.length - i - 1;
      if (/[,:]$/.test(w.palavra) && (cl.length >= 2 || w.palavra.includes('-')) && rem >= 2) {
        clauses.push(cl); cl = [];
      }
    });
    if (cl.length) clauses.push(cl);
    for (const c of clauses) {
      let i = 0;
      while (i < c.length) {
        const rem = c.length - i;
        const sz = rem <= 3 ? rem : (rem === 4 ? 2 : 3);
        const sl = c.slice(i, i + sz);
        groups.push({ inicio: sl[0].inicio, fim: sl[sl.length - 1].fim, palavras: sl });
        i += sz;
      }
    }
  }
  captionGroups = groups;
}

function drawCaptions(t){
  let grp = null;
  for (const c of captionGroups) {
    if (t >= c.inicio - 0.04 && t <= c.fim + 0.14) { grp = c; break; }
  }
  if (!grp || !grp.palavras || !grp.palavras.length) return;

  const words = grp.palavras.map(p => ({
    txt: String(p.palavra || '').toUpperCase(),
    key: normWord(String(p.palavra || '')),
    inicio: Number(p.inicio),
    fim: Number(p.fim ?? (Number(p.inicio) + Number(p.duracao || 0.25)))
  }));
  let active = 0;
  for (let i = 0; i < words.length; i++) if (t >= words[i].inicio - 0.02) active = i;

  g.save();
  let fs = 78;
  g.font = `900 ${fs}px ${COND}`;
  g.textBaseline = 'middle';
  g.textAlign = 'center';
  let sp = Math.max(24, Math.round(fs * 0.34));
  let wds = words.map(w => g.measureText(w.txt).width);
  let tw = wds.reduce((a,b) => a + b, 0) + sp * (words.length - 1);
  if (tw > 920) {
    fs = Math.floor(fs * 920 / tw);
    g.font = `900 ${fs}px ${COND}`;
    sp = Math.max(18, Math.round(fs * 0.34));
    wds = words.map(w => g.measureText(w.txt).width);
    tw = wds.reduce((a,b) => a + b, 0) + sp * (words.length - 1);
  }

  let x = 540 - tw / 2;
  const y = 1485;
  g.lineJoin = 'round';
  g.miterLimit = 2;

  words.forEach((w, i) => {
    const cx = x + wds[i] / 2;
    const isAct = i === active;
    const isRed = RED_WORDS.has(w.key);
    const fill = isAct ? (isRed ? PAL.alert : PAL.yellow) : '#ffffff';

    g.save();
    g.translate(cx, y);
    if (isAct) g.scale(1.06, 1.06);
    g.shadowColor = 'rgba(0,0,0,.85)';
    g.shadowBlur = 14;
    g.shadowOffsetY = 5;
    g.strokeStyle = '#000000';
    g.lineWidth = Math.max(11, Math.round(fs * 0.20));
    g.strokeText(w.txt, 0, 0);
    g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.fillStyle = fill;
    g.fillText(w.txt, 0, 0);
    g.restore();

    x += wds[i] + sp;
  });
  g.restore();
}

let ccOn = false;
function renderAt(t){
  t = clamp(+t || 0, 0, duration);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.filter = 'none';
  g.shadowBlur = 0;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);

  /* Corte seco para preto nos ultimos 0.35s */
  if (t >= duration - 0.35) return;

  const sc = pickScene(t);
  const cam = sc.cam;
  const [hx, hy] = hand(t, sc.id === 14 ? 0 : 1);

  g.save();
  g.translate(W/2 + (cam.sx || 0) + hx, H/2 + (cam.sy || 0) + hy);
  g.scale(cam.z, cam.z);
  g.translate(-cam.cx, -cam.cy);
  sc.draw(t);
  g.restore();

  drawClock(t);
  finish(t, sc.vig || .65);

  /* Micro-fade de 0.08s nas trocas bruscas de cena */
  if (sc.cutAt > 0 && t - sc.cutAt < 0.08) {
    const f = 1 - (t - sc.cutAt) / 0.08;
    g.fillStyle = `rgba(0,0,0,${f * 0.55})`;
    g.fillRect(0, 0, W, H);
  }

  if (ccOn) drawCaptions(t);
}
window.renderAt = renderAt;
window.getDuration = () => duration;

/* Controles do player */
const $ = id => document.getElementById(id);
const btn = $('play'), seek = $('seek'), out = $('time'), cc = $('cc'), status = $('status');
let playing = false, cur = 0, t0 = 0, p0 = 0;
const fmt = v => v.toFixed(1).replace('.', ',');

function ui(){
  seek.value = cur;
  out.textContent = `${fmt(cur)} / ${fmt(duration)}`;
  seek.setAttribute('aria-valuetext', `${fmt(cur)} de ${fmt(duration)} segundos`);
  $('playLbl').textContent = playing ? 'Pausar' : 'Play';
  $('playIcon').setAttribute('d', playing ? 'M3 2h4v12H3zM9 2h4v12H9z' : 'M4 2l10 6-10 6z');
}
function tick(){
  if (!playing) return;
  cur = Math.min(t0 + (performance.now() - p0) / 1000, duration);
  if (audio && cur < audio.duration && Math.abs(audio.currentTime - cur) > 0.2) audio.currentTime = cur;
  renderAt(cur); ui();
  if (cur >= duration) pause(); else requestAnimationFrame(tick);
}
function play(){
  if (cur >= duration) cur = 0;
  playing = true; t0 = cur; p0 = performance.now();
  if (audio) { audio.currentTime = cur; audio.play().catch(() => {}); }
  ui(); requestAnimationFrame(tick);
}
function pause(){ playing = false; if (audio) audio.pause(); ui(); }
btn.addEventListener('click', () => playing ? pause() : play());
seek.addEventListener('input', () => {
  cur = +seek.value; t0 = cur; p0 = performance.now();
  if (audio && cur < audio.duration) audio.currentTime = cur;
  renderAt(cur); ui();
});
cc.addEventListener('click', () => {
  ccOn = !ccOn; cc.setAttribute('aria-pressed', String(ccOn)); renderAt(cur);
});

async function fetchJson(url){
  if (location.protocol === 'file:') return null;
  try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return null;
}
function probeAudio(src){
  return new Promise(res => {
    const el = new Audio(); let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    el.preload = 'auto';
    el.addEventListener('loadedmetadata', () => fin(el), { once: true });
    el.addEventListener('error', () => fin(null), { once: true });
    setTimeout(() => fin(null), 3500);
    el.src = src;
  });
}

async function load(){
  const [evData, tsData] = await Promise.all([
    fetchJson('audio/eventos.json'),
    fetchJson('audio/timestamps.json')
  ]);
  let a = await probeAudio('audio/mix_final.mp3');
  let audioSrc = 'audio/mix_final.mp3';
  if (!a) { a = await probeAudio('audio/narracao.mp3'); audioSrc = 'audio/narracao.mp3'; }

  if (a && isFinite(a.duration)) audio = a;
  normalizeEvents(evData, audio ? audio.duration : null);

  if (tsData && Array.isArray(tsData.grupos) && tsData.grupos.length) {
    captionGroups = tsData.grupos;
  } else {
    buildPreviewCaptions();
  }

  if (audio && evData) {
    status.textContent = `Audio (${audioSrc}) sincronizado com eventos.json e timestamps.json (${fmt(duration)} s).`;
  } else if (audio) {
    status.textContent = `Audio (${audioSrc}) carregado sem eventos.json (${fmt(duration)} s).`;
  } else {
    status.textContent = 'Modo Previa: sem audio, usando marcos padrao do roteiro_01 (0 a 45 s).';
  }
  seek.max = duration;
  btn.disabled = false; seek.disabled = false; btn.removeAttribute('aria-busy');
  renderAt(cur); ui();
}

normalizeEvents(null, null);
buildPreviewCaptions();
renderAt(0); ui(); load();
})();
</script>
</body>
