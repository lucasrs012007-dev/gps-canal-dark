<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fabrica V2 Player</title>
<style>
  @font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Luckiest Guy"; src: url("fonts/LuckiestGuy-Regular.ttf") format("truetype"); font-display: block; }
  html, body { margin: 0; padding: 0; background: #0B0F19; overflow: hidden; }
  canvas { display: block; width: 1080px; height: 1920px; }
  #status { position: fixed; left: -9999px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="status">carregando</div>
<script src="character.js"></script>
<script src="hud.js"></script>
<script>
/*
 * player.html : player deterministico. Contrato para captura headless:
 *   window.READY (Promise), window.__ready (bool), window.renderAt(t), window.getDuration(),
 *   window.getVisualEvents() (auditoria de ritmo), window.getSceneAt(t).
 * Nada depende de relogio: cada quadro e funcao pura de t.
 */
(function () {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const F = 1 / 30;
  let TS = null, S = null, ORDER = [], RANGES = {}, KEYS = {}, CHUNKS = [], DUR = 40;

  const norm = s => String(s).normalize('NFC').toLocaleLowerCase('pt-BR');

  function buildContext(ts) {
    const segs = {};
    ts.segmentos.forEach(s => { segs[s.id] = s; });
    ORDER = ts.segmentos.map(s => s.id).filter(id => window.SCENES[id]);
    const missing = ts.segmentos.map(s => s.id).filter(id => !window.SCENES[id]);
    if (missing.length) throw new Error('Segmentos sem cena: ' + missing.join(', '));
    const drop = (ts.sfx || []).find(x => x.tipo === 'drop' && x.seg === 'twist_b');
    ORDER.forEach((id, i) => {
      let st = i === 0 ? 0 : segs[id].t0 - 0.1;
      if (id === 'twist_b' && drop) st = drop.t; // corte seco no impacto do payoff
      RANGES[id] = { start: st };
    });
    ORDER.forEach((id, i) => { RANGES[id].end = i + 1 < ORDER.length ? RANGES[ORDER[i + 1]].start : ts.duracao; });

    const words = ts.palavras;
    S = {
      ts,
      seg: id => segs[id],
      start: id => RANGES[id].start,
      end: id => RANGES[id].end,
      w(seg, txt, n) {
        n = n || 0;
        const a = norm(txt);
        const list = words.filter(p => p.seg === seg);
        let hitsExact = list.filter(p => norm(p.texto) === a);
        if (!hitsExact.length) hitsExact = list.filter(p => norm(p.texto).startsWith(a + ' '));
        if (!hitsExact[n]) throw new Error(`Palavra "${txt}"[${n}] nao encontrada em ${seg}`);
        return hitsExact[n];
      },
      c(seg, txt, n) { return this.w(seg, txt, n).t0 - 2 * F; } // 2 quadros antes da palavra
    };
    ORDER.forEach(id => {
      const sc = window.SCENES[id];
      KEYS[id] = sc.keys(S).slice().sort((a, b) => a.t - b.t);
    });
    CHUNKS = window.HUD.buildChunks(words, 3, 16);
    DUR = ts.duracao;
  }

  function sceneAt(t) {
    for (let i = ORDER.length - 1; i >= 0; i--) if (t >= RANGES[ORDER[i]].start) return ORDER[i];
    return ORDER[0];
  }

  function vignette() {
    const g = ctx.createRadialGradient(540, 960, 620, 540, 960, 1250);
    g.addColorStop(0, 'rgba(5,8,20,0)'); g.addColorStop(1, 'rgba(5,8,20,0.42)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
  }

  function renderAt(t) {
    t = Math.max(0, Math.min(DUR - 1e-4, t));
    const id = sceneAt(t);
    const sc = window.SCENES[id];
    const st = window.Beto.track(KEYS[id], t);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0B0F19'; ctx.fillRect(0, 0, 1080, 1920);
    ctx.save(); sc.draw(ctx, t, S, st); ctx.restore();
    vignette();
    // flash de impacto no corte entre capitulos (decai em 4 quadros)
    const since = t - RANGES[id].start;
    if (RANGES[id].start > 0 && since < 0.13) {
      ctx.globalAlpha = (id === 'twist_b' ? 0.6 : 0.3) * (1 - since / 0.13);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, 1080, 1920); ctx.globalAlpha = 1;
    }
    const h = sc.hud(S, t) || {};
    if (h.ruler) window.HUD.drawRuler(ctx, { meters: h.ruler.meters, alert: h.ruler.alert, alpha: 1 });
    if (typeof h.customHud === 'function') h.customHud(ctx, t);
    if (h.bar) window.HUD.drawTopBar(ctx, Object.assign({ t }, h.bar));
    if (h.alert) window.HUD.drawAlert(ctx, { t, t0: h.alert.t0, text: h.alert.text, y: 312 });
    window.HUD.drawCaptions(ctx, CHUNKS, t, { y: 1440, size: 92, maxW: 880 });
    ctx.restore();
  }

  function getVisualEvents() {
    const ev = [];
    ORDER.forEach(id => {
      ev.push(RANGES[id].start);
      KEYS[id].forEach(k => ev.push(k.t));
      (window.SCENES[id].ev ? window.SCENES[id].ev(S) : []).forEach(x => ev.push(x));
    });
    CHUNKS.forEach(c => ev.push(c.t0));
    return ev.filter(x => x >= 0 && x <= DUR).sort((a, b) => a - b);
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Falha ao carregar script: ' + src));
      document.head.appendChild(s);
    });
  }

  window.READY = (async () => {
    const params = new URLSearchParams(window.location.search);
    const epBase = (params.get('ep') || '/ep').replace(/\/+$/, '');
    await loadScript(`${epBase}/scenes.js`);
    const r = await fetch(`${epBase}/timestamps.json`, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status} ao carregar ${epBase}/timestamps.json`);
    TS = await r.json();
    if (TS.titulo) document.title = TS.titulo;
    await Promise.all([
      document.fonts.load('92px "Luckiest Guy"', 'VOCÊ ÁÉÍÓÚÃÕÇ?!'),
      document.fonts.load('76px "Anton"', 'DIA 0123456789 VELOCIDADE ALTURA FÓRMULA ÊÇ')
    ]);
    await document.fonts.ready;
    if (!document.fonts.check('92px "Luckiest Guy"') || !document.fonts.check('76px "Anton"')) throw new Error('Fontes nao carregaram');
    buildContext(TS);
    renderAt(0);
    window.__ready = true;
    document.getElementById('status').textContent = `pronto: ${ORDER.length} cenas, ${DUR.toFixed(2)}s`;
    return true;
  })().catch(e => { window.__erro = String(e && e.stack || e); document.getElementById('status').textContent = 'erro: ' + e; throw e; });

  window.renderAt = renderAt;
  window.getDuration = () => DUR;
  window.getVisualEvents = getVisualEvents;
  window.getSceneAt = sceneAt;
  window.getRanges = () => RANGES;
})();
</script>
</body>
</html>
