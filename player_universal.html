*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}
.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-2)}
.stage{width:min(100%,calc((100dvh - var(--chrome-h)) * 9 / 16));aspect-ratio:9/16}
canvas{display:block;width:100%;height:100%;border-radius:var(--radius-card);background:var(--surface-sunken)}
.controls{width:100%;max-width:calc(var(--target-min) * 12);display:flex;align-items:center;gap:var(--space-2)}
.btn{min-height:var(--target-min);min-width:var(--target-min);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);
  padding:0 var(--space-3);border:var(--border-width) solid var(--border-default);border-radius:var(--radius-button);
  background:var(--action-secondary);color:var(--text-primary);font:var(--weight-medium) var(--font-size-sm)/1 var(--font-sans);cursor:pointer;

.btn:active{transform:translateY(var(--press-offset))}

.seek{flex:1;min-width:0;min-height:var(--target-min);accent-color:var(--action-primary);cursor:pointer}

/* Utilidades deterministicas */
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const prog = (t, a, b) => clamp((t - a) / Math.max(0.001, b - a));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (t, seed=0) => {
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57), hash(i + 1 + seed * 57), u) * 2 - 1;
};
const validHex = (h, fb) => (typeof h === 'string' && /^#[0-9A-Fa-f]{6}$/.test(h.trim()) ? h.trim() : fb);
const hexRgb = h => {
  const clean = validHex(h, '#FFFFFF');
  const n = parseInt(clean.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgba = (hex, a) => {
  const [r, gr, b] = hexRgb(hex);
  return `rgba(${r},${gr},${b},${a})`;
};
function mixHex(h1, h2, k){
  k = clamp(k);
  const a = hexRgb(h1), b = hexRgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
}
function mulberry(a){
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(x, y, w, h, r){
  const rad = Math.min(r, Math.max(0, w / 2), Math.max(0, h / 2));
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function circ(x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ell(x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function glow(x, y, r, col, a){
  if (a <= 0.002) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a));
  gr.addColorStop(1, rgba(col, 0));
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}
function vgrad(c1, c2, y0=-320, y1=H+320){
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, c1);
  gr.addColorStop(1, c2);
  g.fillStyle = gr;
  g.fillRect(-420, y0, W + 840, y1 - y0);
}
function popScale(age, dur=0.11){
  if (age <= 0) return 0.68;
  const k = clamp(age / dur);
  if (k < 0.62) return lerp(0.68, 1.10, easeOut(k / 0.62));
  return lerp(1.10, 1.0, ease((k - 0.62) / 0.38));
}

function drawFittedText(text, x, y, maxW, maxFs, family, weight='900', align='center'){
  const txt = String(text ?? '');
  let fs = maxFs;
  g.font = `${weight} ${fs}px ${family}`;
  const w = g.measureText(txt).width;
  if (w > maxW && w > 0) {
    fs = Math.max(16, Math.floor(maxFs * (maxW / w)));
    g.font = `${weight} ${fs}px ${family}`;
  }
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(txt, x, y);
  return fs;
}

function drawWrappedText(text, x, y, maxW, maxLines, fs, lineH, family, weight='700', align='left'){
  const words = String(text ?? '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return;
  g.font = `${weight} ${fs}px ${family}`;
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? `${line} ${w}` : w;
    if (g.measureText(test).width <= maxW || !line) {
      line = test;
    } else {
      lines.push(line);
      line = w;
      if (lines.length >= maxLines - 1) {
        const restIdx = words.indexOf(w);
        line = words.slice(restIdx).join(' ');
        break;
      }
    }
  }
  if (line) lines.push(line);
  const clamped = lines.slice(0, maxLines);
  for (let i = 0; i < clamped.length; i++) {
    drawFittedText(clamped[i], x, y + i * lineH, maxW, fs, family, weight, align);
  }
}

/* ============================================================

const DOF_SCALE = 0.125;
const DOF_PAD = 4;
const dofCv = document.createElement('canvas');
dofCv.width = Math.round(W * DOF_SCALE) + DOF_PAD * 2;
dofCv.height = Math.round(H * DOF_SCALE) + DOF_PAD * 2;
const dofCtx = dofCv.getContext('2d');

const dofBlurCv = document.createElement('canvas');
dofBlurCv.width = dofCv.width;
dofBlurCv.height = dofCv.height;
const dofBlurCtx = dofBlurCv.getContext('2d');

function withBlur(px, fn){
  const m = main.getTransform();
  dofCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofCtx.globalAlpha = 1;
  dofCtx.globalCompositeOperation = 'source-over';
  dofCtx.filter = 'none';
  dofCtx.fillStyle = PAL.bgNavy;
  dofCtx.fillRect(0, 0, dofCv.width, dofCv.height);
  dofCtx.translate(DOF_PAD, DOF_PAD);
  dofCtx.scale(DOF_SCALE, DOF_SCALE);
  dofCtx.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g = dofCtx;
  fn();
  g = main;

  const r = Math.max(1.2, px * DOF_SCALE * 1.45);
  dofBlurCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofBlurCtx.clearRect(0, 0, dofBlurCv.width, dofBlurCv.height);
  dofBlurCtx.filter = `blur(${r.toFixed(2)}px)`;
  dofBlurCtx.drawImage(dofCv, 0, 0);
  dofBlurCtx.filter = 'none';

  main.save();
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.imageSmoothingEnabled = true;
  main.imageSmoothingQuality = 'high';
  const padOut = DOF_PAD / DOF_SCALE;
  main.drawImage(dofBlurCv, -padOut, -padOut, W + padOut * 2, H + padOut * 2);
  main.restore();
}

function normWord(w){
  return String(w || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/gi, '').toLowerCase();

function preserveWordCase(orig, target){
  if (orig === orig.toLocaleUpperCase('pt-BR') && orig !== orig.toLocaleLowerCase('pt-BR')) {
    return target.toLocaleUpperCase('pt-BR');
  }
  if (orig[0] === orig[0].toLocaleUpperCase('pt-BR') && orig.slice(1) === orig.slice(1).toLocaleLowerCase('pt-BR')) {
    return target[0].toLocaleUpperCase('pt-BR') + target.slice(1);
  }
  return target;
}

function restorePtAccents(str){
  const raw = String(str ?? '').normalize('NFC');
  if (!raw) return '';
  return raw.replace(/[A-Za-zÀ-ÿ]+/g, word => {
    const low = word.toLocaleLowerCase('pt-BR');
    let fixed = PT_ACCENT_MAP[low];
    if (!fixed) {
      if (low.endsWith('çao') && low.length > 3) fixed = low.slice(0, -3) + 'ção';
      else if (low.endsWith('çoes') && low.length > 4) fixed = low.slice(0, -4) + 'ções';
    }
    return fixed ? preserveWordCase(word, fixed) : word;
  });
}

function toPtUpper(str){
  return restorePtAccents(str).toLocaleUpperCase('pt-BR');
}

function cameraPreset(camName, modulo, subIdx){
  const isDev = DEVICE_SCENES.has(modulo);
  const zMax = isDev ? 1.12 : 1.18;
  const zMin = isDev ? 1.00 : 1.01;
  const presets = {
    push_in:     [[zMin, 540, 960], [zMax, 540, 946]],
    pull_out:    [[zMax, 540, 948], [zMin, 540, 960]],
    pan_left:    [[1.06, 566, 956], [1.10, 514, 956]],
    pan_right:   [[1.06, 514, 956], [1.10, 566, 956]],
    tight_close: [[1.05, 540, 940], [zMax, 540, 916]],
    wide_still:  [[1.00, 540, 960], [1.05, 540, 954]]
  };
  const base = presets[camName] || presets.push_in;
  if (subIdx % 2 === 1) {
    /* Sub-corte alternado mantem dinamismo visual a cada 1.0s-1.8s */
    const dx = isDev ? 10 : 22;
    return [
      [clamp(base[0][0] + 0.03, 1.0, zMax), base[0][1] + (subIdx % 4 === 1 ? -dx : dx), base[0][2] - 8],
      [clamp(base[1][0] + 0.02, 1.0, zMax), base[1][1] + (subIdx % 4 === 1 ? dx : -dx), base[1][2] - 14]
    ];
  }
  return [base[0].slice(), base[1].slice()];
}

/* Subdivide automaticamente qualquer cena acima de 1.65s para manter cortes dinamicos <= 1.80s */
function splitShots(rawList, maxDur=1.65){
  const out = [];
  for (const s of rawList) {
    const span = s.end - s.start;
    if (span <= 0.02) continue;
    const n = Math.max(1, Math.ceil(span / maxDur));
    for (let i = 0; i < n; i++) {
      const a = i / n, b = (i + 1) / n;
      const [c0, c1] = cameraPreset(s.camera, s.modulo, i);
      out.push({
        id: out.length + 1,
        cenaId: s.id,
        modulo: s.modulo,
        scene: s.modulo,
        mood: s.mood,
        expressao: s.expressao,
        vig: s.vig,
        props: s.props || {},
        subIdx: i,
        subTotal: n,
        start: Number(lerp(s.start, s.end, a).toFixed(3)),
        end: Number(lerp(s.start, s.end, b).toFixed(3)),
        dur: Number(((s.end - s.start) / n).toFixed(3)),
        cam0: c0,
        cam1: c1
      });
    }
  }
  return out;
}

function buildShotsFromConfig(cfg, ev, dur){
  const lista = Array.isArray(cfg.cenas) && cfg.cenas.length ? cfg.cenas : CENAS_PREVIEW.cenas;
  const n = lista.length;
  const ctaA = Number(ev.cta_meio_inicio);
  const ctaB = Number(ev.cta_meio_fim);
  const temCta = isFinite(ctaA) && isFinite(ctaB) && ctaB > ctaA;
  const cP2 = Number(ev.corte_parte_2);
  const temP2 = isFinite(cP2) && cP2 > 0;

  const inicios = lista.map((c, i) => {
    const key = c.evento_inicio || c.id || `cena_${String(i + 1).padStart(2, '0')}`;
    const v = ev[key];
    if (typeof v === 'number' && isFinite(v)) return clamp(v, 0, Math.max(0.1, dur - 0.2));
    return (i / n) * dur;
  });

  /* Garante ordem monotona crescente sem colisoes */
  inicios[0] = 0;
  for (let i = 1; i < n; i++) {
    if (inicios[i] <= inicios[i - 1] + 0.25) {
      inicios[i] = Math.min(dur - 0.15 * (n - i), inicios[i - 1] + Math.max(0.5, (dur - inicios[i - 1]) / (n - i + 1)));
    }
  }

  const raw = [];
  for (let i = 0; i < n; i++) {
    const c = lista[i];
    const st = inicios[i];
    const en = (i < n - 1) ? inicios[i + 1] : dur;
    /* Se a cena cruza a janela da CTA ou corte_parte_2, fatia nas barreiras exatas */
    const cortes = [st];
    if (temCta && ctaA > st + 0.05 && ctaA < en - 0.05) cortes.push(ctaA);
    if (temCta && ctaB > st + 0.05 && ctaB < en - 0.05) cortes.push(ctaB);
    if (temP2 && cP2 > st + 0.05 && cP2 < en - 0.05) cortes.push(cP2);
    cortes.push(en);
    cortes.sort((a, b) => a - b);

    for (let k = 0; k < cortes.length - 1; k++) {
      const a = cortes[k], b = cortes[k + 1];
      if (b - a < 0.04) continue;
      if (temCta && a >= ctaA - 0.02 && b <= ctaB + 0.02) continue;
      raw.push({
        id: c.id || `cena_${String(i + 1).padStart(2, '0')}`,
        modulo: c.modulo || 'quarto_noturno',
        mood: c.mood || 'navy',
        expressao: c.expressao || 'neutral',
        camera: c.camera || 'push_in',
        vig: typeof c.vig === 'number' ? c.vig : 0.60,
        props: c.props || {},
        start: a,
        end: b
      });
    }
  }
  return splitShots(raw, 1.65);
}

function buildKatanaHitsFromConfig(cfg, ev, dur){
  const list = Array.isArray(cfg.katana_hits) ? cfg.katana_hits : [];
  const ctaA = Number(ev.cta_meio_inicio);
  const ctaB = Number(ev.cta_meio_fim);
  const temCta = isFinite(ctaA) && isFinite(ctaB);
  const tilts = [-0.048, 0.044, -0.042, 0.050, -0.038];
  const out = [];

  for (let i = 0; i < list.length; i++) {
    const h = list[i];
    const key = h.evento || h.id || `hit_${String(i + 1).padStart(2, '0')}`;
    let start = (typeof ev[key] === 'number' && isFinite(ev[key]))
      ? Number(ev[key]) - 0.02
      : ((i + 1) / (list.length + 1)) * dur;
    start = clamp(start, 0.4, Math.max(0.5, dur - 0.45));

    const hitDur = clamp(Number(h.duracao) || 0.42, 0.30, 0.50);
    if (temCta && start < ctaB + 0.15 && (start + hitDur) > ctaA - 0.15) {
      start = Math.min(dur - hitDur - 0.1, ctaB + 0.25);
    }
    const linhas = Array.isArray(h.linhas) && h.linhas.length
      ? h.linhas.map(s => toPtUpper(String(s))).slice(0, 2)
      : ['CHOQUE'];
    out.push({
      id: h.id || `hit_${String(i + 1).padStart(2, '0')}`,
      start: Number(start.toFixed(3)),
      end: Number(Math.min(dur - 0.05, start + hitDur).toFixed(3)),
      dur: hitDur,
      lines: linhas,
      accentIdx: linhas.length > 1 ? 1 : 0,
      color: h.cor || 'red',
      tilt: tilts[i % tilts.length],
      punch: 0.15,
      shake: 24
    });
  }
  return out.sort((a, b) => a.start - b.start);
}

function katanaStateAt(t){
  if (isFullScreenCtaActive(t)) return null;
  for (let i = 0; i < KATANA_HITS.length; i++) {
    const h = KATANA_HITS[i];
    if (t >= h.start && t < h.end) return { hit: h, dt: t - h.start, p: clamp((t - h.start) / h.dur) };
  }
  return null;
}

function drawKatanaOverlay(t){
  const st = katanaStateAt(t);
  if (!st) return false;
  const { hit, dt } = st;
  const frame = Math.floor(dt * 30);

  let bgCol = '#06070B', slashCol = PAL.alertKatana, mainTextCol = '#FFFFFF', accentTextCol = PAL.yellow, strokeCol = '#000000';
  if (hit.color === 'yellow') {
    slashCol = '#111827';
    mainTextCol = PAL.yellow;
    accentTextCol = '#FFFFFF';
  }
  if (frame === 0) {
    bgCol = '#FFFFFF'; slashCol = '#06070B'; mainTextCol = '#FFFFFF'; accentTextCol = PAL.alertKatana; strokeCol = 'transparent';
  } else if (frame === 1) {
    bgCol = '#050609'; slashCol = PAL.alertKatana; mainTextCol = '#FFFFFF'; accentTextCol = PAL.yellow;
  } else if (frame === 2) {
    bgCol = PAL.alertKatana; slashCol = '#06070B'; mainTextCol = '#FFFFFF'; accentTextCol = PAL.yellow;
  } else if (frame === 3) {
    bgCol = '#06070B'; slashCol = '#FFFFFF'; mainTextCol = '#06070B'; accentTextCol = PAL.alertKatana; strokeCol = 'transparent';
  }

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = bgCol;
  g.fillRect(0, 0, W, H);

  /* Linhas de velocidade radiais */
  g.save();
  g.translate(540, 960);
  g.strokeStyle = frame === 0 ? 'rgba(6,7,11,0.22)' : 'rgba(255,255,255,0.16)';
  const rayCount = 26;
  for (let i = 0; i < rayCount; i++) {
    const ang = (i / rayCount) * Math.PI * 2 + hit.tilt * 2.2;
    const r0 = 260 + hash(i * 19 + frame) * 140;
    const r1 = 1120;
    g.lineWidth = 3 + (i % 3) * 2.5;
    g.beginPath();
    g.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
    g.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
    g.stroke();
  }
  g.restore();

  /* Faixa diagonal Katana */
  g.save();
  g.translate(540, 955);
  g.rotate(hit.tilt);
  const slashW = lerp(1750, 1460, easeOut(clamp(dt / 0.14)));
  const slashH = hit.lines.length > 1 ? 520 : 350;
  g.fillStyle = slashCol;
  g.fillRect(-slashW / 2, -slashH / 2, slashW, slashH);
  g.fillStyle = frame === 0 ? PAL.alertKatana : '#FFFFFF';
  g.fillRect(-slashW / 2, -slashH / 2 - 14, slashW, 8);
  g.fillRect(-slashW / 2, slashH / 2 + 6, slashW, 8);
  g.restore();

  let scaleX = 1, scaleY = 1;
  if (dt < 0.11) {
    const k = easeOut(dt / 0.11);
    scaleX = lerp(1.58, 1.00, k);
    scaleY = lerp(0.56, 1.12, k);
  } else {
    const d = dt - 0.11;
    const osc = Math.exp(-15 * d) * Math.cos(40 * d);
    scaleX = 1.0 + 0.11 * osc;
    scaleY = 1.0 - 0.08 * osc;
  }

  const jitterX = Math.sin(dt * 120) * (frame <= 3 ? 14 : 5) * Math.exp(-dt * 6);
  const jitterY = Math.cos(dt * 105) * (frame <= 3 ? 10 : 4) * Math.exp(-dt * 6);

  g.translate(540 + jitterX, 955 + jitterY);
  g.rotate(hit.tilt);
  g.scale(scaleX, scaleY);

  const lines = hit.lines;
  const maxW = 920;
  const maxFs = lines.length === 1 ? 268 : 196;
  const stepY = lines.length === 1 ? 0 : 188;
  const startY = lines.length === 1 ? 0 : -stepY * 0.5;

  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.miterLimit = 2;

  for (let i = 0; i < lines.length; i++) {
    const txt = lines[i];
    let fs = maxFs;
    g.font = `900 ${fs}px ${COND}`;
    const mw = g.measureText(txt).width;
    if (mw > maxW && mw > 0) {
      fs = Math.max(48, Math.floor(maxFs * (maxW / mw)));
      g.font = `900 ${fs}px ${COND}`;
    }
    const ly = startY + i * stepY;
    const col = (i === hit.accentIdx) ? accentTextCol : mainTextCol;
    if (frame >= 4) {
      g.fillStyle = 'rgba(0,0,0,0.82)';
      g.fillText(txt, 10, ly + 12);
    }
    if (strokeCol !== 'transparent') {
      g.strokeStyle = strokeCol;
      g.lineWidth = Math.max(14, Math.round(fs * 0.10));
      g.strokeText(txt, 0, ly);
    }
    g.fillStyle = col;
    g.fillText(txt, 0, ly);
  }
  g.restore();
  return true;
}

/* ============================================================
   CTA DEDICADA EM TELA CHEIA NO MEIO (100% DA TELA)
   ============================================================ */
function isFullScreenCtaActive(t){
  const a = Number(EV.cta_meio_inicio);
  const b = Number(EV.cta_meio_fim);
  return isFinite(a) && isFinite(b) && b > a && t >= a && t < b;
}

function drawFullScreenCta(t){
  if (!isFullScreenCtaActive(t)) return false;
  const a = Number(EV.cta_meio_inicio);
  const b = Number(EV.cta_meio_fim);
  const span = Math.max(0.5, b - a);
  const dt = t - a;
  const rem = b - t;
  const pct = clamp(dt / span);
  const ctaCfg = CENAS.cta || CENAS_PREVIEW.cta;

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);

  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#070B16');
  bg.addColorStop(0.52, '#0B1224');
  bg.addColorStop(1, '#04060D');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  g.strokeStyle = 'rgba(255, 212, 0, 0.05)';
  g.lineWidth = 2;
  for (let x = 90; x < W; x += 90) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 120; y < H; y += 120) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  glow(540, 880, 620, PAL.yellow, 0.14 + 0.05 * Math.sin(t * 7.0));
  glow(540, 1220, 480, PAL.alert, 0.09);

  g.fillStyle = 'rgba(255, 212, 0, 0.12)';
  g.fillRect(0, 0, W, 14);
  g.fillRect(0, H - 14, W, 14);
  /* Scanlines sempre atras do cartao para manter a pilula amarela limpa */
  g.drawImage(scanCv, 0, 0);

  let gx = 0, gy = 0;
  const inGlitch = dt < 0.14;
  const outGlitch = rem < 0.11;
  if (inGlitch) {
    const f = Math.floor(dt * 30);
    gx = (f % 2 === 0 ? 1 : -1) * (1 - dt / 0.14) * 28;
    gy = (f % 3 === 0 ? -1 : 1) * (1 - dt / 0.14) * 10;
  } else if (outGlitch) {
    const f = Math.floor(rem * 30);
    gx = (f % 2 === 0 ? -1 : 1) * (1 - rem / 0.11) * 24;
  }
  if (dt < 0.036) {
    g.fillStyle = 'rgba(255, 255, 255, 0.88)';
    g.fillRect(0, 0, W, H);
  }
  g.translate(gx, gy);

  const bx = 64, by = 520, bw = W - 128, bh = 860;
  g.fillStyle = 'rgba(8, 12, 24, 0.94)';
  rr(bx, by, bw, bh, 38); g.fill();
  g.strokeStyle = 'rgba(255, 212, 0, 0.48)';
  g.lineWidth = 3;
  rr(bx, by, bw, bh, 38); g.stroke();

  g.fillStyle = PAL.yellow;
  drawFittedText(ctaCfg.eyebrow || 'PAUSA RÁPIDA NA HISTÓRIA', 540, by + 84, bw - 140, 28, MONO, '800', 'center');
  g.fillStyle = 'rgba(245, 247, 251, 0.14)';
  g.fillRect(540 - 160, by + 124, 320, 3);

  const titlePop = popScale(dt - 0.02, 0.14);
  g.save();
  g.translate(540, by + 270);
  g.scale(titlePop, titlePop);
  g.fillStyle = PAL.white;
  drawFittedText(ctaCfg.titulo_linha_1 || 'QUER FAZER VÍDEOS ASSIM', 0, -54, bw - 112, 74, COND, '900', 'center');
  g.fillStyle = PAL.yellow;
  drawFittedText(ctaCfg.titulo_linha_2 || 'NO AUTOMÁTICO?', 0, 48, bw - 112, 86, COND, '900', 'center');
  g.restore();

  const falaA = Number(EV.cta_fala_inicio || (a + 0.22));
  const enfatiza = t >= (falaA + (b - falaA) * 0.56);
  const pillPulse = enfatiza ? (1.03 + 0.03 * Math.sin(t * 18.0)) : (1.0 + 0.015 * Math.sin(t * 7.5));
  const pillPop = popScale(dt - 0.08, 0.16) * pillPulse;
  const pillW = 824, pillH = 158;

  g.save();
  g.translate(540, by + 518);
  g.scale(pillPop, pillPop);
  if (inGlitch || outGlitch) {
    g.fillStyle = rgba(PAL.alert, 0.48);
    rr(-pillW / 2 - 12, -pillH / 2, pillW, pillH, pillH / 2); g.fill();
    g.fillStyle = rgba(PAL.cyan, 0.42);
    rr(-pillW / 2 + 12, -pillH / 2, pillW, pillH, pillH / 2); g.fill();
  }
  g.fillStyle = PAL.yellow;
  rr(-pillW / 2, -pillH / 2, pillW, pillH, pillH / 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.22)';
  rr(-pillW / 2 + 24, -pillH / 2 + 10, pillW - 48, 28, 14); g.fill();
  g.fillStyle = PAL.ink;
  drawFittedText(ctaCfg.botao || 'COMENTE EU QUERO', 0, 4, pillW - 136, 74, COND, '900', 'center');
  g.restore();

  const infoY = by + 678;
  g.save();
  g.translate(226, infoY);
  g.strokeStyle = PAL.yellow;
  g.lineWidth = 4;
  rr(-18, -14, 36, 26, 7); g.stroke();
  g.beginPath(); g.moveTo(-6, 12); g.lineTo(-14, 21); g.lineTo(4, 12); g.stroke();
  g.restore();

  g.fillStyle = PAL.steelBright;
  drawFittedText(ctaCfg.subtitulo || 'EU TE ENVIO TUDO NO DIRECT', 562, infoY + 2, bw - 220, 32, SANS, '700', 'center');

  const barW = bw - 160, barH = 10, barX = 540 - barW / 2, barY = by + 764;
  g.fillStyle = 'rgba(245, 247, 251, 0.14)';
  rr(barX, barY, barW, barH, 5); g.fill();
  g.fillStyle = PAL.yellow;
  rr(barX, barY, Math.max(12, barW * (1 - pct)), barH, 5); g.fill();

  g.fillStyle = PAL.dim;
  drawFittedText(ctaCfg.rodape || 'A HISTÓRIA CONTINUA EM INSTANTES', 540, barY + 42, bw - 160, 24, MONO, '700', 'center');

  if (inGlitch || outGlitch) {
    g.fillStyle = 'rgba(255,255,255,0.22)';
    for (let i = 0; i < 6; i++) {
      const sy = hash(i * 41 + Math.floor(t * 30)) * H;
      g.fillRect(0, sy, W, 6 + (i % 3) * 5);
    }
  }
  g.restore();
  return true;
}

/* ============================================================
   PARTICULAS + FUNDOS ATMOSFERICOS PULSANTES
   ============================================================ */
const PARTICLES = (() => {
  const rng = mulberry(202607);
  const arr = [];
  for (let i = 0; i < 42; i++) {
    arr.push({
      x: rng() * (W + 300) - 150,
      y: rng() * (H + 300) - 150,
      vx: (rng() - 0.48) * 24,
      vy: -(10 + rng() * 32),
      r: 2.0 + rng() * 4.8,
      layer: i < 21 ? 0 : 1,
      ph: rng() * Math.PI * 2,
      a: 0.12 + rng() * 0.24
    });
  }
  return arr;
})();

function drawParticles(t, mood){
  const colPrimary = mood === 'red' ? PAL.alert
    : (mood === 'yellow' ? PAL.yellow
      : (mood === 'cctv' ? PAL.cctvBright : PAL.cyan));
  const colAlt = mood === 'red' ? '#FF8A5B'
    : (mood === 'cctv' ? PAL.cctvPale : PAL.violet);
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < PARTICLES.length; i++) {
    const p = PARTICLES[i];
    const sp = p.layer === 1 ? 1.35 : 0.72;
    const spanW = W + 300, spanH = H + 300;
    const px = ((((p.x + p.vx * t * sp) + 150) % spanW) + spanW) % spanW - 150;
    const py = ((((p.y + p.vy * t * sp) + 150) % spanH) + spanH) % spanH - 150;
    const tw = 0.55 + 0.45 * Math.sin(t * (2.5 + p.layer * 1.3) + p.ph);
    const col = (i % 3 === 0) ? colAlt : colPrimary;
    const a = p.a * tw * (mood === 'dark' ? 0.32 : 1.0);
    g.fillStyle = rgba(col, a);
    circ(px, py, p.r);
  }
  g.restore();
}

function drawBackdrop(t, mood){
  const pulseSlow = 0.5 + 0.5 * Math.sin(t * 3.4);
  const pulseFast = 0.5 + 0.5 * Math.sin(t * 7.8);
  let top = PAL.bgNavy, bot = PAL.bgDeep, glowCol = PAL.cyan, glowA = 0.14;

  if (mood === 'cctv') {
    top = mixHex('#071418', PAL.bgNavy, pulseSlow * 0.35);
    bot = '#03080C';
    glowCol = PAL.cctvBright;
    glowA = 0.18;
  } else if (mood === 'violet') {
    top = mixHex(PAL.bgViolet, PAL.bgNavy, pulseSlow * 0.38);
    bot = PAL.bgDeep;
    glowCol = PAL.violet;
    glowA = 0.20;
  } else if (mood === 'yellow') {
    top = mixHex(PAL.bgNavy, PAL.bgYellow, 0.45 + 0.45 * pulseFast);
    bot = PAL.bgDeep;
    glowCol = PAL.yellow;
    glowA = 0.20;
  } else if (mood === 'red') {
    top = mixHex(PAL.bgViolet, PAL.bgRed, 0.55 + 0.45 * pulseFast);
    bot = mixHex(PAL.bgNavy, PAL.bgRed, 0.42 + 0.45 * pulseFast);
    glowCol = PAL.alert;
    glowA = 0.26 + 0.12 * pulseFast;
  } else if (mood === 'dark') {
    top = '#05070E';
    bot = '#020306';
    glowCol = PAL.alert;
    glowA = 0.08;
  } else {
    top = mixHex(PAL.bgNavy, '#111B33', pulseSlow * 0.35);
    bot = PAL.bgDeep;
  }

  vgrad(top, bot);
  glow(540 + Math.sin(t * 0.7) * 65, 740, 620, glowCol, glowA);
  drawParticles(t, mood);
}

/* ============================================================
   RIG FLAT EM CAPSULA UNIVERSAL (10 PONTOS IK)
   ============================================================ */
function solveIK(ax, ay, bx, by, l1, l2, bend){
  const dx = bx - ax, dy = by - ay;
  const dist = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + 0.5, l1 + l2 - 0.5);
  const a0 = Math.atan2(dy, dx);
  const cosA = clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
  const ang = a0 + bend * Math.acos(cosA);
  return [ax + Math.cos(ang) * l1, ay + Math.sin(ang) * l1];
}

function drawCapsule(ax, ay, bx, by, w, col, shadeCol){
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  g.save();
  g.translate(ax, ay);
  g.rotate(ang);
  g.fillStyle = col;
  rr(-w * 0.5, -w * 0.5, len + w, w, w * 0.5); g.fill();
  if (shadeCol) {
    g.fillStyle = shadeCol;
    rr(-w * 0.4, 0, len + w * 0.8, w * 0.48, w * 0.24); g.fill();
  }
  g.restore();
}

function drawEyes(cx, cy, r, ex, closed, lookX=0, lookY=0){
  const lift = { neutral: 0, worry: 0.06, fear: 0.11, shock: 0.14, sinister_smile: 0.05 }[ex] || 0;
  const tilt = { neutral: 0, worry: 0.11, fear: 0.10, shock: 0.06, sinister_smile: -0.10 }[ex] || 0;
  const eyePositions = [[cx - r * 0.24, 1], [cx + r * 0.24, -1]];
  g.lineCap = 'round';

  for (const [x, inner] of eyePositions) {
    const y = cy - r * 0.04;
    const browY = y - r * (0.27 + lift);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.068;
    g.beginPath();
    g.moveTo(x - inner * r * 0.15, browY + (ex === 'worry' || ex === 'fear' || ex === 'shock' ? r * 0.04 : 0));
    g.lineTo(x + inner * r * 0.15, browY - tilt * r);
    g.stroke();

    if (closed > 0.55) {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * 0.055;
      g.beginPath(); g.moveTo(x - r * 0.11, y); g.lineTo(x + r * 0.11, y); g.stroke();
      continue;
    }

    const scaleY = 1 - closed * 0.9;
    g.save();
    g.translate(x, y);
    g.scale(1, scaleY);

    if (ex === 'shock' || ex === 'fear' || ex === 'worry' || ex === 'sinister_smile') {
      const rx = ex === 'shock' ? r * 0.22 : (ex === 'sinister_smile' ? r * 0.18 : (ex === 'fear' ? r * 0.19 : r * 0.15));
      const ry = ex === 'shock' ? r * 0.25 : (ex === 'sinister_smile' ? r * 0.20 : (ex === 'fear' ? r * 0.21 : r * 0.17));
      g.fillStyle = PAL.white;
      ell(0, 0, rx, ry);
      const pr = ex === 'shock' ? r * 0.054 : (ex === 'sinister_smile' ? r * 0.058 : (ex === 'fear' ? r * 0.075 : r * 0.085));
      g.fillStyle = PAL.ink;
      circ(lookX * r * 0.06, lookY * r * 0.05, pr);
      g.fillStyle = PAL.white;
      circ(lookX * r * 0.06 - pr * 0.35, lookY * r * 0.05 - pr * 0.35, pr * 0.30);
    } else {
      g.fillStyle = PAL.white;
      ell(0, 0, r * 0.14, r * 0.15);
      g.fillStyle = PAL.ink;
      circ(lookX * r * 0.05, lookY * r * 0.04, r * 0.082);
      g.fillStyle = PAL.white;
      circ(lookX * r * 0.05 - r * 0.03, lookY * r * 0.04 - r * 0.03, r * 0.028);
    }
    g.restore();
  }
}

function drawMouth(cx, cy, r, ex, smileProg=1){
  const my = cy + r * 0.36;
  g.lineCap = 'round';
  if (ex === 'sinister_smile') {
    const sp = clamp(smileProg);
    const w = lerp(r * 0.18, r * 0.44, sp);
    const curve = lerp(r * 0.02, r * 0.24, sp);
    g.fillStyle = '#09090F';
    g.beginPath();
    g.moveTo(cx - w, my - curve * 0.35);
    g.quadraticCurveTo(cx, my + curve * 1.45, cx + w, my - curve * 0.35);
    g.quadraticCurveTo(cx, my + curve * 0.22, cx - w, my - curve * 0.35);
    g.closePath();
    g.fill();
    if (sp > 0.35) {
      g.strokeStyle = 'rgba(248, 250, 252, 0.85)';
      g.lineWidth = r * 0.042;
      g.beginPath();
      g.moveTo(cx - w * 0.72, my - curve * 0.06);
      g.quadraticCurveTo(cx, my + curve * 0.56, cx + w * 0.72, my - curve * 0.06);
      g.stroke();
    }
    return;
  }
  if (ex === 'shock') {
    g.fillStyle = '#190C0E';
    ell(cx, my + r * 0.02, r * 0.16, r * 0.21);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.042;
    g.beginPath(); g.ellipse(cx, my + r * 0.02, r * 0.16, r * 0.21, 0, 0, Math.PI * 2); g.stroke();
  } else if (ex === 'fear') {
    g.fillStyle = '#1E1114';
    ell(cx, my + r * 0.02, r * 0.14, r * 0.11);
  } else if (ex === 'worry') {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.052;
    g.beginPath();
    g.moveTo(cx - r * 0.14, my + r * 0.03);
    g.quadraticCurveTo(cx, my - r * 0.06, cx + r * 0.14, my + r * 0.03);
    g.stroke();
  } else {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.050;
    g.beginPath();
    g.moveTo(cx - r * 0.13, my);
    g.lineTo(cx + r * 0.13, my);
    g.stroke();
  }
}

function drawHeadProtagonista(cx, cy, r, ex, closed, opt={}){
  const {
    tilt = 0, rimA = 0.72, rimColor = PAL.cyan, rimAng = -0.35,
    lookX = 0, lookY = 0, isReflection = false, smileProg = 1, sweat = false
  } = opt;
  g.save();
  g.translate(cx, cy);
  g.rotate(tilt);

  g.fillStyle = isReflection ? '#C4A288' : PAL.skinShadow;
  circ(-r * 0.90, r * 0.06, r * 0.16);
  circ(r * 0.90, r * 0.06, r * 0.16);

  g.fillStyle = isReflection ? '#CFAF96' : PAL.skin;
  circ(0, 0, r);

  g.save();
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
  g.fillStyle = rgba(PAL.skinShadow, isReflection ? 0.34 : 0.24);
  circ(-r * 0.36, r * 0.18, r * 0.96);

  /* Rim light alinhado estritamente dentro do contorno da cabeca (sem vazar deslocado a direita) */
  if (rimA > 0.01) {
    const rimW = Math.max(3, r * 0.044);
    g.strokeStyle = rgba(rimColor, rimA * 0.74);
    g.lineWidth = rimW;
    g.lineCap = 'round';
    g.beginPath();
    g.arc(0, 0, r - rimW * 0.55, rimAng - 0.56, rimAng + 0.80);
    g.stroke();
  }

  g.fillStyle = PAL.hair;
  g.beginPath();
  g.arc(0, -r * 0.14, r * 1.03, Math.PI * 1.04, Math.PI * 1.96);
  g.quadraticCurveTo(r * 0.62, -r * 0.42, r * 0.15, -r * 0.56);
  g.quadraticCurveTo(-r * 0.36, -r * 0.46, -r * 0.96, -r * 0.18);
  g.closePath();
  g.fill();
  g.restore();

  g.fillStyle = PAL.hair;
  g.beginPath();
  g.ellipse(0, -r * 0.72, r * 0.80, r * 0.34, -0.05, Math.PI, Math.PI * 2);
  g.fill();
  g.beginPath();
  g.ellipse(-r * 0.30, -r * 0.64, r * 0.40, r * 0.21, -0.22, 0, Math.PI * 2);
  g.fill();

  drawEyes(0, 0, r, ex, closed, lookX, lookY);
  drawMouth(0, 0, r, ex, smileProg);

  if (sweat || ex === 'shock') {
    g.fillStyle = PAL.sweat;
    g.beginPath();
    g.moveTo(r * 0.58, -r * 0.28);
    g.quadraticCurveTo(r * 0.68, -r * 0.08, r * 0.58, -r * 0.02);
    g.quadraticCurveTo(r * 0.48, -r * 0.08, r * 0.58, -r * 0.28);
    g.fill();
  }
  g.restore();
}

function drawSneaker(fx, fy, rot=0){
  g.save();
  g.translate(fx, fy);
  g.rotate(rot);
  g.fillStyle = '#182234';
  rr(-22, -6, 50, 21, 9); g.fill();
  g.fillStyle = '#29384F';
  rr(-14, -4, 34, 8, 4); g.fill();
  g.fillStyle = '#0C121E';
  rr(-22, 10, 50, 6, 3); g.fill();
  g.restore();
}

function drawTorsoAndHead(shY, opt){
  const {
    topMain, rimColor, rimA, backView, isReflection, ex, closed,
    headTilt, lookX, lookY, smileProg
  } = opt;
  g.fillStyle = topMain;
  rr(-66, shY - 12, 132, 214, 58); g.fill();
  g.save();
  rr(-66, shY - 12, 132, 214, 58); g.clip();
  g.fillStyle = rgba(PAL.topDeep, 0.42);
  g.fillRect(-70, shY - 16, 48, 224);
  if (!backView) {
    g.fillStyle = rgba(PAL.steelLight, 0.25);
    g.fillRect(-3, shY + 12, 6, 186);
    g.fillStyle = '#0F172A';
    rr(-22, shY - 14, 44, 24, 10); g.fill();
  }
  if (rimA > 0.01) {
    g.fillStyle = rgba(rimColor, rimA * 0.34);
    rr(56, shY + 18, 10, 148, 5); g.fill();
  }
  g.restore();

  g.fillStyle = isReflection ? '#BA977E' : PAL.skinShadow;
  rr(-16, shY - 38, 32, 34, 12); g.fill();

  if (backView) {
    g.fillStyle = PAL.skinShadow;
    circ(-62, shY - 86, 12); circ(62, shY - 86, 12);
    g.fillStyle = PAL.hair;
    circ(0, shY - 94, 68);
    g.save();
    g.beginPath(); g.arc(0, shY - 94, 68, 0, Math.PI * 2); g.clip();
    g.beginPath(); g.arc(0, shY - 94, 65, -0.58, 0.72);
    g.strokeStyle = rgba(rimColor, rimA * 0.60); g.lineWidth = 4; g.stroke();
    g.restore();
  } else {
    drawHeadProtagonista(0, shY - 94, 68, ex, closed, {
      tilt: headTilt || 0, rimA, rimColor, rimAng: 0.14,
      lookX, lookY, isReflection, smileProg, sweat: ex === 'shock'
    });
  }
}

function drawProtagonista(x, footY, sc, opt={}){
  const {
    t = 0, ex = 'neutral', closed = 0, face = 1, fastBreath = false,
    pose = {}, rimColor = PAL.cyan, rimA = 0.75, lookX = 0, lookY = 0,
    isReflection = false, smileProg = 1, backView = false, localP = 0
  } = opt;

  const effEx = (pose.caindo && ex === 'sinister_smile') ? 'shock' : ex;
  const breath = Math.sin(t * (fastBreath ? 6.8 : 2.3)) * (fastBreath ? 5.0 : 2.2);
  const walk = pose.walk ? Math.sin(t * 9.0) : 0;
  const pantsA = isReflection ? '#263448' : PAL.pantsDark;
  const pantsB = isReflection ? '#2F3F57' : PAL.pants;
  const topMain = isReflection ? mixHex(PAL.top, '#0F172A', 0.25) : PAL.top;
  const topSh = isReflection ? mixHex(PAL.topShade, '#0F172A', 0.25) : PAL.topShade;

  g.save();
  g.translate(x, footY);
  g.scale(sc * face, sc);

  /* POSE ESPECIAL 1: segurando_mesa (maos presas a borda da mesa, corpo e pes flutuando sem gravidade) */
  if (pose.segurando_mesa) {
    const bob = Math.sin(t * 3.6);
    const trem = Math.sin(t * 28) * 1.6;
    const gripX = typeof opt.deskGripX === 'number' ? opt.deskGripX : -110;
    const gripY = typeof opt.deskGripY === 'number' ? opt.deskGripY : -236;
    const shX = 12 + bob * 7;
    const shY0 = -346 - bob * 14 + trem;
    const bodyTilt = -0.92 - bob * 0.09;

    if (!isReflection) {
      g.fillStyle = 'rgba(0,0,0,0.22)';
      ell(96, 6, 118, 20);
    }

    const bShX = shX - 18, bShY = shY0 + 14;
    const bHandX = gripX, bHandY = gripY;
    const bElbow = solveIK(bShX, bShY, bHandX, bHandY, 94, 94, 1);
    drawCapsule(bShX, bShY, bElbow[0], bElbow[1], 30, topSh);
    drawCapsule(bElbow[0], bElbow[1], bHandX, bHandY, 26, topSh);
    g.fillStyle = isReflection ? '#C7A68E' : PAL.skinShadow;
    circ(bHandX, bHandY, 16);

    /* Tronco, pernas flutuando para cima/direita e cabeca inclinada para a mesa */
    g.save();
    g.translate(shX, shY0);
    g.rotate(bodyTilt);
    const localHipY = 190;
    const lFootX = -26 + Math.sin(t * 4.4) * 20;
    const lFootY = 360 + Math.cos(t * 3.8) * 18;
    const rFootX = 34 + Math.cos(t * 4.0) * 22;
    const rFootY = 340 + Math.sin(t * 4.2) * 18;
    const lKnee = solveIK(-24, localHipY, lFootX, lFootY, 102, 102, 1);
    const rKnee = solveIK(24, localHipY, rFootX, rFootY, 102, 102, 1);

    drawCapsule(-24, localHipY, lKnee[0], lKnee[1], 36, pantsA);
    drawCapsule(lKnee[0], lKnee[1], lFootX, lFootY, 32, pantsA);
    drawCapsule(24, localHipY, rKnee[0], rKnee[1], 36, pantsB);
    drawCapsule(rKnee[0], rKnee[1], rFootX, rFootY, 32, pantsB);
    drawSneaker(lFootX, lFootY, 0.25);
    drawSneaker(rFootX, rFootY, -0.18);

    drawTorsoAndHead(0, {
      topMain, rimColor, rimA, backView, isReflection, ex: effEx, closed,
      headTilt: 0.48, lookX: -0.55, lookY: 0.25, smileProg
    });
    g.restore();

    const fShX = shX + 20, fShY = shY0 + 24;
    const fHandX = gripX + 28, fHandY = gripY - 2;
    const fElbow = solveIK(fShX, fShY, fHandX, fHandY, 94, 94, 1);
    drawCapsule(fShX, fShY, fElbow[0], fElbow[1], 30, topMain, rgba(PAL.topDeep, 0.25));
    drawCapsule(fElbow[0], fElbow[1], fHandX, fHandY, 26, topMain, rgba(PAL.topDeep, 0.25));
    g.fillStyle = isReflection ? '#CFAF96' : PAL.skin;
    circ(fHandX, fHandY, 17);

    g.restore();
    return;
  }

  /* POSE ESPECIAL 2 e 3: flutuando / caindo (sombra no chao + corpo suspenso ou em queda livre) */
  let liftX = 0, liftY = 0, bodyRot = 0;
  if (pose.flutuando) {
    liftX = Math.sin(t * 1.35) * 20;
    liftY = -178 - Math.sin(t * 2.05) * 30;
    bodyRot = -0.15 + Math.sin(t * 1.55) * 0.13;
    if (!isReflection) {
      g.fillStyle = 'rgba(0,0,0,0.18)';
      ell(liftX * 0.5, 6, 112, 20);
    }
  } else if (pose.caindo) {
    const dp = clamp(localP);
    const accel = dp * dp;
    liftX = Math.sin(t * 24) * 5;
    liftY = lerp(-235, -24, accel);
    bodyRot = 0.20 + Math.sin(t * 18) * 0.05;
    if (!isReflection) {
      g.fillStyle = `rgba(0,0,0,${lerp(0.16, 0.52, accel).toFixed(2)})`;
      ell(0, 6, lerp(124, 78, accel), lerp(22, 16, accel));
    }
    /* Linhas verticais de vento para velocidade de queda livre */
    g.save();
    g.strokeStyle = 'rgba(226, 232, 240, 0.28)';
    g.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const sx = -155 + i * 44 + Math.sin(i * 19) * 14;
      const sy0 = liftY - 490 + ((t * 980 + i * 95) % 440);
      g.lineWidth = 2.5 + (i % 3);
      g.beginPath(); g.moveTo(sx, sy0); g.lineTo(sx, sy0 - 78 - (i % 3) * 24); g.stroke();
    }
    g.restore();
  } else if (!isReflection) {
    g.fillStyle = 'rgba(0,0,0,0.45)';
    ell(0, 6, 84, 18);
  }

  g.save();
  if (liftX || liftY || bodyRot) {
    g.translate(liftX, liftY);
    g.translate(0, -250);
    g.rotate(bodyRot);
    g.translate(0, 250);
  }

  const hipY = -205 + breath * 0.35;
  const shY = -395 + breath;

  let lFootX = -32 + walk * 26, rFootX = 32 - walk * 26;
  let lFootY = -12 - Math.max(0, walk * 16), rFootY = -12 - Math.max(0, -walk * 16);
  let lShoeRot = 0, rShoeRot = 0;
  if (pose.flutuando) {
    lFootX = -46 + Math.sin(t * 2.5) * 20;
    lFootY = -44 + Math.cos(t * 2.2) * 18;
    rFootX = 52 + Math.cos(t * 2.3) * 18;
    rFootY = -74 + Math.sin(t * 2.6) * 18;
    lShoeRot = 0.24 + Math.sin(t * 2.4) * 0.14;
    rShoeRot = -0.22 + Math.cos(t * 2.1) * 0.14;
  } else if (pose.caindo) {
    lFootX = -58 + Math.sin(t * 20) * 10;
    lFootY = -62 + Math.cos(t * 18) * 10;
    rFootX = 58 + Math.cos(t * 19) * 10;
    rFootY = -30 + Math.sin(t * 21) * 10;
    lShoeRot = 0.36;
    rShoeRot = -0.28;
  }

  const lKnee = solveIK(-24, hipY, lFootX, lFootY, 102, 102, 1);
  const rKnee = solveIK(24, hipY, rFootX, rFootY, 102, 102, 1);

  drawCapsule(-24, hipY, lKnee[0], lKnee[1], 36, pantsA);
  drawCapsule(lKnee[0], lKnee[1], lFootX, lFootY, 32, pantsA);
  drawCapsule(24, hipY, rKnee[0], rKnee[1], 36, pantsB);
  drawCapsule(rKnee[0], rKnee[1], rFootX, rFootY, 32, pantsB);

  drawSneaker(lFootX, lFootY, lShoeRot);
  drawSneaker(rFootX, rFootY, rShoeRot);

  let bHandX = pose.reach ? 116 : (pose.phone ? 64 : -68 - walk * 18);
  let bHandY = pose.reach ? (shY + 12) : (pose.phone ? (shY + 86) : (shY + 188));
  let bBend = (pose.reach || pose.phone) ? -1 : 1;
  if (pose.flutuando) {
    bHandX = -134 + Math.sin(t * 3.0) * 16;
    bHandY = shY - 22 + Math.cos(t * 2.7) * 22;
    bBend = -1;
  } else if (pose.caindo) {
    bHandX = -118 + Math.sin(t * 24) * 12;
    bHandY = shY - 116 + Math.cos(t * 20) * 10;
    bBend = -1;
  }
  const bElbow = solveIK(-48, shY + 18, bHandX, bHandY, 92, 92, bBend);
  drawCapsule(-48, shY + 18, bElbow[0], bElbow[1], 30, topSh);
  drawCapsule(bElbow[0], bElbow[1], bHandX, bHandY, 26, topSh);
  g.fillStyle = isReflection ? '#C7A68E' : PAL.skinShadow;
  circ(bHandX, bHandY, 16);

  drawTorsoAndHead(shY, {
    topMain, rimColor, rimA, backView, isReflection, ex: effEx, closed,
    headTilt: pose.flutuando ? (Math.sin(t * 1.9) * 0.08) : (pose.caindo ? -0.08 : (pose.headTilt || 0)),
    lookX, lookY: pose.caindo ? 0.45 : (pose.flutuando ? -0.20 : lookY), smileProg
  });

  let fHandX = pose.press ? 128 : (pose.phone ? 78 : (pose.panic ? 84 + Math.sin(t * 28) * 14 : 70 + walk * 16));
  let fHandY = pose.press ? (shY + 8) : (pose.phone ? (shY + 74) : (pose.panic ? (shY - 18) : (shY + 188)));
  let fBend = (pose.press || pose.phone || pose.panic) ? 1 : -1;
  if (pose.flutuando) {
    fHandX = 136 + Math.cos(t * 2.8) * 16;
    fHandY = shY - 32 + Math.sin(t * 3.1) * 22;
    fBend = 1;
  } else if (pose.caindo) {
    fHandX = 122 + Math.cos(t * 22) * 12;
    fHandY = shY - 112 + Math.sin(t * 23) * 10;
    fBend = 1;
  }
  const fElbow = solveIK(48, shY + 20, fHandX, fHandY, 92, 92, fBend);
  drawCapsule(48, shY + 20, fElbow[0], fElbow[1], 30, topMain, rgba(PAL.topDeep, 0.25));
  drawCapsule(fElbow[0], fElbow[1], fHandX, fHandY, 26, topMain, rgba(PAL.topDeep, 0.25));
  g.fillStyle = isReflection ? '#CFAF96' : PAL.skin;
  circ(fHandX, fHandY, 17);

  if (pose.phone && !backView) {
    g.save();
    g.translate(fHandX + 12, fHandY - 12);
    g.rotate(-0.22);
    g.fillStyle = PAL.phone;
    rr(-18, -32, 36, 64, 7); g.fill();
    g.fillStyle = PAL.cyan;
    rr(-14, -26, 28, 52, 4); g.fill();
    glow(0, 0, 120, PAL.cyan, 0.36);
    g.restore();
  }
  g.restore();
  g.restore();
}

function poseObjFromName(name){
  const n = String(name || 'idle').toLowerCase().trim();
  if (n === 'walk') return { walk: 1 };
  if (n === 'phone') return { phone: 1 };
  if (n === 'panic') return { panic: 1 };
  if (n === 'press' || n === 'reach') return { press: 1, reach: 1 };
  if (n === 'flutuando' || n === 'float' || n === 'floating' || n === 'levitando') return { flutuando: 1 };
  if (n === 'segurando_mesa' || n === 'hold_desk' || n === 'segurando') return { segurando_mesa: 1 };
  if (n === 'caindo' || n === 'falling' || n === 'queda') return { caindo: 1 };
  return {};
}

/* MODULO 1: quarto_noturno (cama, janela com luar/chuva, guarda-roupa/vulto, criado-mudo) */
function drawQuartoNoturno(t, shot, f, localP){
  const props = shot.props || {};
  const isRed = shot.mood === 'red';
  drawBackdrop(t, shot.mood);

  /* Parede e piso do quarto */
  vgrad(isRed ? '#1A0B14' : '#0B1325', '#050811', 0, 1340);
  g.fillStyle = '#090D16';
  g.fillRect(-160, 1320, W + 320, 680);
  g.fillStyle = '#182235';
  g.fillRect(-160, 1312, W + 320, 14);

  /* Janela noturna a esquerda com lua fria e chuva */
  const wx = 86, wy = 320, ww = 310, wh = 470;
  g.fillStyle = '#061224';
  rr(wx, wy, ww, wh, 10); g.fill();
  g.save();
  rr(wx, wy, ww, wh, 10); g.clip();
  const moonG = g.createRadialGradient(wx + 220, wy + 120, 12, wx + 220, wy + 120, 220);
  moonG.addColorStop(0, 'rgba(186, 230, 253, 0.45)');
  moonG.addColorStop(1, 'rgba(10, 15, 29, 0)');
  g.fillStyle = moonG;
  g.fillRect(wx, wy, ww, wh);
  g.fillStyle = '#E0F2FE';
  circ(wx + 226, wy + 112, 34);
  /* Gotas de chuva diagonais */
  g.strokeStyle = 'rgba(186, 230, 253, 0.35)';
  g.lineWidth = 2;
  for (let i = 0; i < 18; i++) {
    const rx = wx + ((i * 37 + t * 80) % ww);
    const ry = wy + ((i * 71 + t * 420) % wh);
    g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx - 10, ry + 26); g.stroke();
  }
  /* Persiana semiaberta */
  g.fillStyle = 'rgba(6, 10, 18, 0.55)';
  for (let by = wy + 18; by < wy + wh; by += 36) g.fillRect(wx, by, ww, 10);
  g.restore();
  g.strokeStyle = '#334155'; g.lineWidth = 10;
  rr(wx, wy, ww, wh, 10); g.stroke();

  /* Feixe de luar atravessando o quarto */
  g.save();
  g.fillStyle = isRed ? 'rgba(255, 59, 48, 0.07)' : 'rgba(56, 217, 255, 0.08)';
  g.beginPath();
  g.moveTo(wx + ww, wy + 40); g.lineTo(wx + ww + 340, 1320);
  g.lineTo(wx + 80, 1320); g.lineTo(wx, wy + wh);
  g.closePath(); g.fill();
  g.restore();

  /* Guarda-roupa escuro a direita (com fresta que abre quando vulto=true) */
  const gx = 688, gy = 390, gw = 320, gh = 925;
  g.fillStyle = PAL.woodDark;
  rr(gx, gy, gw, gh, 10); g.fill();
  g.strokeStyle = '#3D2B24'; g.lineWidth = 5;
  rr(gx, gy, gw, gh, 10); g.stroke();
  /* Fresta sinistra abrindo */
  const crack = props.vulto ? lerp(18, 66, easeOut(localP)) : 12;
  g.fillStyle = '#020305';
  g.fillRect(gx + gw * 0.5 - crack * 0.5, gy + 12, crack, gh - 24);
  if (props.vulto) {
    const ey = gy + 360;
    const ex = gx + gw * 0.5;
    glow(ex, ey, 90, PAL.alert, 0.25 + 0.1 * Math.sin(t * 7));
    g.fillStyle = '#F8FAFC';
    ell(ex - 12, ey, 6, 4); ell(ex + 12, ey, 6, 4);
  }
  /* Puxadores do guarda-roupa */
  g.fillStyle = '#94A3B8';
  rr(gx + gw * 0.5 - crack * 0.5 - 18, gy + 430, 8, 72, 4); g.fill();
  rr(gx + gw * 0.5 + crack * 0.5 + 10, gy + 430, 8, 72, 4); g.fill();

  /* Cama + criado-mudo com relogio digital vermelho a esquerda */
  g.fillStyle = '#1E293B';
  rr(40, 1065, 420, 265, 22); g.fill();
  g.fillStyle = '#334155';
  rr(56, 1020, 170, 76, 26); g.fill();
  g.fillStyle = '#0F172A';
  rr(40, 1140, 420, 190, 16); g.fill();

  /* Criado-mudo com abajur apagado/sutil (sem duplicar o relogio superior) */
  g.fillStyle = PAL.woodMid;
  rr(476, 1125, 162, 195, 12); g.fill();
  g.fillStyle = '#334155';
  rr(548, 1082, 18, 44, 4); g.fill();
  g.fillStyle = '#1E293B';
  g.beginPath();
  g.moveTo(522, 1086); g.lineTo(592, 1086); g.lineTo(578, 1038); g.lineTo(536, 1038);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(148, 163, 184, 0.25)'; g.lineWidth = 2; g.stroke();

  /* Protagonista em pe no quarto */
  const ex = shot.expressao || f.ex;
  drawProtagonista(470, 1362, 1.02, {
    t, ex, closed: f.closed, localP,
    fastBreath: ex === 'fear' || ex === 'shock',
    pose: poseObjFromName(props.pose),
    rimColor: isRed ? PAL.alert : PAL.cyan,
    rimA: 0.82,
    lookX: props.vulto ? 0.55 : -0.20
  });
}

/* MODULO 2: corredor_escuro (perspectiva claustrofobica, luz piscando, porta/cadeira/vulto) */
function drawCorredorEscuro(t, shot, f, localP){
  const props = shot.props || {};
  const flk = (Math.sin(t * 28) > -0.45 && Math.sin(t * 11.3) > -0.75) ? 0.85 : 0.24;
  const isRed = shot.mood === 'red';
  vgrad('#060910', '#020408');

  /* Paredes em perspectiva */
  const vx = 540, vy = 740;
  g.fillStyle = '#141B26';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(vx - 190, vy - 280); g.lineTo(vx - 190, vy + 360); g.lineTo(0, H); g.closePath(); g.fill();
  g.fillStyle = '#111722';
  g.beginPath(); g.moveTo(W, 0); g.lineTo(vx + 190, vy - 280); g.lineTo(vx + 190, vy + 360); g.lineTo(W, H); g.closePath(); g.fill();
  /* Teto e piso umido */
  g.fillStyle = '#090D14';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(vx + 190, vy - 280); g.lineTo(vx - 190, vy - 280); g.closePath(); g.fill();
  const flG = g.createLinearGradient(0, vy + 360, 0, H);
  flG.addColorStop(0, '#0B1018');
  flG.addColorStop(1, '#1B2330');
  g.fillStyle = flG;
  g.beginPath(); g.moveTo(vx - 190, vy + 360); g.lineTo(vx + 190, vy + 360); g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();

  /* Fundo do corredor */
  g.fillStyle = '#05080E';
  g.fillRect(vx - 190, vy - 280, 380, 640);

  /* Lampada fluorescente piscando no teto */
  const lampCol = isRed ? PAL.alert : '#E0F2FE';
  g.fillStyle = flk > 0.5 ? lampCol : '#1E293B';
  rr(420, 355, 240, 22, 11); g.fill();
  if (flk > 0.4) {
    glow(540, 420, 440, isRed ? PAL.alert : PAL.cyan, flk * 0.28);
    /* Reflexo da luz no piso */
    g.fillStyle = rgba(isRed ? PAL.alert : PAL.cyan, flk * 0.12);
    g.beginPath(); g.moveTo(470, vy + 360); g.lineTo(610, vy + 360); g.lineTo(740, H); g.lineTo(340, H); g.closePath(); g.fill();
  }

  /* Elemento focal configuravel: cadeira | vulto | porta */
  const obj = String(props.corredor_objeto || (props.vulto ? 'vulto' : 'porta')).toLowerCase();
  if (obj === 'cadeira') {
    const cx = 540, cy = 1145;
    g.fillStyle = 'rgba(0,0,0,0.68)';
    ell(cx, cy + 88, 128, 28);
    g.strokeStyle = '#94A3B8'; g.lineWidth = 10; g.lineCap = 'round';
    /* Pernas metalicas */
    g.beginPath();
    g.moveTo(cx - 56, cy - 10); g.lineTo(cx - 72, cy + 84);
    g.moveTo(cx + 56, cy - 10); g.lineTo(cx + 72, cy + 84);
    g.moveTo(cx - 46, cy - 10); g.lineTo(cx - 54, cy + 62);
    g.moveTo(cx + 46, cy - 10); g.lineTo(cx + 54, cy + 62);
    g.stroke();
    /* Assento e encosto */
    g.fillStyle = '#475569';
    rr(cx - 66, cy - 22, 132, 22, 6); g.fill();
    g.strokeStyle = '#CBD5E1'; g.lineWidth = 8;
    g.beginPath();
    g.moveTo(cx - 56, cy - 18); g.lineTo(cx - 56, cy - 132);
    g.moveTo(cx + 56, cy - 18); g.lineTo(cx + 56, cy - 132);
    g.stroke();
    g.fillStyle = '#334155';
    rr(cx - 60, cy - 126, 120, 44, 8); g.fill();
  } else if (obj === 'vulto') {
    const sc = lerp(0.88, 1.12, easeOut(localP));
    const vx0 = 540, vy0 = 1140;
    g.save();
    g.translate(vx0, vy0);
    g.scale(sc, sc);
    g.fillStyle = 'rgba(0,0,0,0.72)';
    ell(0, 12, 110, 24);
    g.fillStyle = '#030509';
    rr(-66, -340, 132, 340, 56); g.fill();
    circ(0, -408, 60);
    g.strokeStyle = rgba(isRed ? PAL.alert : PAL.cyan, 0.40);
    g.lineWidth = 4;
    g.beginPath(); g.arc(0, -408, 60, -0.7, 0.8); g.stroke();
    /* Olhos brilhando no fim do corredor */
    g.fillStyle = isRed ? PAL.alert : '#F8FAFC';
    ell(-20, -412, 9, 5); ell(20, -412, 9, 5);
    g.restore();
  } else {
    /* Porta pesada entreaberta com fresta de luz dramatica */
    const dx = vx - 122, dy = vy - 210, dw = 244, dh = 570;
    g.fillStyle = '#1E1613';
    rr(dx, dy, dw, dh, 6); g.fill();
    g.strokeStyle = '#475569'; g.lineWidth = 6;
    rr(dx, dy, dw, dh, 6); g.stroke();
    /* Fresta vertical brilhante */
    const gapW = lerp(14, 34, localP);
    g.fillStyle = isRed ? PAL.alert : PAL.yellow;
    g.fillRect(dx + dw - gapW, dy + 6, gapW, dh - 12);
    glow(dx + dw - 10, dy + dh * 0.5, 220, isRed ? PAL.alert : PAL.yellow, 0.34);
    g.fillStyle = '#CBD5E1';
    circ(dx + dw - gapW - 22, dy + dh * 0.52, 10);
  }

  /* Protagonista em primeiro plano (de costas ou lateral, sem cobrir o foco) */
  if (props.pose === 'walk' || props.pose === 'panic' || obj !== 'vulto') {
    const px = obj === 'cadeira' ? 270 : 300;
    drawProtagonista(px, 1385, 0.98, {
      t, ex: shot.expressao || f.ex, closed: f.closed, localP,
      fastBreath: true,
      backView: obj === 'vulto' || obj === 'porta',
      pose: poseObjFromName(props.pose),
      rimColor: isRed ? PAL.alert : PAL.cyan,
      rimA: 0.84
    });
  }
}

  }

  /* Painel do carro + moldura inferior */
  g.fillStyle = '#070B14';
  g.beginPath();
  g.moveTo(-60, 1020);
  g.quadraticCurveTo(540, 920, W + 60, 1020);
  g.lineTo(W + 60, H + 80);
  g.lineTo(-60, H + 80);
  g.closePath();
  g.fill();
  g.strokeStyle = '#1E293B'; g.lineWidth = 6; g.stroke();

  /* Volante a esquerda */
  g.strokeStyle = '#1E293B'; g.lineWidth = 34;
  g.beginPath(); g.arc(270, 1210, 195, Math.PI * 1.05, Math.PI * 1.95); g.stroke();

  rr(gx, gy, gw, gh, 22); g.stroke();

  /* Mapa estilizado e rota no GPS */
  g.save();
  rr(gx + 8, gy + 8, gw - 16, gh - 16, 16); g.clip();
  g.strokeStyle = 'rgba(56, 217, 255, 0.14)'; g.lineWidth = 2;
  for (let x = gx; x < gx + gw; x += 48) { g.beginPath(); g.moveTo(x, gy); g.lineTo(x, gy + gh); g.stroke(); }
  for (let y = gy; y < gy + gh; y += 48) { g.beginPath(); g.moveTo(gx, y); g.lineTo(gx + gw, y); g.stroke(); }
  /* Linha da rota */
  g.strokeStyle = isRed ? PAL.alert : PAL.cyan; g.lineWidth = 10; g.lineCap = 'round';

  g.moveTo(gx + 130, gy + 310);

}

/* ============================================================
   PROPS FLUTUANTES E FISICA DE GRAVIDADE ZERO (V6.1)
   ============================================================ */
function resolveZeroG(shot){
  const props = shot.props || {};
  const poseName = String(props.pose || 'idle').toLowerCase().trim();
  const objRaw = normWord(String(props.objeto || ''));
  const rawList = Array.isArray(props.objetos_flutuantes) ? props.objetos_flutuantes : [];
  const items = new Set();

  for (const it of rawList) {
    const k = normWord(String(it));
    if (k.includes('lapiseira') || k.includes('caneta') || k.includes('lapis')) items.add('lapiseira');
    if (k.includes('xicara') || k.includes('cafe') || k.includes('caneca')) items.add('xicara_cafe');
    if (k.includes('cadeira')) items.add('cadeiras');
    if (k.includes('silhueta') || k.includes('janela') || k.includes('pessoa') || k.includes('carro')) items.add('silhuetas_janela');
  }
  if (objRaw.includes('lapiseira') || objRaw.includes('caneta')) items.add('lapiseira');
  if (objRaw.includes('xicara') || objRaw.includes('cafe')) items.add('xicara_cafe');
  if (objRaw.includes('cadeira')) items.add('cadeiras');
  if (props.silhuetas_janela) items.add('silhuetas_janela');

  const active = Boolean(props.gravidade_zero)
    || poseName === 'flutuando'
    || poseName === 'segurando_mesa'
    || poseName === 'caindo'
    || items.size > 0;
  const isFalling = poseName === 'caindo';

  if (active && items.size === 0) {
    items.add('lapiseira');
    items.add('xicara_cafe');
    items.add('cadeiras');
  }
  return { active, isFalling, poseName, items };
}

function drawFloatingProps(t, zg, localP, opt={}){
  if (!zg.active) return;
  const fallDrop = zg.isFalling ? (localP * localP * 280) : 0;
  const layer = opt.layer || 'front';

  if (layer === 'back') {
    /* Cadeiras giratorias flutuando e girando devagar no ambiente */
    if (zg.items.has('cadeiras')) {
      const c1x = 186 + Math.sin(t * 1.05) * 24;
      const c1y = 655 + Math.cos(t * 1.35) * 32 + fallDrop;
      drawOfficeChair(c1x, c1y, 0.84, -0.34 + Math.sin(t * 0.9) * 0.28);

      const c2x = 874 + Math.cos(t * 0.95) * 26;
      const c2y = 740 + Math.sin(t * 1.25 + 1.1) * 30 + fallDrop * 0.9;
      drawOfficeChair(c2x, c2y, 0.78, 0.42 + Math.cos(t * 0.85) * 0.30);
    }

    /* Folhas A4 flutuando sem peso */
    const papers = [
      { x: 290, y: 540, ph: 0.4, rot: -0.25 },
      { x: 760, y: 575, ph: 2.1, rot: 0.32 },
      { x: 525, y: 470, ph: 4.0, rot: -0.14 }
    ];
    for (let i = 0; i < papers.length; i++) {
      const p = papers[i];
      const px = p.x + Math.sin(t * 1.4 + p.ph) * 24;
      const py = p.y + Math.cos(t * 1.6 + p.ph) * 26 + fallDrop * 0.85;
      g.save();
      g.translate(px, py);
      g.rotate(p.rot + Math.sin(t * 1.1 + p.ph) * 0.25);
      g.fillStyle = 'rgba(226, 232, 240, 0.86)';
      rr(-26, -34, 52, 68, 4); g.fill();
      g.fillStyle = 'rgba(100, 116, 139, 0.55)';
      for (let ln = 0; ln < 4; ln++) g.fillRect(-17, -20 + ln * 12, 34 - (ln === 3 ? 12 : 0), 3);
      g.restore();
    }
    return;
  }

  /* Props de primeiro plano nitidos: lapiseira + xicara de cafe com gotas */
  if (zg.items.has('lapiseira')) {
    const lx = 330 + Math.sin(t * 1.6) * 20;
    const ly = 790 + Math.cos(t * 1.9) * 26 + fallDrop;
    drawFloatingLapiseira(lx, ly, t, 1.05);

  if (zg.items.has('xicara_cafe')) {
    const cx = 746 + Math.cos(t * 1.35) * 22;
    const cy = 835 + Math.sin(t * 1.7 + 0.7) * 28 + fallDrop;
    drawFloatingXicaraCafe(cx, cy, t, 1.02);
  }
}

  g.strokeStyle = '#334155'; g.lineWidth = 9;

  /* Almofadas discretas da folha da porta */

/* MODULO 9: blecaute_olhos (escuridao total com olhos brilhando e silhueta emergindo) */
function drawBlecauteOlhos(t, shot, f, localP){
  vgrad('#030408', '#000000');
  const emerge = easeOut(clamp(localP * 1.15));
  const pulse = 0.5 + 0.5 * Math.sin(t * 8.5);
  const sc = lerp(0.84, 1.14, emerge);

  /* Aura vermelha/fria sutil atras da silhueta */
  glow(540, 820, 460, PAL.alert, 0.16 + 0.12 * pulse);

  g.save();
  g.translate(540 + Math.sin(t * 32) * 2.5 * emerge, 940);
  g.scale(sc, sc);

  /* Silhueta escura emergindo do breu */
  g.fillStyle = '#05070C';
  rr(-240, 130, 480, 920, 165); g.fill();
  circ(0, -70, 210);
  g.strokeStyle = rgba(PAL.alert, 0.32 + 0.18 * pulse);
  g.lineWidth = 5;
  g.beginPath(); g.arc(0, -70, 210, -0.75, 0.75); g.stroke();

  /* Dois olhos penetrantes brilhando no escuro */
  const eyeY = -88;
  const eyeOff = 74;
  glow(-eyeOff, eyeY, 86, '#F8FAFC', 0.45 + 0.15 * pulse);
  glow(eyeOff, eyeY, 86, '#F8FAFC', 0.45 + 0.15 * pulse);
  g.fillStyle = '#F8FAFC';
  ell(-eyeOff, eyeY, 34, 20 + 6 * emerge);
  ell(eyeOff, eyeY, 34, 20 + 6 * emerge);
  g.fillStyle = '#05070C';
  circ(-eyeOff, eyeY, 9);
  circ(eyeOff, eyeY, 9);
  g.fillStyle = PAL.alert;
  circ(-eyeOff, eyeY, 3.5);
  circ(eyeOff, eyeY, 3.5);

  /* Sorriso fino e sinistro surgindo no escuro se expressao for sinister_smile */
  if (shot.expressao === 'sinister_smile' || emerge > 0.35) {
    const sp = clamp((emerge - 0.25) / 0.65);
    if (sp > 0.05) {
      const w = lerp(24, 118, sp);
      const curve = lerp(6, 56, sp);
      g.strokeStyle = rgba('#F8FAFC', 0.78 * sp);
      g.lineWidth = 8;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(-w, 42 - curve * 0.25);
      g.quadraticCurveTo(0, 42 + curve, w, 42 - curve * 0.25);
      g.stroke();
    }
  }
  g.restore();
}

function drawScene(shot, t){
  const f = faceAt(t);
  const localP = prog(t, shot.start, shot.end);
  switch (shot.modulo) {
    case 'quarto_noturno':      drawQuartoNoturno(t, shot, f, localP); break;
    case 'corredor_escuro':     drawCorredorEscuro(t, shot, f, localP); break;
    case 'celular_notificacao': drawCelularNotificacao(t, shot, f, localP); break;
    case 'camera_cctv':         drawCameraCctv(t, shot, f, localP); break;
    case 'elevador_cabine':     drawElevadorCabine(t, shot, f, localP); break;
    case 'carro_noite':         drawCarroNoite(t, shot, f, localP); break;
    case 'sala_cozinha':        drawSalaCozinha(t, shot, f, localP); break;
    case 'escritorio':          drawEscritorio(t, shot, f, localP); break;
    case 'big_face':            drawBigFace(t, shot, f); break;
    case 'blecaute_olhos':      drawBlecauteOlhos(t, shot, f, localP); break;
    default:                    drawQuartoNoturno(t, shot, f, localP); break;
  }
}

function getActiveParteLabel(t){
  if (!parteLabel) return '';

    if (/\b1\b/.test(base)) return base.replace(/\b1\b/, '2');

}

/* ============================================================
   EXPRESSOES + PISCADAS + CAMERA + SCREEN SHAKE AMORTECIDO
   ============================================================ */
function exprAt(t){
  let ex = 'neutral';
  for (const [a, b] of EXPR_CUES) if (t >= a - 0.01) ex = b;
  return ex;
}
function faceAt(t){
  let last = -1, prev = -1;
  for (const b of BLINKS) { if (b <= t) { prev = last; last = b; } else break; }
  const d = t - last;
  const closed = last >= 0 && d < 0.16 ? Math.sin((d / 0.16) * Math.PI) : 0;
  const ref = last < 0 ? 0 : (d < 0.08 ? (prev < 0 ? 0 : prev + 0.08) : last + 0.08);
  return { ex: exprAt(ref), closed };
}

function pickShot(t){
  for (let i = 0; i < SHOTS.length; i++) {
    const s = SHOTS[i];
    if (t < s.end || i === SHOTS.length - 1) return s;
  }
  return SHOTS[0];
}

function cameraFor(shot, t){
  const k = ease(prog(t, shot.start, shot.end));
  let z = lerp(shot.cam0[0], shot.cam1[0], k);
  const cx = lerp(shot.cam0[1], shot.cam1[1], k);
  const cy = lerp(shot.cam0[2], shot.cam1[2], k);

  let sx = noise(t * 2.1, 11) * 4.0;
  let sy = noise(t * 1.9, 29) * 4.0;

  for (let i = 0; i < KATANA_HITS.length; i++) {
    const kh = KATANA_HITS[i];
    if (t >= kh.start && t < kh.end + 0.40) {
      const dt = t - kh.start;
      z += kh.punch * Math.exp(-dt * 7.2);
      const env = Math.exp(-dt * 10.5);
      sx += Math.sin(dt * 108) * kh.shake * env;
      sy += Math.cos(dt * 94) * kh.shake * 0.72 * env;
    }
  }

  for (const sfx of (EV.sfx_eventos || [])) {
    const ti = Number(sfx.inicio);
    if (!isFinite(ti)) continue;
    if (t >= ti && t < ti + 0.85) {
      const dt = t - ti;
      const amp = sfx.nome === 'impacto_twist' ? 26 : 14;
      const env = Math.exp(-dt * 5.8);
      sx += Math.sin(dt * 95) * amp * env;
      sy += Math.cos(dt * 83) * amp * 0.72 * env;
    }
  }
  return { z, cx, cy, sx, sy };
}

function finish(vig){
  g.save();
  g.globalAlpha = clamp(vig, 0, 1);
  g.drawImage(vigCv, 0, 0);
  g.restore();
}

/* ============================================================
   LEGENDAS ANTI-COLISAO V5.1 (ZERO COLAGEM + ZERO VAZAMENTO P1->P2)
   ============================================================ */
function buildPreviewCaptions(){
  const lines = [
    [0.2, 4.2, 'Duas e quarenta e sete da manhã no quarto escuro.'],
    [4.4, 9.2, 'O celular vibra com uma mensagem de número oculto.'],
    [9.4, 14.2, 'No corredor vazio, uma cadeira aparece de frente pra porta.'],
    [14.4, 18.8, 'Na câmera de segurança, alguém encara a lente sem piscar.'],
    [22.8, 27.6, 'O elevador desce sozinho até um andar que não existe.'],
    [27.8, 32.6, 'O GPS recalcula a rota para dentro da própria casa.'],
    [32.8, 37.4, 'A luz apaga e o silêncio toma a sala inteira.'],
    [37.6, 41.6, 'No escuro total, dois olhos abrem atrás de você.']
  ];
  const groups = [];
  for (const [t0, t1, txt] of lines) {
    const words = txt.split(' ');
    const span = Math.max(0.3, t1 - t0);
    const step = span / words.length;
    const timed = words.map((w, i) => ({
      palavra: w, inicio: t0 + i * step, fim: t0 + (i + 1) * step, duracao: step
    }));
    let i = 0;
    while (i < timed.length) {
      const rem = timed.length - i;
      let sz = rem <= 3 ? rem : (rem === 4 ? 2 : 3);
      const sl = timed.slice(i, i + sz);
      groups.push({ inicio: sl[0].inicio, fim: sl[sl.length - 1].fim, palavras: sl });
      i += sz;
    }
  }
  captionGroups = groups;
}

function layoutCaptionGroup(grp){
  const words = grp.palavras
    .map(p => {
      const cleaned = String(p.palavra || '').replace(/\[\/?VOZ(?::[a-zA-Z0-9_]+)?\]/gi, '').trim();
      return {
        txt: toPtUpper(cleaned),
        key: normWord(cleaned),
        inicio: Number(p.inicio),
        fim: Number(p.fim ?? (Number(p.inicio) + Number(p.duracao || 0.25)))
      };
    })
    .filter(w => w.txt.length > 0);
  if (!words.length) return null;

  const POP_MAX = 1.09;
  const MAX_LINE_W = 876;
  let fs = 78;
  let lw = 16, gap = 36, wds = [], boxes = [], tw = 0;

  for (let iter = 0; iter < 16; iter++) {
    g.font = `900 ${fs}px ${COND}`;
    lw = Math.max(10, Math.round(fs * 0.20));
    gap = Math.max(26, Math.round(fs * 0.36) + Math.round(lw * 0.50));
    wds = words.map(w => g.measureText(w.txt).width);
    boxes = wds.map(w => w * POP_MAX + lw);
    tw = boxes.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
    if (tw <= MAX_LINE_W || fs <= 30) break;
    const nextFs = Math.max(30, Math.floor(fs * (MAX_LINE_W / tw)) - (iter > 2 ? 1 : 0));
    if (nextFs >= fs) fs -= 2; else fs = nextFs;
  }

  let x = 540 - tw / 2;
  const items = words.map((w, i) => {
    const cx = x + boxes[i] / 2;
    const item = { ...w, cx, w: wds[i], boxW: boxes[i] };
    x += boxes[i] + gap;
    return item;
  });
  return { fs, lw, gap, tw, items };
}

function pickCaptionGroup(t){
  const cP2 = Number(EV.corte_parte_2);
  const temCorte = isFinite(cP2) && cP2 > 0;
  const naParte2 = temCorte && t >= cP2 - 0.001;

  let candidato = null;
  for (let i = 0; i < captionGroups.length; i++) {
    const c = captionGroups[i];
    const ini = Number(c.inicio);
    const fim = Number(c.fim);
    if (temCorte) {
      const grpEhP2 = ini >= cP2 - 0.005;
      if (naParte2 && !grpEhP2) continue;
      if (!naParte2 && grpEhP2) continue;
    }
    if (t >= ini - 0.04 && t <= fim) return c;
    if (t > fim && t <= fim + 0.14) candidato = c;
  }
  return candidato;
}

function drawCaptions(t){
  if (katanaStateAt(t) !== null) return;
  if (isFullScreenCtaActive(t)) return;

  const grp = pickCaptionGroup(t);
  if (!grp || !grp.palavras || !grp.palavras.length) return;
  const lay = layoutCaptionGroup(grp);
  if (!lay) return;

  let active = 0;
  for (let i = 0; i < lay.items.length; i++) if (t >= lay.items[i].inicio - 0.02) active = i;
  const grpPop = popScale(t - grp.inicio + 0.02, 0.11);

  g.save();
  g.font = `900 ${lay.fs}px ${COND}`;
  g.textBaseline = 'middle';
  g.textAlign = 'center';

  const y = 1495;
  g.translate(540, y);
  g.scale(grpPop, grpPop);
  g.translate(-540, -y);
  g.lineJoin = 'round';
  g.miterLimit = 2;

  lay.items.forEach((w, i) => {
    const isAct = i === active;
    const isRed = RED_WORDS.has(w.key);
    const fill = isAct ? (isRed ? PAL.alert : PAL.yellow) : '#FFFFFF';
    const wPop = isAct ? lerp(1.09, 1.04, easeOut(clamp((t - w.inicio) / 0.09))) : 1.0;

    g.save();
    g.translate(w.cx, y);
    g.scale(wPop, wPop);
    g.shadowColor = 'rgba(0,0,0,.88)';
    g.shadowBlur = 16;
    g.shadowOffsetY = 6;
    g.strokeStyle = '#000000';
    g.lineWidth = lay.lw;
    g.strokeText(w.txt, 0, 0);
    g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.fillStyle = fill;
    g.fillText(w.txt, 0, 0);
    g.restore();
  });
  g.restore();
}

window.measureCaptionAt = t => {
  const grp = pickCaptionGroup(t);
  if (!grp) return null;
  g = main;
  const lay = layoutCaptionGroup(grp);
  if (!lay) return null;
  let minVisualGap = Infinity;
  for (let i = 0; i < lay.items.length - 1; i++) {
    const a = lay.items[i], b = lay.items[i + 1];
    minVisualGap = Math.min(minVisualGap, (b.cx - b.boxW / 2) - (a.cx + a.boxW / 2));
  }
  return {
    texto: lay.items.map(x => x.txt).join(' '),
    palavras: lay.items.map(x => x.txt),
    fs: lay.fs,
    lw: lay.lw,
    gap: lay.gap,
    tw: Number(lay.tw.toFixed(1)),
    minVisualGap: lay.items.length > 1 ? Number(minVisualGap.toFixed(1)) : null
  };
};

/* ============================================================
   INICIALIZACAO DE TIMELINE + RENDER DETERMINISTICO
   ============================================================ */
function rebuildTimeline(cenasData, evData, audioDur){
  CENAS = (cenasData && Array.isArray(cenasData.cenas) && cenasData.cenas.length)
    ? cenasData
    : JSON.parse(JSON.stringify(CENAS_PREVIEW));
  applyPaletteFromCenas(CENAS);

  const fallbackDur = 42.0;
  const dur = Math.max(
    audioDur || 0,
    Number((evData && evData.duracao_total) || 0) || fallbackDur
  );
  duration = dur;

  const baseEv = {
    cta_modo: CENAS.cta_modo || 'pausa_meio',
    cta_texto: (CENAS.cta && CENAS.cta.botao) || 'COMENTE EU QUERO',
    cta_meio_inicio: Number((dur * 0.45).toFixed(2)),
    cta_meio_fim: Number((dur * 0.45 + 3.4).toFixed(2)),
    duracao_total: dur
  };
  EV = evData ? { ...baseEv, ...evData, duracao_total: dur } : baseEv;

  if (URL_PARTE === null && typeof window.parteLabel !== 'string') {
    const lbl = (evData && evData.parte_label) || CENAS.parte_label || 'PARTE 1';
    if (typeof lbl === 'string' && lbl.trim()) parteLabel = lbl.trim();
  }

  document.title = `${CENAS.titulo || 'Short V6'}: Player Universal V6`;
  const h1 = document.getElementById('pageTitle');
  if (h1) h1.textContent = `Previa do Short V6: ${CENAS.titulo || 'Player Universal'}`;

  SHOTS = buildShotsFromConfig(CENAS, EV, duration);
  KATANA_HITS = buildKatanaHitsFromConfig(CENAS, EV, duration);

  /* Troca de expressoes escondida na piscada 2 frames antes de cada mudanca de cena */
  EXPR_CUES = [];
  let lastEx = '';
  for (const s of SHOTS) {
    if (s.expressao && s.expressao !== lastEx) {
      EXPR_CUES.push([s.start, s.expressao]);
      lastEx = s.expressao;
    }
  }
  if (!EXPR_CUES.length) EXPR_CUES.push([0, 'neutral']);

  const bl = [];
  let bt = 0.85, bi = 0;
  while (bt < duration + 1) { bl.push(bt); bt += 2.6 + hash(bi++ * 11.3) * 1.6; }
  for (const [ct] of EXPR_CUES) if (ct > 0.2) bl.push(Math.max(0.05, ct - 0.067));
  BLINKS = bl.sort((a, b) => a - b);
}

let ccOn = false;
function renderAt(t){
  t = clamp(+t || 0, 0, duration);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.filter = 'none';
  g.shadowBlur = 0;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);

  if (drawFullScreenCta(t)) return;

  const shot = pickShot(t);
  const katanaActive = drawKatanaOverlay(t);

  if (!katanaActive) {
    const cam = cameraFor(shot, t);
    g.save();
    g.translate(W / 2 + cam.sx, H / 2 + cam.sy);
    g.scale(cam.z, cam.z);
    g.translate(-cam.cx, -cam.cy);
    drawScene(shot, t);
    g.restore();

    finish(shot.vig || 0.60);
    drawClock(t, shot);

    const cutAge = t - shot.start;
    if (shot.id > 1 && cutAge >= 0 && cutAge < 0.06) {
      const k = 1 - cutAge / 0.06;
      g.fillStyle = shot.mood === 'red' ? `rgba(255,59,48,${k * 0.16})` : `rgba(0,0,0,${k * 0.35})`;
      g.fillRect(0, 0, W, H);
    }
  }

  drawParteBadge(t);
  if (ccOn) drawCaptions(t);
}

window.renderAt = renderAt;
window.getDuration = () => duration;
window.getShots = () => SHOTS.map(s => ({ id: s.id, cenaId: s.cenaId, scene: s.modulo, modulo: s.modulo, mood: s.mood, start: s.start, end: s.end, dur: s.dur }));
window.getKatanaHits = () => KATANA_HITS.map(h => ({ id: h.id, lines: h.lines, start: h.start, end: h.end, dur: h.dur }));
window.getMidCta = () => ({
  modo: EV.cta_modo || 'pausa_meio',
  inicio: EV.cta_meio_inicio,
  fim: EV.cta_meio_fim,
  texto: EV.cta_texto || 'COMENTE EU QUERO'
});
window.getCorteParte2 = () => {
  const v = Number(EV.corte_parte_2);
  return (isFinite(v) && v > 0) ? v : null;
};
window.getParteLabel = t => (typeof t === 'number' ? getActiveParteLabel(t) : parteLabel);
window.setParteLabel = v => { parteLabel = String(v ?? '').trim(); renderAt(cur); };
window.getLoadedConfig = () => ({
  schema_version: CENAS.schema_version,
  video_id: CENAS.video_id,
  titulo: CENAS.titulo,
  horario: CENAS.horario,
  tem_parte_2: Boolean(window.getCorteParte2()),
  modulos: (CENAS.cenas || []).map(c => c.modulo)
});

/* Controles do player */
const $ = id => document.getElementById(id);
const btn = $('play'), seek = $('seek'), out = $('time'), cc = $('cc'), status = $('status');
let playing = false, cur = 0, t0 = 0, p0 = 0;
const fmt = v => v.toFixed(1).replace('.', ',');

function ui(){
  seek.value = cur;
  out.textContent = `${fmt(cur)} / ${fmt(duration)}`;
  seek.setAttribute('aria-valuetext', `${fmt(cur)} de ${fmt(duration)} segundos`);
  $('playLbl').textContent = playing ? 'Pausar' : 'Play';
  $('playIcon').setAttribute('d', playing ? 'M3 2h4v12H3zM9 2h4v12H9z' : 'M4 2l10 6-10 6z');
}
function tick(){
  if (!playing) return;
  cur = Math.min(t0 + (performance.now() - p0) / 1000, duration);
  if (audio && cur < audio.duration && Math.abs(audio.currentTime - cur) > 0.2) audio.currentTime = cur;
  renderAt(cur); ui();
  if (cur >= duration) pause(); else requestAnimationFrame(tick);
}
function play(){
  if (cur >= duration) cur = 0;
  playing = true; t0 = cur; p0 = performance.now();
  if (audio) { audio.currentTime = cur; audio.play().catch(() => {}); }
  ui(); requestAnimationFrame(tick);
}
function pause(){ playing = false; if (audio) audio.pause(); ui(); }
btn.addEventListener('click', () => playing ? pause() : play());
seek.addEventListener('input', () => {
  cur = +seek.value; t0 = cur; p0 = performance.now();
  if (audio && cur < audio.duration) audio.currentTime = cur;
  renderAt(cur); ui();
});
cc.addEventListener('click', () => {
  ccOn = !ccOn; cc.setAttribute('aria-pressed', String(ccOn)); renderAt(cur);
});

async function fetchJson(url){
  if (location.protocol === 'file:') return null;
  try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return null;
}
function probeAudio(src){
  return new Promise(res => {
    const el = new Audio(); let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    el.preload = 'auto';
    el.addEventListener('loadedmetadata', () => fin(el), { once: true });
    el.addEventListener('error', () => fin(null), { once: true });
    setTimeout(() => fin(null), 3500);
    el.src = src;
  });
}

async function load(){
  const [cenasData, evData, tsData] = await Promise.all([
    fetchJson('cenas.json'),
    fetchJson('audio/eventos.json'),
    fetchJson('audio/timestamps.json')
  ]);
  let a = await probeAudio('audio/mix_final.mp3');
  let audioSrc = 'audio/mix_final.mp3';
  if (!a) { a = await probeAudio('audio/narracao.mp3'); audioSrc = 'audio/narracao.mp3'; }

  if (a && isFinite(a.duration)) audio = a;
  rebuildTimeline(cenasData, evData, audio ? audio.duration : null);

  if (tsData && Array.isArray(tsData.grupos) && tsData.grupos.length) {
    captionGroups = tsData.grupos;
  } else {
    buildPreviewCaptions();
  }

  const cP2 = window.getCorteParte2();
  const corteTxt = cP2 ? `Corte P2 em ${fmt(cP2)} s` : 'Short unico';
  if (audio && evData) {
    status.textContent = `Motor Universal V6 (${CENAS.titulo}): ${audioSrc} sincronizado (${fmt(duration)} s | ${SHOTS.length} cortes | ${corteTxt}).`;
  } else if (cenasData) {
    status.textContent = `Modo Previa V6 (${CENAS.titulo}): cenas.json carregado sem audio (${fmt(duration)} s | ${SHOTS.length} cortes).`;
  } else {
    status.textContent = `Modo Previa V6 padrao: sem cenas.json e sem audio (${fmt(duration)} s | 10 modulos demonstrativos).`;
  }
  seek.max = duration;
  btn.disabled = false; seek.disabled = false; btn.removeAttribute('aria-busy');
  renderAt(cur); ui();
}

rebuildTimeline(null, null, null);
buildPreviewCaptions();
renderAt(0); ui(); load();
})();
</script>
