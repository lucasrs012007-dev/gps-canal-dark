/* MODULO 8: big_face (close extremo com pupilas tremendo, suor caindo e ondas de choque) */
function drawBigFace(t, shot, f, localP=0){
  const isRed = shot.mood === 'red' || shot.expressao === 'shock' || shot.expressao === 'fear';
  const accent = isRed ? PAL.alert : (shot.mood === 'yellow' ? PAL.yellow : PAL.cyan);
  withBlur(7, () => {
    drawBackdrop(t, isRed ? 'red' : (shot.mood || 'violet'));
    g.fillStyle = isRed ? '#1A0B13' : '#111827';
    g.fillRect(100, 250, 880, 1020);
  });

  /* Ondas de choque concentricas expandindo atras do rosto */
  g.save();
  for (let k = 0; k < 4; k++) {
    const phase = ((t * 1.35 + k * 0.25) % 1);
    const rad = lerp(220, 720, easeOut(phase));
    g.strokeStyle = rgba(accent, (1 - phase) * 0.42);
    g.lineWidth = lerp(8, 2, phase);
    g.beginPath(); g.arc(540, 840, rad, 0, Math.PI * 2); g.stroke();
  }
  drawSpeedLines(t, isRed ? 0.85 : 0.45, accent);
  g.restore();

  const amp = (shot.expressao === 'shock' || shot.acao_cena === 'explosao_choque') ? 10 : 4.5;
  const jitX = noise(t * 48, 1) * amp;
  const jitY = noise(t * 48, 2) * amp;
  const talkAmt = speechMouthAt(t);
  const faceEx = (shot.expressao && shot.expressao !== 'neutral') ? shot.expressao : 'shock';

  g.save();
  g.translate(540 + jitX, 855 + jitY);
  g.fillStyle = PAL.top;
  rr(-310, 265, 620, 880, 175); g.fill();
  g.save();
  rr(-310, 265, 620, 880, 175); g.clip();
  g.fillStyle = rgba(PAL.topDeep, 0.48);
  g.fillRect(-320, 255, 175, 900);
  g.restore();
  g.fillStyle = PAL.skinShadow;
  rr(-64, 190, 128, 120, 40); g.fill();

  drawHeadProtagonista(0, -15, 290, faceEx, f.closed, {
    tilt: -0.03 + noise(t * 22, 3) * 0.018,
    rimA: 0.98,
    rimColor: accent,
    rimAng: 0.12,
    lookX: Math.sin(t * 2.1) * 0.14,
    sweat: true,
    talkAmt,
    t,
    tremble: true
  });
  glow(0, 340, 380, PAL.cyan, 0.22);
  glow(320, -20, 420, accent, 0.36);
  g.restore();

  /* Faixa escura suave na base para contraste maximo das legendas sem cobrir o rosto */
  g.save();
  const scrim = g.createLinearGradient(0, 1280, 0, 1920);
  scrim.addColorStop(0, 'rgba(6, 9, 18, 0)');
  scrim.addColorStop(0.45, 'rgba(6, 9, 18, 0.72)');
  scrim.addColorStop(1, 'rgba(6, 9, 18, 0.94)');
  g.fillStyle = scrim;
  g.fillRect(0, 1280, W, 640);
  g.restore();
}

/* MODULO 9: blecaute_olhos (escuridao total com olhos brilhando e silhueta emergindo) */
function drawBlecauteOlhos(t, shot, f, localP){
  vgrad('#030408', '#000000');
  const emerge = easeOut(clamp(localP * 1.15));
  const pulse = 0.5 + 0.5 * Math.sin(t * 8.5);
  const sc = lerp(0.84, 1.14, emerge);

  glow(540, 820, 460, PAL.alert, 0.16 + 0.12 * pulse);

  g.save();
  g.translate(540 + Math.sin(t * 32) * 2.5 * emerge, 940);
  g.scale(sc, sc);

  g.fillStyle = '#05070C';
  rr(-240, 130, 480, 920, 165); g.fill();
  circ(0, -70, 210);
  g.strokeStyle = rgba(PAL.alert, 0.32 + 0.18 * pulse);
  g.lineWidth = 5;
  g.beginPath(); g.arc(0, -70, 210, -0.75, 0.75); g.stroke();

  const eyeY = -88;
  const eyeOff = 74;
  glow(-eyeOff, eyeY, 86, '#F8FAFC', 0.45 + 0.15 * pulse);
  glow(eyeOff, eyeY, 86, '#F8FAFC', 0.45 + 0.15 * pulse);
  g.fillStyle = '#F8FAFC';
  ell(-eyeOff, eyeY, 34, 20 + 6 * emerge);
  ell(eyeOff, eyeY, 34, 20 + 6 * emerge);
  g.fillStyle = '#05070C';
  circ(-eyeOff, eyeY, 9);
  circ(eyeOff, eyeY, 9);
  g.fillStyle = PAL.alert;
  circ(-eyeOff, eyeY, 3.5);
  circ(eyeOff, eyeY, 3.5);

  if (shot.expressao === 'sinister_smile' || emerge > 0.35) {
    const sp = clamp((emerge - 0.25) / 0.65);
    if (sp > 0.05) {
      const w = lerp(24, 118, sp);
      const curve = lerp(6, 56, sp);
      g.strokeStyle = rgba('#F8FAFC', 0.78 * sp);
      g.lineWidth = 8;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(-w, 42 - curve * 0.25);
      g.quadraticCurveTo(0, 42 + curve, w, 42 - curve * 0.25);
      g.stroke();
    }
  }
  g.restore();
}

/* ============================================================
   PROPS E EFEITOS DINAMICOS 30FPS COMPARTILHADOS (MOTOR V7)
   ============================================================ */
function drawWallClock(cx, cy, r, t, isRed=false){
  g.save();
  g.translate(cx, cy);
  g.fillStyle = '#0B1220';
  circ(0, 0, r);
  g.strokeStyle = isRed ? rgba(PAL.alert, 0.72) : '#475569';
  g.lineWidth = 4;
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke();
  /* Marcadores de hora */
  g.strokeStyle = 'rgba(226, 232, 240, 0.48)';
  g.lineWidth = 2.5;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    g.beginPath();
    g.moveTo(Math.cos(a) * r * 0.74, Math.sin(a) * r * 0.74);
    g.lineTo(Math.cos(a) * r * 0.88, Math.sin(a) * r * 0.88);
    g.stroke();
  }
  /* Ponteiros hora, minuto e segundo girando a cada frame */
  const hAng = -Math.PI * 0.35 + t * 0.02;
  const mAng = -Math.PI * 0.85 + t * 0.18;
  const sAng = -Math.PI * 0.5 + t * (Math.PI * 2 / 12);
  g.lineCap = 'round';
  g.strokeStyle = '#E2E8F0'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(hAng) * r * 0.44, Math.sin(hAng) * r * 0.44); g.stroke();
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(mAng) * r * 0.66, Math.sin(mAng) * r * 0.66); g.stroke();
  g.strokeStyle = isRed ? PAL.alert : PAL.cyan; g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(sAng) * r * 0.76, Math.sin(sAng) * r * 0.76); g.stroke();
  g.fillStyle = isRed ? PAL.alert : PAL.cyan;
  circ(0, 0, 4);
  g.restore();
}

function drawSpeedLines(t, intensity=0.6, color='#38D9FF'){
  g.save();
  g.lineCap = 'round';
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2 + Math.sin(t * 5 + i) * 0.04;
    const r0 = 390 + ((t * 480 + i * 73) % 140);
    const r1 = r0 + 190 + (i % 3) * 55;
    g.strokeStyle = rgba(color, intensity * (0.16 + 0.16 * hash(i * 19 + Math.floor(t * 15))));
    g.lineWidth = 2 + (i % 3) * 1.4;
    g.beginPath();
    g.moveTo(540 + Math.cos(a) * r0, 920 + Math.sin(a) * r0);
    g.lineTo(540 + Math.cos(a) * r1, 920 + Math.sin(a) * r1);
    g.stroke();
  }
  g.restore();
}

function drawHelicopter(cx, cy, t, sc=1, dir=1, isRed=false){
  g.save();
  g.translate(cx, cy);
  g.scale(sc * dir, sc);
  const pitch = Math.sin(t * 2.8) * 0.07 - 0.06;
  g.rotate(pitch);

  /* Holofote varrendo a cena */
  const beamAng = 0.42 + Math.sin(t * 2.4) * 0.28;
  g.save();
  g.translate(38, 22);
  g.rotate(beamAng);
  const bg = g.createLinearGradient(0, 0, 0, 560);
  bg.addColorStop(0, rgba(isRed ? '#FECACA' : '#E0F2FE', 0.34));
  bg.addColorStop(1, 'rgba(224,242,254,0)');
  g.fillStyle = bg;
  g.beginPath();
  g.moveTo(-12, 0); g.lineTo(12, 0); g.lineTo(135, 560); g.lineTo(-135, 560);
  g.closePath(); g.fill();
  g.restore();

  /* Cauda e rotor traseiro girando */
  g.strokeStyle = '#1E293B';
  g.lineWidth = 14;
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(-48, -6); g.lineTo(-148, -14); g.lineTo(-162, -38); g.stroke();
  const tailSpin = t * 44;
  g.strokeStyle = '#94A3B8'; g.lineWidth = 4;
  g.beginPath();
  g.moveTo(-156 + Math.cos(tailSpin) * 20, -24 + Math.sin(tailSpin) * 20);
  g.lineTo(-156 - Math.cos(tailSpin) * 20, -24 - Math.sin(tailSpin) * 20);
  g.stroke();

  /* Esquis de pouso */
  g.strokeStyle = '#475569'; g.lineWidth = 5;
  g.beginPath();
  g.moveTo(-42, 42); g.lineTo(54, 42);
  g.moveTo(-24, 24); g.lineTo(-28, 42);
  g.moveTo(28, 24); g.lineTo(32, 42);
  g.stroke();

  /* Fuselagem e cabine iluminada */
  g.fillStyle = '#0F172A';
  ell(6, 2, 74, 34);
  g.strokeStyle = isRed ? rgba(PAL.alert, 0.72) : rgba(PAL.cyan, 0.65);
  g.lineWidth = 3;
  g.beginPath(); g.ellipse(6, 2, 74, 34, 0, -Math.PI * 0.6, Math.PI * 0.35); g.stroke();
  g.fillStyle = isRed ? '#FCA5A5' : '#7DD3FC';
  g.beginPath();
  g.moveTo(24, -18); g.quadraticCurveTo(68, -16, 74, 6); g.lineTo(22, 8); g.closePath();
  g.fill();

  /* Luz anticolisao piscando */
  if (Math.sin(t * 14) > 0) {
    glow(-148, -14, 34, PAL.alert, 0.85);
    g.fillStyle = PAL.alert;
    circ(-148, -14, 5);
  }

  /* Mastro e helice principal girando em alta velocidade */
  g.fillStyle = '#64748B';
  g.fillRect(-5, -48, 10, 22);
  const rotorW = 136 * (0.45 + 0.55 * Math.abs(Math.cos(t * 38)));
  g.fillStyle = 'rgba(203, 213, 225, 0.22)';
  ell(0, -48, 142, 9);
  g.strokeStyle = '#E2E8F0';
  g.lineWidth = 5;
  g.beginPath();
  g.moveTo(-rotorW, -48); g.lineTo(rotorW, -48);
  g.stroke();
  g.restore();
}

function drawArrowVolley(t, count=11, accent='#FF3B30'){
  g.save();
  for (let i = 0; i < count; i++) {
    const spd = 1.15 + (i % 4) * 0.28;
    const p = ((t * spd + i * 0.19) % 1.15);
    const sx = 1120 - p * 1240 + (i % 3) * 40;
    const sy = 340 + (i * 68) % 520 + p * 340;
    const ang = Math.atan2(340, -1240);
    g.save();
    g.translate(sx, sy);
    g.rotate(ang);
    /* Trilha luminosa de velocidade */
    const trG = g.createLinearGradient(0, 0, -135, 0);
    trG.addColorStop(0, rgba(accent, 0.75));
    trG.addColorStop(1, 'rgba(255,59,48,0)');
    g.strokeStyle = trG;
    g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(-135, 0); g.stroke();
    /* Haste de madeira */
    g.strokeStyle = '#D97706';
    g.lineWidth = 4.5;
    g.beginPath(); g.moveTo(-74, 0); g.lineTo(14, 0); g.stroke();
    /* Ponta metalica afiada */
    g.fillStyle = '#F8FAFC';
    g.beginPath(); g.moveTo(26, 0); g.lineTo(8, -7); g.lineTo(12, 0); g.lineTo(8, 7); g.closePath(); g.fill();
    /* Penas traseiras */
    g.strokeStyle = PAL.yellow; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(-64, 0); g.lineTo(-78, -9);
    g.moveTo(-64, 0); g.lineTo(-78, 9);
    g.stroke();
    g.restore();
  }
  g.restore();
}

function drawRadarPulseRing(cx, cy, maxR, t, color='#FF3B30', label='5 KM'){
  g.save();
  for (let k = 0; k < 3; k++) {
    const p = ((t * 0.72 + k * 0.33) % 1);
    const r = lerp(45, maxR, easeOut(p));
    g.strokeStyle = rgba(color, (1 - p) * 0.75);
    g.lineWidth = lerp(5, 2, p);
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  }
  /* Anel limite tracejado + varredura giratoria */
  g.strokeStyle = rgba(color, 0.62);
  g.lineWidth = 3;
  g.setLineDash([12, 10]);
  g.beginPath(); g.arc(cx, cy, maxR * 0.84, 0, Math.PI * 2); g.stroke();
  g.setLineDash([]);

  const sw = t * 2.2;
  g.fillStyle = rgba(color, 0.16);
  g.beginPath();
  g.moveTo(cx, cy);
  g.arc(cx, cy, maxR * 0.84, sw, sw + 0.65);
  g.closePath(); g.fill();

  if (label) {
    g.fillStyle = 'rgba(10, 15, 29, 0.82)';
    rr(cx - 58, cy - maxR * 0.84 - 22, 116, 36, 10); g.fill();
    g.strokeStyle = rgba(color, 0.75);
    g.lineWidth = 2;
    rr(cx - 58, cy - maxR * 0.84 - 22, 116, 36, 10); g.stroke();
    g.fillStyle = color;
    g.font = `900 22px ${MONO}`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, cx, cy - maxR * 0.84 - 3);
  }
  g.restore();
}

function drawExplosionShock(cx, cy, t, localP, color='#FF3B30'){
  g.save();
  const p = ((t * 1.4) % 1);
  glow(cx, cy, lerp(140, 440, easeOut(p)), color, (1 - p) * 0.55);
  for (let k = 0; k < 3; k++) {
    const pk = ((t * 1.4 + k * 0.22) % 1);
    g.strokeStyle = rgba(k === 0 ? PAL.yellow : color, (1 - pk) * 0.85);
    g.lineWidth = lerp(10, 2, pk);
    g.beginPath(); g.arc(cx, cy, lerp(30, 420, easeOut(pk)), 0, Math.PI * 2); g.stroke();
  }
  /* Faiscas radiais voando */
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + 0.2;
    const dist = lerp(40, 390, easeOut((t * 1.6 + i * 0.09) % 1));
    const px = cx + Math.cos(a) * dist;
    const py = cy + Math.sin(a) * dist;
    g.fillStyle = i % 2 === 0 ? PAL.yellow : color;
    circ(px, py, 5.5 - (dist / 420) * 3.5);
  }
  g.restore();
}

/* CENARIO 1: oceano_ilha (ondas animadas, ilha + palmeiras, barco, radar 5KM, flechas, helicoptero, tsunami) */
function drawOceanoIlha(t, shot, f, localP){
  const isRed = shot.mood === 'red';
  const acao = shot.acao_cena || 'barco_navegando';
  drawBackdrop(t, shot.mood || 'navy');

  /* Ceu oceanico dramatico com gradiente e nuvens deslizando */
  const skyG = g.createLinearGradient(0, 0, 0, 980);

    skyG.addColorStop(0, '#1B0712');
    skyG.addColorStop(0.55, '#3A1120');
    skyG.addColorStop(1, '#12182B');
  } else if (shot.mood === 'yellow') {
    skyG.addColorStop(0, '#0D172B');
    skyG.addColorStop(0.55, '#2B241A');
    skyG.addColorStop(1, '#0F223A');
  } else {
    skyG.addColorStop(0, '#061126');
    skyG.addColorStop(0.58, '#0D294A');
    skyG.addColorStop(1, '#133C5E');
  }
  g.fillStyle = skyG;
  g.fillRect(-120, -100, W + 240, 1090);

  /* Lua / brilho atmosferico no horizonte */
  const moonX = 240 + Math.sin(t * 0.25) * 14;
  const moonY = 390;
  glow(moonX, moonY, 260, isRed ? PAL.alert : '#BAE6FD', 0.28);
  g.fillStyle = isRed ? '#FCA5A5' : '#E0F2FE';
  circ(moonX, moonY, 54);

  /* Nuvens oceanicas em paralaxe */
  g.fillStyle = isRed ? 'rgba(255, 130, 130, 0.10)' : 'rgba(186, 230, 253, 0.11)';
  for (let i = 0; i < 4; i++) {
    const cx = ((t * (18 + i * 7) + i * 310) % (W + 420)) - 210;
    const cy = 320 + i * 95;
    ell(cx, cy, 180 + i * 25, 34);
    ell(cx + 85, cy - 16, 110, 28);
  }

  /* Aves marinhas distantes batendo asas */
  g.strokeStyle = 'rgba(226, 232, 240, 0.45)';
  g.lineWidth = 3;
  for (let b = 0; b < 3; b++) {
    const bx = ((t * 46 + b * 240) % (W + 180)) - 90;
    const by = 460 + b * 42 + Math.sin(t * 3 + b) * 12;
    const flap = Math.sin(t * 9 + b * 2.1) * 9;
    g.beginPath();
    g.moveTo(bx - 16, by + flap); g.quadraticCurveTo(bx - 6, by - 8, bx, by);
    g.quadraticCurveTo(bx + 6, by - 8, bx + 16, by + flap);
    g.stroke();
  }

  /* Onda gigante / tsunami atras da ilha se acao_cena === onda_gigante */
  if (acao === 'onda_gigante') {
    const waveRise = easeOut(clamp(localP * 1.15));
    const crestY = lerp(740, 440, waveRise) + Math.sin(t * 5.2) * 18;
    const wg = g.createLinearGradient(0, crestY, 0, 1080);
    wg.addColorStop(0, '#38BDF8');
    wg.addColorStop(0.25, '#0369A1');
    wg.addColorStop(1, '#082F49');
    g.fillStyle = wg;
    g.beginPath();
    g.moveTo(-120, 1080);
    g.lineTo(-120, crestY + 120);
    g.quadraticCurveTo(220, crestY - 120, 620, crestY + 15);
    g.quadraticCurveTo(860, crestY + 90, W + 140, crestY - 30);
    g.lineTo(W + 140, 1080);
    g.closePath();
    g.fill();
    /* Espuma revolta na crista do tsunami */
    g.strokeStyle = 'rgba(224, 242, 254, 0.85)';
    g.lineWidth = 14;
    g.beginPath();
    g.moveTo(-80, crestY + 95);
    g.quadraticCurveTo(220, crestY - 115, 620, crestY + 18);
    g.stroke();
    for (let sp = 0; sp < 14; sp++) {
      const sx = 120 + sp * 62 + Math.sin(t * 8 + sp) * 18;
      const sy = crestY - 25 + Math.cos(t * 7 + sp * 1.3) * 32;
      g.fillStyle = 'rgba(224, 242, 254, 0.65)';
      circ(sx, sy, 5 + (sp % 4) * 3);
    }
  }

  /* Ilha tropical densa (Ilha Sentinela) ao fundo direito */
  const islX = 760, islY = 965;
  g.fillStyle = '#071520';
  g.beginPath();
  g.moveTo(430, islY);
  g.quadraticCurveTo(560, islY - 165, 740, islY - 210);
  g.quadraticCurveTo(890, islY - 245, 1060, islY - 110);
  g.lineTo(1160, islY + 20);
  g.lineTo(430, islY + 20);
  g.closePath();
  g.fill();
  /* Faixa de areia escura na praia */
  g.fillStyle = '#332C24';
  ell(760, islY - 8, 280, 22);

  /* 3 palmeiras balancando continuamente no vento */
  const palms = [
    { x: 610, y: islY - 118, h: 125, lean: -22, ph: 0.2 },
    { x: 755, y: islY - 188, h: 150, lean: 14, ph: 1.4 },
    { x: 890, y: islY - 148, h: 132, lean: 28, ph: 2.7 }
  ];
  for (const pm of palms) {
    const sway = Math.sin(t * 2.6 + pm.ph) * 16;
    const topX = pm.x + pm.lean + sway;
    const topY = pm.y - pm.h;
    g.strokeStyle = '#1E293B';
    g.lineWidth = 10;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(pm.x, pm.y);
    g.quadraticCurveTo(pm.x + pm.lean * 0.4, pm.y - pm.h * 0.55, topX, topY);
    g.stroke();
    /* Folhas de palmeira */
    g.strokeStyle = isRed ? '#2F1B24' : '#0F3B3E';
    g.lineWidth = 7;
    for (let fr = -2; fr <= 2; fr++) {
      const ang = -Math.PI * 0.5 + fr * 0.55 + sway * 0.012;
      const fx = topX + Math.cos(ang) * 58;
      const fy = topY + Math.sin(ang) * 42 + 16;
      g.beginPath();
      g.moveTo(topX, topY);
      g.quadraticCurveTo(topX + Math.cos(ang) * 32, topY + Math.sin(ang) * 18 - 10, fx, fy);
      g.stroke();
    }
  }

  /* Radar pulsante de exclusao ao redor da ilha */
  if (acao === 'radar_alerta' || acao === 'investigando_pista') {
    const rLabel = (shot.hud_dado && shot.hud_dado.valor) ? String(shot.hud_dado.valor).slice(0, 10) : '5 KM';
    drawRadarPulseRing(750, 860, 290, t, isRed ? PAL.alert : PAL.cyan, rLabel);
  }

  /* Helicoptero sobrevoando a ilha com helice girando */
  if (acao === 'helicoptero_sobrevoando') {
    const hx = 560 + Math.sin(t * 1.4) * 110;
    const hy = 460 + Math.cos(t * 2.1) * 26;
    drawHelicopter(hx, hy, t, 1.05, 1, isRed);
  }

  /* 3 camadas de ondas do oceano animadas em 30fps */
  const waveLayers = [
    { yBase: 965, amp: 14, freq: 0.012, spd: 2.2, col: '#0A2540', foam: 'rgba(125,211,252,0.22)' },
    { yBase: 1085, amp: 20, freq: 0.010, spd: -2.8, col: '#071C33', foam: 'rgba(186,230,253,0.26)' },
    { yBase: 1225, amp: 24, freq: 0.0085, spd: 3.4, col: '#041224', foam: 'rgba(56,217,255,0.20)' }
  ];

  for (let li = 0; li < waveLayers.length; li++) {
    const wl = waveLayers[li];
    /* Barco balancando nas ondas entre camada 1 e 2 (separado do protagonista para silhueta limpa) */
    if (li === 1) {
      const boatX = 705 + Math.sin(t * 0.9) * 34;
      const boatY = 1048 + Math.sin(t * 2.8 + boatX * 0.01) * 18;
      const boatPitch = Math.cos(t * 2.8 + boatX * 0.01) * 0.11;
      g.save();
      g.translate(boatX, boatY);
      g.rotate(boatPitch);
      /* Casco do barco */
      g.fillStyle = '#3B2318';
      g.beginPath();
      g.moveTo(-105, -8); g.lineTo(105, -14); g.lineTo(76, 32); g.lineTo(-82, 32);
      g.closePath(); g.fill();
      g.strokeStyle = '#78350F'; g.lineWidth = 4; g.stroke();
      /* Mastro e lanterna */
      g.fillStyle = '#1E293B';
      g.fillRect(-6, -110, 10, 102);
      glow(24, -76, 72, PAL.yellow, 0.35 + 0.15 * Math.sin(t * 8));
      g.fillStyle = PAL.yellow;
      circ(24, -76, 7);
      g.restore();
    }

    g.fillStyle = wl.col;
    g.beginPath();
    g.moveTo(-140, H + 120);
    for (let x = -140; x <= W + 140; x += 36) {
      const wy = wl.yBase + Math.sin(x * wl.freq + t * wl.spd) * wl.amp + Math.cos(x * wl.freq * 1.9 - t * wl.spd * 0.6) * (wl.amp * 0.4);
      g.lineTo(x, wy);
    }
    g.lineTo(W + 140, H + 120);
    g.closePath();
    g.fill();

    g.strokeStyle = wl.foam;
    g.lineWidth = 5;
    g.beginPath();
    for (let x = -140; x <= W + 140; x += 36) {
      const wy = wl.yBase + Math.sin(x * wl.freq + t * wl.spd) * wl.amp + Math.cos(x * wl.freq * 1.9 - t * wl.spd * 0.6) * (wl.amp * 0.4);
      if (x === -140) g.moveTo(x, wy); else g.lineTo(x, wy);
    }
    g.stroke();
  }

  /* Piso de pier / proa de madeira em primeiro plano onde o protagonista se apoia */
  g.fillStyle = '#141B29';
  rr(-60, 1326, W + 120, 620, 0); g.fill();
  g.fillStyle = '#1E293B';
  g.fillRect(-60, 1326, W + 120, 14);

  /* Protagonista animado */
  drawProtagonista(280, 1352, 0.98, {
    t, ex: shot.expressao || f.ex, closed: f.closed, localP,
    fastBreath: isRed || acao === 'onda_gigante' || acao === 'chuva_flechas',
    pose: shot.pose || 'falando',
    prevPose: shot.prevPose || null,
    shotAge: Math.max(0, t - shot.start),
    rimColor: isRed ? PAL.alert : PAL.cyan,
    rimA: 0.88,
    lookX: 0.35
  });

  /* Chuva de flechas ou explosao na camada frontal */
  if (acao === 'chuva_flechas') {
    drawArrowVolley(t, 12, isRed ? PAL.alert : PAL.yellow);
  } else if (acao === 'explosao_choque') {
    drawExplosionShock(740, 740, t, localP, PAL.alert);
  }
}

/* CENARIO 2: espaco_orbita (estrelas em paralaxe, planeta girando, satelite, asteroides, trajetorias) */
function drawEspacoOrbita(t, shot, f, localP){
  const isRed = shot.mood === 'red';
  const acao = shot.acao_cena || 'flutuando_gravidade';
  vgrad(isRed ? '#150612' : '#030714', '#02040A');

  /* Nebulosa sutil animada */
  glow(260 + Math.sin(t * 0.4) * 50, 520, 480, isRed ? PAL.alert : PAL.violet, 0.22);
  glow(820 - Math.cos(t * 0.35) * 40, 760, 420, PAL.cyan, 0.16);

  /* Campo de estrelas em 2 camadas de paralaxe continua */
  for (let i = 0; i < 72; i++) {
    const layer = i % 2 === 0 ? 1 : 2;
    const sx = ((hash(i * 17.3) * W - t * (12 * layer)) % W + W) % W;
    const sy = 140 + hash(i * 31.7) * 1240;
    const tw = 0.45 + 0.55 * Math.sin(t * (2.5 + (i % 5)) + i * 1.7);
    g.fillStyle = rgba(i % 7 === 0 ? '#7DD3FC' : '#F8FAFC', tw * (layer === 2 ? 0.9 : 0.55));
    circ(sx, sy, layer === 2 ? 2.8 : 1.7);
  }

  /* Estrela cadente periodica */
  const shP = (t * 0.65) % 1;
  if (shP < 0.35) {
    const k = shP / 0.35;
    const x0 = lerp(960, 180, k), y0 = lerp(260, 540, k);
    const sg = g.createLinearGradient(x0, y0, x0 + 130, y0 - 46);
    sg.addColorStop(0, '#FFFFFF'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    g.strokeStyle = sg; g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + 130, y0 - 46); g.stroke();
  }

  /* Planeta / Terra girando com atmosfera luminosa */
  const px = 660, py = 680, pr = 255;
  glow(px, py, pr * 1.55, isRed ? PAL.alert : PAL.cyan, 0.30);
  g.save();
  g.beginPath(); g.arc(px, py, pr, 0, Math.PI * 2); g.clip();
  const pg = g.createRadialGradient(px - 80, py - 80, 30, px, py, pr);
  pg.addColorStop(0, isRed ? '#7F1D1D' : '#1D4ED8');
  pg.addColorStop(0.65, isRed ? '#3B0A14' : '#0B2856');
  pg.addColorStop(1, '#030816');
  g.fillStyle = pg;
  g.fillRect(px - pr, py - pr, pr * 2, pr * 2);

  /* Continentes deslizando continuamente para simular rotacao planetaria */
  const rotShift = (t * 48) % (pr * 2.6);
  g.fillStyle = isRed ? 'rgba(248, 113, 113, 0.30)' : 'rgba(52, 211, 153, 0.38)';
  for (let rep = -1; rep <= 1; rep++) {
    const ox = px - pr + rotShift + rep * pr * 2.6;
    ell(ox - 40, py - 55, 92, 46);
    ell(ox + 95, py + 40, 110, 52);
    ell(ox - 120, py + 75, 76, 36);
  }
  /* Faixas de nuvens girando ligeiramente mais rapido */
  const clShift = (t * 66) % (pr * 2.4);
  g.fillStyle = 'rgba(224, 242, 254, 0.22)';
  for (let rep = -1; rep <= 1; rep++) {
    const cx0 = px - pr + clShift + rep * pr * 2.4;
    rr(cx0 - 80, py - 115, 165, 18, 9); g.fill();
    rr(cx0 + 40, py + 15, 195, 16, 8); g.fill();
    rr(cx0 - 110, py + 102, 140, 14, 7); g.fill();
  }
  /* Sombra noturna curva */
  g.fillStyle = 'rgba(2, 6, 18, 0.52)';
  circ(px + 135, py + 90, pr * 1.02);
  g.restore();

  /* Rim atmosferico do planeta */
  g.strokeStyle = isRed ? rgba(PAL.alert, 0.72) : rgba(PAL.cyan, 0.78);
  g.lineWidth = 5;
  g.beginPath(); g.arc(px, py, pr + 2, Math.PI * 0.85, Math.PI * 1.95); g.stroke();

  /* Arco de trajetoria orbital tracejado animado */
  g.save();
  g.translate(px, py);
  g.rotate(-0.34);
  g.strokeStyle = rgba(isRed ? PAL.alert : PAL.cyan, 0.45);
  g.lineWidth = 3;
  g.setLineDash([16, 12]);
  g.lineDashOffset = -t * 58;
  g.beginPath(); g.ellipse(0, 0, pr + 135, 95, 0, 0, Math.PI * 2); g.stroke();
  g.setLineDash([]);

  /* Satelite orbitando ao longo da elipse */
  const satAng = t * 1.15;
  const satX = Math.cos(satAng) * (pr + 135);
  const satY = Math.sin(satAng) * 95;
  g.save();
  g.translate(satX, satY);
  g.rotate(satAng * 0.4);
  g.fillStyle = '#0284C7';
  rr(-44, -10, 32, 20, 3); g.fill();
  rr(12, -10, 32, 20, 3); g.fill();
  g.fillStyle = '#E2E8F0';
  rr(-11, -14, 22, 28, 4); g.fill();
  if (Math.sin(t * 10) > 0) {
    g.fillStyle = PAL.alert;
    circ(0, -18, 4.5);
  }
  g.restore();
  g.restore();

  /* Asteroides girando em primeiro plano */
  for (let a = 0; a < 4; a++) {
    const ax = ((1160 - (t * (55 + a * 22) + a * 310)) % (W + 240) + (W + 240)) % (W + 240) - 120;
    const ay = 360 + a * 210 + Math.sin(t * 1.5 + a) * 24;
    g.save();
    g.translate(ax, ay);
    g.rotate(t * (0.8 + a * 0.35));
    g.fillStyle = '#334155';
    g.beginPath();
    g.moveTo(-22, -10); g.lineTo(6, -24); g.lineTo(26, -6); g.lineTo(18, 20); g.lineTo(-14, 18);
    g.closePath(); g.fill();
    g.strokeStyle = '#64748B'; g.lineWidth = 2.5; g.stroke();
    g.restore();
  }

  if (acao === 'radar_alerta') {
    drawRadarPulseRing(px, py, 240, t, PAL.alert, 'ORBITA');
  } else if (acao === 'explosao_choque') {
    drawExplosionShock(px - 60, py - 40, t, localP, PAL.alert);
  }

  /* Plataforma espacial escura na base */
  g.fillStyle = '#0A101E';
  g.fillRect(-120, 1340, W + 240, 620);
  g.strokeStyle = rgba(PAL.cyan, 0.38); g.lineWidth = 4;
  g.beginPath(); g.moveTo(-120, 1342); g.lineTo(W + 120, 1342); g.stroke();

  const isFloat = shot.pose === 'flutuando' || acao === 'flutuando_gravidade';
  drawProtagonista(310, isFloat ? 1270 : 1352, 0.98, {
    t, ex: shot.expressao || f.ex, closed: f.closed, localP,
    fastBreath: isRed,
    pose: isFloat ? 'flutuando' : (shot.pose || 'apontando'),
    prevPose: shot.prevPose || null,
    shotAge: Math.max(0, t - shot.start),
    rimColor: isRed ? PAL.alert : PAL.cyan,
    rimA: 0.92,
    lookX: 0.35
  });
}

/* CENARIO 3: cidade_rua (skyline em paralaxe, postes luminosos, asfalto molhado e farois) */
function drawCidadeRua(t, shot, f, localP){
  const isRed = shot.mood === 'red';
  const acao = shot.acao_cena || 'corrida_fuga';
  const scrollSpd = (acao === 'corrida_fuga' || shot.pose === 'correndo') ? 160 : 42;
  drawBackdrop(t, shot.mood || 'navy');

  /* Ceu urbano noturno */
  vgrad(isRed ? '#210A15' : '#081226', '#0D1B33', 0, 1160);

  /* Skyline traseiro em paralaxe lenta */
  const backShift = (t * scrollSpd * 0.25) % 900;
  for (let rep = -1; rep <= 2; rep++) {
    const bx0 = rep * 900 - backShift;
    const heights = [360, 520, 410, 610, 470, 540, 390];
    for (let i = 0; i < heights.length; i++) {
      const x = bx0 + i * 130;
      const h = heights[i];
      g.fillStyle = isRed ? '#1A0C16' : '#0A1629';
      g.fillRect(x, 1160 - h, 116, h);
      /* Antena piscante no topo dos predios mais altos */
      if (h > 500) {
        g.strokeStyle = '#475569'; g.lineWidth = 3;
        g.beginPath(); g.moveTo(x + 58, 1160 - h); g.lineTo(x + 58, 1160 - h - 46); g.stroke();
        if (Math.sin(t * 7 + i) > 0) {
          g.fillStyle = PAL.alert;
          circ(x + 58, 1160 - h - 48, 5);
        }
      }
      /* Janelas iluminadas */
      g.fillStyle = isRed ? 'rgba(255, 130, 130, 0.20)' : 'rgba(250, 204, 21, 0.22)';
      for (let wy = 1160 - h + 28; wy < 1120; wy += 34) {
        for (let wx = x + 16; wx < x + 98; wx += 24) {
          if (hash(wx * 5 + wy * 3) > 0.42) g.fillRect(wx, wy, 12, 16);
        }
      }
    }
  }

  /* Postes de rua em paralaxe mais rapida com cone de luz */
  const lampShift = (t * scrollSpd) % 520;
  for (let rep = -1; rep <= 3; rep++) {
    const lx = rep * 520 - lampShift;
    g.strokeStyle = '#334155'; g.lineWidth = 9;
    g.beginPath(); g.moveTo(lx, 1210); g.lineTo(lx, 760); g.lineTo(lx + 42, 760); g.stroke();
    g.fillStyle = isRed ? '#FCA5A5' : '#FEF08A';
    rr(lx + 24, 756, 30, 10, 4); g.fill();
    const lg = g.createLinearGradient(lx + 38, 766, lx + 38, 1220);
    lg.addColorStop(0, rgba(isRed ? PAL.alert : PAL.yellow, 0.24));
    lg.addColorStop(1, 'rgba(255,212,0,0)');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(lx + 22, 766); g.lineTo(lx + 54, 766); g.lineTo(lx + 160, 1220); g.lineTo(lx - 84, 1220);
    g.closePath(); g.fill();
  }

  /* Rua asfaltada + faixas passando + rastros de farol */
  g.fillStyle = '#090E19';
  g.fillRect(-120, 1160, W + 240, 820);
  g.fillStyle = '#1E293B';
  g.fillRect(-120, 1160, W + 240, 12);
  /* Faixas da pista correndo */
  const laneShift = (t * scrollSpd * 1.45) % 210;
  g.fillStyle = 'rgba(255, 212, 0, 0.48)';
  for (let x = -220; x < W + 260; x += 210) {
    rr(x - laneShift, 1244, 110, 12, 5); g.fill();
  }
  /* Rastros luminosos de carros ao fundo */
  for (let c = 0; c < 3; c++) {
    const cx = ((t * (380 + c * 110) + c * 420) % (W + 460)) - 230;
    const cy = 1192 + c * 16;
    const cg = g.createLinearGradient(cx, cy, cx - 180, cy);
    cg.addColorStop(0, c % 2 === 0 ? PAL.alert : '#E0F2FE');
    cg.addColorStop(1, 'rgba(0,0,0,0)');
    g.strokeStyle = cg; g.lineWidth = 6;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx - 180, cy); g.stroke();
  }

  /* Helicoptero ou sirene / linhas de velocidade em corrida */
  if (acao === 'helicoptero_sobrevoando') {
    drawHelicopter(720 + Math.sin(t * 1.3) * 90, 420 + Math.cos(t * 2) * 20, t, 0.95, -1, isRed);
  }
  if (acao === 'corrida_fuga') {
    const sirenRed = Math.sin(t * 13) > 0;
    glow(sirenRed ? 160 : 920, 1080, 320, sirenRed ? PAL.alert : '#3B82F6', 0.24);
    drawSpeedLines(t, 0.55, isRed ? PAL.alert : PAL.cyan);
  } else if (acao === 'explosao_choque') {
    drawExplosionShock(760, 760, t, localP, PAL.alert);
  }

  drawProtagonista(420, 1358, 1.00, {
    t, ex: shot.expressao || f.ex, closed: f.closed, localP,
    fastBreath: isRed || acao === 'corrida_fuga',
    pose: shot.pose || (acao === 'corrida_fuga' ? 'correndo' : 'falando'),
    prevPose: shot.prevPose || null,
    shotAge: Math.max(0, t - shot.start),
    rimColor: isRed ? PAL.alert : PAL.cyan,
    rimA: 0.85,
    lookX: 0.22
  });
}

/* CENARIO 4: ceu_nuvens (nuvens em paralaxe, raios, aeronave/helicoptero e linhas de vento) */
function drawCeuNuvens(t, shot, f, localP){
  const isRed = shot.mood === 'red';
  const acao = shot.acao_cena || 'flutuando_gravidade';
  const skyG = g.createLinearGradient(0, 0, 0, H);
  if (isRed) {
    skyG.addColorStop(0, '#1D0812');
    skyG.addColorStop(0.55, '#3F1426');
    skyG.addColorStop(1, '#090D18');
  } else {
    skyG.addColorStop(0, '#071734');
    skyG.addColorStop(0.55, '#13345F');
    skyG.addColorStop(1, '#091122');
  }
  g.fillStyle = skyG;
  g.fillRect(-140, -140, W + 280, H + 280);

  /* Relampago animado atravessando as nuvens */
  const boltPulse = Math.sin(t * 7.8) * Math.sin(t * 19.3);
  if (boltPulse > 0.55 || acao === 'explosao_choque') {
    const bx = 260 + ((Math.floor(t * 2) * 290) % 580);
    glow(bx, 560, 420, '#E0F2FE', 0.32);
    g.strokeStyle = '#F8FAFC';
    g.lineWidth = 7;
    g.beginPath();
    g.moveTo(bx, 180);
    g.lineTo(bx - 42, 410);
    g.lineTo(bx + 26, 540);
    g.lineTo(bx - 35, 790);
    g.stroke();
  }

  /* 3 camadas de nuvens volumetricas deslizando continuamente */
  const cloudBands = [
    { y: 420, spd: 28, col: isRed ? 'rgba(254, 202, 202, 0.14)' : 'rgba(186, 230, 253, 0.16)', r: 150 },
    { y: 760, spd: 54, col: isRed ? 'rgba(159, 18, 57, 0.28)' : 'rgba(56, 189, 248, 0.20)', r: 185 },
    { y: 1180, spd: 86, col: isRed ? 'rgba(30, 12, 22, 0.78)' : 'rgba(12, 28, 54, 0.80)', r: 230 }
  ];
  for (let bi = 0; bi < cloudBands.length; bi++) {
    const cb = cloudBands[bi];
    g.fillStyle = cb.col;
    for (let i = 0; i < 4; i++) {
      const cx = ((t * cb.spd + i * 380) % (W + 520)) - 260;
      const cy = cb.y + Math.sin(t * 0.9 + i + bi) * 18;
      ell(cx, cy, cb.r, cb.r * 0.34);
      ell(cx - cb.r * 0.48, cy + 16, cb.r * 0.65, cb.r * 0.26);
      ell(cx + cb.r * 0.52, cy + 12, cb.r * 0.70, cb.r * 0.28);
    }
  }

  /* Helicoptero ou jato cortando as nuvens */
  if (acao === 'helicoptero_sobrevoando') {
    drawHelicopter(540 + Math.sin(t * 1.6) * 140, 500 + Math.cos(t * 2.2) * 32, t, 1.15, 1, isRed);
  } else {
    const jx = ((t * 190) % (W + 380)) - 190;
    const jy = 460 + Math.sin(t * 1.4) * 28;
    const trG = g.createLinearGradient(jx, jy, jx - 240, jy);
    trG.addColorStop(0, 'rgba(224,242,254,0.55)');
    trG.addColorStop(1, 'rgba(224,242,254,0)');
    g.strokeStyle = trG; g.lineWidth = 6;
    g.beginPath(); g.moveTo(jx, jy - 8); g.lineTo(jx - 240, jy - 8); g.stroke();
    g.beginPath(); g.moveTo(jx, jy + 8); g.lineTo(jx - 240, jy + 8); g.stroke();
    g.fillStyle = '#E2E8F0';
    g.beginPath();
    g.moveTo(jx + 34, jy); g.lineTo(jx - 18, jy - 18); g.lineTo(jx - 8, jy); g.lineTo(jx - 18, jy + 18);
    g.closePath(); g.fill();
  }

  /* Linhas de vento verticais para sensacao de altitude / queda */
  g.strokeStyle = 'rgba(224, 242, 254, 0.22)';
  g.lineWidth = 3;
  for (let w = 0; w < 14; w++) {
    const wx = 80 + ((w * 97) % (W - 160));
    const wy = ((H - (t * 620 + w * 180)) % H + H) % H;
    g.beginPath(); g.moveTo(wx, wy); g.lineTo(wx, wy + 120); g.stroke();
  }

  /* Base escura para contraste de legendas */
  const botG = g.createLinearGradient(0, 1280, 0, H);
  botG.addColorStop(0, 'rgba(5, 9, 18, 0)');
  botG.addColorStop(0.35, 'rgba(5, 9, 18, 0.82)');
  botG.addColorStop(1, '#040710');
  g.fillStyle = botG;
  g.fillRect(-120, 1280, W + 240, 680);

  drawProtagonista(520, (shot.pose === 'caindo' || shot.pose === 'flutuando') ? 1265 : 1345, 1.00, {
    t, ex: shot.expressao || f.ex, closed: f.closed, localP,
    fastBreath: true,
    pose: shot.pose || 'flutuando',
    prevPose: shot.prevPose || null,
    shotAge: Math.max(0, t - shot.start),
    rimColor: isRed ? PAL.alert : '#7DD3FC',
    rimA: 0.92,
    lookY: -0.25
  });
}

/* CENARIO 5: floresta_noite (arvores balancando no vento, neblina, vagalumes e olhos ocultos) */
function drawFlorestaNoite(t, shot, f, localP){
  const isRed = shot.mood === 'red';
  const acao = shot.acao_cena || 'investigando_pista';
  drawBackdrop(t, shot.mood || 'navy');

  vgrad(isRed ? '#1A0812' : '#05111B', '#030810', 0, 1340);

  /* Lua cheia brilhando atras das copas */
  glow(760, 420, 320, isRed ? PAL.alert : '#BAE6FD', 0.28);
  g.fillStyle = isRed ? '#FECACA' : '#E0F2FE';
  circ(760, 420, 74);

  /* 2 camadas de arvores altas balancando continuamente no vento */
  const treeLayers = [
    { count: 9, col: '#071821', baseY: 1320, hMin: 560, hMax: 840, swayAmp: 12, spd: 1.5 },
    { count: 6, col: '#040E14', baseY: 1360, hMin: 680, hMax: 940, swayAmp: 22, spd: 2.1 }
  ];
  const runShift = (acao === 'corrida_fuga' || shot.pose === 'correndo') ? (t * 145) : 0;
  for (let li = 0; li < treeLayers.length; li++) {
    const tl = treeLayers[li];
    g.fillStyle = tl.col;
    for (let i = 0; i < tl.count; i++) {
      const tx = (((i * (W + 240) / tl.count) - runShift * (li === 1 ? 1.4 : 0.7)) % (W + 240) + (W + 240)) % (W + 240) - 120;
      const th = lerp(tl.hMin, tl.hMax, hash(i * 13 + li * 7));
      const sway = Math.sin(t * tl.spd + i * 1.4) * tl.swayAmp;
      /* Tronco curvo */
      g.beginPath();
      g.moveTo(tx - 18, tl.baseY);
      g.lineTo(tx + 18, tl.baseY);
      g.lineTo(tx + 6 + sway, tl.baseY - th);
      g.lineTo(tx - 6 + sway, tl.baseY - th);
      g.closePath(); g.fill();
      /* Copas em triangulos organicos */
      for (let tier = 0; tier < 3; tier++) {
        const ty = tl.baseY - th * (0.45 + tier * 0.22);
        const tw = 115 - tier * 24;
        const ts = sway * (0.55 + tier * 0.22);
        g.beginPath();
        g.moveTo(tx + ts, ty - 145);
        g.lineTo(tx + ts - tw, ty + 30);
        g.lineTo(tx + ts + tw, ty + 30);
        g.closePath(); g.fill();
      }
    }
  }

  /* Olhos brilhantes ocultos na mata piscando periodicamente */
  const eyeBlink = Math.sin(t * 2.1) > -0.82;
  if (eyeBlink) {
    const ex0 = 835, ey0 = 965;
    glow(ex0, ey0, 64, isRed ? PAL.alert : PAL.yellow, 0.35);
    g.fillStyle = isRed ? PAL.alert : PAL.yellow;
    ell(ex0 - 16, ey0, 8, 4.5);
    ell(ex0 + 16, ey0, 8, 4.5);
  }

  /* Neblina rasteira deslizando */
  for (let fg = 0; fg < 4; fg++) {
    const fx = ((t * (28 + fg * 10) + fg * 340) % (W + 540)) - 270;
    const fy = 1150 + fg * 42;
    g.fillStyle = isRed ? 'rgba(254, 202, 202, 0.08)' : 'rgba(186, 230, 253, 0.09)';
    ell(fx, fy, 290, 56);
  }

  /* Vagalumes brilhantes flutuando em curvas organicas */
  for (let ff = 0; ff < 16; ff++) {
    const fx = 120 + hash(ff * 23) * (W - 240) + Math.sin(t * (1.2 + (ff % 4) * 0.3) + ff) * 46;
    const fy = 520 + hash(ff * 41) * 740 + Math.cos(t * (1.4 + (ff % 3) * 0.35) + ff * 1.7) * 38;
    const pulse = 0.35 + 0.65 * Math.sin(t * 5.2 + ff * 2.1);
    const col = isRed ? PAL.alert : (ff % 2 === 0 ? '#A3E635' : PAL.cyan);
    glow(fx, fy, 26, col, pulse * 0.55);
    g.fillStyle = rgba(col, pulse);
    circ(fx, fy, 3.6);
  }

  /* Chao escuro da trilha */
  g.fillStyle = '#04080E';
  g.fillRect(-120, 1324, W + 240, 640);

  /* Lanterna varrendo a mata em investigando_pista */
  if (acao === 'investigando_pista') {
    const flAng = -0.18 + Math.sin(t * 2.3) * 0.24;
    g.save();
    g.translate(450, 1085);
    g.rotate(flAng);
    const flG = g.createLinearGradient(0, 0, 520, 0);
    flG.addColorStop(0, 'rgba(254, 249, 195, 0.34)');
    flG.addColorStop(1, 'rgba(254, 249, 195, 0)');
    g.fillStyle = flG;
    g.beginPath(); g.moveTo(0, -14); g.lineTo(520, -145); g.lineTo(520, 145); g.lineTo(0, 14); g.closePath(); g.fill();
    g.restore();
  }

  drawProtagonista(365, 1356, 1.00, {
    t, ex: shot.expressao || f.ex, closed: f.closed, localP,
    fastBreath: isRed || acao === 'corrida_fuga',
    pose: shot.pose || 'assustado',
    prevPose: shot.prevPose || null,
    shotAge: Math.max(0, t - shot.start),
    rimColor: isRed ? PAL.alert : '#A3E635',
    rimA: 0.86,
    lookX: 0.35
  });

  if (acao === 'chuva_flechas') {
    drawArrowVolley(t, 10, PAL.alert);
  } else if (acao === 'radar_alerta') {
    drawRadarPulseRing(780, 920, 220, t, PAL.alert, 'ALERTA');
  }
}

/* CENARIO 6: laboratorio (tubos com bolhas, monitor de onda/ECG ao vivo e radar giratorio) */
function drawLaboratorio(t, shot, f, localP){
  const isRed = shot.mood === 'red';
  const accent = isRed ? PAL.alert : PAL.cyan;
  drawBackdrop(t, shot.mood || 'navy');

  vgrad(isRed ? '#1A0A12' : '#081222', '#050914', 0, 1340);

  /* Painel metalico tecnico de fundo */
  g.strokeStyle = 'rgba(148, 163, 184, 0.12)'; g.lineWidth = 2;
  for (let x = 90; x < W; x += 180) { g.beginPath(); g.moveTo(x, 220); g.lineTo(x, 1320); g.stroke(); }
  for (let y = 320; y < 1320; y += 200) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }

  /* 2 tubos de vidro iluminados com bolhas subindo a 30fps */
  const tubes = [{ x: 118, col: isRed ? PAL.alert : '#22D3EE' }, { x: 962, col: isRed ? '#FB7185' : '#34D399' }];
  for (let ti = 0; ti < tubes.length; ti++) {
    const tb = tubes[ti];
    g.fillStyle = '#0F172A';
    rr(tb.x - 56, 390, 112, 46, 10); g.fill();
    rr(tb.x - 56, 1050, 112, 54, 10); g.fill();
    g.fillStyle = rgba(tb.col, 0.16);
    rr(tb.x - 44, 436, 88, 614, 14); g.fill();
    glow(tb.x, 740, 190, tb.col, 0.22);
    /* Bolhas subindo continuamente */
    for (let b = 0; b < 9; b++) {
      const bp = ((t * (0.42 + (b % 3) * 0.15) + b * 0.17 + ti * 0.4) % 1);
      const bx = tb.x + Math.sin(t * 2.5 + b * 2.1) * 22;
      const by = lerp(1030, 460, bp);
      g.fillStyle = rgba(tb.col, 0.65 * (1 - bp * 0.4));
      circ(bx, by, 4 + (b % 4) * 2.4);
    }
    g.strokeStyle = rgba(tb.col, 0.55); g.lineWidth = 3.5;
    rr(tb.x - 44, 436, 88, 614, 14); g.stroke();
  }

  /* Monitor central widescreen de telemetria + onda ao vivo + radar */
  const mx = 200, my = 365, mw = 680, mh = 430;
  g.fillStyle = '#070E1C';
  rr(mx, my, mw, mh, 18); g.fill();
  g.strokeStyle = rgba(accent, 0.68); g.lineWidth = 4;
  rr(mx, my, mw, mh, 18); g.stroke();

  /* Grade interna do monitor */
  g.strokeStyle = rgba(accent, 0.14); g.lineWidth = 1.5;
  for (let gx = mx + 40; gx < mx + mw; gx += 48) { g.beginPath(); g.moveTo(gx, my + 20); g.lineTo(gx, my + mh - 20); g.stroke(); }
  for (let gy = my + 40; gy < my + mh; gy += 48) { g.beginPath(); g.moveTo(mx + 20, gy); g.lineTo(mx + mw - 20, gy); g.stroke(); }

  /* Onda ECG / sinal oscilando ao vivo a esquerda do monitor */
  g.strokeStyle = accent; g.lineWidth = 4.5;
  g.beginPath();
  for (let sx = 0; sx <= 370; sx += 6) {
    const phase = (sx * 0.045) - t * 6.8;
    const spike = Math.pow(Math.max(0, Math.sin(phase)), 9) * (isRed ? 74 : 52);
    const wave = Math.sin(phase * 2.3) * 14 - spike + Math.sin(phase * 5) * 6;
    const x = mx + 34 + sx, y = my + 160 + wave;
    if (sx === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();

  /* Radar circular giratorio a direita do monitor */
  const rcx = mx + 545, rcy = my + 175, rr0 = 102;
  g.strokeStyle = rgba(accent, 0.50); g.lineWidth = 2.5;
  for (const frac of [0.35, 0.68, 1.0]) { g.beginPath(); g.arc(rcx, rcy, rr0 * frac, 0, Math.PI * 2); g.stroke(); }
  const swA = t * 2.8;
  g.fillStyle = rgba(accent, 0.24);
  g.beginPath(); g.moveTo(rcx, rcy); g.arc(rcx, rcy, rr0, swA, swA + 0.75); g.closePath(); g.fill();
  g.fillStyle = PAL.yellow;
  circ(rcx + Math.cos(1.1) * 58, rcy + Math.sin(1.1) * 58, 5 + Math.sin(t * 9) * 2);

  /* Barras de frequencia animadas na base do monitor */
  for (let b = 0; b < 14; b++) {
    const bh = 22 + Math.abs(Math.sin(t * 5.2 + b * 0.85)) * 78;
    g.fillStyle = (b > 10 && isRed) ? PAL.alert : rgba(accent, 0.78);
    rr(mx + 34 + b * 44, my + mh - 32 - bh, 28, bh, 5); g.fill();
  }

  /* Bancada de laboratorio e piso */
  g.fillStyle = '#0A101E';
  g.fillRect(-120, 1320, W + 240, 640);
  g.fillStyle = '#1E293B';
  rr(120, 1110, 840, 28, 8); g.fill();
  g.fillStyle = '#0F172A';
  g.fillRect(156, 1138, 22, 186);
  g.fillRect(902, 1138, 22, 186);

  if (shot.acao_cena === 'explosao_choque') {
    drawExplosionShock(540, 610, t, localP, PAL.alert);
  }

  drawProtagonista(510, 1356, 1.00, {
    t, ex: shot.expressao || f.ex, closed: f.closed, localP,
    fastBreath: isRed,
    pose: shot.pose || 'pensando',
    prevPose: shot.prevPose || null,
    shotAge: Math.max(0, t - shot.start),
    rimColor: accent,
    rimA: 0.90,
    lookX: 0.15
  });
}

/* CENARIO 7: arena_comparacao (palco em perspectiva, holofotes, barras crescendo e regua de escala) */
function drawArenaComparacao(t, shot, f, localP){
  const isRed = shot.mood === 'red';
  const accent = isRed ? PAL.alert : (shot.mood === 'yellow' ? PAL.yellow : PAL.cyan);
  drawBackdrop(t, shot.mood || 'violet');
  vgrad(isRed ? '#1C0A15' : '#0B1024', '#050812', 0, 1340);

  /* Holofotes cruzados varrendo o topo da arena */
  for (let sp = 0; sp < 2; sp++) {
    const ox = sp === 0 ? 180 : 900;
    const ang = (sp === 0 ? 0.34 : -0.34) + Math.sin(t * 1.4 + sp * 2.2) * 0.14;
    g.save();
    g.translate(ox, 120);
    g.rotate(ang);
    const sg = g.createLinearGradient(0, 0, 0, 1180);
    sg.addColorStop(0, rgba(sp === 0 ? PAL.cyan : accent, 0.22));
    sg.addColorStop(1, 'rgba(56,217,255,0)');
    g.fillStyle = sg;
    g.beginPath(); g.moveTo(-26, 0); g.lineTo(26, 0); g.lineTo(190, 1180); g.lineTo(-190, 1180); g.closePath(); g.fill();
    g.restore();
  }

  /* Piso de palco com grade em perspectiva animada */
  g.fillStyle = '#070C18';
  g.fillRect(-120, 1120, W + 240, 860);
  g.strokeStyle = rgba(accent, 0.22); g.lineWidth = 2;
  for (let i = -5; i <= 5; i++) {
    g.beginPath(); g.moveTo(540 + i * 110, 1120); g.lineTo(540 + i * 280, 1700); g.stroke();
  }
  const gridShift = (t * 42) % 48;
  for (let r = 0; r < 8; r++) {
    const gy = 1125 + r * 48 + gridShift * 0.5;
    if (gy < 1460) { g.beginPath(); g.moveTo(-80, gy); g.lineTo(W + 80, gy); g.stroke(); }
  }

  /* Barras de comparacao animadas crescendo suavemente no palco direito */
  const grow = easeOut(clamp(prog(t, shot.sceneStart || shot.start, (shot.sceneStart || shot.start) + 1.1)));
  const bars = [
    { x: 545, hMax: 240, col: '#38BDF8', lbl: 'BASE' },
    { x: 675, hMax: 430, col: PAL.yellow, lbl: '2X' },
    { x: 805, hMax: 650, col: isRed ? PAL.alert : '#A855F7', lbl: 'MAX' }
  ];
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const pulse = 1 + Math.sin(t * 4.2 + i * 1.1) * 0.035;
    const h = b.hMax * clamp(grow * (1.15 - i * 0.12)) * pulse;
    const y0 = 1190 - h;
    const bg = g.createLinearGradient(0, y0, 0, 1190);
    bg.addColorStop(0, b.col);
    bg.addColorStop(1, rgba(b.col, 0.16));
    g.fillStyle = bg;
    rr(b.x, y0, 96, h, 14); g.fill();
    g.strokeStyle = rgba('#F8FAFC', 0.45); g.lineWidth = 2.5;
    rr(b.x, y0, 96, h, 14); g.stroke();
    glow(b.x + 48, y0, 96, b.col, 0.28);
    g.fillStyle = '#F8FAFC';
    g.font = `900 24px ${MONO}`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(b.lbl, b.x + 48, Math.max(380, y0 - 22));
  }

  /* Regua vertical de escala animada a extrema direita */
  const rx = 968, rTop = 420, rBot = 1190;
  g.strokeStyle = 'rgba(226, 232, 240, 0.48)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(rx, rTop); g.lineTo(rx, rBot); g.stroke();
  for (let tk = 0; tk <= 10; tk++) {
    const ty = lerp(rBot, rTop, tk / 10);
    g.beginPath(); g.moveTo(rx - (tk % 2 === 0 ? 22 : 12), ty); g.lineTo(rx, ty); g.stroke();
  }
  const markerP = clamp(grow * (shot.hud_dado ? Number(shot.hud_dado.progresso || 0.78) : 0.78) + Math.sin(t * 3.0) * 0.03, 0.08, 0.96);
  const my = lerp(rBot, rTop, markerP);
  g.fillStyle = accent;
  g.beginPath(); g.moveTo(rx - 28, my); g.lineTo(rx - 52, my - 13); g.lineTo(rx - 52, my + 13); g.closePath(); g.fill();
  g.strokeStyle = rgba(accent, 0.45); g.lineWidth = 2; g.setLineDash([10, 8]);
  g.beginPath(); g.moveTo(520, my); g.lineTo(rx - 28, my); g.stroke();
  g.setLineDash([]);

  if (shot.acao_cena === 'explosao_choque') {
    drawExplosionShock(852, 560, t, localP, PAL.alert);
  }

  drawProtagonista(305, 1354, 1.00, {
    t, ex: shot.expressao || f.ex, closed: f.closed, localP,
    fastBreath: isRed,
    pose: shot.pose || 'apontando',
    prevPose: shot.prevPose || null,
    shotAge: Math.max(0, t - shot.start),
    rimColor: accent,
    rimA: 0.90,
    lookX: 0.42
  });
}

function drawScene(shot, t){
  const f = faceAt(t);
  const localP = prog(t, shot.start, shot.end);
  const cen = shot.cenario || shot.modulo;
  switch (cen) {
    case 'oceano_ilha':         drawOceanoIlha(t, shot, f, localP); break;
    case 'espaco_orbita':       drawEspacoOrbita(t, shot, f, localP); break;
    case 'cidade_rua':          drawCidadeRua(t, shot, f, localP); break;
    case 'ceu_nuvens':          drawCeuNuvens(t, shot, f, localP); break;
    case 'floresta_noite':      drawFlorestaNoite(t, shot, f, localP); break;
    case 'laboratorio':         drawLaboratorio(t, shot, f, localP); break;
    case 'arena_comparacao':    drawArenaComparacao(t, shot, f, localP); break;
    case 'escritorio':          drawEscritorio(t, shot, f, localP); break;
    case 'sala_cozinha':        drawSalaCozinha(t, shot, f, localP); break;
    case 'big_face':            drawBigFace(t, shot, f, localP); break;
    case 'quarto_noturno':      drawQuartoNoturno(t, shot, f, localP); break;
    case 'corredor_escuro':     drawCorredorEscuro(t, shot, f, localP); break;
    case 'celular_notificacao': drawCelularNotificacao(t, shot, f, localP); break;
    case 'camera_cctv':         drawCameraCctv(t, shot, f, localP); break;
    case 'elevador_cabine':     drawElevadorCabine(t, shot, f, localP); break;
    case 'carro_noite':         drawCarroNoite(t, shot, f, localP); break;
    case 'blecaute_olhos':      drawBlecauteOlhos(t, shot, f, localP); break;
    default:                    drawOceanoIlha(t, shot, f, localP); break;
  }
}

/* ============================================================
   SELO DINAMICO PARTE 1 / PARTE 2 E RELOGIO
   ============================================================ */
function getActiveParteLabel(t){
  if (!parteLabel) return '';
  const base = parteLabel.toUpperCase();
  const cP2 = Number(EV.corte_parte_2);
  if (isFinite(cP2) && cP2 > 0 && t >= cP2 - 0.001) {
    if (/\b1\b/.test(base)) return base.replace(/\b1\b/, '2');
    return 'PARTE 2';
  }
  return base;
}

function drawParteBadge(t){
  if (isFullScreenCtaActive(t)) return;
  const label = getActiveParteLabel(t);
  if (!label) return;
  const isP2 = label.includes('2');

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  const fs = 26;
  g.font = `800 ${fs}px ${SANS}`;
  const tw = g.measureText(label).width;
  const bw = Math.max(132, Math.min(280, Math.ceil(tw + 48)));
  const bh = 52;
  const bx = 64, by = 165;

  g.fillStyle = 'rgba(10, 15, 29, 0.74)';
  rr(bx, by, bw, bh, 12); g.fill();
  g.strokeStyle = isP2 ? rgba(PAL.yellow, 0.65) : 'rgba(245, 247, 251, 0.30)';
  g.lineWidth = 2;
  rr(bx, by, bw, bh, 12); g.stroke();

  g.fillStyle = isP2 ? PAL.yellow : PAL.text;
  drawFittedText(label, bx + bw / 2, by + bh / 2 + 1, bw - 28, fs, SANS, '800', 'center');
  g.restore();
}

function drawClock(t, shot){
  if (shot && shot.hud_dado) return;
  if (DEVICE_SCENES.has(shot.modulo)) return;
  if (katanaStateAt(t) !== null) return;
  if (isFullScreenCtaActive(t)) return;

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);

function formatAnimatedHudValue(rawVal, k){
  const str = String(rawVal || '').trim();
  if (!str) return '';
  const m = str.match(/^(.*?)(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:[.,]\d+)?)(.*)$/);
  if (!m) return toPtUpper(str);
  const pre = m[1], numStr = m[2], suf = m[3];
  const isPtThousands = /^\d{1,3}(?:\.\d{3})+(?:,\d+)?$/.test(numStr);
  const hasComma = numStr.includes(',');
  const hasDot = numStr.includes('.');
  const cleanNum = isPtThousands ? numStr.replace(/\./g, '').replace(',', '.') : numStr.replace(',', '.');
  const target = parseFloat(cleanNum);
  if (!isFinite(target)) return toPtUpper(str);
  const decimals = isPtThousands
    ? (hasComma ? (numStr.split(',')[1] || '').length : 0)
    : ((hasComma || hasDot) ? (numStr.split(/[.,]/)[1] || '').length : 0);
  /* Para anos (1900..2099), inicia proximo para contagem rapida e nitida */
  const startVal = (!isPtThousands && decimals === 0 && target >= 1900 && target <= 2099) ? Math.max(1900, target - 24) : 0;
  const curVal = lerp(startVal, target, easeOut(clamp(k)));
  let formatted;
  if (isPtThousands && decimals === 0) {
    formatted = Math.round(curVal).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  } else {
    formatted = decimals > 0 ? curVal.toFixed(decimals) : String(Math.round(curVal));
    if (hasComma) formatted = formatted.replace('.', ',');
  }
  return toPtUpper(`${pre}${formatted}${suf}`);
}

function drawHudDado(t, shot){
  if (!shot || !shot.hud_dado) return;
  if (katanaStateAt(t) !== null) return;
  if (isFullScreenCtaActive(t)) return;

  const hud = shot.hud_dado;
  const rotulo = toPtUpper(String(hud.rotulo || 'DADO').trim());
  const rawValor = String(hud.valor || '').trim();
  if (!rawValor) return;

  const sceneAge = Math.max(0, t - (shot.sceneStart ?? shot.start));
  const enterK = easeOut(clamp(sceneAge / 0.20));
  const countK = clamp(sceneAge / 0.42);
  const targetProg = clamp(Number(hud.progresso ?? 0.75), 0.08, 1.0);
  const barProg = clamp(targetProg * easeOut(countK), 0.04, 1.0);
  const isRed = (shot.mood === 'red' || shot.acao_cena === 'radar_alerta' || shot.acao_cena === 'explosao_choque');
  const accent = isRed ? PAL.alert : (shot.mood === 'yellow' ? PAL.yellow : PAL.cyan);
  const dispValor = formatAnimatedHudValue(rawValor, countK);

  const bw = 540, bh = 148;
  const bx = 540 - bw / 2, by = 128 - (1 - enterK) * 18;

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = clamp(enterK * 1.15);

  /* Cartao com borda completa em hairline (nunca borda lateral unica) */
  g.fillStyle = 'rgba(8, 13, 26, 0.90)';
  rr(bx, by, bw, bh, 20); g.fill();
  g.strokeStyle = rgba(accent, 0.65);
  g.lineWidth = 2.5;
  rr(bx, by, bw, bh, 20); g.stroke();

  /* Linha 1: indicador pulsante + rotulo limpo no topo (largura total, zero colisao com o valor) */
  const dotPulse = 0.55 + 0.45 * Math.sin(t * 7.5);
  glow(bx + 30, by + 30, 22, accent, 0.35 * dotPulse);
  g.fillStyle = accent;
  circ(bx + 30, by + 30, 6);

  g.fillStyle = 'rgba(203, 213, 225, 0.92)';
  drawFittedText(rotulo, bx + 48, by + 31, bw - 72, 22, SANS, '800', 'left');

  /* Linha 2: valor numerico grande abaixo do rotulo com folga vertical garantida */
  g.fillStyle = isRed ? '#FCA5A5' : '#FFFFFF';
  drawFittedText(dispValor, bx + bw / 2, by + 79, bw - 48, 46, MONO, '900', 'center');

  /* Linha 3: barra de progresso / gauge animada na base do cartao */
  const gx = bx + 24, gy = by + 116, gw = bw - 48, gh = 13;
  g.fillStyle = 'rgba(148, 163, 184, 0.18)';
  rr(gx, gy, gw, gh, 7); g.fill();
  const fillW = Math.max(18, gw * barProg);
  const gg = g.createLinearGradient(gx, gy, gx + fillW, gy);
  gg.addColorStop(0, rgba(accent, 0.72));
  gg.addColorStop(1, accent);
  g.fillStyle = gg;
  rr(gx, gy, fillW, gh, 7); g.fill();
  /* Pulso de luz percorrendo a ponta da barra */
  glow(gx + fillW, gy + gh / 2, 26, accent, 0.38 + 0.16 * Math.sin(t * 6.5));
  g.fillStyle = '#FFFFFF';
  circ(gx + fillW - 4, gy + gh / 2, 4.5);

  g.restore();
}

/* ============================================================
   EXPRESSOES + PISCADAS + CAMERA + SCREEN SHAKE AMORTECIDO
   ============================================================ */
function exprAt(t){
  let ex = 'neutral';
  for (const [a, b] of EXPR_CUES) if (t >= a - 0.01) ex = b;
  return ex;
}
function faceAt(t){
  let last = -1, prev = -1;
  for (const b of BLINKS) { if (b <= t) { prev = last; last = b; } else break; }
  const d = t - last;
  const closed = last >= 0 && d < 0.16 ? Math.sin((d / 0.16) * Math.PI) : 0;
  const ref = last < 0 ? 0 : (d < 0.08 ? (prev < 0 ? 0 : prev + 0.08) : last + 0.08);
  return { ex: exprAt(ref), closed };
}

function pickShot(t){
  for (let i = 0; i < SHOTS.length; i++) {
    const s = SHOTS[i];
    if (t < s.end || i === SHOTS.length - 1) return s;
  }
  return SHOTS[0];
}

function cameraFor(shot, t){
  const k = ease(prog(t, shot.start, shot.end));
  let z = lerp(shot.cam0[0], shot.cam1[0], k);
  const cx = lerp(shot.cam0[1], shot.cam1[1], k);
  const cy = lerp(shot.cam0[2], shot.cam1[2], k);

  let sx = noise(t * 2.1, 11) * 4.5;
  let sy = noise(t * 1.9, 29) * 4.5;

  const camName = shot.cameraName || '';
  if (camName === 'shake_impact') {
    const dtShot = Math.max(0, t - shot.start);
    const env = Math.exp(-dtShot * 4.2);
    z += 0.045 * Math.exp(-dtShot * 5.8);
    sx += Math.sin(dtShot * 96) * 20 * env + noise(t * 24, 5) * 3.5;
    sy += Math.cos(dtShot * 84) * 16 * env + noise(t * 24, 9) * 3.5;
  } else if (camName === 'float_cam') {
    sx += Math.sin(t * 1.45) * 16;
    sy += Math.cos(t * 1.15) * 18;
    z += Math.sin(t * 1.10) * 0.018;
  }

  for (let i = 0; i < KATANA_HITS.length; i++) {
    const kh = KATANA_HITS[i];
    if (t >= kh.start && t < kh.end + 0.40) {
      const dt = t - kh.start;
      z += kh.punch * Math.exp(-dt * 7.2);
      const env = Math.exp(-dt * 10.5);
      sx += Math.sin(dt * 108) * kh.shake * env;
      sy += Math.cos(dt * 94) * kh.shake * 0.72 * env;
    }
  }

  for (const sfx of (EV.sfx_eventos || [])) {
    const ti = Number(sfx.inicio);
    if (!isFinite(ti)) continue;
    if (t >= ti && t < ti + 0.85) {
      const dt = t - ti;
      const amp = sfx.nome === 'impacto_twist' ? 26 : 14;
      const env = Math.exp(-dt * 5.8);
      sx += Math.sin(dt * 95) * amp * env;
      sy += Math.cos(dt * 83) * amp * 0.72 * env;
    }
  }
  return { z, cx, cy, sx, sy };
}

function finish(vig){
  g.save();
  g.globalAlpha = clamp(vig, 0, 1);
  g.drawImage(vigCv, 0, 0);
  g.restore();
}

/* ============================================================
   LEGENDAS ANTI-COLISAO V7 (ZERO COLAGEM + ANOS 2004/2006 INTACTOS)
   ============================================================ */
function buildPreviewCaptions(){
  const lines = [
    [0.1, 4.2, 'Existe uma ilha onde nenhum barco pode chegar a menos de 5 km.'],
    [4.4, 8.8, 'Em 2004, um tsunami gigante atingiu o oceano inteiro.'],
    [9.0, 13.4, 'Um helicóptero sobrevoou a ilha e levou uma chuva de flechas.'],
    [13.6, 18.2, 'Em 2006, dois pescadores entraram lá e nunca voltaram.'],
    [18.4, 23.0, 'Até satélites em órbita monitoram o perímetro isolado.'],
    [23.2, 27.6, 'Nuvens de tempestade escondem a costa da Ilha Sentinela.'],
    [27.8, 32.0, 'Cientistas analisam os dados em laboratório há décadas.'],
    [32.2, 36.2, 'Mesmo hoje, o isolamento chega a 100% do território.'],
    [36.4, 41.4, 'E se você pousasse lá agora? Comente aqui embaixo.']
  ];
  const groups = [];
  for (const [t0, t1, txt] of lines) {
    const words = txt.split(' ');
    const span = Math.max(0.3, t1 - t0);
    const step = span / words.length;
    const timed = words.map((w, i) => ({
      palavra: w, inicio: t0 + i * step, fim: t0 + (i + 1) * step, duracao: step
    }));
    let i = 0;
    while (i < timed.length) {
      const rem = timed.length - i;
      let sz = rem <= 3 ? rem : (rem === 4 ? 2 : 3);
      /* Mantem anos (2004/2006) e medidas (5 km) unidos com a palavra anterior */
      if (i + sz < timed.length) {
        const lastW = timed[i + sz - 1].palavra.toLowerCase().replace(/[^a-z0-9]/g, '');
        const nextW = timed[i + sz].palavra.toLowerCase().replace(/[^a-z0-9]/g, '');
        if ((/^(em|de|ate|no|na)$/.test(lastW) && /^\d{4}$/.test(nextW)) || (/^\d+$/.test(lastW) && /^(km|m|kg|h|s)$/.test(nextW))) {
          if (sz > 1) sz -= 1;
        }
      }
      const sl = timed.slice(i, i + sz);
      groups.push({ inicio: sl[0].inicio, fim: sl[sl.length - 1].fim, palavras: sl });
      i += sz;
    }
  }
  captionGroups = groups;
}

function layoutCaptionGroup(grp){
  const words = grp.palavras
    .map(p => {
      const cleaned = String(p.palavra || '').replace(/\[\/?VOZ(?::[a-zA-Z0-9_]+)?\]/gi, '').trim();
      return {
        txt: toPtUpper(cleaned),
        key: normWord(cleaned),
        inicio: Number(p.inicio),
        fim: Number(p.fim ?? (Number(p.inicio) + Number(p.duracao || 0.25)))
      };
    })
    .filter(w => w.txt.length > 0);
  if (!words.length) return null;

  const POP_MAX = 1.09;
  const MAX_LINE_W = 876;
  let fs = 84;
  let lw = 18, gap = 36, wds = [], boxes = [], tw = 0;

  for (let iter = 0; iter < 16; iter++) {
    g.font = `900 ${fs}px ${COND}`;
    lw = Math.max(12, Math.round(fs * 0.22));
    gap = Math.max(26, Math.round(fs * 0.36) + Math.round(lw * 0.50));
    wds = words.map(w => g.measureText(w.txt).width);
    boxes = wds.map(w => w * POP_MAX + lw);
    tw = boxes.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
    if (tw <= MAX_LINE_W || fs <= 32) break;
    const nextFs = Math.max(32, Math.floor(fs * (MAX_LINE_W / tw)) - (iter > 2 ? 1 : 0));
    if (nextFs >= fs) fs -= 2; else fs = nextFs;
  }

  let x = 540 - tw / 2;
  const items = words.map((w, i) => {
    const cx = x + boxes[i] / 2;
    const item = { ...w, cx, w: wds[i], boxW: boxes[i] };
    x += boxes[i] + gap;
    return item;
  });
  return { fs, lw, gap, tw, items };
}

function pickCaptionGroup(t){
  const cP2 = Number(EV.corte_parte_2);
  const temCorte = isFinite(cP2) && cP2 > 0;
  const naParte2 = temCorte && t >= cP2 - 0.001;

  let candidato = null;
  for (let i = 0; i < captionGroups.length; i++) {
    const c = captionGroups[i];
    const ini = Number(c.inicio);
    const fim = Number(c.fim);
    if (temCorte) {
      const grpEhP2 = ini >= cP2 - 0.005;
      if (naParte2 && !grpEhP2) continue;
      if (!naParte2 && grpEhP2) continue;
    }
    if (t >= ini - 0.04 && t <= fim) return c;
    if (t > fim && t <= fim + 0.14) candidato = c;
  }
  return candidato;
}

function drawCaptions(t){
  if (katanaStateAt(t) !== null) return;
  if (isFullScreenCtaActive(t)) return;

  const grp = pickCaptionGroup(t);
  if (!grp || !grp.palavras || !grp.palavras.length) return;
  const lay = layoutCaptionGroup(grp);
  if (!lay) return;

  let active = 0;
  for (let i = 0; i < lay.items.length; i++) if (t >= lay.items[i].inicio - 0.02) active = i;
  const grpPop = popScale(t - grp.inicio + 0.02, 0.11);

  g.save();
  g.font = `900 ${lay.fs}px ${COND}`;
  g.textBaseline = 'middle';
  g.textAlign = 'center';

  const y = 1495;
  g.translate(540, y);
  g.scale(grpPop, grpPop);
  g.translate(-540, -y);
  g.lineJoin = 'round';
  g.miterLimit = 2;

  lay.items.forEach((w, i) => {
    const isAct = i === active;
    const fill = isAct ? PAL.yellow : '#FFFFFF';
    const wPop = isAct ? lerp(1.09, 1.04, easeOut(clamp((t - w.inicio) / 0.09))) : 1.0;

    g.save();
    g.translate(w.cx, y);
    g.scale(wPop, wPop);
    g.shadowColor = 'rgba(0,0,0,.88)';
    g.shadowBlur = 16;
    g.shadowOffsetY = 6;
    g.strokeStyle = '#000000';
    g.lineWidth = lay.lw;
    g.strokeText(w.txt, 0, 0);
    g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.fillStyle = fill;
    g.fillText(w.txt, 0, 0);
    g.restore();
  });
  g.restore();
}

window.measureCaptionAt = t => {
  const grp = pickCaptionGroup(t);
  if (!grp) return null;
  g = main;
  const lay = layoutCaptionGroup(grp);
  if (!lay) return null;
  let minVisualGap = Infinity;
  for (let i = 0; i < lay.items.length - 1; i++) {
    const a = lay.items[i], b = lay.items[i + 1];
    minVisualGap = Math.min(minVisualGap, (b.cx - b.boxW / 2) - (a.cx + a.boxW / 2));
  }
  return {
    texto: lay.items.map(x => x.txt).join(' '),
    palavras: lay.items.map(x => x.txt),
    fs: lay.fs,
    lw: lay.lw,
    gap: lay.gap,
    tw: Number(lay.tw.toFixed(1)),
    minVisualGap: lay.items.length > 1 ? Number(minVisualGap.toFixed(1)) : null
  };
};

/* ============================================================
   INICIALIZACAO DE TIMELINE + RENDER DETERMINISTICO 30FPS
   ============================================================ */
function rebuildTimeline(cenasData, evData, audioDur){
  CENAS = (cenasData && Array.isArray(cenasData.cenas) && cenasData.cenas.length)
    ? cenasData
    : JSON.parse(JSON.stringify(CENAS_PREVIEW));
  applyPaletteFromCenas(CENAS);

  const fallbackDur = 42.0;
  const dur = Math.max(
    audioDur || 0,
    Number((evData && evData.duracao_total) || 0) || fallbackDur
  );
  duration = dur;

  const modoCta = String((evData && evData.cta_modo) || CENAS.cta_modo || 'final').trim().toLowerCase();
  const usaCtaMeio = modoCta === 'pausa_meio' || modoCta === 'meio';
  const baseEv = {
    cta_modo: modoCta,
    cta_texto: (CENAS.cta && CENAS.cta.botao) || 'COMENTE EU QUERO',
    cta_meio_inicio: usaCtaMeio ? Number((dur * 0.45).toFixed(2)) : null,
    cta_meio_fim: usaCtaMeio ? Number((dur * 0.45 + 3.4).toFixed(2)) : null,
    duracao_total: dur
  };
  EV = evData ? { ...baseEv, ...evData, duracao_total: dur } : baseEv;

  /* Selo de parte fica vazio por padrao em video continuo; so exibe se passado explicitamente via ?parte= ou setParteLabel */

  document.title = `${CENAS.titulo || 'Short V7'}: Estudio 2D Animado 30fps`;
  const h1 = document.getElementById('pageTitle');
  if (h1) h1.textContent = `Previa 2D 30fps: ${CENAS.titulo || 'Estudio Animado V7'}`;

  SHOTS = buildShotsFromConfig(CENAS, EV, duration);
  KATANA_HITS = buildKatanaHitsFromConfig(CENAS, EV, duration);

  /* Troca de expressoes escondida na piscada 2 frames antes de cada mudanca de cena */
  EXPR_CUES = [];
  let lastEx = '';
  for (const s of SHOTS) {
    if (s.expressao && s.expressao !== lastEx) {
      EXPR_CUES.push([s.start, s.expressao]);
      lastEx = s.expressao;
    }
  }
  if (!EXPR_CUES.length) EXPR_CUES.push([0, 'neutral']);

  /* Piscada automatica natural a cada ~2.5s */
  const bl = [];
  let bt = 0.85, bi = 0;
  while (bt < duration + 1) { bl.push(bt); bt += 2.2 + hash(bi++ * 11.3) * 0.6; }
  for (const [ct] of EXPR_CUES) if (ct > 0.2) bl.push(Math.max(0.05, ct - 0.067));
  BLINKS = bl.sort((a, b) => a - b);
}

let ccOn = false;
function renderAt(t){
  t = clamp(+t || 0, 0, duration);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.filter = 'none';
  g.shadowBlur = 0;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);

  if (drawFullScreenCta(t)) return;

  const shot = pickShot(t);
  const katanaActive = drawKatanaOverlay(t);

  if (!katanaActive) {
    const cam = cameraFor(shot, t);
    g.save();
    g.translate(W / 2 + cam.sx, H / 2 + cam.sy);
    g.scale(cam.z, cam.z);
    g.translate(-cam.cx, -cam.cy);
    drawScene(shot, t);
    g.restore();

    finish(shot.vig || 0.60);
    if (shot.hud_dado) {
      drawHudDado(t, shot);
    }

    const cutAge = t - shot.start;
    if (shot.id > 1 && cutAge >= 0 && cutAge < 0.06) {
      const k = 1 - cutAge / 0.06;
      g.fillStyle = shot.mood === 'red' ? `rgba(255,59,48,${k * 0.16})` : `rgba(0,0,0,${k * 0.35})`;
      g.fillRect(0, 0, W, H);
    }
  }

  drawParteBadge(t);
  if (ccOn) drawCaptions(t);
}

window.renderAt = renderAt;

/* Controles do player */
const $ = id => document.getElementById(id);
const btn = $('play'), seek = $('seek'), out = $('time'), cc = $('cc'), status = $('status');
let playing = false, cur = 0, t0 = 0, p0 = 0;
const fmt = v => v.toFixed(1).replace('.', ',');

function ui(){
  seek.value = cur;
  out.textContent = `${fmt(cur)} / ${fmt(duration)}`;
  seek.setAttribute('aria-valuetext', `${fmt(cur)} de ${fmt(duration)} segundos`);
  $('playLbl').textContent = playing ? 'Pausar' : 'Play';
  $('playIcon').setAttribute('d', playing ? 'M3 2h4v12H3zM9 2h4v12H9z' : 'M4 2l10 6-10 6z');
}
function tick(){
  if (!playing) return;
  cur = Math.min(t0 + (performance.now() - p0) / 1000, duration);
  if (audio && cur < audio.duration && Math.abs(audio.currentTime - cur) > 0.2) audio.currentTime = cur;
  renderAt(cur); ui();
  if (cur >= duration) pause(); else requestAnimationFrame(tick);
}
function play(){
  if (cur >= duration) cur = 0;
  playing = true; t0 = cur; p0 = performance.now();
  if (audio) { audio.currentTime = cur; audio.play().catch(() => {}); }
  ui(); requestAnimationFrame(tick);
}
function pause(){ playing = false; if (audio) audio.pause(); ui(); }
btn.addEventListener('click', () => playing ? pause() : play());
seek.addEventListener('input', () => {
  cur = +seek.value; t0 = cur; p0 = performance.now();
  if (audio && cur < audio.duration) audio.currentTime = cur;
  renderAt(cur); ui();
});
cc.addEventListener('click', () => {
  ccOn = !ccOn; cc.setAttribute('aria-pressed', String(ccOn)); renderAt(cur);
});

async function fetchJson(url){
  if (location.protocol === 'file:') return null;
  try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return null;
}
function probeAudio(src){
  return new Promise(res => {
    const el = new Audio(); let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    el.preload = 'auto';
    el.addEventListener('loadedmetadata', () => fin(el), { once: true });
    el.addEventListener('error', () => fin(null), { once: true });
    setTimeout(() => fin(null), 3500);
    el.src = src;
  });
}

async function load(){
  const [cenasData, evData, tsData] = await Promise.all([
    fetchJson('cenas.json'),
    fetchJson('audio/eventos.json'),
    fetchJson('audio/timestamps.json')
  ]);
  let a = await probeAudio('audio/mix_final.mp3');
  let audioSrc = 'audio/mix_final.mp3';
  if (!a) { a = await probeAudio('audio/narracao.mp3'); audioSrc = 'audio/narracao.mp3'; }

  if (a && isFinite(a.duration)) audio = a;
  rebuildTimeline(cenasData, evData, audio ? audio.duration : null);

  if (tsData && Array.isArray(tsData.grupos) && tsData.grupos.length) {
    const normGrps = tsData.grupos.map(gr => ({
      ...gr,
      palavras: Array.isArray(gr.palavras) ? gr.palavras.map(p => ({ ...p })) : []
    })).filter(gr => gr.palavras.length > 0);
    if (normGrps.length) {
      /* Garante primeira legenda ancorada em 0.0s e evita flash de 1 palavra (<0.45s) na abertura */
      normGrps[0].inicio = 0;
      if (normGrps[0].palavras[0]) normGrps[0].palavras[0].inicio = 0;
      if (
        normGrps.length >= 2 &&
        normGrps[0].palavras.length === 1 &&
        (Number(normGrps[0].fim) - Number(normGrps[0].inicio)) < 0.45
      ) {
        const combPals = [...normGrps[0].palavras, ...normGrps[1].palavras];
        const combTxt = combPals.map(p => String(p.palavra || '')).join(' ');
        if (combPals.length <= 4 && combTxt.length <= 26) {
          normGrps[0] = {
            ...normGrps[0],
            inicio: 0,
            fim: normGrps[1].fim,
            palavras: combPals
          };
          normGrps.splice(1, 1);
        }
      }
      for (let i = 0; i < normGrps.length - 1; i++) {
        const curP = normGrps[i].palavras;
        const nxtP = normGrps[i + 1].palavras;
        if (curP.length >= 2 && nxtP.length >= 1) {
          const lastTok = String(curP[curP.length - 1].palavra || '').trim().toUpperCase();
          if ((lastTok === 'R$' || lastTok === 'US$') && nxtP.length < 4) {
            const moved = curP.pop();
            nxtP.unshift(moved);
            normGrps[i].fim = curP[curP.length - 1].fim ?? normGrps[i].fim;
            normGrps[i + 1].inicio = moved.inicio ?? normGrps[i + 1].inicio;
          }
        }
      }
      captionGroups = normGrps;
    } else {
      buildPreviewCaptions();
    }
  } else {
    buildPreviewCaptions();
  }

  const cP2 = window.getCorteParte2();
  const corteTxt = cP2 ? `Corte P2 em ${fmt(cP2)} s` : 'Short unico';
  if (audio && evData) {
    status.textContent = `Motor 2D Animado V7 (${CENAS.titulo}): ${audioSrc} sincronizado (${fmt(duration)} s | ${SHOTS.length} cortes | ${corteTxt}).`;
  } else if (cenasData) {
    status.textContent = `Modo Previa 2D V7 (${CENAS.titulo}): cenas.json carregado sem audio (${fmt(duration)} s | ${SHOTS.length} cortes).`;
  } else {
    status.textContent = `Modo Previa 2D V7 padrao: sem cenas.json e sem audio (${fmt(duration)} s | 10 cenarios animados).`;
  }
  seek.max = duration;
  btn.disabled = false; seek.disabled = false; btn.removeAttribute('aria-busy');
  renderAt(cur); ui();
}

rebuildTimeline(null, null, null);
buildPreviewCaptions();
renderAt(0); ui(); load();
})();
</script>
