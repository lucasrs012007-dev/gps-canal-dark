.controls{width:100%;max-width:calc(var(--target-min) * 12);display:flex;align-items:center;gap:var(--space-2)}
.btn{min-height:var(--target-min);min-width:var(--target-min);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);

.seek{flex:1;min-width:0;min-height:var(--target-min);accent-color:var(--action-primary);cursor:pointer}

/* Utilidades deterministicas */
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const prog = (t, a, b) => clamp((t - a) / Math.max(0.001, b - a));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (t, seed=0) => {
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57), hash(i + 1 + seed * 57), u) * 2 - 1;
};
const validHex = (h, fb) => (typeof h === 'string' && /^#[0-9A-Fa-f]{6}$/.test(h.trim()) ? h.trim() : fb);
const hexRgb = h => {
  const clean = validHex(h, '#FFFFFF');
  const n = parseInt(clean.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgba = (hex, a) => {
  const [r, gr, b] = hexRgb(hex);
  return `rgba(${r},${gr},${b},${a})`;
};
function mixHex(h1, h2, k){
  k = clamp(k);
  const a = hexRgb(h1), b = hexRgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
}
function mulberry(a){
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(x, y, w, h, r){
  const rad = Math.min(r, Math.max(0, w / 2), Math.max(0, h / 2));
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function circ(x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ell(x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function glow(x, y, r, col, a){
  if (a <= 0.002) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a));
  gr.addColorStop(1, rgba(col, 0));
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}
function vgrad(c1, c2, y0=-320, y1=H+320){
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, c1);
  gr.addColorStop(1, c2);
  g.fillStyle = gr;
  g.fillRect(-420, y0, W + 840, y1 - y0);
}
function popScale(age, dur=0.11){
  if (age <= 0) return 0.68;
  const k = clamp(age / dur);
  if (k < 0.62) return lerp(0.68, 1.10, easeOut(k / 0.62));
  return lerp(1.10, 1.0, ease((k - 0.62) / 0.38));
}

function drawFittedText(text, x, y, maxW, maxFs, family, weight='900', align='center'){
  const txt = String(text ?? '');
  let fs = maxFs;
  g.font = `${weight} ${fs}px ${family}`;
  const w = g.measureText(txt).width;
  if (w > maxW && w > 0) {
    fs = Math.max(16, Math.floor(maxFs * (maxW / w)));
    g.font = `${weight} ${fs}px ${family}`;
  }
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(txt, x, y);
  return fs;
}

function drawWrappedText(text, x, y, maxW, maxLines, fs, lineH, family, weight='700', align='left'){
  const words = String(text ?? '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return;
  g.font = `${weight} ${fs}px ${family}`;
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? `${line} ${w}` : w;
    if (g.measureText(test).width <= maxW || !line) {
      line = test;
    } else {
      lines.push(line);
      line = w;
      if (lines.length >= maxLines - 1) {
        const restIdx = words.indexOf(w);
        line = words.slice(restIdx).join(' ');
        break;
      }
    }
  }
  if (line) lines.push(line);
  const clamped = lines.slice(0, maxLines);
  for (let i = 0; i < clamped.length; i++) {
    drawFittedText(clamped[i], x, y + i * lineH, maxW, fs, family, weight, align);
  }
}

/* ============================================================
   DOF 1/8 + VINHETA E SCANLINES PRE-RENDER
   ============================================================ */
const DOF_SCALE = 0.125;
const DOF_PAD = 4;
const dofCv = document.createElement('canvas');
dofCv.width = Math.round(W * DOF_SCALE) + DOF_PAD * 2;
dofCv.height = Math.round(H * DOF_SCALE) + DOF_PAD * 2;
const dofCtx = dofCv.getContext('2d');

const dofBlurCv = document.createElement('canvas');
dofBlurCv.width = dofCv.width;
dofBlurCv.height = dofCv.height;
const dofBlurCtx = dofBlurCv.getContext('2d');

function withBlur(px, fn){
  const m = main.getTransform();
  dofCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofCtx.globalAlpha = 1;
  dofCtx.globalCompositeOperation = 'source-over';
  dofCtx.filter = 'none';
  dofCtx.fillStyle = PAL.bgNavy;
  dofCtx.fillRect(0, 0, dofCv.width, dofCv.height);
  dofCtx.translate(DOF_PAD, DOF_PAD);
  dofCtx.scale(DOF_SCALE, DOF_SCALE);
  dofCtx.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g = dofCtx;
  fn();
  g = main;

  const r = Math.max(1.2, px * DOF_SCALE * 1.45);
  dofBlurCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofBlurCtx.clearRect(0, 0, dofBlurCv.width, dofBlurCv.height);
  dofBlurCtx.filter = `blur(${r.toFixed(2)}px)`;
  dofBlurCtx.drawImage(dofCv, 0, 0);
  dofBlurCtx.filter = 'none';

  main.save();
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.imageSmoothingEnabled = true;
  main.imageSmoothingQuality = 'high';
  const padOut = DOF_PAD / DOF_SCALE;
  main.drawImage(dofBlurCv, -padOut, -padOut, W + padOut * 2, H + padOut * 2);
  main.restore();
}

      .map(w => normWord(String(w)))
      .filter(Boolean)
  );
}

function normWord(w){
  return String(w || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/gi, '').toLowerCase();
}

const PT_ACCENT_MAP = {

function preserveWordCase(orig, target){
  if (orig === orig.toLocaleUpperCase('pt-BR') && orig !== orig.toLocaleLowerCase('pt-BR')) {
    return target.toLocaleUpperCase('pt-BR');
  }
  if (orig[0] === orig[0].toLocaleUpperCase('pt-BR') && orig.slice(1) === orig.slice(1).toLocaleLowerCase('pt-BR')) {
    return target[0].toLocaleUpperCase('pt-BR') + target.slice(1);
  }
  return target;
}

function restorePtAccents(str){
  const raw = String(str ?? '').normalize('NFC');
  if (!raw) return '';
  return raw.replace(/[A-Za-zÀ-ÿ]+/g, word => {
    const low = word.toLocaleLowerCase('pt-BR');
    let fixed = PT_ACCENT_MAP[low];
    if (!fixed) {
      if (low.endsWith('çao') && low.length > 3) fixed = low.slice(0, -3) + 'ção';
      else if (low.endsWith('çoes') && low.length > 4) fixed = low.slice(0, -4) + 'ções';
    }
    return fixed ? preserveWordCase(word, fixed) : word;
  });
}

function toPtUpper(str){
  return restorePtAccents(str).toLocaleUpperCase('pt-BR');
}

function cameraPreset(camName, modulo, subIdx){
  const isDev = DEVICE_SCENES.has(modulo);
  const zMax = isDev ? 1.12 : 1.18;
  const zMin = isDev ? 1.00 : 1.01;
  const presets = {
    push_in:      [[zMin, 540, 960], [zMax, 540, 944]],
    pull_out:     [[zMax, 540, 946], [zMin, 540, 960]],
    pan_left:     [[1.06, 568, 956], [1.11, 512, 956]],
    pan_right:    [[1.06, 512, 956], [1.11, 568, 956]],
    shake_impact: [[1.15, 540, 938], [1.04, 540, 956]],
    float_cam:    [[1.04, 532, 952], [1.10, 548, 962]],
    tight_close:  [[1.05, 540, 940], [zMax, 540, 916]],
    wide_still:   [[1.00, 540, 960], [1.05, 540, 954]]
  };
  const base = presets[camName] || presets.push_in;
  if (subIdx % 2 === 1) {
    /* Sub-corte alternado mantem dinamismo visual a cada 1.0s-1.8s */
    const dx = isDev ? 10 : 22;
    return [
      [clamp(base[0][0] + 0.03, 1.0, zMax), base[0][1] + (subIdx % 4 === 1 ? -dx : dx), base[0][2] - 8],
      [clamp(base[1][0] + 0.02, 1.0, zMax), base[1][1] + (subIdx % 4 === 1 ? dx : -dx), base[1][2] - 14]
    ];
  }
  return [base[0].slice(), base[1].slice()];
}

/* Subdivide automaticamente qualquer cena acima de 1.65s para manter cortes dinamicos <= 1.80s */
function splitShots(rawList, maxDur=1.65){
  const out = [];
  for (const s of rawList) {
    const span = s.end - s.start;
    if (span <= 0.02) continue;
    const n = Math.max(1, Math.ceil(span / maxDur));
    for (let i = 0; i < n; i++) {
      const a = i / n, b = (i + 1) / n;
      const [c0, c1] = cameraPreset(s.camera, s.modulo, i);
      out.push({
        id: out.length + 1,
        cenaId: s.id,
        cenario: s.cenario,
        modulo: s.modulo,
        scene: s.modulo,
        acao_cena: s.acao_cena,
        pose: s.pose,
        prevPose: i === 0 ? s.prevPose : s.pose,
        hud_dado: s.hud_dado,
        fala: s.fala,
        cameraName: s.camera,
        mood: s.mood,
        expressao: s.expressao,
        vig: s.vig,
        props: s.props || {},
        subIdx: i,
        subTotal: n,
        sceneStart: s.start,
        sceneEnd: s.end,
        start: Number(lerp(s.start, s.end, a).toFixed(3)),
        end: Number(lerp(s.start, s.end, b).toFixed(3)),
        dur: Number(((s.end - s.start) / n).toFixed(3)),
        cam0: c0,
        cam1: c1
      });
    }
  }
  return out;
}

function hasMidCtaWindow(ev){
  const modo = String((ev && ev.cta_modo) || (CENAS && CENAS.cta_modo) || 'final').trim().toLowerCase();
  if (modo !== 'pausa_meio' && modo !== 'meio') return false;
  if (!ev || ev.cta_meio_inicio == null || ev.cta_meio_fim == null) return false;
  const a = Number(ev.cta_meio_inicio);
  const b = Number(ev.cta_meio_fim);
  return isFinite(a) && isFinite(b) && b > a;
}

function buildShotsFromConfig(cfg, ev, dur){
  const lista = Array.isArray(cfg.cenas) && cfg.cenas.length ? cfg.cenas : CENAS_PREVIEW.cenas;
  const n = lista.length;
  const temCta = hasMidCtaWindow(ev);
  const ctaA = temCta ? Number(ev.cta_meio_inicio) : NaN;
  const ctaB = temCta ? Number(ev.cta_meio_fim) : NaN;
  const cP2 = Number(ev.corte_parte_2);
  const temP2 = isFinite(cP2) && cP2 > 0;

  const inicios = lista.map((c, i) => {
    const key = c.evento_inicio || c.id || `cena_${String(i + 1).padStart(2, '0')}`;
    const v = ev[key];
    if (typeof v === 'number' && isFinite(v)) return clamp(v, 0, Math.max(0.1, dur - 0.2));
    return (i / n) * dur;
  });

  /* Garante ordem monotona crescente sem colisoes */
  inicios[0] = 0;
  for (let i = 1; i < n; i++) {
    if (inicios[i] <= inicios[i - 1] + 0.25) {
      inicios[i] = Math.min(dur - 0.15 * (n - i), inicios[i - 1] + Math.max(0.5, (dur - inicios[i - 1]) / (n - i + 1)));
    }
  }

  const raw = [];
  let lastPose = 'em_pe';
  for (let i = 0; i < n; i++) {
    const c = lista[i];
    const st = inicios[i];
    const en = (i < n - 1) ? inicios[i + 1] : dur;
    const cen = c.cenario || c.modulo || 'oceano_ilha';
    const props = c.props || {};
    const poseName = c.pose || props.pose || 'falando';
    const acaoCena = c.acao_cena || props.acao_cena || 'investigando_pista';
    const hudDado = (c.hud_dado && typeof c.hud_dado === 'object') ? c.hud_dado : (props.hud_dado || null);

    /* Se a cena cruza a janela da CTA ou corte_parte_2, fatia nas barreiras exatas */
    const cortes = [st];
    if (temCta && ctaA > st + 0.05 && ctaA < en - 0.05) cortes.push(ctaA);
    if (temCta && ctaB > st + 0.05 && ctaB < en - 0.05) cortes.push(ctaB);
    if (temP2 && cP2 > st + 0.05 && cP2 < en - 0.05) cortes.push(cP2);
    cortes.push(en);
    cortes.sort((a, b) => a - b);

    for (let k = 0; k < cortes.length - 1; k++) {
      const a = cortes[k], b = cortes[k + 1];
      if (b - a < 0.04) continue;
      if (temCta && a >= ctaA - 0.02 && b <= ctaB + 0.02) continue;
      raw.push({
        id: c.id || `cena_${String(i + 1).padStart(2, '0')}`,
        cenario: cen,
        modulo: cen,
        acao_cena: acaoCena,
        pose: poseName,
        prevPose: lastPose,
        hud_dado: hudDado,
        fala: c.fala || '',
        mood: c.mood || 'navy',
        expressao: c.expressao || 'neutral',
        camera: c.camera || 'push_in',
        vig: typeof c.vig === 'number' ? c.vig : 0.60,
        props: { ...props, pose: poseName, acao_cena: acaoCena },
        start: a,
        end: b
      });
    }
    lastPose = poseName;
  }
  return splitShots(raw, 1.65);
}

function buildKatanaHitsFromConfig(cfg, ev, dur){
  const list = Array.isArray(cfg.katana_hits) ? cfg.katana_hits : [];
  const temCta = hasMidCtaWindow(ev);
  const ctaA = temCta ? Number(ev.cta_meio_inicio) : NaN;
  const ctaB = temCta ? Number(ev.cta_meio_fim) : NaN;
  const tilts = [-0.048, 0.044, -0.042, 0.050, -0.038];
  const out = [];

  for (let i = 0; i < list.length; i++) {
    const h = list[i];
    const key = h.evento || h.id || `hit_${String(i + 1).padStart(2, '0')}`;
    let start = (typeof ev[key] === 'number' && isFinite(ev[key]))
      ? Number(ev[key]) - 0.02
      : ((i + 1) / (list.length + 1)) * dur;
    start = clamp(start, 0.4, Math.max(0.5, dur - 0.45));

    const hitDur = clamp(Number(h.duracao) || 0.42, 0.30, 0.50);
    if (temCta && start < ctaB + 0.15 && (start + hitDur) > ctaA - 0.15) {
      start = Math.min(dur - hitDur - 0.1, ctaB + 0.25);
    }
    const linhas = Array.isArray(h.linhas) && h.linhas.length
      ? h.linhas.map(s => toPtUpper(String(s))).slice(0, 2)
      : ['CHOQUE'];
    out.push({
      id: h.id || `hit_${String(i + 1).padStart(2, '0')}`,
      start: Number(start.toFixed(3)),
      end: Number(Math.min(dur - 0.05, start + hitDur).toFixed(3)),
      dur: hitDur,
      lines: linhas,
      accentIdx: linhas.length > 1 ? 1 : 0,
      color: h.cor || 'red',
      tilt: tilts[i % tilts.length],
      punch: 0.15,
      shake: 24
    });
  }
  return out.sort((a, b) => a.start - b.start);
}

function drawKatanaOverlay(t){
  return false;
  const { hit, dt } = st;
  const frame = Math.floor(dt * 30);

  let bgCol = '#06070B', slashCol = PAL.alertKatana, mainTextCol = '#FFFFFF', accentTextCol = PAL.yellow, strokeCol = '#000000';
  if (hit.color === 'yellow') {
    slashCol = '#111827';
    mainTextCol = PAL.yellow;
    accentTextCol = '#FFFFFF';
  }
  if (frame === 0) {
    bgCol = '#FFFFFF'; slashCol = '#06070B'; mainTextCol = '#FFFFFF'; accentTextCol = PAL.alertKatana; strokeCol = 'transparent';
  } else if (frame === 1) {
    bgCol = '#050609'; slashCol = PAL.alertKatana; mainTextCol = '#FFFFFF'; accentTextCol = PAL.yellow;
  } else if (frame === 2) {
    bgCol = PAL.alertKatana; slashCol = '#06070B'; mainTextCol = '#FFFFFF'; accentTextCol = PAL.yellow;
  } else if (frame === 3) {
    bgCol = '#06070B'; slashCol = '#FFFFFF'; mainTextCol = '#06070B'; accentTextCol = PAL.alertKatana; strokeCol = 'transparent';
  }

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = bgCol;
  g.fillRect(0, 0, W, H);

  /* Linhas de velocidade radiais */
  g.save();
  g.translate(540, 960);
  g.strokeStyle = frame === 0 ? 'rgba(6,7,11,0.22)' : 'rgba(255,255,255,0.16)';
  const rayCount = 26;
  for (let i = 0; i < rayCount; i++) {
    const ang = (i / rayCount) * Math.PI * 2 + hit.tilt * 2.2;
    const r0 = 260 + hash(i * 19 + frame) * 140;
    const r1 = 1120;
    g.lineWidth = 3 + (i % 3) * 2.5;
    g.beginPath();
    g.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
    g.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
    g.stroke();
  }
  g.restore();

  /* Faixa diagonal Katana */
  g.save();
  g.translate(540, 955);
  g.rotate(hit.tilt);
  const slashW = lerp(1750, 1460, easeOut(clamp(dt / 0.14)));
  const slashH = hit.lines.length > 1 ? 520 : 350;
  g.fillStyle = slashCol;
  g.fillRect(-slashW / 2, -slashH / 2, slashW, slashH);
  g.fillStyle = frame === 0 ? PAL.alertKatana : '#FFFFFF';
  g.fillRect(-slashW / 2, -slashH / 2 - 14, slashW, 8);
  g.fillRect(-slashW / 2, slashH / 2 + 6, slashW, 8);
  g.restore();

  let scaleX = 1, scaleY = 1;
  if (dt < 0.11) {
    const k = easeOut(dt / 0.11);
    scaleX = lerp(1.58, 1.00, k);
    scaleY = lerp(0.56, 1.12, k);
  } else {
    const d = dt - 0.11;
    const osc = Math.exp(-15 * d) * Math.cos(40 * d);
    scaleX = 1.0 + 0.11 * osc;
    scaleY = 1.0 - 0.08 * osc;
  }

  const jitterX = Math.sin(dt * 120) * (frame <= 3 ? 14 : 5) * Math.exp(-dt * 6);
  const jitterY = Math.cos(dt * 105) * (frame <= 3 ? 10 : 4) * Math.exp(-dt * 6);

  g.translate(540 + jitterX, 955 + jitterY);
  g.rotate(hit.tilt);
  g.scale(scaleX, scaleY);

  const lines = hit.lines;
  const maxW = 920;
  const maxFs = lines.length === 1 ? 268 : 196;
  const stepY = lines.length === 1 ? 0 : 188;
  const startY = lines.length === 1 ? 0 : -stepY * 0.5;

  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.miterLimit = 2;

  for (let i = 0; i < lines.length; i++) {
    const txt = lines[i];
    let fs = maxFs;
    g.font = `900 ${fs}px ${COND}`;
    const mw = g.measureText(txt).width;
    if (mw > maxW && mw > 0) {
      fs = Math.max(48, Math.floor(maxFs * (maxW / mw)));
      g.font = `900 ${fs}px ${COND}`;
    }
    const ly = startY + i * stepY;
    const col = (i === hit.accentIdx) ? accentTextCol : mainTextCol;
    if (frame >= 4) {
      g.fillStyle = 'rgba(0,0,0,0.82)';
      g.fillText(txt, 10, ly + 12);
    }
    if (strokeCol !== 'transparent') {
      g.strokeStyle = strokeCol;
      g.lineWidth = Math.max(14, Math.round(fs * 0.10));
      g.strokeText(txt, 0, ly);
    }
    g.fillStyle = col;
    g.fillText(txt, 0, ly);
  }
  g.restore();
  return true;
}

function isFullScreenCtaActive(t){
  if (!hasMidCtaWindow(EV)) return false;
  const a = Number(EV.cta_meio_inicio);
  const b = Number(EV.cta_meio_fim);
  return t >= a && t < b;
}

  rr(barX, barY, barW, barH, 5); g.fill();
  g.fillStyle = PAL.yellow;
  rr(barX, barY, Math.max(12, barW * (1 - pct)), barH, 5); g.fill();

  g.fillStyle = PAL.dim;
  drawFittedText(ctaCfg.rodape || 'A HISTÓRIA CONTINUA EM INSTANTES', 540, barY + 42, bw - 160, 24, MONO, '700', 'center');

  if (inGlitch || outGlitch) {
    g.fillStyle = 'rgba(255,255,255,0.22)';
    for (let i = 0; i < 6; i++) {
      const sy = hash(i * 41 + Math.floor(t * 30)) * H;
      g.fillRect(0, sy, W, 6 + (i % 3) * 5);
    }
  }
  g.restore();
  return true;
}

/* ============================================================
   PARTICULAS + FUNDOS ATMOSFERICOS PULSANTES
   ============================================================ */
const PARTICLES = (() => {
  const rng = mulberry(202607);
  const arr = [];
  for (let i = 0; i < 42; i++) {
    arr.push({
      x: rng() * (W + 300) - 150,
      y: rng() * (H + 300) - 150,
      vx: (rng() - 0.48) * 24,
      vy: -(10 + rng() * 32),
      r: 2.0 + rng() * 4.8,
      layer: i < 21 ? 0 : 1,
      ph: rng() * Math.PI * 2,
      a: 0.12 + rng() * 0.24
    });
  }
  return arr;
})();

function drawParticles(t, mood){
  const colPrimary = mood === 'red' ? PAL.alert
    : (mood === 'yellow' ? PAL.yellow
      : (mood === 'cctv' ? PAL.cctvBright : PAL.cyan));
  const colAlt = mood === 'red' ? '#FF8A5B'
    : (mood === 'cctv' ? PAL.cctvPale : PAL.violet);
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < PARTICLES.length; i++) {
    const p = PARTICLES[i];
    const sp = p.layer === 1 ? 1.35 : 0.72;
    const spanW = W + 300, spanH = H + 300;
    const px = ((((p.x + p.vx * t * sp) + 150) % spanW) + spanW) % spanW - 150;
    const py = ((((p.y + p.vy * t * sp) + 150) % spanH) + spanH) % spanH - 150;
    const tw = 0.55 + 0.45 * Math.sin(t * (2.5 + p.layer * 1.3) + p.ph);
    const col = (i % 3 === 0) ? colAlt : colPrimary;
    const a = p.a * tw * (mood === 'dark' ? 0.32 : 1.0);
    g.fillStyle = rgba(col, a);
    circ(px, py, p.r);
  }
  g.restore();
}

function drawBackdrop(t, mood){
  const pulseSlow = 0.5 + 0.5 * Math.sin(t * 3.4);
  const pulseFast = 0.5 + 0.5 * Math.sin(t * 7.8);
  let top = PAL.bgNavy, bot = PAL.bgDeep, glowCol = PAL.cyan, glowA = 0.14;

  if (mood === 'cctv') {
    top = mixHex('#071418', PAL.bgNavy, pulseSlow * 0.35);
    bot = '#03080C';
    glowCol = PAL.cctvBright;
    glowA = 0.18;
  } else if (mood === 'violet') {
    top = mixHex(PAL.bgViolet, PAL.bgNavy, pulseSlow * 0.38);
    bot = PAL.bgDeep;
    glowCol = PAL.violet;
    glowA = 0.20;
  } else if (mood === 'yellow') {
    top = mixHex(PAL.bgNavy, PAL.bgYellow, 0.45 + 0.45 * pulseFast);
    bot = PAL.bgDeep;
    glowCol = PAL.yellow;
    glowA = 0.20;
  } else if (mood === 'red') {
    top = mixHex(PAL.bgViolet, PAL.bgRed, 0.55 + 0.45 * pulseFast);
    bot = mixHex(PAL.bgNavy, PAL.bgRed, 0.42 + 0.45 * pulseFast);
    glowCol = PAL.alert;
    glowA = 0.26 + 0.12 * pulseFast;
  } else if (mood === 'dark') {
    top = '#05070E';
    bot = '#020306';
    glowCol = PAL.alert;
    glowA = 0.08;
  } else {
    top = mixHex(PAL.bgNavy, '#111B33', pulseSlow * 0.35);
    bot = PAL.bgDeep;
  }

  vgrad(top, bot);
  glow(540 + Math.sin(t * 0.7) * 65, 740, 620, glowCol, glowA);
  drawParticles(t, mood);
}

/* ============================================================
   RIG FLAT EM CAPSULA UNIVERSAL (10 PONTOS IK)
   ============================================================ */
function solveIK(ax, ay, bx, by, l1, l2, bend){
  const dx = bx - ax, dy = by - ay;
  const dist = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + 0.5, l1 + l2 - 0.5);
  const a0 = Math.atan2(dy, dx);
  const cosA = clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
  const ang = a0 + bend * Math.acos(cosA);
  return [ax + Math.cos(ang) * l1, ay + Math.sin(ang) * l1];
}

function drawCapsule(ax, ay, bx, by, w, col, shadeCol){
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  g.save();
  g.translate(ax, ay);
  g.rotate(ang);
  g.fillStyle = col;
  rr(-w * 0.5, -w * 0.5, len + w, w, w * 0.5); g.fill();
  if (shadeCol) {
    g.fillStyle = shadeCol;
    rr(-w * 0.4, 0, len + w * 0.8, w * 0.48, w * 0.24); g.fill();
  }
  g.restore();
}

function speechMouthAt(t){
  if (typeof captionGroups === 'undefined' || !captionGroups || !captionGroups.length) {
    return 0.25 + 0.35 * Math.abs(Math.sin(t * 14.0));
  }
  for (let i = 0; i < captionGroups.length; i++) {
    const grp = captionGroups[i];
    if (t < Number(grp.inicio) - 0.04 || t > Number(grp.fim) + 0.04) continue;
    const pals = grp.palavras || [];
    for (let j = 0; j < pals.length; j++) {
      const w = pals[j];
      const ini = Number(w.inicio);
      const fim = Number(w.fim ?? (ini + Number(w.duracao || 0.22)));
      if (t >= ini - 0.02 && t <= fim + 0.02) {
        const len = Math.max(1, String(w.palavra || '').length);
        const freq = 15.0 + (len % 5) * 2.2;
        const env = Math.sin(clamp((t - ini) / Math.max(0.06, fim - ini)) * Math.PI);
        return clamp(0.18 + (0.45 + 0.55 * Math.abs(Math.sin(t * freq + j * 1.9))) * (0.55 + 0.45 * env), 0, 1);
      }
    }
  }
  return 0;
}

function drawEyes(cx, cy, r, ex, closed, lookX=0, lookY=0, t=0, tremble=false){
  const lift = { neutral: 0, worry: 0.06, fear: 0.11, shock: 0.14, smug: 0.04, focus: -0.04, sinister_smile: 0.05 }[ex] || 0;
  const tilt = { neutral: 0, worry: 0.11, fear: 0.10, shock: 0.06, smug: -0.07, focus: -0.11, sinister_smile: -0.10 }[ex] || 0;
  const eyePositions = [[cx - r * 0.24, 1], [cx + r * 0.24, -1]];
  g.lineCap = 'round';

  for (const [x, inner] of eyePositions) {
    const y = cy - r * 0.04;
    const browY = y - r * (0.27 + lift);
    const smugAsym = (ex === 'smug' && inner === -1) ? -r * 0.06 : 0;
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.068;
    g.beginPath();
    g.moveTo(x - inner * r * 0.15, browY + smugAsym + (ex === 'worry' || ex === 'fear' || ex === 'shock' ? r * 0.04 : 0));
    g.lineTo(x + inner * r * 0.15, browY + smugAsym - tilt * r);
    g.stroke();

    if (closed > 0.55) {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * 0.055;
      g.beginPath(); g.moveTo(x - r * 0.11, y); g.lineTo(x + r * 0.11, y); g.stroke();
      continue;
    }

    const scaleY = 1 - closed * 0.9;
    g.save();
    g.translate(x, y);
    g.scale(1, scaleY);

    const tremX = (tremble || ex === 'shock') ? noise(t * 54, inner * 7 + 3) * r * 0.025 : 0;
    const tremY = (tremble || ex === 'shock') ? noise(t * 54, inner * 11 + 9) * r * 0.025 : 0;

    if (ex === 'shock' || ex === 'fear' || ex === 'worry' || ex === 'sinister_smile') {
      const rx = ex === 'shock' ? r * 0.22 : (ex === 'sinister_smile' ? r * 0.18 : (ex === 'fear' ? r * 0.19 : r * 0.15));
      const ry = ex === 'shock' ? r * 0.25 : (ex === 'sinister_smile' ? r * 0.20 : (ex === 'fear' ? r * 0.21 : r * 0.17));
      g.fillStyle = PAL.white;
      ell(0, 0, rx, ry);
      const pr = ex === 'shock' ? r * 0.054 : (ex === 'sinister_smile' ? r * 0.058 : (ex === 'fear' ? r * 0.075 : r * 0.085));
      g.fillStyle = PAL.ink;
      circ(lookX * r * 0.06 + tremX, lookY * r * 0.05 + tremY, pr);
      g.fillStyle = PAL.white;
      circ(lookX * r * 0.06 + tremX - pr * 0.35, lookY * r * 0.05 + tremY - pr * 0.35, pr * 0.30);
    } else if (ex === 'focus' || ex === 'smug') {
      const rx = r * 0.15, ry = ex === 'focus' ? r * 0.115 : r * 0.13;
      g.fillStyle = PAL.white;
      ell(0, 0, rx, ry);
      g.fillStyle = PAL.ink;
      circ(lookX * r * 0.06, lookY * r * 0.03, r * 0.074);
      g.fillStyle = PAL.white;
      circ(lookX * r * 0.06 - r * 0.026, lookY * r * 0.03 - r * 0.026, r * 0.024);
      /* Palpebra superior firme */
      g.fillStyle = PAL.skin;
      g.fillRect(-rx - 2, -ry - 4, (rx + 2) * 2, ry * (ex === 'focus' ? 0.42 : 0.34));
    } else {
      g.fillStyle = PAL.white;
      ell(0, 0, r * 0.14, r * 0.15);
      g.fillStyle = PAL.ink;
      circ(lookX * r * 0.05, lookY * r * 0.04, r * 0.082);
      g.fillStyle = PAL.white;
      circ(lookX * r * 0.05 - r * 0.03, lookY * r * 0.04 - r * 0.03, r * 0.028);
    }
    g.restore();
  }
}

function drawMouth(cx, cy, r, ex, smileProg=1, talkAmt=0){
  const my = cy + r * 0.36;
  const open = clamp(talkAmt);
  g.lineCap = 'round';
  if (ex === 'sinister_smile') {
    const sp = clamp(smileProg);
    const w = lerp(r * 0.18, r * 0.44, sp);
    const curve = lerp(r * 0.02, r * 0.24, sp);
    g.fillStyle = '#09090F';
    g.beginPath();
    g.moveTo(cx - w, my - curve * 0.35);
    g.quadraticCurveTo(cx, my + curve * 1.45, cx + w, my - curve * 0.35);
    g.quadraticCurveTo(cx, my + curve * 0.22, cx - w, my - curve * 0.35);
    g.closePath();
    g.fill();
    if (sp > 0.35) {
      g.strokeStyle = 'rgba(248, 250, 252, 0.85)';
      g.lineWidth = r * 0.042;
      g.beginPath();
      g.moveTo(cx - w * 0.72, my - curve * 0.06);
      g.quadraticCurveTo(cx, my + curve * 0.56, cx + w * 0.72, my - curve * 0.06);
      g.stroke();
    }
    return;
  }
  if (ex === 'shock') {
    const rx = r * (0.14 + open * 0.05);
    const ry = r * (0.18 + open * 0.07);
    g.fillStyle = '#190C0E';
    ell(cx, my + r * 0.02, rx, ry);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.042;
    g.beginPath(); g.ellipse(cx, my + r * 0.02, rx, ry, 0, 0, Math.PI * 2); g.stroke();
    return;
  }
  if (ex === 'fear') {
    const rx = r * (0.13 + open * 0.05);
    const ry = r * (0.09 + open * 0.07);
    g.fillStyle = '#1E1114';
    ell(cx, my + r * 0.02, rx, ry);
    if (open > 0.35) {
      g.fillStyle = 'rgba(248,250,252,0.85)';
      rr(cx - rx * 0.6, my - ry * 0.55, rx * 1.2, ry * 0.42, 3); g.fill();
    }
    return;
  }
  if (open > 0.14) {
    /* Animacao natural de fala sincronizada durante as palavras */
    const rx = r * lerp(0.11, 0.19, open);
    const ry = r * lerp(0.045, 0.14, open);
    g.fillStyle = '#1D0F12';
    ell(cx, my + r * 0.02, rx, ry);
    if (open > 0.40) {
      g.fillStyle = 'rgba(248, 250, 252, 0.88)';
      rr(cx - rx * 0.62, my - ry * 0.62, rx * 1.24, Math.max(2, ry * 0.42), 3); g.fill();
    }
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.036;
    g.beginPath(); g.ellipse(cx, my + r * 0.02, rx, ry, 0, 0, Math.PI * 2); g.stroke();
    return;
  }
  if (ex === 'smug') {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.054;
    g.beginPath();
    g.moveTo(cx - r * 0.15, my + r * 0.02);
    g.quadraticCurveTo(cx + r * 0.04, my + r * 0.10, cx + r * 0.19, my - r * 0.04);
    g.stroke();
  } else if (ex === 'worry') {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.052;
    g.beginPath();
    g.moveTo(cx - r * 0.14, my + r * 0.03);
    g.quadraticCurveTo(cx, my - r * 0.06, cx + r * 0.14, my + r * 0.03);
    g.stroke();
  } else if (ex === 'focus') {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.054;
    g.beginPath();
    g.moveTo(cx - r * 0.14, my + r * 0.01);
    g.lineTo(cx + r * 0.14, my - r * 0.01);
    g.stroke();
  } else {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.050;
    g.beginPath();
    g.moveTo(cx - r * 0.13, my);
    g.quadraticCurveTo(cx, my + r * 0.04, cx + r * 0.13, my);
    g.stroke();
  }
}

function drawHeadProtagonista(cx, cy, r, ex, closed, opt={}){
  const {
    tilt = 0, rimA = 0.72, rimColor = PAL.cyan, rimAng = -0.35,
    lookX = 0, lookY = 0, isReflection = false, smileProg = 1, sweat = false,
    talkAmt = 0, t = 0, tremble = false
  } = opt;
  g.save();
  g.translate(cx, cy);
  g.rotate(tilt);

  g.fillStyle = isReflection ? '#C4A288' : PAL.skinShadow;
  circ(-r * 0.90, r * 0.06, r * 0.16);
  circ(r * 0.90, r * 0.06, r * 0.16);

  g.fillStyle = isReflection ? '#CFAF96' : PAL.skin;
  circ(0, 0, r);

  g.save();
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
  g.fillStyle = rgba(PAL.skinShadow, isReflection ? 0.34 : 0.24);
  circ(-r * 0.36, r * 0.18, r * 0.96);

  /* Rim light alinhado estritamente dentro do contorno da cabeca */
  if (rimA > 0.01) {
    const rimW = Math.max(3, r * 0.044);
    g.strokeStyle = rgba(rimColor, rimA * 0.74);
    g.lineWidth = rimW;
    g.lineCap = 'round';
    g.beginPath();
    g.arc(0, 0, r - rimW * 0.55, rimAng - 0.56, rimAng + 0.80);
    g.stroke();
  }

  g.fillStyle = PAL.hair;
  g.beginPath();
  g.arc(0, -r * 0.14, r * 1.03, Math.PI * 1.04, Math.PI * 1.96);
  g.quadraticCurveTo(r * 0.62, -r * 0.42, r * 0.15, -r * 0.56);
  g.quadraticCurveTo(-r * 0.36, -r * 0.46, -r * 0.96, -r * 0.18);
  g.closePath();
  g.fill();
  g.restore();

  g.fillStyle = PAL.hair;
  g.beginPath();
  g.ellipse(0, -r * 0.72, r * 0.80, r * 0.34, -0.05, Math.PI, Math.PI * 2);
  g.fill();
  g.beginPath();
  g.ellipse(-r * 0.30, -r * 0.64, r * 0.40, r * 0.21, -0.22, 0, Math.PI * 2);
  g.fill();

  drawEyes(0, 0, r, ex, closed, lookX, lookY, t, tremble);
  drawMouth(0, 0, r, ex, smileProg, talkAmt);

  if (sweat || ex === 'shock' || ex === 'fear') {
    const dropCycle = (t * 0.85) % 1;
    const dropY = -r * 0.32 + dropCycle * r * 0.46;
    const dropAlpha = dropCycle < 0.85 ? 0.92 : lerp(0.92, 0, (dropCycle - 0.85) / 0.15);
    g.save();
    g.globalAlpha = dropAlpha;
    g.fillStyle = PAL.sweat;
    g.beginPath();
    g.moveTo(r * 0.58, dropY);
    g.quadraticCurveTo(r * 0.68, dropY + r * 0.18, r * 0.58, dropY + r * 0.24);
    g.quadraticCurveTo(r * 0.48, dropY + r * 0.18, r * 0.58, dropY);
    g.fill();
    g.restore();
  }
  g.restore();
}

function canonicalPoseName(poseOrName){
  if (typeof poseOrName === 'string') {
    const n = poseOrName.toLowerCase().trim();
    const map = {
      idle: 'em_pe', standing: 'em_pe', em_pe: 'em_pe',
      falando: 'falando', phone: 'falando', talking: 'falando',
      apontando: 'apontando', press: 'apontando', reach: 'apontando', pointing: 'apontando',
      assustado: 'assustado', panic: 'assustado', scared: 'assustado',
      pensando: 'pensando', thinking: 'pensando',
      correndo: 'correndo', walk: 'correndo', running: 'correndo',
      pulando: 'pulando', jumping: 'pulando',
      flutuando: 'flutuando', floating: 'flutuando', levitando: 'flutuando',
      caindo: 'caindo', falling: 'caindo',
      comemorando: 'comemorando', celebrating: 'comemorando',
      segurando_mesa: 'segurando_mesa'
    };
    return map[n] || 'falando';
  }
  if (poseOrName && typeof poseOrName === 'object') {
    if (poseOrName.name) return canonicalPoseName(poseOrName.name);
    if (poseOrName.segurando_mesa) return 'segurando_mesa';
    if (poseOrName.caindo) return 'caindo';
    if (poseOrName.flutuando) return 'flutuando';
    if (poseOrName.walk) return 'correndo';
    if (poseOrName.panic) return 'assustado';
    if (poseOrName.press || poseOrName.reach) return 'apontando';
    if (poseOrName.phone) return 'falando';
  }
  return 'em_pe';
}

function computePoseTargets(name, t, localP, shY, talkAmt){
  const sway = Math.sin(t * 2.2) * 5;
  const base = {
    liftX: 0, liftY: 0, bodyRot: 0, headTilt: Math.sin(t * 1.7) * 0.03,
    lFootX: -32, lFootY: -12, rFootX: 32, rFootY: -12, lShoeRot: 0, rShoeRot: 0,
    bHandX: -68 + sway, bHandY: shY + 184, bBend: 1,
    fHandX: 68 - sway, fHandY: shY + 184, fBend: -1,
    shadowScale: 1.0, shadowAlpha: 0.45, lookY: 0
  };
  if (name === 'falando') {
    const gest = Math.sin(t * 7.2) * (0.55 + 0.45 * talkAmt);
    const gest2 = Math.cos(t * 5.8) * (0.55 + 0.45 * talkAmt);
    return {
      ...base,
      bodyRot: Math.sin(t * 2.6) * 0.028,
      headTilt: Math.sin(t * 4.2) * 0.065,
      bHandX: -96 + gest * 18, bHandY: shY + 62 - gest * 24, bBend: -1,
      fHandX: 102 + gest2 * 22, fHandY: shY + 46 + gest2 * 26, fBend: 1
    };
  }
  if (name === 'apontando') {
    const pulse = Math.sin(t * 6.0) * 9;
    return {
      ...base,
      bodyRot: 0.04, headTilt: -0.05,
      bHandX: -76, bHandY: shY + 150, bBend: 1,
      fHandX: 158 + pulse, fHandY: shY - 38 + Math.cos(t * 4.5) * 6, fBend: 1
    };
  }
  if (name === 'assustado') {
    const trem = Math.sin(t * 28) * 6;
    return {
      ...base,
      liftY: 8 + Math.abs(Math.sin(t * 10)) * 5,
      bodyRot: -0.06 + Math.sin(t * 22) * 0.02,
      headTilt: -0.08 + Math.sin(t * 20) * 0.03,
      lFootX: -44, rFootX: 44,
      bHandX: -88 + trem, bHandY: shY - 12 - Math.abs(trem), bBend: -1,
      fHandX: 88 - trem, fHandY: shY - 18 + trem * 0.5, fBend: 1
    };
  }
  if (name === 'pensando') {
    return {
      ...base,
      bodyRot: -0.03, headTilt: 0.09 + Math.sin(t * 1.6) * 0.03,
      bHandX: 12, bHandY: shY + 86, bBend: -1,
      fHandX: 28 + Math.sin(t * 2.4) * 4, fHandY: shY - 46 + Math.cos(t * 2.2) * 3, fBend: 1,
      lookY: -0.18
    };
  }
  if (name === 'correndo') {
    const ph = t * 11.5;
    const s = Math.sin(ph), c = Math.cos(ph);
    return {
      ...base,
      liftX: Math.sin(ph * 0.5) * 8,
      liftY: -18 - Math.abs(s) * 26,
      bodyRot: 0.16 + c * 0.04,
      headTilt: -0.08,
      lFootX: -14 + s * 68, lFootY: -16 - Math.max(0, c) * 46, lShoeRot: s * 0.32,
      rFootX: 14 - s * 68, rFootY: -16 - Math.max(0, -c) * 46, rShoeRot: -s * 0.32,
      bHandX: -18 - s * 86, bHandY: shY + 56 - Math.max(0, -s) * 42, bBend: -1,
      fHandX: 18 + s * 86, fHandY: shY + 56 - Math.max(0, s) * 42, fBend: 1,
      shadowScale: 0.85, shadowAlpha: 0.32
    };
  }
  if (name === 'pulando') {
    const arc = Math.abs(Math.sin(t * 4.4));
    return {
      ...base,
      liftY: -26 - arc * 124,
      bodyRot: -0.05 + Math.sin(t * 4.4) * 0.08,
      headTilt: -0.06,
      lFootX: -48, lFootY: -24 - arc * 36, lShoeRot: 0.28,
      rFootX: 48, rFootY: -18 - arc * 52, rShoeRot: -0.26,
      bHandX: -124, bHandY: shY - 72 - arc * 26, bBend: -1,
      fHandX: 124, fHandY: shY - 78 - arc * 26, fBend: 1,
      shadowScale: lerp(0.95, 0.52, arc), shadowAlpha: lerp(0.42, 0.16, arc), lookY: -0.15
    };
  }
  if (name === 'flutuando') {
    return {
      ...base,
      liftX: Math.sin(t * 1.35) * 20,
      liftY: -168 - Math.sin(t * 2.05) * 30,
      bodyRot: -0.15 + Math.sin(t * 1.55) * 0.13,
      headTilt: Math.sin(t * 1.9) * 0.09,
      lFootX: -46 + Math.sin(t * 2.5) * 20, lFootY: -44 + Math.cos(t * 2.2) * 18, lShoeRot: 0.24 + Math.sin(t * 2.4) * 0.14,
      rFootX: 52 + Math.cos(t * 2.3) * 18, rFootY: -74 + Math.sin(t * 2.6) * 18, rShoeRot: -0.22 + Math.cos(t * 2.1) * 0.14,
      bHandX: -134 + Math.sin(t * 3.0) * 16, bHandY: shY - 22 + Math.cos(t * 2.7) * 22, bBend: -1,
      fHandX: 136 + Math.cos(t * 2.8) * 16, fHandY: shY - 32 + Math.sin(t * 3.1) * 22, fBend: 1,
      shadowScale: 1.22, shadowAlpha: 0.18, lookY: -0.20
    };
  }
  if (name === 'caindo') {
    const dp = clamp(localP);
    const accel = dp * dp;
    return {
      ...base,
      liftX: Math.sin(t * 24) * 5,
      liftY: lerp(-220, -24, accel),
      bodyRot: 0.20 + Math.sin(t * 18) * 0.05,
      headTilt: -0.09,
      lFootX: -58 + Math.sin(t * 20) * 10, lFootY: -62 + Math.cos(t * 18) * 10, lShoeRot: 0.36,
      rFootX: 58 + Math.cos(t * 19) * 10, rFootY: -30 + Math.sin(t * 21) * 10, rShoeRot: -0.28,
      bHandX: -118 + Math.sin(t * 24) * 12, bHandY: shY - 116 + Math.cos(t * 20) * 10, bBend: -1,
      fHandX: 122 + Math.cos(t * 22) * 12, fHandY: shY - 112 + Math.sin(t * 23) * 10, fBend: 1,
      shadowScale: lerp(1.3, 0.85, accel), shadowAlpha: lerp(0.16, 0.52, accel), lookY: 0.42
    };
  }
  if (name === 'comemorando') {
    const bounce = Math.abs(Math.sin(t * 7.0));
    return {
      ...base,
      liftY: -10 - bounce * 36,
      bodyRot: Math.sin(t * 5.2) * 0.06,
      headTilt: Math.sin(t * 6.4) * 0.08,
      lFootX: -38, lFootY: -14 - bounce * 10, rFootX: 38, rFootY: -14 - bounce * 10,
      bHandX: -108 + Math.sin(t * 8.0) * 14, bHandY: shY - 118 - bounce * 18, bBend: -1,
      fHandX: 108 - Math.sin(t * 8.0) * 14, fHandY: shY - 118 - bounce * 18, fBend: 1,
      shadowScale: lerp(1.0, 0.78, bounce), shadowAlpha: lerp(0.45, 0.25, bounce)
    };
  }
  /* em_pe: respiracao viva e micro-movimento natural */
  return base;
}

function drawProtagonista(x, footY, sc, opt={}){
  const {
    t = 0, ex = 'neutral', closed = 0, face = 1, fastBreath = false,
    pose = {}, prevPose = null, shotAge = 1.0, rimColor = PAL.cyan, rimA = 0.75,
    lookX = 0, lookY = 0, isReflection = false, smileProg = 1, backView = false, localP = 0
  } = opt;

  const poseName = canonicalPoseName(pose);
  const prevName = prevPose ? canonicalPoseName(prevPose) : poseName;
  const effEx = (poseName === 'caindo' && ex === 'sinister_smile') ? 'shock' : ex;
  const talkAmt = backView ? 0 : speechMouthAt(t);
  const breath = Math.sin(t * (fastBreath ? 6.8 : 2.6)) * (fastBreath ? 5.2 : 2.8);
  const pantsA = isReflection ? '#263448' : PAL.pantsDark;
  const pantsB = isReflection ? '#2F3F57' : PAL.pants;
  const topMain = isReflection ? mixHex(PAL.top, '#0F172A', 0.25) : PAL.top;
  const topSh = isReflection ? mixHex(PAL.topShade, '#0F172A', 0.25) : PAL.topShade;

  g.save();
  g.translate(x, footY);
  g.scale(sc * face, sc);

  /* POSE ESPECIAL LEGADA: segurando_mesa */
  if (poseName === 'segurando_mesa') {
    const bob = Math.sin(t * 3.6);
    const trem = Math.sin(t * 28) * 1.6;
    const gripX = typeof opt.deskGripX === 'number' ? opt.deskGripX : -110;
    const gripY = typeof opt.deskGripY === 'number' ? opt.deskGripY : -236;
    const shX = 12 + bob * 7;
    const shY0 = -346 - bob * 14 + trem;
    const bodyTilt = -0.92 - bob * 0.09;

    if (!isReflection) {
      g.fillStyle = 'rgba(0,0,0,0.22)';
      ell(96, 6, 118, 20);
    }

    const bShX = shX - 18, bShY = shY0 + 14;
    const bElbow = solveIK(bShX, bShY, gripX, gripY, 94, 94, 1);
    drawCapsule(bShX, bShY, bElbow[0], bElbow[1], 30, topSh);
    drawCapsule(bElbow[0], bElbow[1], gripX, gripY, 26, topSh);
    g.fillStyle = isReflection ? '#C7A68E' : PAL.skinShadow;
    circ(gripX, gripY, 16);

    g.save();
    g.translate(shX, shY0);
    g.rotate(bodyTilt);
    const localHipY = 190;
    const lFootX = -26 + Math.sin(t * 4.4) * 20;
    const lFootY = 360 + Math.cos(t * 3.8) * 18;
    const rFootX = 34 + Math.cos(t * 4.0) * 22;
    const rFootY = 340 + Math.sin(t * 4.2) * 18;
    const lKnee = solveIK(-24, localHipY, lFootX, lFootY, 102, 102, 1);
    const rKnee = solveIK(24, localHipY, rFootX, rFootY, 102, 102, 1);
    drawCapsule(-24, localHipY, lKnee[0], lKnee[1], 36, pantsA);
    drawCapsule(lKnee[0], lKnee[1], lFootX, lFootY, 32, pantsA);
    drawCapsule(24, localHipY, rKnee[0], rKnee[1], 36, pantsB);
    drawCapsule(rKnee[0], rKnee[1], rFootX, rFootY, 32, pantsB);
    drawSneaker(lFootX, lFootY, 0.25);
    drawSneaker(rFootX, rFootY, -0.18);
    drawTorsoAndHead(0, {
      topMain, rimColor, rimA, backView, isReflection, ex: effEx, closed,
      headTilt: 0.48, lookX: -0.55, lookY: 0.25, smileProg, talkAmt, t
    });
    g.restore();

    const fShX = shX + 20, fShY = shY0 + 24;
    const fHandX = gripX + 28, fHandY = gripY - 2;
    const fElbow = solveIK(fShX, fShY, fHandX, fHandY, 94, 94, 1);
    drawCapsule(fShX, fShY, fElbow[0], fElbow[1], 30, topMain, rgba(PAL.topDeep, 0.25));
    drawCapsule(fElbow[0], fElbow[1], fHandX, fHandY, 26, topMain, rgba(PAL.topDeep, 0.25));
    g.fillStyle = isReflection ? '#CFAF96' : PAL.skin;
    circ(fHandX, fHandY, 17);
    g.restore();
    return;
  }

  const hipY = -205 + breath * 0.35;
  const shY = -395 + breath;

  /* Interpolacao suave entre poses (0.24s de transicao) */
  const curT = computePoseTargets(poseName, t, localP, shY, talkAmt);
  let pt = curT;
  if (prevName !== poseName && prevName !== 'segurando_mesa' && shotAge < 0.24) {
    const prevT = computePoseTargets(prevName, t, 1.0, shY, talkAmt);
    const k = ease(clamp(shotAge / 0.24));
    pt = {
      liftX: lerp(prevT.liftX, curT.liftX, k),
      liftY: lerp(prevT.liftY, curT.liftY, k),
      bodyRot: lerp(prevT.bodyRot, curT.bodyRot, k),
      headTilt: lerp(prevT.headTilt, curT.headTilt, k),
      lFootX: lerp(prevT.lFootX, curT.lFootX, k),
      lFootY: lerp(prevT.lFootY, curT.lFootY, k),
      rFootX: lerp(prevT.rFootX, curT.rFootX, k),
      rFootY: lerp(prevT.rFootY, curT.rFootY, k),
      lShoeRot: lerp(prevT.lShoeRot, curT.lShoeRot, k),
      rShoeRot: lerp(prevT.rShoeRot, curT.rShoeRot, k),
      bHandX: lerp(prevT.bHandX, curT.bHandX, k),
      bHandY: lerp(prevT.bHandY, curT.bHandY, k),
      bBend: curT.bBend,
      fHandX: lerp(prevT.fHandX, curT.fHandX, k),
      fHandY: lerp(prevT.fHandY, curT.fHandY, k),
      fBend: curT.fBend,
      shadowScale: lerp(prevT.shadowScale, curT.shadowScale, k),
      shadowAlpha: lerp(prevT.shadowAlpha, curT.shadowAlpha, k),
      lookY: lerp(prevT.lookY, curT.lookY, k)
    };
  }

  if (!isReflection) {
    g.fillStyle = `rgba(0,0,0,${pt.shadowAlpha.toFixed(2)})`;
    ell(pt.liftX * 0.45, 6, 84 * pt.shadowScale, 18 * pt.shadowScale);
  }

  if (poseName === 'caindo') {
    g.save();
    g.strokeStyle = 'rgba(226, 232, 240, 0.28)';
    g.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const sx = -155 + i * 44 + Math.sin(i * 19) * 14;
      const sy0 = pt.liftY - 490 + ((t * 980 + i * 95) % 440);
      g.lineWidth = 2.5 + (i % 3);
      g.beginPath(); g.moveTo(sx, sy0); g.lineTo(sx, sy0 - 78 - (i % 3) * 24); g.stroke();
    }
    g.restore();
  }

  g.save();
  if (pt.liftX || pt.liftY || pt.bodyRot) {
    g.translate(pt.liftX, pt.liftY);
    g.translate(0, -250);
    g.rotate(pt.bodyRot);
    g.translate(0, 250);
  }

  const lKnee = solveIK(-24, hipY, pt.lFootX, pt.lFootY, 102, 102, 1);
  const rKnee = solveIK(24, hipY, pt.rFootX, pt.rFootY, 102, 102, 1);

  drawCapsule(-24, hipY, lKnee[0], lKnee[1], 36, pantsA);
  drawCapsule(lKnee[0], lKnee[1], pt.lFootX, pt.lFootY, 32, pantsA);
  drawCapsule(24, hipY, rKnee[0], rKnee[1], 36, pantsB);
  drawCapsule(rKnee[0], rKnee[1], pt.rFootX, pt.rFootY, 32, pantsB);

  drawSneaker(pt.lFootX, pt.lFootY, pt.lShoeRot);
  drawSneaker(pt.rFootX, pt.rFootY, pt.rShoeRot);

  const bElbow = solveIK(-48, shY + 18, pt.bHandX, pt.bHandY, 92, 92, pt.bBend);
  drawCapsule(-48, shY + 18, bElbow[0], bElbow[1], 30, topSh);
  drawCapsule(bElbow[0], bElbow[1], pt.bHandX, pt.bHandY, 26, topSh);
  g.fillStyle = isReflection ? '#C7A68E' : PAL.skinShadow;
  circ(pt.bHandX, pt.bHandY, 16);

  drawTorsoAndHead(shY, {
    topMain, rimColor, rimA, backView, isReflection, ex: effEx, closed,
    headTilt: pt.headTilt, lookX, lookY: lookY || pt.lookY, smileProg, talkAmt, t
  });

  const fElbow = solveIK(48, shY + 20, pt.fHandX, pt.fHandY, 92, 92, pt.fBend);
  drawCapsule(48, shY + 20, fElbow[0], fElbow[1], 30, topMain, rgba(PAL.topDeep, 0.25));
  drawCapsule(fElbow[0], fElbow[1], pt.fHandX, pt.fHandY, 26, topMain, rgba(PAL.topDeep, 0.25));
  g.fillStyle = isReflection ? '#CFAF96' : PAL.skin;
  circ(pt.fHandX, pt.fHandY, 17);

  if (pose && pose.phone && !backView) {
    g.save();
    g.translate(pt.fHandX + 12, pt.fHandY - 12);
    g.rotate(-0.22);
    g.fillStyle = PAL.phone;
    rr(-18, -32, 36, 64, 7); g.fill();
    g.fillStyle = PAL.cyan;
    rr(-14, -26, 28, 52, 4); g.fill();
    glow(0, 0, 120, PAL.cyan, 0.36);
    g.restore();
  }
  g.restore();
  g.restore();
}

function poseObjFromName(name){
  const n = canonicalPoseName(name);
  return { name: n };
}

/* ============================================================
   10 MODULOS DE CENARIO PARAMETRIZAVEIS (MOTOR UNIVERSAL V6.1)
   ============================================================ */

/* MODULO 1: quarto_noturno (cama, janela com luar/chuva, guarda-roupa/vulto, criado-mudo) */
function drawQuartoNoturno(t, shot, f, localP){
  const props = shot.props || {};
  const isRed = shot.mood === 'red';
  drawBackdrop(t, shot.mood);

  /* Parede e piso do quarto */
  vgrad(isRed ? '#1A0B14' : '#0B1325', '#050811', 0, 1340);
  g.fillStyle = '#090D16';
  g.fillRect(-160, 1320, W + 320, 680);
  g.fillStyle = '#182235';
  g.fillRect(-160, 1312, W + 320, 14);

  /* Janela noturna a esquerda com lua fria e chuva */
  const wx = 86, wy = 320, ww = 310, wh = 470;
  g.fillStyle = '#061224';
  rr(wx, wy, ww, wh, 10); g.fill();
  g.save();
  rr(wx, wy, ww, wh, 10); g.clip();
  const moonG = g.createRadialGradient(wx + 220, wy + 120, 12, wx + 220, wy + 120, 220);
  moonG.addColorStop(0, 'rgba(186, 230, 253, 0.45)');
  moonG.addColorStop(1, 'rgba(10, 15, 29, 0)');
  g.fillStyle = moonG;
  g.fillRect(wx, wy, ww, wh);
  g.fillStyle = '#E0F2FE';
  circ(wx + 226, wy + 112, 34);
  /* Gotas de chuva diagonais */
  g.strokeStyle = 'rgba(186, 230, 253, 0.35)';
  g.lineWidth = 2;
  for (let i = 0; i < 18; i++) {
    const rx = wx + ((i * 37 + t * 80) % ww);
    const ry = wy + ((i * 71 + t * 420) % wh);
    g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx - 10, ry + 26); g.stroke();
  }
  /* Persiana semiaberta */
  g.fillStyle = 'rgba(6, 10, 18, 0.55)';
  for (let by = wy + 18; by < wy + wh; by += 36) g.fillRect(wx, by, ww, 10);
  g.restore();
  g.strokeStyle = '#334155'; g.lineWidth = 10;
  rr(wx, wy, ww, wh, 10); g.stroke();

  /* Feixe de luar atravessando o quarto */
  g.save();
  g.fillStyle = isRed ? 'rgba(255, 59, 48, 0.07)' : 'rgba(56, 217, 255, 0.08)';
  g.beginPath();
  g.moveTo(wx + ww, wy + 40); g.lineTo(wx + ww + 340, 1320);
  g.lineTo(wx + 80, 1320); g.lineTo(wx, wy + wh);
  g.closePath(); g.fill();
  g.restore();

  /* Guarda-roupa escuro a direita (com fresta que abre quando vulto=true) */
  const gx = 688, gy = 390, gw = 320, gh = 925;
  g.fillStyle = PAL.woodDark;
  rr(gx, gy, gw, gh, 10); g.fill();
  g.strokeStyle = '#3D2B24'; g.lineWidth = 5;
  rr(gx, gy, gw, gh, 10); g.stroke();
  /* Fresta sinistra abrindo */
  const crack = props.vulto ? lerp(18, 66, easeOut(localP)) : 12;
  g.fillStyle = '#020305';
  g.fillRect(gx + gw * 0.5 - crack * 0.5, gy + 12, crack, gh - 24);
  if (props.vulto) {
    const ey = gy + 360;
    const ex = gx + gw * 0.5;
    glow(ex, ey, 90, PAL.alert, 0.25 + 0.1 * Math.sin(t * 7));
    g.fillStyle = '#F8FAFC';
    ell(ex - 12, ey, 6, 4); ell(ex + 12, ey, 6, 4);
  }
  /* Puxadores do guarda-roupa */
  g.fillStyle = '#94A3B8';
  rr(gx + gw * 0.5 - crack * 0.5 - 18, gy + 430, 8, 72, 4); g.fill();
  rr(gx + gw * 0.5 + crack * 0.5 + 10, gy + 430, 8, 72, 4); g.fill();

  /* Cama + criado-mudo com relogio digital vermelho a esquerda */
  g.fillStyle = '#1E293B';
  rr(40, 1065, 420, 265, 22); g.fill();
  g.fillStyle = '#334155';
  rr(56, 1020, 170, 76, 26); g.fill();
  g.fillStyle = '#0F172A';
  rr(40, 1140, 420, 190, 16); g.fill();

  /* Criado-mudo com abajur apagado/sutil (sem duplicar o relogio superior) */
  g.fillStyle = PAL.woodMid;
  rr(476, 1125, 162, 195, 12); g.fill();
  g.fillStyle = '#334155';
  rr(548, 1082, 18, 44, 4); g.fill();
  g.fillStyle = '#1E293B';
  g.beginPath();
  g.moveTo(522, 1086); g.lineTo(592, 1086); g.lineTo(578, 1038); g.lineTo(536, 1038);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(148, 163, 184, 0.25)'; g.lineWidth = 2; g.stroke();

  /* Protagonista em pe no quarto */
  const ex = shot.expressao || f.ex;
  drawProtagonista(470, 1362, 1.02, {
    t, ex, closed: f.closed, localP,
    fastBreath: ex === 'fear' || ex === 'shock',
    pose: poseObjFromName(props.pose),
    rimColor: isRed ? PAL.alert : PAL.cyan,
    rimA: 0.82,
    lookX: props.vulto ? 0.55 : -0.20
  });
}

/* MODULO 2: corredor_escuro (perspectiva claustrofobica, luz piscando, porta/cadeira/vulto) */
function drawCorredorEscuro(t, shot, f, localP){
  const props = shot.props || {};
  const flk = (Math.sin(t * 28) > -0.45 && Math.sin(t * 11.3) > -0.75) ? 0.85 : 0.24;
  const isRed = shot.mood === 'red';
  vgrad('#060910', '#020408');

  /* Paredes em perspectiva */
  const vx = 540, vy = 740;
  g.fillStyle = '#141B26';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(vx - 190, vy - 280); g.lineTo(vx - 190, vy + 360); g.lineTo(0, H); g.closePath(); g.fill();
  g.fillStyle = '#111722';
  g.beginPath(); g.moveTo(W, 0); g.lineTo(vx + 190, vy - 280); g.lineTo(vx + 190, vy + 360); g.lineTo(W, H); g.closePath(); g.fill();
  /* Teto e piso umido */
  g.fillStyle = '#090D14';
  g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(vx + 190, vy - 280); g.lineTo(vx - 190, vy - 280); g.closePath(); g.fill();
  const flG = g.createLinearGradient(0, vy + 360, 0, H);
  flG.addColorStop(0, '#0B1018');
  flG.addColorStop(1, '#1B2330');
  g.fillStyle = flG;
  g.beginPath(); g.moveTo(vx - 190, vy + 360); g.lineTo(vx + 190, vy + 360); g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();

  /* Fundo do corredor */
  g.fillStyle = '#05080E';
  g.fillRect(vx - 190, vy - 280, 380, 640);

  /* Lampada fluorescente piscando no teto */
  const lampCol = isRed ? PAL.alert : '#E0F2FE';
  g.fillStyle = flk > 0.5 ? lampCol : '#1E293B';
  rr(420, 355, 240, 22, 11); g.fill();
  if (flk > 0.4) {
    glow(540, 420, 440, isRed ? PAL.alert : PAL.cyan, flk * 0.28);
    /* Reflexo da luz no piso */
    g.fillStyle = rgba(isRed ? PAL.alert : PAL.cyan, flk * 0.12);
    g.beginPath(); g.moveTo(470, vy + 360); g.lineTo(610, vy + 360); g.lineTo(740, H); g.lineTo(340, H); g.closePath(); g.fill();
  }

  /* Elemento focal configuravel: cadeira | vulto | porta */
  const obj = String(props.corredor_objeto || (props.vulto ? 'vulto' : 'porta')).toLowerCase();
  if (obj === 'cadeira') {
    const cx = 540, cy = 1145;
    g.fillStyle = 'rgba(0,0,0,0.68)';
    ell(cx, cy + 88, 128, 28);
    g.strokeStyle = '#94A3B8'; g.lineWidth = 10; g.lineCap = 'round';
    /* Pernas metalicas */
    g.beginPath();
    g.moveTo(cx - 56, cy - 10); g.lineTo(cx - 72, cy + 84);
    g.moveTo(cx + 56, cy - 10); g.lineTo(cx + 72, cy + 84);
    g.moveTo(cx - 46, cy - 10); g.lineTo(cx - 54, cy + 62);
    g.moveTo(cx + 46, cy - 10); g.lineTo(cx + 54, cy + 62);

    /* Assento e encosto */
    g.fillStyle = '#475569';
    rr(cx - 66, cy - 22, 132, 22, 6); g.fill();
    g.strokeStyle = '#CBD5E1'; g.lineWidth = 8;

    g.stroke();
    g.fillStyle = '#334155';
    rr(cx - 60, cy - 126, 120, 44, 8); g.fill();
  } else if (obj === 'vulto') {

    g.fillStyle = isRed ? PAL.alert : '#F8FAFC';
    ell(-20, -412, 9, 5); ell(20, -412, 9, 5);
    g.restore();
  } else {

    const dx = vx - 122, dy = vy - 210, dw = 244, dh = 570;

    rr(dx, dy, dw, dh, 6); g.fill();
    g.strokeStyle = '#475569'; g.lineWidth = 6;

    g.fillRect(dx + dw - gapW, dy + 6, gapW, dh - 12);
    glow(dx + dw - 10, dy + dh * 0.5, 220, isRed ? PAL.alert : PAL.yellow, 0.34);
    g.fillStyle = '#CBD5E1';
    circ(dx + dw - gapW - 22, dy + dh * 0.52, 10);
  }

  /* Protagonista em primeiro plano (de costas ou lateral, sem cobrir o foco) */
  if (props.pose === 'walk' || props.pose === 'panic' || obj !== 'vulto') {
    const px = obj === 'cadeira' ? 270 : 300;
    drawProtagonista(px, 1385, 0.98, {
      t, ex: shot.expressao || f.ex, closed: f.closed, localP,
      fastBreath: true,
      backView: obj === 'vulto' || obj === 'porta',
      pose: poseObjFromName(props.pose),
      rimColor: isRed ? PAL.alert : PAL.cyan,
      rimA: 0.84
    });
  }
}

  g.beginPath(); g.moveTo(430, horY); g.lineTo(650, horY); g.lineTo(W + 120, 1260); g.lineTo(-120, 1260); g.closePath(); g.fill();

  /* Cones dos farois iluminando a pista */

  const beamL = g.createLinearGradient(540, 1150, 540, horY);
  beamL.addColorStop(0, rgba(isRed ? PAL.alert : '#E0F2FE', 0.24));
  beamL.addColorStop(1, 'rgba(56, 217, 255, 0)');

  /* Faixas da pista animadas */
  g.fillStyle = rgba(PAL.yellow, 0.72);
  for (let i = 0; i < 6; i++) {
    const p = ((i / 6) + (t * 0.95)) % 1;
    const y = lerp(horY + 12, 1160, p * p);

    const h = lerp(16, 74, p * p);

  for (let i = 0; i < 5; i++) {

  g.lineTo(W + 60, H + 80);
  g.lineTo(-60, H + 80);
  g.closePath();
  g.fill();
  g.strokeStyle = '#1E293B'; g.lineWidth = 6; g.stroke();

  /* Volante a esquerda */
  g.strokeStyle = '#1E293B'; g.lineWidth = 34;
  g.beginPath(); g.arc(270, 1210, 195, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
  g.fillStyle = '#0F172A';
  circ(270, 1220, 66);

  rr(gx, gy, gw, gh, 22); g.fill();

  /* Mapa estilizado e rota no GPS */
  g.save();
  rr(gx + 8, gy + 8, gw - 16, gh - 16, 16); g.clip();
  g.strokeStyle = 'rgba(56, 217, 255, 0.14)'; g.lineWidth = 2;
  for (let x = gx; x < gx + gw; x += 48) { g.beginPath(); g.moveTo(x, gy); g.lineTo(x, gy + gh); g.stroke(); }
  for (let y = gy; y < gy + gh; y += 48) { g.beginPath(); g.moveTo(gx, y); g.lineTo(gx + gw, y); g.stroke(); }
  /* Linha da rota */
  g.strokeStyle = isRed ? PAL.alert : PAL.cyan; g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath();
  g.moveTo(gx + 130, gy + 310);
  g.lineTo(gx + 240, gy + 210);

  glow(gx + 430, gy + 110, 64, PAL.alert, 0.55);

  g.fillRect(gx, gy, gw, 58);

  drawFittedText(props.gps_alerta || 'ROTA RECALCULADA', gx + gw * 0.5, gy + 30, gw - 36, 26, MONO, '900', 'center');

  g.fillRect(gx, gy + gh - 64, gw, 64);

  g.restore();
}

/* ============================================================
   PROPS FLUTUANTES E FISICA DE GRAVIDADE ZERO (V6.1)
   ============================================================ */
function resolveZeroG(shot){
  const props = shot.props || {};
  const poseName = String(props.pose || 'idle').toLowerCase().trim();
  const objRaw = normWord(String(props.objeto || ''));
  const rawList = Array.isArray(props.objetos_flutuantes) ? props.objetos_flutuantes : [];
  const items = new Set();

  for (const it of rawList) {
    const k = normWord(String(it));
    if (k.includes('lapiseira') || k.includes('caneta') || k.includes('lapis')) items.add('lapiseira');
    if (k.includes('xicara') || k.includes('cafe') || k.includes('caneca')) items.add('xicara_cafe');
    if (k.includes('cadeira')) items.add('cadeiras');
    if (k.includes('silhueta') || k.includes('janela') || k.includes('pessoa') || k.includes('carro')) items.add('silhuetas_janela');
  }
  if (objRaw.includes('lapiseira') || objRaw.includes('caneta')) items.add('lapiseira');
  if (objRaw.includes('xicara') || objRaw.includes('cafe')) items.add('xicara_cafe');
  if (objRaw.includes('cadeira')) items.add('cadeiras');
  if (props.silhuetas_janela) items.add('silhuetas_janela');

  const active = Boolean(props.gravidade_zero)
    || poseName === 'flutuando'
    || poseName === 'segurando_mesa'
    || poseName === 'caindo'
    || items.size > 0;
  const isFalling = poseName === 'caindo';

  if (active && items.size === 0) {
    items.add('lapiseira');
    items.add('xicara_cafe');
    items.add('cadeiras');
  }
  return { active, isFalling, poseName, items };
}

  /* Silhuetas humanas flutuando do lado de fora da janela panoramica */
  const people = [
    { xf: 0.14, yf: 0.54, sp: 44, sc: 0.56, ph: 0.3 },

    g.lineWidth = 2;

}

function drawFloatingXicaraCafe(cx, cy, t, sc=1){
  const rot = 0.44 + Math.sin(t * 1.25 + 0.8) * 0.24;
  g.save();
  g.translate(cx, cy);
  g.rotate(rot);
  g.scale(sc, sc);
  glow(0, 0, 84, '#F59E0B', 0.18);

  g.strokeStyle = '#CBD5E1';
  g.lineWidth = 9;
  g.beginPath();
  g.arc(30, 2, 18, -Math.PI * 0.45, Math.PI * 0.45);
  g.stroke();
  /* Corpo ceramico */
  g.fillStyle = '#E2E8F0';
  rr(-30, -34, 60, 68, 12); g.fill();
  g.fillStyle = '#94A3B8';
  rr(-30, -34, 18, 68, 10); g.fill();
  /* Cafe escuro na boca da xicara */
  g.fillStyle = '#3E2723';
  ell(0, -30, 26, 8);
  g.restore();

  /* Gotas esfericas de cafe suspensas em gravidade zero */
  const drops = [
    { dx: 44, dy: -56, r: 9.5, ph: 0.2 },
    { dx: 76, dy: -84, r: 6.5, ph: 1.4 },
    { dx: 18, dy: -82, r: 7.5, ph: 2.3 },
    { dx: 58, dy: -22, r: 5.5, ph: 3.1 },
    { dx: 96, dy: -46, r: 4.5, ph: 4.2 },
    { dx: -16, dy: -66, r: 5.0, ph: 5.1 }
  ];
  for (let i = 0; i < drops.length; i++) {

    const gx = cx + (d.dx + Math.sin(t * 2.2 + d.ph) * 10) * sc;
    const gy = cy + (d.dy + Math.cos(t * 1.9 + d.ph) * 12) * sc;

    circ(gx, gy, gr);

}

function drawFloatingProps(t, zg, localP, opt={}){
  if (!zg.active) return;
  const fallDrop = zg.isFalling ? (localP * localP * 280) : 0;
  const layer = opt.layer || 'front';

  if (layer === 'back') {
    /* Cadeiras giratorias flutuando e girando devagar no ambiente */
    if (zg.items.has('cadeiras')) {
      const c1x = 186 + Math.sin(t * 1.05) * 24;
      const c1y = 655 + Math.cos(t * 1.35) * 32 + fallDrop;
      drawOfficeChair(c1x, c1y, 0.84, -0.34 + Math.sin(t * 0.9) * 0.28);

      const c2x = 874 + Math.cos(t * 0.95) * 26;
      const c2y = 740 + Math.sin(t * 1.25 + 1.1) * 30 + fallDrop * 0.9;
      drawOfficeChair(c2x, c2y, 0.78, 0.42 + Math.cos(t * 0.85) * 0.30);
    }

    /* Folhas A4 flutuando sem peso */
    const papers = [
      { x: 290, y: 540, ph: 0.4, rot: -0.25 },
      { x: 760, y: 575, ph: 2.1, rot: 0.32 },
      { x: 525, y: 470, ph: 4.0, rot: -0.14 }
    ];
    for (let i = 0; i < papers.length; i++) {
      const p = papers[i];
      const px = p.x + Math.sin(t * 1.4 + p.ph) * 24;
      const py = p.y + Math.cos(t * 1.6 + p.ph) * 26 + fallDrop * 0.85;
      g.save();
      g.translate(px, py);
      g.rotate(p.rot + Math.sin(t * 1.1 + p.ph) * 0.25);
      g.fillStyle = 'rgba(226, 232, 240, 0.86)';
      rr(-26, -34, 52, 68, 4); g.fill();
      g.fillStyle = 'rgba(100, 116, 139, 0.55)';
      for (let ln = 0; ln < 4; ln++) g.fillRect(-17, -20 + ln * 12, 34 - (ln === 3 ? 12 : 0), 3);
      g.restore();
    }
    return;
  }

  /* Props de primeiro plano nitidos: lapiseira + xicara de cafe com gotas */
  if (zg.items.has('lapiseira')) {
    const lx = 330 + Math.sin(t * 1.6) * 20;
    const ly = 790 + Math.cos(t * 1.9) * 26 + fallDrop;
    drawFloatingLapiseira(lx, ly, t, 1.05);
  }
  if (zg.items.has('xicara_cafe')) {
    const cx = 746 + Math.cos(t * 1.35) * 22;
    const cy = 835 + Math.sin(t * 1.7 + 0.7) * 28 + fallDrop;
    drawFloatingXicaraCafe(cx, cy, t, 1.02);
  }
}

/* MODULO 7: sala_cozinha (ambiente residencial noturno com porta alinhada, janela e mesa) */
function drawSalaCozinha(t, shot, f, localP){
  const props = shot.props || {};
  const isRed = shot.mood === 'red';
  const zg = resolveZeroG(shot);
  drawBackdrop(t, shot.mood);

  vgrad(isRed ? '#1A0B12' : '#0C1426', '#050811', 0, 1340);
  g.fillStyle = '#0A0F1A';
  g.fillRect(-140, 1320, W + 280, 660);

  /* Azulejos sutis / parede residencial */
  g.strokeStyle = 'rgba(148, 163, 184, 0.08)'; g.lineWidth = 2;
  for (let x = 0; x < W; x += 90) { g.beginPath(); g.moveTo(x, 260); g.lineTo(x, 1320); g.stroke(); }

  /* Janela da sala com brilho de rua a esquerda */
  const jx = 76, jy = 340, jw = 290, jh = 430;
  g.fillStyle = '#09172B';
  rr(jx, jy, jw, jh, 10); g.fill();
  glow(jx + jw * 0.5, jy + jh * 0.4, 240, PAL.cyan, 0.18);

  if (zg.items.has('silhuetas_janela')) {
    drawWindowSilhouettes(t, jx, jy, jw, jh, zg.isFalling, localP);
  } else if (props.vulto) {
    /* Vulto sinistro recortado dentro da janela (nunca elipse no rodape da porta) */
    g.save();
    rr(jx + 4, jy + 4, jw - 8, jh - 8, 6); g.clip();
    const vx = jx + jw * 0.54;
    const vy = jy + jh * 0.68;
    g.fillStyle = '#03060C';
    rr(vx - 62, vy - 18, 124, 190, 48); g.fill();
    circ(vx, vy - 72, 46);
    g.strokeStyle = rgba(isRed ? PAL.alert : PAL.cyan, 0.32);
    g.lineWidth = 3;
    g.beginPath(); g.arc(vx, vy - 72, 44, -0.6, 0.7); g.stroke();
    g.fillStyle = isRed ? PAL.alert : '#E0F2FE';
    ell(vx - 15, vy - 74, 5.5, 3.2);
    ell(vx + 15, vy - 74, 5.5, 3.2);
    g.restore();
  }

  g.strokeStyle = '#334155'; g.lineWidth = 9;
  rr(jx, jy, jw, jh, 10); g.stroke();
  g.beginPath();
  g.moveTo(jx + jw / 2, jy); g.lineTo(jx + jw / 2, jy + jh);
  g.moveTo(jx, jy + jh / 2); g.lineTo(jx + jw, jy + jh / 2);
  g.stroke();

  /* Porta de entrada a direita com moldura, almofadas e macaneta alinhada (sem arco solto) */
  const dx = 710, dy = 380, dw = 290, dh = 940;
  g.fillStyle = '#131924';
  rr(dx - 10, dy - 10, dw + 20, dh + 10, 10); g.fill();
  const doorG = g.createLinearGradient(dx, dy, dx + dw, dy + dh);
  doorG.addColorStop(0, '#271B16');
  doorG.addColorStop(1, '#19110E');
  g.fillStyle = doorG;
  rr(dx, dy, dw, dh, 6); g.fill();
  g.strokeStyle = '#475569'; g.lineWidth = 5;
  rr(dx, dy, dw, dh, 6); g.stroke();

  /* Almofadas discretas da folha da porta */
  g.strokeStyle = 'rgba(15, 10, 8, 0.65)';
  g.lineWidth = 4;
  rr(dx + 34, dy + 54, dw - 68, 340, 6); g.stroke();
  rr(dx + 34, dy + 462, dw - 68, 396, 6); g.stroke();

  /* Espelho metalico, fechadura e macaneta alinhados na borda esquerda da porta */
  const hx = dx + 34, hy = dy + 488;
  g.fillStyle = '#475569';
  rr(hx - 10, hy - 34, 20, 78, 6); g.fill();
  g.strokeStyle = '#94A3B8'; g.lineWidth = 2;
  rr(hx - 10, hy - 34, 20, 78, 6); g.stroke();
  g.fillStyle = '#0B0F1A';
  circ(hx, hy + 20, 4.2);
  g.fillRect(hx - 2, hy + 20, 4, 12);
  g.fillStyle = '#94A3B8';
  circ(hx, hy, 9);
  g.fillStyle = '#CBD5E1';
  rr(hx - 4, hy - 6, 46, 12, 6); g.fill();

  /* Mesa / balcao residencial no centro-esquerda */
  g.fillStyle = '#241B18';
  rr(64, 1110, 480, 34, 10); g.fill();
  g.fillStyle = '#17110F';
  g.fillRect(102, 1144, 24, 190);
  g.fillRect(486, 1144, 24, 190);
  /* Luminaria / abajur com oscilacao sutil de luz e xicara fumegante sobre a mesa */
  const lampFlk = 0.86 + Math.sin(t * 11.5) * 0.08 + (isRed ? (Math.sin(t * 27) > 0.1 ? 0.08 : -0.25) : 0);
  g.fillStyle = '#334155';
  rr(180, 1064, 58, 46, 8); g.fill();
  g.fillStyle = isRed ? PAL.alert : PAL.yellow;
  rr(188, 1054, 42, 12, 5); g.fill();
  glow(210, 1060, 165, isRed ? PAL.alert : PAL.yellow, Math.max(0.05, 0.20 * lampFlk));
  /* Caneca com vapor animado subindo */
  g.fillStyle = '#CBD5E1';
  rr(320, 1076, 32, 34, 6); g.fill();
  g.strokeStyle = 'rgba(226, 232, 240, 0.32)';
  g.lineWidth = 3;
  g.lineCap = 'round';
  for (let st = 0; st < 2; st++) {
    const syOff = ((t * 26 + st * 18) % 34);
    g.beginPath();
    g.moveTo(330 + st * 12, 1070 - syOff);
    g.quadraticCurveTo(324 + st * 12 + Math.sin(t * 4 + st) * 6, 1054 - syOff, 332 + st * 12, 1040 - syOff);
    g.stroke();
  }

  /* Relogio de parede analogico com ponteiro em movimento continuo */
  drawWallClock(536, 456, 56, t, isRed);

  drawFloatingProps(t, zg, localP, { layer: 'back' });

  /* Protagonista (pes firmes acima da regiao das legendas) */
  const px = zg.poseName === 'segurando_mesa' ? 620 : 515;
  drawProtagonista(px, 1358, 1.02, {
    t, ex: shot.expressao || f.ex, closed: f.closed, localP,
    fastBreath: isRed,
    pose: shot.pose || poseObjFromName(props.pose),
    prevPose: shot.prevPose || null,
    shotAge: Math.max(0, t - shot.start),
    deskGripX: -112,
    deskGripY: -242,
    rimColor: isRed ? PAL.alert : PAL.cyan,
    rimA: 0.80,
    lookX: props.vulto ? -0.45 : -0.15
  });

  drawFloatingProps(t, zg, localP, { layer: 'front' });
}

/* MODULO 10: escritorio (mesas, monitores vivos, janelas panoramicas, teto de gesso + relogio) */
function drawEscritorio(t, shot, f, localP){
  const props = shot.props || {};
  const isRed = shot.mood === 'red';
  const isYellow = shot.mood === 'yellow';
  const zg = resolveZeroG(shot);
  drawBackdrop(t, shot.mood);

  /* Parede corporativa e teto de gesso em perspectiva */
  vgrad(isRed ? '#1E0D15' : '#0E1729', '#080E1B', 0, 1310);

  /* Teto de gesso acustico (y=215..362) */
  g.fillStyle = isRed ? '#211018' : '#141E32';
  g.fillRect(-120, 215, W + 240, 148);
  g.strokeStyle = isRed ? 'rgba(255, 110, 110, 0.22)' : 'rgba(148, 163, 184, 0.22)';
  g.lineWidth = 2.5;
  for (const ty of [248, 290, 334, 362]) {
    g.beginPath(); g.moveTo(-120, ty); g.lineTo(W + 120, ty); g.stroke();
  }
  for (let i = -2; i <= 8; i++) {
    const xTop = 540 + (i - 3) * 195;
    const xBot = 540 + (i - 3) * 155;
    g.beginPath(); g.moveTo(xTop, 215); g.lineTo(xBot, 362); g.stroke();
  }
  /* Placas de gesso desalinhadas no caos de gravidade zero */
  if (zg.active && (isRed || isYellow || shot.expressao === 'shock')) {
    g.save();
    g.translate(310, 312);
    g.rotate(-0.11 + Math.sin(t * 4.5) * 0.03);
    g.fillStyle = '#070A12';
    g.fillRect(-74, -22, 148, 42);
    g.fillStyle = '#1E293B';
    g.fillRect(-68, -12, 140, 28);
    g.restore();

    g.save();
    g.translate(790, 306);
    g.rotate(0.13 + Math.cos(t * 4.0) * 0.03);
    g.fillStyle = '#070A12';
    g.fillRect(-68, -20, 136, 40);
    g.fillStyle = '#1E293B';
    g.fillRect(-62, -10, 128, 26);
    g.restore();
  }
  /* Luminarias LED embutidas no gesso com cintilacao sutil */
  const flk = isRed
    ? (Math.sin(t * 26) > -0.3 ? 0.88 : 0.24)
    : (0.86 + 0.08 * Math.sin(t * 9.5) + (Math.sin(t * 37) > 0.96 ? -0.22 : 0));
  for (const lx of [165, 540, 915]) {
    g.fillStyle = flk > 0.45 ? (isRed ? '#FCA5A5' : '#E0F2FE') : '#334155';
    rr(lx - 108, 302, 216, 18, 6); g.fill();
    if (flk > 0.45) glow(lx, 340, 260, isRed ? PAL.alert : PAL.cyan, flk * 0.14);
  }

  /* Janelas panoramicas de vidro ocupando o fundo (x=52..1028, y=380..916) */
  const wx = 52, wy = 380, ww = W - 104, wh = 536;
  const hourNum = parseInt(String(CENAS.horario || '15:00').split(':')[0], 10);
  const isDay = isFinite(hourNum) && hourNum >= 7 && hourNum <= 18;
  g.save();
  rr(wx, wy, ww, wh, 10); g.clip();
  const skyG = g.createLinearGradient(0, wy, 0, wy + wh);
  if (isRed) {
    skyG.addColorStop(0, '#2B0C16');
    skyG.addColorStop(0.55, '#4A1525');
    skyG.addColorStop(1, '#1A0B14');
  } else if (isYellow) {
    skyG.addColorStop(0, '#16243E');
    skyG.addColorStop(0.6, '#3D2E18');
    skyG.addColorStop(1, '#141B29');
  } else if (isDay) {
    skyG.addColorStop(0, '#11294B');
    skyG.addColorStop(0.58, '#1E416B');
    skyG.addColorStop(1, '#2D527C');
  } else {
    skyG.addColorStop(0, '#071124');
    skyG.addColorStop(1, '#11223E');
  }
  g.fillStyle = skyG;
  g.fillRect(wx, wy, ww, wh);

  /* Nuvens sutis e horizonte de arranha-ceus */
  g.fillStyle = isRed ? 'rgba(254, 202, 202, 0.08)' : 'rgba(224, 242, 254, 0.09)';
  ell(wx + 240 + Math.sin(t * 0.45) * 34, wy + 125, 190, 32);
  ell(wx + 740 - Math.sin(t * 0.38) * 32, wy + 160, 220, 36);

  const bldgs = [
    [0, 120, 210], [108, 110, 290], [208, 130, 190], [326, 105, 325],
    [422, 138, 230], [548, 115, 310], [652, 128, 220], [768, 112, 285], [868, 125, 240]
  ];
  for (let i = 0; i < bldgs.length; i++) {
    const [bx, bw, bh] = bldgs[i];
    const x0 = wx + bx;
    const y0 = wy + wh - bh;
    g.fillStyle = isRed ? '#1A0B14' : '#0B1628';
    g.fillRect(x0, y0, bw, bh);
    g.fillStyle = isRed ? 'rgba(255, 120, 120, 0.16)' : 'rgba(186, 230, 253, 0.18)';
    for (let gy = y0 + 18; gy < wy + wh - 16; gy += 24) {
      for (let gx = x0 + 14; gx < x0 + bw - 18; gx += 22) {
        if (hash(gx * 3 + gy * 7) > 0.35) g.fillRect(gx, gy, 10, 12);
      }
    }
  }
  g.restore();

  /* Silhuetas de pessoas e carros subindo fora da janela panoramica */
  if (zg.items.has('silhuetas_janela')) {
    drawWindowSilhouettes(t, wx, wy, ww, wh, zg.isFalling, localP);
  }

  /* Brilho diagonal nos vidros e montantes da janela panoramica */
  g.save();
  rr(wx, wy, ww, wh, 10); g.clip();
  g.fillStyle = 'rgba(224, 242, 254, 0.06)';
  g.beginPath(); g.moveTo(wx + 120, wy); g.lineTo(wx + 220, wy); g.lineTo(wx + 40, wy + wh); g.lineTo(wx - 60, wy + wh); g.closePath(); g.fill();
