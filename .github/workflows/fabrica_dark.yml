name: Fabrica Dark V8 (Motor Cinematografico IA 30fps + Telegram)

on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Titulo opcional do video (vazio para o Diretor IA gerar automaticamente)"
        required: false
        default: ""
        type: string
      roteiro:
        description: "Roteiro bruto opcional (se vazio com usar_video_atual=false, o Diretor IA cria um episodio inedito via Gemini)"
        required: false
        default: ""
        type: string
      usar_video_atual:
        description: "Re-renderiza o video ativo em historico_videos.json sem chamar o Diretor IA"
        required: false
        default: false
        type: boolean
      enviar_telegram:
        description: "Envia Parte 1 e Parte 2 (<= 45 MB cada) + link do Artifact + legendas prontas no Telegram"
        required: false
        default: true
        type: boolean
      modo_teste:
        description: "Renderiza apenas 3 segundos (90 quadros @ 30fps) de teste rapido"
        required: false
        default: false
        type: boolean
      youtube_privacidade:
        description: "Privacidade do upload no YouTube Shorts (config = usar config_canal.json)"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - public
          - unlisted
          - private
      tiktok_modo:
        description: "Modo do envio ao TikTok (inbox = rascunhos/inbox, direct = publicacao direta)"
        required: false
        default: "inbox"
        type: choice
        options:
          - inbox
          - direct
  repository_dispatch:
    types:
      - novo_roteiro

permissions:
  contents: write

concurrency:
  group: fabrica-dark-render
  cancel-in-progress: false

jobs:
  produzir-e-renderizar:
    name: Diretor IA -> Audio -> Render -> YouTube/IG/TikTok -> Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      EVENT_NAME: ${{ github.event_name }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      WD_TITULO: ${{ inputs.titulo }}
      WD_ROTEIRO: ${{ inputs.roteiro }}
      WD_USAR_ATUAL: ${{ inputs.usar_video_atual }}
      WD_ENVIAR_TG: ${{ inputs.enviar_telegram }}
      WD_MODO_TESTE: ${{ inputs.modo_teste }}
      WD_YT_PRIVACIDADE: ${{ inputs.youtube_privacidade }}
      WD_TT_MODE: ${{ inputs.tiktok_modo }}
      RD_TITULO: ${{ github.event.client_payload.titulo }}
      RD_ROTEIRO: ${{ github.event.client_payload.roteiro }}
      RD_USAR_ATUAL: ${{ github.event.client_payload.usar_video_atual }}
      RD_ENVIAR_TG: ${{ github.event.client_payload.enviar_telegram }}
      RD_MODO_TESTE: ${{ github.event.client_payload.modo_teste }}
      RD_YT_PRIVACIDADE: ${{ github.event.client_payload.youtube_privacidade }}
      RD_TT_MODE: ${{ github.event.client_payload.tiktok_modo }}
      VAR_TT_MODE: ${{ vars.TIKTOK_MODE }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalizar parametros da execucao
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from pipeline.config_canal import carregar_config_canal

          cfg_canal = carregar_config_canal()
          ev = os.environ.get("EVENT_NAME", "")

          def to_bool_str(val: str, padrao: bool) -> str:
              v = str(val or "").strip().lower()
              if v in ("true", "1", "yes", "sim"):
                  return "true"
              if v in ("false", "0", "no", "nao"):
                  return "false"
              return "true" if padrao else "false"

          def to_privacy(val: str, padrao: str = "public") -> str:
              v = str(val or "").strip().lower()
              return v if v in ("public", "unlisted", "private") else padrao

          def to_tiktok_mode(val: str, padrao: str = "inbox") -> str:
              v = str(val or "").strip().lower()
              return v if v in ("inbox", "direct") else padrao

          yt_padrao = to_privacy(str(cfg_canal.get("privacidade_youtube", "public")), "public")
          tt_padrao = to_tiktok_mode(os.environ.get("VAR_TT_MODE", ""), "inbox")

          if ev == "schedule":
              usar_atual = "false"
              enviar_tg = "true"
              modo_teste = "false"
              yt_privacy = yt_padrao
              tt_mode = tt_padrao
          else:
              pref = "RD_" if ev == "repository_dispatch" else "WD_"
              usar_atual = to_bool_str(os.environ.get(pref + "USAR_ATUAL", ""), False)
              enviar_tg = to_bool_str(os.environ.get(pref + "ENVIAR_TG", ""), True)
              modo_teste = to_bool_str(os.environ.get(pref + "MODO_TESTE", ""), False)
              yt_privacy = to_privacy(os.environ.get(pref + "YT_PRIVACIDADE", ""), yt_padrao)
              tt_mode = to_tiktok_mode(os.environ.get(pref + "TT_MODE", ""), tt_padrao)

          gh_env = Path(os.environ["GITHUB_ENV"])
          with gh_env.open("a", encoding="utf-8") as arq:
              arq.write(f"USAR_VIDEO_ATUAL={usar_atual}\n")
              arq.write(f"ENVIAR_TELEGRAM={enviar_tg}\n")
              arq.write(f"MODO_TESTE={modo_teste}\n")
              arq.write(f"YOUTUBE_PRIVACY={yt_privacy}\n")
              arq.write(f"TIKTOK_MODE={tt_mode}\n")

          print(
              f"Canal='{cfg_canal['nome_canal']}' ({cfg_canal['idioma']}) | Evento={ev} | "
              f"usar_video_atual={usar_atual} | enviar_telegram={enviar_tg} "
              f"| modo_teste={modo_teste} | youtube_privacy={yt_privacy} | tiktok_mode={tt_mode}"
          )
          PY

      - name: Instalar dependencias Python (numpy, edge-tts, gTTS, Pillow, Gemini e YouTube API)
        run: |
          python3 -m pip install --upgrade pip --no-cache-dir
          python3 -m pip install --upgrade --no-cache-dir numpy edge-tts gTTS Pillow google-genai google-api-python-client google-auth google-auth-oauthlib

      - name: Garantir FFmpeg e fontes
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! fc-list : family 2>/dev/null | grep -qi "DejaVu Sans"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fontconfig fonts-dejavu-core fonts-liberation
            fc-cache -f
          fi
          ffmpeg -version | head -n 1

      - name: Estacao 1 - Diretor IA V8 (Groq Llama 3.3 70B primario -> GeminiPool fallback)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          from pipeline.gemini_pool import carregar_chaves_gemini, obter_groq_api_key

          ev = os.environ.get("EVENT_NAME", "")
          usar_atual = str(os.environ.get("USAR_VIDEO_ATUAL", "false")).strip().lower() == "true"
          if ev == "schedule":
              roteiro = ""
              titulo = ""
          else:
              pref = "RD_" if ev == "repository_dispatch" else "WD_"
              roteiro = os.environ.get(pref + "ROTEIRO", "").strip()
              titulo = os.environ.get(pref + "TITULO", "").strip()

          if usar_atual:
              print("Modo usar_video_atual=true: mantendo video ativo do historico_videos.json.")
              sys.exit(0)

          chaves_gem = carregar_chaves_gemini(ler_env_arquivo=False)
          groq_key = obter_groq_api_key(ler_env_arquivo=False)
          if not groq_key and not chaves_gem:
              print(
                  "ERRO Estacao 1: nenhuma chave valida em GROQ_API_KEY, GEMINI_API_KEY, "
                  "GEMINI_API_KEY_2 ou GEMINI_API_KEY_3 quando usar_video_atual=false "
                  "(bloqueado para impedir repeticao silenciosa de video antigo).",
                  file=sys.stderr,
              )
              sys.exit(1)

          motor_txt = "Groq Llama 3.3 70B (primario)" if groq_key else "GeminiPool (GROQ_API_KEY vazia)"
          hist_path = Path("historico_videos.json")
          hist_antes = json.loads(hist_path.read_text(encoding="utf-8"))
          id_antes = int(hist_antes.get("video_atual", 0))

          if roteiro:
              arq = Path("/tmp/roteiro_entrada_v8.txt")
              arq.write_text(roteiro, encoding="utf-8")
              cmd = [sys.executable, "pipeline/diretor_ia.py", "--arquivo", str(arq), "--exigir-gemini"]
              print(f"Estacao 1: roteiro fornecido -> gerando proximo episodio acima do Video {id_antes:02d} via {motor_txt}...")
          else:
              cmd = [sys.executable, "pipeline/diretor_ia.py", "--gerar-inedito", "--exigir-gemini"]
              print(f"Estacao 1: usar_video_atual=false sem roteiro manual -> criando episodio 100% inedito acima do Video {id_antes:02d} via {motor_txt}...")

          if titulo:
              cmd.extend(["--titulo", titulo])
          subprocess.run(cmd, check=True)

          hist_depois = json.loads(hist_path.read_text(encoding="utf-8"))
          id_depois = int(hist_depois.get("video_atual", 0))
          if id_depois <= id_antes:
              print(
                  f"ERRO Estacao 1: historico_videos.json nao avancou (antes={id_antes:02d}, depois={id_depois:02d}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          roteiro_novo = Path(f"roteiro_{id_depois:02d}.txt")
          cenas_path = Path("cenas.json")
          if not roteiro_novo.is_file() or not cenas_path.is_file():
              print(
                  f"ERRO Estacao 1: artefatos esperados ausentes ({roteiro_novo} ou {cenas_path}).",
                  file=sys.stderr,
              )
              sys.exit(1)
          cenas_dados = json.loads(cenas_path.read_text(encoding="utf-8"))
          if int(cenas_dados.get("video_id", 0)) != id_depois:
              print(
                  f"ERRO Estacao 1: cenas.json desalinhado (video_id={cenas_dados.get('video_id')}, esperado={id_depois}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              f"Estacao 1 confirmada: Video {id_depois:02d} registrado em historico_videos.json "
              f"(anterior: {id_antes:02d}, roteiro={roteiro_novo.name}, cenas=cenas.json, motor={cenas_dados.get('motor')})."
          )
          PY

      - name: Validar historico e limpar cache de audio antigo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          python3 pipeline/historico.py verificar
          rm -f audio/mix_final.mp3 audio/voz_limpa.mp3 audio/narracao.mp3 audio/timestamps.json audio/eventos.json

      - name: Estacao 2 - Narracao humana Gemini TTS (1.02x) e Sound Design (-14 LUFS)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          python3 audio/gerar_narracao.py
          python3 audio/sound_design.py
          python3 pipeline/historico.py validar-audio

      - name: Estacao 3 - Motor Cinematografico IA 30fps (Gemini Image / FAL Video + FFmpeg) + Corte Parte 1 / Parte 2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          rm -rf output/cenas
          if [ "${MODO_TESTE}" = "true" ]; then
            python3 gerar_midia_cenas.py --max-cenas 2
            python3 render/renderizar.py --legendas --teste
          else
            python3 gerar_midia_cenas.py
            python3 render/renderizar.py --legendas
          fi
          ls -lh output/cenas/ output/*.mp4

      - name: Publicar no YouTube Shorts
        if: ${{ success() }}
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ env.YOUTUBE_PRIVACY }}
        run: |
          rm -f output/youtube_url.txt
          python3 upload_youtube.py

      - name: Verificar credenciais da Estacao 5B (Instagram Reels)
        id: check_ig
        if: ${{ success() }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -n "${IG_ACCESS_TOKEN}" ]; then
            echo "habilitado=true" >> "${GITHUB_OUTPUT}"
            echo "Estacao 5B (Instagram Reels): IG_ACCESS_TOKEN detectado; upload condicional habilitado."
          else
            echo "habilitado=false" >> "${GITHUB_OUTPUT}"
            echo "AVISO Estacao 5B (Instagram Reels): IG_ACCESS_TOKEN vazio; pulando release temporaria e upload sem interromper a pipeline."
          fi

      - name: Publicar no Instagram Reels (Estacao 5B)
        if: ${{ success() && steps.check_ig.outputs.habilitado == 'true' }}
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_VIDEO_URL: ${{ secrets.PUBLIC_VIDEO_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f output/instagram_url.txt
          if [ -z "${IG_ACCESS_TOKEN}" ] || [ -z "${IG_USER_ID}" ]; then
            python3 upload_instagram.py
            exit 0
          fi

          if [ -z "${PUBLIC_VIDEO_URL}" ]; then
            VIDEO_MP4="$(python3 -c 'import upload_instagram as u; v = u.descobrir_video_completo(); print(v or "")')"
            if [ -z "${VIDEO_MP4}" ] || [ ! -f "${VIDEO_MP4}" ]; then
              echo "AVISO Estacao 5B: nenhum video completo output/short_NN.mp4 encontrado para release temporaria."
              exit 0
            fi

            TAG="ig-tmp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            ASSET_NAME="$(basename "${VIDEO_MP4}")"
            cleanup_ig_release() {
              gh release delete "${TAG}" --yes --cleanup-tag >/dev/null 2>&1 || true
            }
            trap cleanup_ig_release EXIT

            gh release create "${TAG}" "${VIDEO_MP4}" \
              --target main \
              --prerelease \
              --title "Temp IG Reels ${GITHUB_RUN_NUMBER}" \
              --notes "Asset temporario da Estacao 5B (removido automaticamente ao concluir)."
            export PUBLIC_VIDEO_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}"
            echo "Asset temporario publicado para Estacao 5B: ${PUBLIC_VIDEO_URL}"
          fi

          python3 upload_instagram.py

      - name: Publicar no TikTok (Estacao 5C)
        if: ${{ success() }}
        continue-on-error: true
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_MODE: ${{ env.TIKTOK_MODE }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
        run: |
          rm -f output/tiktok_publish_id.txt
          python3 upload_tiktok.py

      - name: Publicar MP4s e metadados como Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabrica-dark-short-${{ github.run_number }}
          retention-days: 7
          path: |
            output/*.mp4
            cenas.json
            audio/eventos.json
            historico_videos.json

      - name: Estacao 4 - Enviar Parte 1 e Parte 2 + link do Artifact e legendas prontas no Telegram
        if: ${{ success() && env.ENVIAR_TELEGRAM != 'false' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTIFACT_URL: ${{ steps.upload_artifact.outputs.artifact-url }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "AVISO: Secrets do Telegram ausentes em Repository Secrets (Actions)."
            [ -z "${TELEGRAM_BOT_TOKEN}" ] && echo " - Falta configurar TELEGRAM_BOT_TOKEN"
            [ -z "${TELEGRAM_CHAT_ID}" ] && echo " - Falta configurar TELEGRAM_CHAT_ID"
            echo "Simulando payload de entrega (--dry-run) para conferir o formato:"
            python3 automacao/enviar_telegram.py \
              --estrategia partes \
              --artifact-url "${ARTIFACT_URL}" \
              --run-url "${RUN_URL}" \
              --dry-run
            exit 0
          fi
          python3 automacao/enviar_telegram.py \
            --estrategia partes \
            --artifact-url "${ARTIFACT_URL}" \
            --run-url "${RUN_URL}"

      - name: Persistir historico_videos.json atualizado na main
        if: ${{ success() && env.USAR_VIDEO_ATUAL == 'false' && env.MODO_TESTE == 'false' }}
        run: |
          if git diff --quiet -- historico_videos.json; then
            echo "historico_videos.json sem alteracoes para persistir."
            exit 0
          fi

          # Guarda o novo registro gerado nesta execucao antes de sincronizar com origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path
          dados = json.loads(Path("historico_videos.json").read_text(encoding="utf-8"))
          vid = int(dados["video_atual"])
          novo = next(v for v in dados["videos"] if int(v["id"]) == vid)
          Path("/tmp/novo_registro_hist.json").write_text(
              json.dumps({"video_atual": vid, "registro": novo}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Limpa artefatos gerados durante a execucao e sincroniza main com seguranca
          git checkout -- .
          git clean -fd
          git fetch origin main
          git checkout -B main origin/main

          # Aplica exclusivamente o novo registro em historico_videos.json sobre o topo de origin/main
          META=$(python3 - <<'PY'
          import json
          from pathlib import Path
          pacote = json.loads(Path("/tmp/novo_registro_hist.json").read_text(encoding="utf-8"))
          reg = pacote["registro"]
          vid = int(pacote["video_atual"])

          hist_path = Path("historico_videos.json")
          hist = json.loads(hist_path.read_text(encoding="utf-8"))
          ids_existentes = {int(v["id"]) for v in hist.get("videos", [])}
          if vid not in ids_existentes:
              for v in hist.get("videos", []):
                  if str(v.get("status", "")).strip() == "em_producao":
                      v["status"] = "arquivado"
              hist["videos"].append(reg)
              hist["video_atual"] = vid
              hist["versao"] = max(int(hist.get("versao", 6)), vid)
              hist_path.write_text(json.dumps(hist, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          titulo = str(reg.get("titulo", "Novo Episodio")).replace('"', "'")
          print(f"{vid:02d}|{titulo}")
          PY
          )
          rm -f /tmp/novo_registro_hist.json

          VID_NUM="${META%%|*}"
          VID_TITULO="${META#*|}"

          # Valida integridade do JSON atualizado antes de commitar
          python3 pipeline/historico.py verificar

          git add historico_videos.json
          if git diff --cached --quiet -- historico_videos.json; then
            echo "historico_videos.json ja contem o Video ${VID_NUM} em origin/main."
            exit 0
          fi

          git commit -m "chore(historico): registra Video ${VID_NUM} (${VID_TITULO}) [skip ci]"
          git pull --rebase origin main
          if ! git push origin main; then
            echo "AVISO: main avancou durante o push; refazendo pull --rebase e tentando novamente..."
            git pull --rebase origin main
            git push origin main
          fi
          echo "Memoria persistida na main: historico_videos.json atualizado com Video ${VID_NUM} (${VID_TITULO})."

      - name: Notificar falha no Telegram
        if: ${{ failure() && env.ENVIAR_TELEGRAM != 'false' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            exit 0
          fi
          python3 automacao/enviar_telegram.py \
            --erro "A renderizacao na nuvem falhou. Abra o link abaixo para ver o log completo." \
            --run-url "${RUN_URL}"
