name: Fabrica Dark V6 (Render na Nuvem + Telegram)

on:
  schedule:
    # Teste automatico as 17h43 de Brasilia (UTC-3 = 20h43 UTC)
    - cron: "43 20 * * *"
  workflow_dispatch:
    inputs:
      titulo:
        description: "Titulo opcional do video (vazio para o Diretor IA gerar automaticamente)"
        required: false
        default: ""
        type: string
      roteiro:
        description: "Roteiro bruto opcional (se vazio com usar_video_atual=false, o Diretor IA cria um episodio inedito via Gemini)"
        required: false
        default: ""
        type: string
      usar_video_atual:
        description: "Re-renderiza o video ativo em historico_videos.json sem chamar o Diretor IA"
        required: false
        default: false
        type: boolean
      enviar_telegram:
        description: "Envia Parte 1 e Parte 2 (<= 45 MB cada) + link do Artifact + legendas prontas no Telegram"
        required: false
        default: true
        type: boolean
      modo_teste:
        description: "Renderiza apenas 2 segundos de teste rapido"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - novo_roteiro

permissions:
  contents: write

concurrency:
  group: fabrica-dark-render
  cancel-in-progress: false

jobs:
  produzir-e-renderizar:
    name: Diretor IA -> Audio -> Render -> Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      EVENT_NAME: ${{ github.event_name }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WD_TITULO: ${{ inputs.titulo }}
      WD_ROTEIRO: ${{ inputs.roteiro }}
      WD_USAR_ATUAL: ${{ inputs.usar_video_atual }}
      WD_ENVIAR_TG: ${{ inputs.enviar_telegram }}
      WD_MODO_TESTE: ${{ inputs.modo_teste }}
      RD_TITULO: ${{ github.event.client_payload.titulo }}
      RD_ROTEIRO: ${{ github.event.client_payload.roteiro }}
      RD_USAR_ATUAL: ${{ github.event.client_payload.usar_video_atual }}
      RD_ENVIAR_TG: ${{ github.event.client_payload.enviar_telegram }}
      RD_MODO_TESTE: ${{ github.event.client_payload.modo_teste }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalizar parametros da execucao
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          ev = os.environ.get("EVENT_NAME", "")

          def to_bool_str(val: str, padrao: bool) -> str:
              v = str(val or "").strip().lower()
              if v in ("true", "1", "yes", "sim"):
                  return "true"
              if v in ("false", "0", "no", "nao"):
                  return "false"
              return "true" if padrao else "false"

          if ev == "schedule":
              usar_atual = "false"
              enviar_tg = "true"
              modo_teste = "false"
          else:
              pref = "RD_" if ev == "repository_dispatch" else "WD_"
              usar_atual = to_bool_str(os.environ.get(pref + "USAR_ATUAL", ""), False)
              enviar_tg = to_bool_str(os.environ.get(pref + "ENVIAR_TG", ""), True)
              modo_teste = to_bool_str(os.environ.get(pref + "MODO_TESTE", ""), False)

          gh_env = Path(os.environ["GITHUB_ENV"])
          with gh_env.open("a", encoding="utf-8") as arq:
              arq.write(f"USAR_VIDEO_ATUAL={usar_atual}\n")
              arq.write(f"ENVIAR_TELEGRAM={enviar_tg}\n")
              arq.write(f"MODO_TESTE={modo_teste}\n")

          print(f"Evento={ev} | usar_video_atual={usar_atual} | enviar_telegram={enviar_tg} | modo_teste={modo_teste}")
          PY

      - name: Instalar dependencias Python (numpy, edge-tts atualizado e gTTS)
        run: |
          python3 -m pip install --upgrade pip --no-cache-dir
          python3 -m pip install --upgrade --no-cache-dir numpy edge-tts gTTS

      - name: Garantir FFmpeg e Google Chrome headless
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq wget gnupg ca-certificates
            wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq /tmp/chrome.deb
            rm -f /tmp/chrome.deb
          fi
          ffmpeg -version | head -n 1
          (google-chrome --version || chromium --version || chromium-browser --version)

      - name: Estacao 1 - Diretor IA V6 (gera episodio novo quando usar_video_atual=false)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          ev = os.environ.get("EVENT_NAME", "")
          usar_atual = str(os.environ.get("USAR_VIDEO_ATUAL", "false")).strip().lower() == "true"
          if ev == "schedule":
              roteiro = ""
              titulo = ""
          else:
              pref = "RD_" if ev == "repository_dispatch" else "WD_"
              roteiro = os.environ.get(pref + "ROTEIRO", "").strip()
              titulo = os.environ.get(pref + "TITULO", "").strip()

          if usar_atual:
              print("Modo usar_video_atual=true: mantendo video ativo do historico_videos.json.")
              sys.exit(0)

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key or len(api_key) < 10 or any(ch.isspace() for ch in api_key):
              print(
                  "ERRO Estacao 1: GEMINI_API_KEY ausente ou invalida quando usar_video_atual=false "
                  "(bloqueado para impedir repeticao silenciosa de video antigo).",
                  file=sys.stderr,
              )
              sys.exit(1)

          hist_path = Path("historico_videos.json")
          hist_antes = json.loads(hist_path.read_text(encoding="utf-8"))
          id_antes = int(hist_antes.get("video_atual", 0))

          if roteiro:
              arq = Path("/tmp/roteiro_entrada_v6.txt")
              arq.write_text(roteiro, encoding="utf-8")
              cmd = [sys.executable, "pipeline/diretor_ia.py", "--arquivo", str(arq), "--exigir-gemini"]
              print(f"Estacao 1: roteiro fornecido -> gerando proximo episodio acima do Video {id_antes:02d} via Gemini...")
          else:
              cmd = [sys.executable, "pipeline/diretor_ia.py", "--gerar-inedito", "--exigir-gemini"]
              print(f"Estacao 1: usar_video_atual=false sem roteiro manual -> criando episodio 100% inedito acima do Video {id_antes:02d} via Gemini...")

          if titulo:
              cmd.extend(["--titulo", titulo])
          subprocess.run(cmd, check=True)

          hist_depois = json.loads(hist_path.read_text(encoding="utf-8"))
          id_depois = int(hist_depois.get("video_atual", 0))
          if id_depois <= id_antes:
              print(
                  f"ERRO Estacao 1: historico_videos.json nao avancou (antes={id_antes:02d}, depois={id_depois:02d}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          roteiro_novo = Path(f"roteiro_{id_depois:02d}.txt")
          cenas_path = Path("cenas.json")
          if not roteiro_novo.is_file() or not cenas_path.is_file():
              print(
                  f"ERRO Estacao 1: artefatos esperados ausentes ({roteiro_novo} ou {cenas_path}).",
                  file=sys.stderr,
              )
              sys.exit(1)
          cenas_dados = json.loads(cenas_path.read_text(encoding="utf-8"))
          if int(cenas_dados.get("video_id", 0)) != id_depois:
              print(
                  f"ERRO Estacao 1: cenas.json desalinhado (video_id={cenas_dados.get('video_id')}, esperado={id_depois}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              f"Estacao 1 confirmada: Video {id_depois:02d} registrado em historico_videos.json "
              f"(anterior: {id_antes:02d}, roteiro={roteiro_novo.name}, cenas=cenas.json)."
          )
          PY

      - name: Validar historico e limpar cache de audio antigo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 pipeline/historico.py verificar
          rm -f audio/mix_final.mp3 audio/voz_limpa.mp3 audio/narracao.mp3 audio/timestamps.json audio/eventos.json

      - name: Estacao 2 - Narracao atuada V5.2 e Sound Design (-14 LUFS)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          python3 audio/gerar_narracao.py
          python3 audio/sound_design.py
          python3 pipeline/historico.py validar-audio

      - name: Estacao 3 - Renderizacao 9:16 (1080x1920 @ 30fps) + Corte Parte 1 / Parte 2
        run: |
          if [ "${MODO_TESTE}" = "true" ]; then
            python3 render/renderizar.py --legendas --teste
          else
            python3 render/renderizar.py --legendas
          fi
          ls -lh output/*.mp4

      - name: Publicar MP4s e metadados como Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabrica-dark-short-${{ github.run_number }}
          retention-days: 7
          path: |
            output/*.mp4
            cenas.json
            audio/eventos.json
            historico_videos.json

      - name: Estacao 4 - Enviar Parte 1 e Parte 2 + link do Artifact e legendas prontas no Telegram
        if: ${{ success() && env.ENVIAR_TELEGRAM != 'false' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTIFACT_URL: ${{ steps.upload_artifact.outputs.artifact-url }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "AVISO: Secrets do Telegram ausentes em Repository Secrets (Actions)."
            [ -z "${TELEGRAM_BOT_TOKEN}" ] && echo " - Falta configurar TELEGRAM_BOT_TOKEN"
            [ -z "${TELEGRAM_CHAT_ID}" ] && echo " - Falta configurar TELEGRAM_CHAT_ID"
            echo "Simulando payload de entrega (--dry-run) para conferir o formato:"
            python3 automacao/enviar_telegram.py \
              --estrategia partes \
              --artifact-url "${ARTIFACT_URL}" \
              --run-url "${RUN_URL}" \
              --dry-run
            exit 0
          fi
          python3 automacao/enviar_telegram.py \
            --estrategia partes \
            --artifact-url "${ARTIFACT_URL}" \
            --run-url "${RUN_URL}"

      - name: Persistir historico_videos.json atualizado na main
        if: ${{ success() && env.USAR_VIDEO_ATUAL == 'false' && env.MODO_TESTE == 'false' }}
        run: |
          if git diff --quiet -- historico_videos.json; then
            echo "historico_videos.json sem alteracoes para persistir."
            exit 0
          fi

          # Guarda o novo registro gerado nesta execucao antes de sincronizar com origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path
          dados = json.loads(Path("historico_videos.json").read_text(encoding="utf-8"))
          vid = int(dados["video_atual"])
          novo = next(v for v in dados["videos"] if int(v["id"]) == vid)
          Path("/tmp/novo_registro_hist.json").write_text(
              json.dumps({"video_atual": vid, "registro": novo}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Limpa artefatos gerados durante a execucao e sincroniza main com seguranca
          git checkout -- .
          git clean -fd
          git fetch origin main
          git checkout -B main origin/main

          # Aplica exclusivamente o novo registro em historico_videos.json sobre o topo de origin/main
          META=$(python3 - <<'PY'
          import json
          from pathlib import Path
          pacote = json.loads(Path("/tmp/novo_registro_hist.json").read_text(encoding="utf-8"))
          reg = pacote["registro"]
          vid = int(pacote["video_atual"])

          hist_path = Path("historico_videos.json")
          hist = json.loads(hist_path.read_text(encoding="utf-8"))
          ids_existentes = {int(v["id"]) for v in hist.get("videos", [])}
          if vid not in ids_existentes:
              for v in hist.get("videos", []):
                  if str(v.get("status", "")).strip() == "em_producao":
                      v["status"] = "arquivado"
              hist["videos"].append(reg)
              hist["video_atual"] = vid
              hist["versao"] = max(int(hist.get("versao", 6)), vid)
              hist_path.write_text(json.dumps(hist, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          titulo = str(reg.get("titulo", "Novo Episodio")).replace('"', "'")
          print(f"{vid:02d}|{titulo}")
          PY
          )
          rm -f /tmp/novo_registro_hist.json

          VID_NUM="${META%%|*}"
          VID_TITULO="${META#*|}"

          # Valida integridade do JSON atualizado antes de commitar
          python3 pipeline/historico.py verificar

          git add historico_videos.json
          if git diff --cached --quiet -- historico_videos.json; then
            echo "historico_videos.json ja contem o Video ${VID_NUM} em origin/main."
            exit 0
          fi

          git commit -m "chore(historico): registra Video ${VID_NUM} (${VID_TITULO}) [skip ci]"
          git pull --rebase origin main
          if ! git push origin main; then
            echo "AVISO: main avancou durante o push; refazendo pull --rebase e tentando novamente..."
            git pull --rebase origin main
            git push origin main
          fi
          echo "Memoria persistida na main: historico_videos.json atualizado com Video ${VID_NUM} (${VID_TITULO})."

      - name: Notificar falha no Telegram
        if: ${{ failure() && env.ENVIAR_TELEGRAM != 'false' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            exit 0
          fi
          python3 automacao/enviar_telegram.py \
            --erro "A renderizacao na nuvem falhou. Abra o link abaixo para ver o log completo." \
            --run-url "${RUN_URL}"
