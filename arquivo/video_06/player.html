/* ============================================================
   DESENHO DAS CENAS DO VIDEO 06 ("O Elevador do Subsolo 2")
   ============================================================ */
function drawScene(shot, t){
  const f = faceAt(t);
  const localP = prog(t, shot.start, shot.end);

  switch (shot.scene) {
    /* 1. Hall escuro do 12o andar + porta aberta do elevador */
    case 'hall_12_entrada': {
      drawBackdrop(t, 'navy');
      drawElevatorCabin(t, { light: 0.86, visorText: '12', visorArrow: 'stop', doorOpen: 0.92 });
      const rx = lerp(260, 495, ease(localP));
      drawRafaelStanding(rx, 1410, 1.04, {
        t, ex: 'neutral', closed: f.closed, pose: { walk: 1 }, rimColor: PAL.cyan, rimA: 0.78, lookX: 0.20
      });
      break;
    }

    /* 2. Rafael entra sozinho no elevador no 12o andar */
    case 'cabine_entra_12': {
      drawBackdrop(t, 'navy');
      drawElevatorCabin(t, {
        light: 0.90, visorText: '12', visorArrow: 'stop',
        mirrorRafael: { x: 540, footY: 1100, sc: 0.76, ex: 'neutral', closed: f.closed, lookX: 0 }
      });
      drawRafaelStanding(520, 1425, 1.12, {
        t, ex: 'neutral', closed: f.closed, backView: true, rimColor: PAL.cyan, rimA: 0.72
      });
      break;
    }

    /* 3. Close na botoeira apertando o Terreo */
    case 'botoeira_aperta_t': {
      drawButtonPanelMacro(t, 'terreo', localP);
      break;
    }

    /* 4. Portas de aco inox fechando devagar ([SFX:porta_elevador:1.1]) */
    case 'portas_fechando': {
      const closeP = 1 - prog(t, EV.portas_fecham, EV.porta_elevador + (EV.porta_elevador_duracao || 1.1));
      drawElevatorCabin(t, {
        light: 0.88, visorText: '12', visorArrow: 'down', doorOpen: clamp(closeP, 0.01, 0.96),
        mirrorRafael: { x: 540, footY: 1100, sc: 0.75, ex: 'neutral', closed: f.closed }
      });
      drawRafaelStanding(535, 1420, 1.08, {
        t, ex: 'neutral', closed: f.closed, rimColor: PAL.cyan, rimA: 0.76, lookX: 0.10
      });
      break;
    }

    /* 5. Painel vermelho descendo: 11 -> 10 -> 09 */
    case 'visor_desce': {
      let dig = '12';
      if (t >= EV.num_09 - 0.05) dig = '09';
      else if (t >= EV.num_10 - 0.05) dig = '10';
      else if (t >= EV.num_11 - 0.05) dig = '11';
      drawVisorMacro(t, dig, true, 'down', false, 0.05);
      break;
    }

    /* 6. Luz pisca freneticamente e elevador trava seco no 06 */
    case 'cabine_luz_pisca': {
      const flk = (Math.sin(t * 38) > -0.15) ? 0.82 : 0.14;
      const is06 = t >= EV.andar_06 - 0.15;
      drawElevatorCabin(t, {
        light: flk, redAlert: t >= EV.trava_seco - 0.1, visorText: is06 ? '06' : '08',
        visorArrow: is06 ? 'stop' : 'down',
        mirrorRafael: { x: 540, footY: 1100, sc: 0.78, ex: 'fear', closed: f.closed }
      });
      drawRafaelStanding(540, 1435, 1.16, {
        t, ex: 'fear', closed: f.closed, fastBreath: true,
        pose: { panic: 1 }, rimColor: PAL.alert, rimA: 0.88, lookY: -0.35
      });
      break;
    }

    /* 7. Visor cravado em 06 durante o tranco nos cabos ([SFX:tranco_elevador:1.2]) */
    case 'visor_trava_06': {
      const on = Math.sin(t * 42) > -0.25;
      drawVisorMacro(t, '06', on, 'warn', true, 0.55);
      break;
    }

    /* 8. Painel inteiro apaga */
    case 'visor_apaga': {
      drawVisorMacro(t, 'OFF', false, 'stop', false, 0);
      break;
    }

    /* 9. Rafael olha pro espelho atras dele: o reflexo demora 0,5s a mais para virar a cabeca! */
    case 'espelho_reflexo_atrasado': {
      const delayStart = EV.reflexo_atrasado;
      const rafTurn = easeOut(prog(t, EV.olha_espelho, EV.olha_espelho + 0.35));
      /* O reflexo congela olhando reto e so comeca a virar 0,55s depois! */
      const refTurn = easeOut(prog(t, delayStart + 0.45, delayStart + 1.05));
      const eeriness = prog(t, delayStart, delayStart + 0.55);

      drawElevatorCabin(t, {
        light: 0.24, redAlert: eeriness > 0.3, visorText: '--', visorOn: false,
        mirrorRafael: {
          x: 540, footY: 1105, sc: 0.84,
          ex: eeriness > 0.2 ? 'sinister_smile' : 'neutral',
          smileProg: eeriness * 0.38,
          closed: 0,
          pose: { headTilt: lerp(0.0, 0.14, refTurn) },
          lookX: lerp(0.0, 0.35, refTurn)
        }
      });
      drawRafaelStanding(410, 1465, 1.24, {
        t, ex: eeriness > 0.2 ? 'shock' : 'worry', closed: f.closed, fastBreath: true,
        pose: { headTilt: lerp(0.0, -0.14, rafTurn) },
        rimColor: eeriness > 0.2 ? PAL.alert : PAL.violet, rimA: 0.86,
        lookX: lerp(0.1, -0.45, rafTurn)
      });
      break;
    }

    /* 10. CTA dedicada em tela cheia (desenhada em camada exclusiva no renderAt) */
    case 'cta_tela_cheia': {
      drawBackdrop(t, 'dark');
      break;
    }

    /* 11. Luz volta fraca piscando e elevador volta a descer */
    case 'cabine_luz_volta': {
      const flk = 0.42 + 0.28 * (Math.sin(t * 24) > -0.2 ? 1 : 0.25);
      drawElevatorCabin(t, {
        light: flk, visorText: '03', visorArrow: 'down',
        mirrorRafael: { x: 540, footY: 1100, sc: 0.76, ex: 'worry', closed: f.closed }
      });
      drawRafaelStanding(520, 1435, 1.14, {
        t, ex: 'worry', closed: f.closed, fastBreath: true, rimColor: PAL.cyan, rimA: 0.80, lookY: -0.25
      });
      break;
    }

    /* 12. Visor passa direto por T -> G1 -> G2 */
    case 'visor_passa_subsolos': {
      let dig = '01';
      if (t >= EV.passa_g2 - 0.08) dig = 'G2';
      else if (t >= EV.passa_g1 - 0.08) dig = 'G1';
      else if (t >= EV.passa_terreo - 0.08) dig = 'T';
      drawVisorMacro(t, dig, true, 'down', dig === 'G1' || dig === 'G2', 0.32);
      break;
    }

    /* 13. Rafael aperta o botao vermelho de emergencia desesperado ([SFX:alarme_interfone:1.1]) */
    case 'botoeira_emergencia': {
      drawButtonPanelMacro(t, 'emergencia', localP);
      break;
    }

    /* 14. Panico na cabine: o predio so tem dois subsolos */
    case 'cabine_panico_s3': {
      drawElevatorCabin(t, {
        light: 0.48, redAlert: true, visorText: 'G2', visorArrow: 'down',
        mirrorRafael: { x: 540, footY: 1105, sc: 0.80, ex: 'fear', closed: f.closed }
      });
      drawRafaelStanding(545, 1455, 1.24, {
        t, ex: 'fear', closed: f.closed, fastBreath: true,
        pose: { panic: 1 }, rimColor: PAL.alert, rimA: 0.94, lookY: -0.35
      });
      break;
    }

    /* 15. Macro no visor digital vermelho acendendo a letra impossivel: "S3" */
    case 'visor_s3_macro': {
      const showS3 = t >= EV.visor_s3 - 0.45;
      drawVisorMacro(t, showS3 ? 'S3' : 'G2', true, showS3 ? 'warn' : 'down', true, showS3 ? 0.65 : 0.20);
      break;
    }

    /* 16. Portas abrem revelando o breu absoluto do S3 (gancho seco da Parte 1!) */
    case 'portas_abrem_breu': {
      const openP = prog(t, EV.portas_abrem_s3, EV.corte_parte_2);
      drawS3Corridor(t, 0, false);
      /* Portas de inox abrindo do centro para os lados */
      const gap = lerp(18, 490, ease(openP));
      const dG = g.createLinearGradient(0, 0, W, 0);
      dG.addColorStop(0, '#1E293B'); dG.addColorStop(0.5, '#475569'); dG.addColorStop(1, '#1E293B');
      g.fillStyle = dG;
      g.fillRect(-100, 150, 640 - gap, 1580);
      g.fillRect(540 + gap, 150, 640 - gap, 1580);
      g.fillStyle = '#020617';
      g.fillRect(532 - gap, 150, 12, 1580);
      g.fillRect(536 + gap, 150, 12, 1580);
      /* Breu mais intenso nos primeiros instantes */
      g.fillStyle = `rgba(2, 4, 9, ${lerp(0.75, 0.25, openP)})`;
      g.fillRect(540 - gap, 150, gap * 2, 1580);
      break;
    }

    /* 17 & 18. PARTE 2: Corredor de concreto umido com a cadeira de metal isolada! */
    case 'corredor_s3_cadeira': {
      drawS3Corridor(t, localP, false);
      break;
    }
    case 'corredor_cadeira_zoom': {
      drawS3Corridor(t, localP, true);
      break;
    }

    /* 19. Rafael esmaga o botao de fechar porta (painel morto) */
    case 'botoeira_morta': {
      drawButtonPanelMacro(t, 'morta', localP);
      break;
    }

    /* 20. Interfone do elevador chia sozinho ([SFX:interfone:1.2]) */
    case 'interfone_grade': {
      drawIntercomGrille(t);
      break;
    }

    /* 21. Rafael ouve a voz tremula do porteiro */
    case 'rafael_ouve_interfone': {
      withBlur(8, () => {
        drawElevatorCabin(t, { light: 0.40, redAlert: true, visorText: 'S3', visorArrow: 'warn', showMirror: false });
      });
      drawRafaelStanding(520, 1520, 1.38, {
        t, ex: 'fear', closed: f.closed, fastBreath: true,
        pose: { panic: 1 }, rimColor: PAL.cctvBright, rimA: 0.90, lookX: 0.35
      });
      break;
    }

    /* 22 & 23. Tela CCTV da portaria: elevador no Terreo ha 5 minutos + figura olhando pra camera */
    case 'cctv_portaria': {
      drawCctvPortaria(t, false, localP);
      break;
    }
    case 'cctv_portaria_zoom': {
      drawCctvPortaria(t, true, localP);
      break;
    }

    /* 24. Rafael olha pro teto, pro pontinho vermelho da camera */
    case 'camera_teto_led': {
      drawCeilingCamera(t);
      break;
    }

    /* 25. Corredor sumiu, porta fechou e o elevador esta no Terreo (T) */
    case 'cabine_terreo_normal': {
      drawElevatorCabin(t, {
        light: 0.82, redAlert: false, visorText: 'T', visorArrow: 'stop',
        mirrorRafael: { x: 540, footY: 1105, sc: 0.78, ex: 'worry', closed: f.closed }
      });
      drawRafaelStanding(510, 1440, 1.16, {
        t, ex: 'worry', closed: f.closed, fastBreath: true, rimColor: PAL.cyan, rimA: 0.82, lookX: -0.15
      });
      break;
    }

    /* 26 & 27. Celular vibra com a mensagem do amigo la de cima */
    case 'celular_msg':
    case 'celular_msg_zoom': {
      withBlur(8, () => {
        drawElevatorCabin(t, { light: 0.52, redAlert: shot.scene === 'celular_msg_zoom', visorText: 'T', showMirror: false });
      });
      drawFriendPhone(t, shot.scene === 'celular_msg_zoom' || t >= EV.igual_voce - 0.15, localP);
      break;
    }

    /* 28. MODULO bigFace DO RAFAEL EM CHOQUE EXTREMO ([SFX:impacto_twist:1.4]) */
    case 'big_face': {
      withBlur(8, () => {
        drawBackdrop(t, 'red');
        drawElevatorCabin(t, { light: 0.26, redAlert: true, visorText: 'T', showMirror: false });
      });
      const jitX = noise(t * 48, 1) * 9;
      const jitY = noise(t * 48, 2) * 9;
      g.save();
      g.translate(540 + jitX, 920 + jitY);
      g.fillStyle = PAL.top;
      rr(-310, 265, 620, 880, 175); g.fill();
      g.save();
      rr(-310, 265, 620, 880, 175); g.clip();
      g.fillStyle = rgba(PAL.topDeep, 0.48);
      g.fillRect(-320, 255, 175, 900);
      g.restore();
      g.fillStyle = PAL.skinShadow;
      rr(-64, 190, 128, 120, 40); g.fill();

      drawHeadRafael(0, -15, 290, 'shock', f.closed, {
        tilt: -0.04 + noise(t * 22, 3) * 0.016,
        rimA: 0.98,
        rimColor: PAL.alert,
        rimAng: 0.12,
        lookX: 0.12,
        sweat: true
      });
      glow(0, 340, 380, PAL.cyan, 0.26);
      glow(320, -20, 420, PAL.alert, 0.36);
      g.restore();
      break;
    }

    /* 29. FRAME FINAL SECO PARA LOOP: no espelho atras do Rafael, o reflexo sorri primeiro! */
    case 'final_espelho_sorriso': {
      drawFinalMirrorSmile(t, localP);
      break;
    }
  }
}

/* ============================================================
   CAMERA VIVA V5 + PUNCH-IN KATANA + SCREEN SHAKE AMORTECIDO
   ============================================================ */
function pickShot(t){
  for (let i = 0; i < SHOTS.length; i++) {
    const s = SHOTS[i];
    if (t < s.end || i === SHOTS.length - 1) return s;
  }
  return SHOTS[0];
}

function cameraFor(shot, t){
  const k = ease(prog(t, shot.start, shot.end));
  let z = lerp(shot.cam0[0], shot.cam1[0], k);
  const cx = lerp(shot.cam0[1], shot.cam1[1], k);
  const cy = lerp(shot.cam0[2], shot.cam1[2], k);

  let sx = noise(t * 2.1, 11) * 4.5;
  let sy = noise(t * 1.9, 29) * 4.5;

  for (let i = 0; i < KATANA_HITS.length; i++) {
    const kh = KATANA_HITS[i];
    if (t >= kh.start && t < kh.end + 0.40) {
      const dt = t - kh.start;
      z += kh.punch * Math.exp(-dt * 7.2);
      const env = Math.exp(-dt * 10.5);
      sx += Math.sin(dt * 108) * kh.shake * env;
      sy += Math.cos(dt * 94) * kh.shake * 0.72 * env;
    }
  }

  const impacts = [
    [EV.porta_elevador + 0.75, 12, 8.0],
    [EV.tranco_elevador + 0.04, 30, 5.2],
    [EV.alarme_interfone + 0.04, 14, 7.5],
    [EV.celular_vibra, 11, 8.0],
    [EV.impacto_twist, 28, 5.0]
  ];
  for (const [ti, amp, dec] of impacts) {
    if (t >= ti && t < ti + 0.90) {
      const dt = t - ti;
      const env = Math.exp(-dt * dec);
      sx += Math.sin(dt * 95) * amp * env;
      sy += Math.cos(dt * 83) * amp * 0.72 * env;
    }
  }
  return { z, cx, cy, sx, sy };
}

function finish(vig){
  g.save();
  g.globalAlpha = clamp(vig, 0, 1);
  g.drawImage(vigCv, 0, 0);
  g.restore();
}

/* ============================================================
   LEGENDAS POP-IN (2-3 PALAVRAS, MAIUSCULAS, AMARELO/VERMELHO)
   Ocultas durante Katana hits e durante a CTA tela cheia V5
   ============================================================ */
const RED_WORDS = new Set([
  'sozinho', 'trava', 'seco', 'apaga', 'espelho', 'reflexo', 'atrasado',
  'emergencia', 'desesperado', 'subsolos', 's', 'tres', 'escuro', 'cadeira',
  'metal', 'interfone', 'nao', 'sai', 'cinco', 'minutos', 'alguem', 'camera',
  'vermelho', 'sumiu', 'igual', 'voce', 'hall', 'sorri', 'primeiro'
]);
function normWord(w){
  return w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/gi, '').toLowerCase();
}

function groupLen(slice){
  return slice.reduce((acc, p) => acc + String(p.palavra || '').length, 0) + Math.max(0, slice.length - 1);
}

function buildPreviewCaptions(){
  const e = EV;
  const lines = [
    [e.gancho, e.entra_elevador - 0.15, 'Uma e quarenta e dois da manhã.'],
    [e.entra_elevador, e.aperta_terreo - 0.18, 'Rafael entra sozinho no elevador no décimo segundo andar.'],
    [e.aperta_terreo, e.porta_elevador - 0.08, 'Ele aperta o térreo. As portas fecham devagar.'],
    [e.painel_desce, e.luz_pisca - 0.16, 'No painel vermelho, os números descem: onze, dez, nove.'],
    [e.luz_pisca, e.tranco_elevador - 0.08, 'A luz pisca e o elevador trava seco no sexto andar.'],
    [e.painel_apaga, e.cta_meio_inicio - 0.15, 'O painel apaga. O reflexo no espelho demorou meio segundo a mais pra virar.'],
    [e.luz_volta, e.botao_emergencia - 0.16, 'O elevador volta a descer e passa direto pelo térreo, subsolo um e dois.'],
    [e.botao_emergencia, e.alarme_interfone - 0.08, 'Rafael aperta o botão de emergência desesperado.'],
    [e.dois_subsolos, e.portas_abrem_s3 - 0.10, 'O prédio só tem dois subsolos. Mas o visor acende S três.'],
    [e.portas_abrem_s3, e.corte_parte_2 - 0.08, 'As portas começam a abrir num corredor completamente escuro.'],
    [e.lado_fora, e.esmaga_botao - 0.16, 'Lá fora só tem concreto úmido e uma cadeira de metal de frente pro elevador.'],
    [e.esmaga_botao, e.interfone - 0.08, 'Rafael esmaga o botão de fechar. O interfone chia sozinho.'],
    [e.voz_porteiro, e.olha_camera - 0.16, 'Seu Rafael, não sai daí. O elevador tá parado no térreo há cinco minutos.'],
    [e.olha_camera, e.celular_vibra - 0.16, 'Rafael olha pro teto. O corredor sumiu e o elevador tá no térreo.'],
    [e.celular_vibra, e.impacto_twist - 0.08, 'Quem é esse cara igual a você saindo do elevador na câmera do hall?'],
    [e.final_espelho, e.duracao_total - 0.20, 'No espelho atrás do Rafael, o reflexo sorri primeiro.']
  ];
  const groups = [];
  for (const [t0, t1, txt] of lines) {
    const words = txt.split(' ');
    const span = Math.max(0.25, t1 - t0);
    const weights = words.map(w => Math.max(2, w.length) + 1.2);
    const sum = weights.reduce((a, b) => a + b, 0);
    let cur = t0;
    const timed = words.map((w, i) => {
      const d = span * (weights[i] / sum);
      const item = { palavra: w, inicio: cur, fim: cur + d, duracao: d };
      cur += d;
      return item;
    });
    let i = 0;
    while (i < timed.length) {
      const rem = timed.length - i;
      let sz = rem <= 3 ? rem : (rem === 4 ? 2 : 3);
      if (sz === 3 && groupLen(timed.slice(i, i + 3)) > 20) sz = 2;
      if (sz === 2 && groupLen(timed.slice(i, i + 2)) > 22) sz = 1;
      const sl = timed.slice(i, i + sz);
      groups.push({ inicio: sl[0].inicio, fim: sl[sl.length - 1].fim, palavras: sl });
      i += sz;
    }
  }
  captionGroups = groups;
}

function layoutCaptionGroup(grp){
  const words = grp.palavras
    .map(p => ({
      txt: String(p.palavra || '').replace(/\[\/?VOZ(?::[a-zA-Z0-9_]+)?\]/gi, '').trim().toUpperCase(),
      key: normWord(String(p.palavra || '')),
      inicio: Number(p.inicio),
      fim: Number(p.fim ?? (Number(p.inicio) + Number(p.duracao || 0.25)))
    }))
    .filter(w => w.txt.length > 0);
  if (!words.length) return null;

  const POP_MAX = 1.09;
  const MAX_LINE_W = 876;
  let fs = 78;
  let lw = 16, gap = 36, wds = [], boxes = [], tw = 0;

  for (let iter = 0; iter < 16; iter++) {
    g.font = `900 ${fs}px ${COND}`;
    lw = Math.max(10, Math.round(fs * 0.20));
    /* Reserva folga real do contorno (lw) + expansao lateral do pop-in (POP_MAX) */
    gap = Math.max(26, Math.round(fs * 0.36) + Math.round(lw * 0.50));
    wds = words.map(w => g.measureText(w.txt).width);
    boxes = wds.map(w => w * POP_MAX + lw);
    tw = boxes.reduce((a, b) => a + b, 0) + gap * (words.length - 1);
    if (tw <= MAX_LINE_W || fs <= 30) break;
    const nextFs = Math.max(30, Math.floor(fs * (MAX_LINE_W / tw)) - (iter > 2 ? 1 : 0));
    if (nextFs >= fs) fs -= 2; else fs = nextFs;
  }

  let x = 540 - tw / 2;
  const items = words.map((w, i) => {
    const cx = x + boxes[i] / 2;
    const item = { ...w, cx, w: wds[i], boxW: boxes[i] };
    x += boxes[i] + gap;
    return item;
  });
  return { fs, lw, gap, tw, items };
}

function pickCaptionGroup(t){
  const cP2 = Number(EV.corte_parte_2);
  const temCorte = isFinite(cP2) && cP2 > 0;
  const naParte2 = temCorte && t >= cP2 - 0.001;

  let candidato = null;
  for (let i = 0; i < captionGroups.length; i++) {
    const c = captionGroups[i];
    const ini = Number(c.inicio);
    const fim = Number(c.fim);
    /* Barreira dura entre Parte 1 e Parte 2: legenda da Parte 1 nunca vaza para 0:00 da Parte 2 */
    if (temCorte) {
      const grpEhP2 = ini >= cP2 - 0.005;
      if (naParte2 && !grpEhP2) continue;
      if (!naParte2 && grpEhP2) continue;
    }
    if (t >= ini - 0.04 && t <= fim) {
      return c;
    }
    if (t > fim && t <= fim + 0.14) {
      candidato = c;
    }
  }
  return candidato;
}

function drawCaptions(t){
  if (katanaStateAt(t) !== null) return;
  if (isFullScreenCtaActive(t)) return;

  const grp = pickCaptionGroup(t);
  if (!grp || !grp.palavras || !grp.palavras.length) return;

  const lay = layoutCaptionGroup(grp);
  if (!lay) return;

  let active = 0;
  for (let i = 0; i < lay.items.length; i++) if (t >= lay.items[i].inicio - 0.02) active = i;

  const grpPop = popScale(t - grp.inicio + 0.02, 0.11);

  g.save();
  g.font = `900 ${lay.fs}px ${COND}`;
  g.textBaseline = 'middle';
  g.textAlign = 'center';

  const y = 1495;
  g.translate(540, y);
  g.scale(grpPop, grpPop);
  g.translate(-540, -y);

  g.lineJoin = 'round';
  g.miterLimit = 2;

  lay.items.forEach((w, i) => {
    const isAct = i === active;
    const isRed = RED_WORDS.has(w.key);
    const fill = isAct ? (isRed ? PAL.alert : PAL.yellow) : '#FFFFFF';
    const wPop = isAct ? lerp(1.09, 1.04, easeOut(clamp((t - w.inicio) / 0.09))) : 1.0;

    g.save();
    g.translate(w.cx, y);
    g.scale(wPop, wPop);
    g.shadowColor = 'rgba(0,0,0,.88)';
    g.shadowBlur = 16;
    g.shadowOffsetY = 6;
    g.strokeStyle = '#000000';
    g.lineWidth = lay.lw;
    g.strokeText(w.txt, 0, 0);
    g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.fillStyle = fill;
    g.fillText(w.txt, 0, 0);
    g.restore();
  });
  g.restore();
}

window.measureCaptionAt = t => {
  const grp = pickCaptionGroup(t);
  if (!grp) return null;
  g = main;
  const lay = layoutCaptionGroup(grp);
  if (!lay) return null;
  let minVisualGap = Infinity;
  for (let i = 0; i < lay.items.length - 1; i++) {
    const a = lay.items[i], b = lay.items[i + 1];
    const rightA = a.cx + a.boxW / 2;
    const leftB = b.cx - b.boxW / 2;
    minVisualGap = Math.min(minVisualGap, leftB - rightA);
  }
  return {
    texto: lay.items.map(x => x.txt).join(' '),
    palavras: lay.items.map(x => x.txt),
    fs: lay.fs,
    lw: lay.lw,
    gap: lay.gap,
    tw: Number(lay.tw.toFixed(1)),
    minVisualGap: lay.items.length > 1 ? Number(minVisualGap.toFixed(1)) : null
  };
};

let ccOn = false;
function renderAt(t){
  t = clamp(+t || 0, 0, duration);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.filter = 'none';
  g.shadowBlur = 0;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);

  /* 1. CTA dedicada em tela cheia V5 (ocupa 100% da tela, oculta selo/relogio/legendas) */
  if (drawFullScreenCta(t)) return;

  /* 2. Motor Katana + Cenas + Loop seco sem tela preta no fim da Parte 1 nem da Parte 2 */
  const shot = pickShot(t);
  const katanaActive = drawKatanaOverlay(t);

  if (!katanaActive) {
    const cam = cameraFor(shot, t);
    g.save();
    g.translate(W / 2 + cam.sx, H / 2 + cam.sy);
    g.scale(cam.z, cam.z);
    g.translate(-cam.cx, -cam.cy);
    drawScene(shot, t);
    g.restore();

    finish(shot.vig || 0.60);
    drawClock(t, shot);

    const cutAge = t - shot.start;
    if (shot.id > 1 && cutAge >= 0 && cutAge < 0.06) {
      const k = 1 - cutAge / 0.06;
      g.fillStyle = shot.mood === 'red' ? `rgba(255,59,48,${k * 0.16})` : `rgba(0,0,0,${k * 0.35})`;
      g.fillRect(0, 0, W, H);
    }
  }

  /* 3. Selo dinamico V5 ("PARTE 1" -> "PARTE 2" a partir de corte_parte_2) */
  drawParteBadge(t);

  /* 4. Legendas sincronizadas (2-3 palavras, ocultas na CTA tela cheia e Katana hits) */
  if (ccOn) drawCaptions(t);
}

window.renderAt = renderAt;
window.getDuration = () => duration;
window.getShots = () => SHOTS.map(s => ({ id: s.id, scene: s.scene, mood: s.mood, start: s.start, end: s.end, dur: s.dur }));
window.getKatanaHits = () => KATANA_HITS.map(h => ({ id: h.id, lines: h.lines, start: h.start, end: h.end, dur: h.dur }));
window.getMidCta = () => ({
  modo: EV.cta_modo || 'pausa_meio',
  inicio: EV.cta_meio_inicio,
  fim: EV.cta_meio_fim,
  texto: EV.cta_texto || 'COMENTE EU QUERO'
});
window.getCorteParte2 = () => Number(EV.corte_parte_2);
window.getParteLabel = t => (typeof t === 'number' ? getActiveParteLabel(t) : parteLabel);
window.setParteLabel = v => { parteLabel = String(v ?? '').trim(); renderAt(cur); };

/* Controles do player */
const $ = id => document.getElementById(id);
const btn = $('play'), seek = $('seek'), out = $('time'), cc = $('cc'), status = $('status');
let playing = false, cur = 0, t0 = 0, p0 = 0;
const fmt = v => v.toFixed(1).replace('.', ',');

function ui(){
  seek.value = cur;
  out.textContent = `${fmt(cur)} / ${fmt(duration)}`;
  seek.setAttribute('aria-valuetext', `${fmt(cur)} de ${fmt(duration)} segundos`);
  $('playLbl').textContent = playing ? 'Pausar' : 'Play';
  $('playIcon').setAttribute('d', playing ? 'M3 2h4v12H3zM9 2h4v12H9z' : 'M4 2l10 6-10 6z');
}
function tick(){
  if (!playing) return;
  cur = Math.min(t0 + (performance.now() - p0) / 1000, duration);
  if (audio && cur < audio.duration && Math.abs(audio.currentTime - cur) > 0.2) audio.currentTime = cur;
  renderAt(cur); ui();
  if (cur >= duration) pause(); else requestAnimationFrame(tick);
}
function play(){
  if (cur >= duration) cur = 0;
  playing = true; t0 = cur; p0 = performance.now();
  if (audio) { audio.currentTime = cur; audio.play().catch(() => {}); }
  ui(); requestAnimationFrame(tick);
}
function pause(){ playing = false; if (audio) audio.pause(); ui(); }
btn.addEventListener('click', () => playing ? pause() : play());
seek.addEventListener('input', () => {
  cur = +seek.value; t0 = cur; p0 = performance.now();
  if (audio && cur < audio.duration) audio.currentTime = cur;
  renderAt(cur); ui();
});
cc.addEventListener('click', () => {
  ccOn = !ccOn; cc.setAttribute('aria-pressed', String(ccOn)); renderAt(cur);
});

async function fetchJson(url){
  if (location.protocol === 'file:') return null;
  try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return null;
}
function probeAudio(src){
  return new Promise(res => {
    const el = new Audio(); let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    el.preload = 'auto';
    el.addEventListener('loadedmetadata', () => fin(el), { once: true });
    el.addEventListener('error', () => fin(null), { once: true });
    setTimeout(() => fin(null), 3500);
    el.src = src;
  });
}

async function load(){
  const [evData, tsData] = await Promise.all([
    fetchJson('audio/eventos.json'),
    fetchJson('audio/timestamps.json')
  ]);
  let a = await probeAudio('audio/mix_final.mp3');
  let audioSrc = 'audio/mix_final.mp3';
  if (!a) { a = await probeAudio('audio/narracao.mp3'); audioSrc = 'audio/narracao.mp3'; }

  if (a && isFinite(a.duration)) audio = a;
  normalizeEvents(evData, audio ? audio.duration : null);

  if (tsData && Array.isArray(tsData.grupos) && tsData.grupos.length) {
    captionGroups = tsData.grupos;
  } else {
    buildPreviewCaptions();
  }

  if (audio && evData) {
    status.textContent = `Audio (${audioSrc}) sincronizado V5 (${fmt(duration)} s | CTA tela cheia | Corte P2 em ${fmt(EV.corte_parte_2)} s).`;
  } else if (audio) {
    status.textContent = `Audio (${audioSrc}) carregado sem eventos.json (${fmt(duration)} s).`;
  } else {
    status.textContent = `Modo Previa V5: sem audio, usando marcos padrao do roteiro_06 (0 a ${fmt(duration)} s | Corte P2 em ${fmt(EV.corte_parte_2)} s).`;
  }
  seek.max = duration;
  btn.disabled = false; seek.disabled = false; btn.removeAttribute('aria-busy');
  renderAt(cur); ui();
}

normalizeEvents(null, null);
buildPreviewCaptions();
renderAt(0); ui(); load();
})();
