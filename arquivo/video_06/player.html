<style>
/* Camada unica de tokens, espelhando tokens/colors.json (dark), spacing, typography, motion, borders, opacity. */
:root{
  --surface-page:#030712; --surface-sunken:#000000; --surface-raised:#1f2937;
  --text-primary:#f9fafb; --text-secondary:#9ca3af;
  --border-default:#1f2937; --border-strong:#6b7280; --focus-ring:#60a5fa;
  --action-primary:#2563eb; --action-primary-hover:#1d4ed8;
  --action-secondary:#111827; --action-secondary-hover:#374151;
  --space-1:4px; --space-2:8px; --space-3:12px;
  --radius-button:6px; --radius-card:8px; --border-width:1px; --focus-width:2px;
  --font-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
  --font-size-xs:12px; --font-size-sm:14px; --weight-medium:500;
  --duration-fast:100ms; --ease-out:cubic-bezier(0,0,.2,1);
  --opacity-disabled:.45; --target-min:44px; --chrome-h:128px; --press-offset:1px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}
.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-2)}
.stage{width:min(100%,calc((100dvh - var(--chrome-h)) * 9 / 16));aspect-ratio:9/16}
canvas{display:block;width:100%;height:100%;border-radius:var(--radius-card);background:var(--surface-sunken)}
.controls{width:100%;max-width:calc(var(--target-min) * 12);display:flex;align-items:center;gap:var(--space-2)}
.btn{min-height:var(--target-min);min-width:var(--target-min);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);
  padding:0 var(--space-3);border:var(--border-width) solid var(--border-default);border-radius:var(--radius-button);
  background:var(--action-secondary);color:var(--text-primary);font:var(--weight-medium) var(--font-size-sm)/1 var(--font-sans);cursor:pointer;
  transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out)}
.btn svg{width:var(--font-size-sm);height:var(--font-size-sm);fill:currentColor}
.btn:hover{background:var(--action-secondary-hover)}
.btn-primary{background:var(--action-primary);border-color:var(--action-primary)}
.btn-primary:hover{background:var(--action-primary-hover)}
.btn:focus-visible,.seek:focus-visible{outline:var(--focus-width) solid var(--focus-ring);outline-offset:var(--focus-width)}
.btn:active{transform:translateY(var(--press-offset))}
.btn:disabled{opacity:var(--opacity-disabled);cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress}
.btn[aria-pressed="true"]{background:var(--surface-raised);border-color:var(--border-strong)}
.seek{flex:1;min-width:0;min-height:var(--target-min);accent-color:var(--action-primary);cursor:pointer}
.seek:disabled{opacity:var(--opacity-disabled)}
.time{font:var(--font-size-xs)/1 var(--font-mono);color:var(--text-secondary);white-space:nowrap}
.status{margin:0;font-size:var(--font-size-xs);color:var(--text-secondary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

const MONO = '"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace';
const SANS = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const COND = '"Arial Narrow","Roboto Condensed","Liberation Sans Narrow",Impact,Arial,sans-serif';

/* Selo dinamico V5: "PARTE 1" antes de corte_parte_2, "PARTE 2" a partir de corte_parte_2 */
const URL_PARTE = new URLSearchParams(location.search).get('parte');

/* Utilidades deterministicas */
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const prog = (t, a, b) => clamp((t - a) / Math.max(0.001, b - a));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (t, seed=0) => {
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57), hash(i + 1 + seed * 57), u) * 2 - 1;
};
const hexRgb = h => {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgba = (hex, a) => {
  const [r, gr, b] = hexRgb(hex);
  return `rgba(${r},${gr},${b},${a})`;
};
function mixHex(h1, h2, k){
  k = clamp(k);
  const a = hexRgb(h1), b = hexRgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
}
function mulberry(a){
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(x, y, w, h, r){
  const rad = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function circ(x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ell(x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function glow(x, y, r, col, a){
  if (a <= 0.002) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a));
  gr.addColorStop(1, rgba(col, 0));
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}
function vgrad(c1, c2, y0=-320, y1=H+320){
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, c1);
  gr.addColorStop(1, c2);
  g.fillStyle = gr;
  g.fillRect(-420, y0, W + 840, y1 - y0);
}
function popScale(age, dur=0.11){
  if (age <= 0) return 0.68;
  const k = clamp(age / dur);
  if (k < 0.62) return lerp(0.68, 1.10, easeOut(k / 0.62));
  return lerp(1.10, 1.0, ease((k - 0.62) / 0.38));
}

/* Helper anti-vazamento: mede sempre com a fonte real instalada (Windows/Linux/Colab) */
function drawFittedText(text, x, y, maxW, maxFs, family, weight='900', align='center'){
  let fs = maxFs;
  g.font = `${weight} ${fs}px ${family}`;
  const w = g.measureText(text).width;
  if (w > maxW && w > 0) {
    fs = Math.max(18, Math.floor(maxFs * (maxW / w)));
    g.font = `${weight} ${fs}px ${family}`;
  }
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(text, x, y);
  return fs;
}

const dofCv = document.createElement('canvas');
dofCv.width = Math.round(W * DOF_SCALE) + DOF_PAD * 2;
dofCv.height = Math.round(H * DOF_SCALE) + DOF_PAD * 2;
const dofCtx = dofCv.getContext('2d');

const dofBlurCv = document.createElement('canvas');
dofBlurCv.width = dofCv.width;
dofBlurCv.height = dofCv.height;
const dofBlurCtx = dofBlurCv.getContext('2d');

function withBlur(px, fn){
  const m = main.getTransform();
  dofCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofCtx.globalAlpha = 1;
  dofCtx.globalCompositeOperation = 'source-over';
  dofCtx.filter = 'none';
  dofCtx.fillStyle = PAL.bgNavy;
  dofCtx.fillRect(0, 0, dofCv.width, dofCv.height);
  dofCtx.translate(DOF_PAD, DOF_PAD);
  dofCtx.scale(DOF_SCALE, DOF_SCALE);
  dofCtx.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g = dofCtx;
  fn();
  g = main;

  const r = Math.max(1.2, px * DOF_SCALE * 1.45);
  dofBlurCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofBlurCtx.clearRect(0, 0, dofBlurCv.width, dofBlurCv.height);
  dofBlurCtx.filter = `blur(${r.toFixed(2)}px)`;
  dofBlurCtx.drawImage(dofCv, 0, 0);
  dofBlurCtx.filter = 'none';

  main.save();
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.imageSmoothingEnabled = true;
  main.imageSmoothingQuality = 'high';
  const padOut = DOF_PAD / DOF_SCALE;
  main.drawImage(dofBlurCv, -padOut, -padOut, W + padOut * 2, H + padOut * 2);
  main.restore();
}

const vigCv = document.createElement('canvas');
vigCv.width = W; vigCv.height = H;

/* ============================================================
   MOTOR DE CORTES DINAMICOS V5 (MAX 1,80s POR PLANO)
   ============================================================ */
function splitShots(rawList, maxDur=1.68){
  const out = [];
  let id = 1;
  for (const s of rawList) {
    const start = Math.max(0, s.start);
    const end = Math.max(start + 0.22, s.end);
    const span = end - start;
    const n = Math.max(1, Math.ceil(span / maxDur));
    for (let i = 0; i < n; i++) {
      const a = start + (span * i) / n;
      const b = start + (span * (i + 1)) / n;
      const alt = i % 2 === 1;
      const z0 = lerp(s.cam0[0], s.cam1[0], i / n);
      const z1 = lerp(s.cam0[0], s.cam1[0], (i + 1) / n);
      const cx0 = lerp(s.cam0[1], s.cam1[1], i / n);
      const cx1 = lerp(s.cam0[1], s.cam1[1], (i + 1) / n);
      const cy0 = lerp(s.cam0[2], s.cam1[2], i / n);
      const cy1 = lerp(s.cam0[2], s.cam1[2], (i + 1) / n);
      out.push({
        id: id++,
        scene: s.scene,
        mood: s.mood,
        vig: s.vig,
        subIdx: i,
        cam0: [alt ? z0 * 1.045 : z0, cx0 + (alt ? 18 : 0), cy0 + (alt ? -12 : 0)],
        cam1: [alt ? z1 * 1.075 : z1 * 1.02, cx1 + (alt ? -14 : 0), cy1 + (alt ? 10 : 0)],
        start: Number(a.toFixed(3)),
        end: Number(b.toFixed(3)),
        dur: Number((b - a).toFixed(3))
      });
    }
  }
  return out;
}

    /* PAUSA DEDICADA V5: CTA EM TELA CHEIA */

    /* ESCALADA FINAL DA PARTE 1 ATE O S3 */
    { scene: 'cabine_luz_volta', mood: 'navy', vig: 0.62, cam0: [1.02, 540, 955], cam1: [1.11, 535, 935], start: ctaB, end: e.passa_terreo - 0.15 },
    { scene: 'visor_passa_subsolos', mood: 'red', vig: 0.64, cam0: [1.03, 540, 940], cam1: [1.18, 540, 925], start: e.passa_terreo - 0.15, end: e.botao_emergencia },

/* ============================================================
   MOTOR KATANA V5 (4 HITS CINETICOS: TRAVOU, S3, 5 MINUTOS, SORRIU)
   ============================================================ */
function buildKatanaHits(e){
  const hits = [
    {
      id: 'travou',
      lines: ['TRAVOU'],
      accentIdx: 0,
      start: Math.max(0.2, Number(e.trava_seco) - 0.02),
      dur: 0.38,
      tilt: -0.055,
      punch: 0.14,
      shake: 24
    },
    {
      id: 's3',
      lines: ['S3'],
      accentIdx: 0,
      start: Math.max(0.2, Number(e.visor_s3) - 0.02),
      dur: 0.40,
      tilt: 0.048,
      punch: 0.16,
      shake: 28
    },
    {
      id: 'cinco_minutos',
      lines: ['5', 'MINUTOS'],
      accentIdx: 0,
      start: Math.max(0.2, Number(e.cinco_minutos) - 0.02),
      dur: 0.40,
      tilt: -0.045,
      punch: 0.14,
      shake: 24
    },
    {
      id: 'sorriu',
      lines: ['SORRIU'],
      accentIdx: 0,
      start: Math.max(0.2, Number(e.reflexo_sorri) - 0.02),
      dur: Math.min(0.36, Math.max(0.26, (Number(e.duracao_total) - Number(e.reflexo_sorri)) * 0.44)),
      tilt: 0.052,
      punch: 0.16,
      shake: 30
    }
  ];
  return hits.map(h => ({ ...h, end: Number((h.start + h.dur).toFixed(3)) }));
}

function katanaStateAt(t){
  for (let i = 0; i < KATANA_HITS.length; i++) {
    const h = KATANA_HITS[i];
    if (t >= h.start && t < h.end) {
      const dt = t - h.start;
      return { hit: h, dt, frame: Math.floor(dt * 30), k: clamp(dt / h.dur) };
    }
  }
  return null;
}

function drawKatanaOverlay(t){
  const ks = katanaStateAt(t);
  if (!ks) return false;
  const { hit, dt, frame } = ks;

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);

  let bgCol = '#05060B';
  let slashCol = PAL.alertKatana;
  let mainTextCol = '#FFFFFF';
  let accentTextCol = PAL.yellow;
  let strokeCol = '#000000';

  if (frame === 0) {
    bgCol = '#FFFFFF';
    slashCol = '#080A11';
    mainTextCol = '#080A11';
    accentTextCol = PAL.alertKatana;
    strokeCol = 'transparent';
  } else if (frame === 1) {
    bgCol = '#04050A';
    slashCol = '#FFFFFF';
    mainTextCol = '#FFFFFF';
    accentTextCol = PAL.yellow;
  } else if (frame === 2) {
    bgCol = PAL.alertKatana;
    slashCol = '#06070D';
    mainTextCol = '#FFFFFF';
    accentTextCol = '#FFFFFF';
  } else if (frame === 3) {
    bgCol = '#060812';
    slashCol = PAL.alertKatana;
    mainTextCol = '#FFFFFF';
    accentTextCol = PAL.yellow;
  }

  g.fillStyle = bgCol;
  g.fillRect(0, 0, W, H);

  /* Linhas de velocidade radiais */
  g.save();
  g.translate(540, 960);
  const rayCount = 24;
  g.strokeStyle = frame === 0 ? 'rgba(8,10,17,0.18)' : 'rgba(255,255,255,0.12)';
  for (let i = 0; i < rayCount; i++) {
    const ang = (i / rayCount) * Math.PI * 2 + hit.tilt * 2.2;
    const r0 = 260 + hash(i * 19 + frame) * 140;
    const r1 = 1120;
    g.lineWidth = 3 + (i % 3) * 2.5;
    g.beginPath();
    g.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
    g.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
    g.stroke();
  }
  g.restore();

  /* Faixa diagonal Katana */
  g.save();
  g.translate(540, 955);
  g.rotate(hit.tilt);
  const slashW = lerp(1750, 1460, easeOut(clamp(dt / 0.14)));
  const slashH = hit.lines.length > 1 ? 520 : 350;
  g.fillStyle = slashCol;
  g.fillRect(-slashW / 2, -slashH / 2, slashW, slashH);
  g.fillStyle = frame === 0 ? PAL.alertKatana : '#FFFFFF';
  g.fillRect(-slashW / 2, -slashH / 2 - 14, slashW, 8);
  g.fillRect(-slashW / 2, slashH / 2 + 6, slashW, 8);
  g.fillStyle = frame === 2 ? 'rgba(255,255,255,0.45)' : rgba(PAL.yellow, 0.35);
  g.fillRect(-slashW * 0.44, -slashH / 2 - 220, slashW * 0.88, 6);
  g.fillRect(-slashW * 0.44, slashH / 2 + 214, slashW * 0.88, 6);
  g.restore();

  let scaleX = 1, scaleY = 1;
  if (dt < 0.11) {
    const k = easeOut(dt / 0.11);
    scaleX = lerp(1.58, 1.00, k);
    scaleY = lerp(0.56, 1.12, k);
  } else {
    const d = dt - 0.11;
    const osc = Math.exp(-15 * d) * Math.cos(40 * d);
    scaleX = 1.0 + 0.11 * osc;
    scaleY = 1.0 - 0.08 * osc;
  }
  const rem = hit.dur - dt;
  if (rem < 0.06) {
    const ek = 1 - rem / 0.06;
    scaleX *= lerp(1.0, 1.18, ek);
    scaleY *= lerp(1.0, 0.82, ek);
  }

  const jitterX = Math.sin(dt * 120) * (frame <= 3 ? 14 : 5) * Math.exp(-dt * 6);
  const jitterY = Math.cos(dt * 105) * (frame <= 3 ? 10 : 4) * Math.exp(-dt * 6);

  g.translate(540 + jitterX, 955 + jitterY);
  g.rotate(hit.tilt);
  g.scale(scaleX, scaleY);

  const lines = hit.lines;
  const maxW = 920;
  const maxFs = lines.length === 1 ? 270 : 198;
  const stepY = lines.length === 1 ? 0 : 190;
  const startY = lines.length === 1 ? 0 : -stepY * 0.5;

  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.miterLimit = 2;

  for (let i = 0; i < lines.length; i++) {
    const txt = lines[i];
    let fs = maxFs;
    g.font = `900 ${fs}px ${COND}`;
    const mw = g.measureText(txt).width;
    if (mw > maxW && mw > 0) {
      fs = Math.max(48, Math.floor(maxFs * (maxW / mw)));
      g.font = `900 ${fs}px ${COND}`;
    }
    const ly = startY + i * stepY;
    const col = (i === hit.accentIdx) ? accentTextCol : mainTextCol;

    if (frame >= 4) {
      g.fillStyle = 'rgba(0,0,0,0.82)';
      g.fillText(txt, 10, ly + 12);
    }
    if (strokeCol !== 'transparent') {
      g.strokeStyle = strokeCol;
      g.lineWidth = Math.max(14, Math.round(fs * 0.10));
      g.strokeText(txt, 0, ly);
    }
    g.fillStyle = col;
    g.fillText(txt, 0, ly);
  }

  g.restore();
  return true;
}

/* ============================================================
   MOTOR V5: CTA DEDICADA EM TELA CHEIA NO MEIO (100% DA TELA)
   Interrompe a historia seco, oculta selo/relogio/legendas
   ============================================================ */
function isFullScreenCtaActive(t){
  const a = Number(EV.cta_meio_inicio);
  const b = Number(EV.cta_meio_fim);
  return isFinite(a) && isFinite(b) && t >= a && t < b;
}

function drawFullScreenCta(t){
  if (!isFullScreenCtaActive(t)) return false;
  const a = Number(EV.cta_meio_inicio);
  const b = Number(EV.cta_meio_fim);
  const span = Math.max(0.5, b - a);
  const dt = t - a;
  const rem = b - t;
  const pct = clamp(dt / span);

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);

  /* Fundo escuro cinematografico ocupando 100% da tela */
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#070B16');
  bg.addColorStop(0.52, '#0B1224');
  bg.addColorStop(1, '#04060D');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  /* Grade arquitetonica sutil + halos direcionais (sem poluicao visual) */
  g.strokeStyle = 'rgba(255, 212, 0, 0.05)';
  g.lineWidth = 2;
  for (let x = 90; x < W; x += 90) {
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
  }
  for (let y = 120; y < H; y += 120) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  glow(540, 880, 620, PAL.yellow, 0.14 + 0.05 * Math.sin(t * 7.0));
  glow(540, 1220, 480, PAL.alert, 0.09);

  /* Faixas diagonais discretas no topo e na base (moldura editorial) */
  g.fillStyle = 'rgba(255, 212, 0, 0.12)';
  g.fillRect(0, 0, W, 14);
  g.fillRect(0, H - 14, W, 14);
  g.drawImage(scanCv, 0, 0);

  /* Micro-glitch seco na entrada (0.14s) e na saida (0.11s) sincronizado com glitch_cta */
  let gx = 0, gy = 0;
  const inGlitch = dt < 0.14;
  const outGlitch = rem < 0.11;
  if (inGlitch) {
    const f = Math.floor(dt * 30);
    gx = (f % 2 === 0 ? 1 : -1) * (1 - dt / 0.14) * 28;
    gy = (f % 3 === 0 ? -1 : 1) * (1 - dt / 0.14) * 10;
  } else if (outGlitch) {
    const f = Math.floor(rem * 30);
    gx = (f % 2 === 0 ? -1 : 1) * (1 - rem / 0.11) * 24;
  }

  /* Flash editorial no frame 0 da entrada */
  if (dt < 0.036) {
    g.fillStyle = 'rgba(255, 255, 255, 0.88)';
    g.fillRect(0, 0, W, H);
  }

  g.translate(gx, gy);

  /* Card central editorial com hairline limpa (sem drop shadow generico nem borda lateral unica) */
  const bx = 64, by = 520, bw = W - 128, bh = 860;
  g.fillStyle = 'rgba(8, 12, 24, 0.94)';
  rr(bx, by, bw, bh, 38); g.fill();
  g.strokeStyle = 'rgba(255, 212, 0, 0.48)';
  g.lineWidth = 3;
  rr(bx, by, bw, bh, 38); g.stroke();

  /* Eyebrow discreto no topo do cartao */
  g.fillStyle = PAL.yellow;
  drawFittedText('PAUSA RÁPIDA NA HISTÓRIA', 540, by + 84, bw - 140, 28, MONO, '800', 'center');

  /* Linha fina separadora */
  g.fillStyle = 'rgba(245, 247, 251, 0.14)';
  g.fillRect(540 - 160, by + 124, 320, 3);

  /* Titulo principal de alto impacto (2 linhas, display forte, 100% blindado via drawFittedText) */
  const titlePop = popScale(dt - 0.02, 0.14);
  g.save();
  g.translate(540, by + 270);
  g.scale(titlePop, titlePop);
  g.fillStyle = PAL.white;
  drawFittedText('QUER FAZER VÍDEOS ASSIM', 0, -54, bw - 112, 74, COND, '900', 'center');
  g.fillStyle = PAL.yellow;
  drawFittedText('NO AUTOMÁTICO?', 0, 48, bw - 112, 86, COND, '900', 'center');
  g.restore();

  /* Pilula amarela gigante "COMENTE EU QUERO" (padding lateral >= 64px por lado!) */
  const falaA = Number(EV.cta_fala_inicio || (a + 0.22));
  const enfatiza = t >= (falaA + (b - falaA) * 0.56);
  const pillPulse = enfatiza ? (1.03 + 0.03 * Math.sin(t * 18.0)) : (1.0 + 0.015 * Math.sin(t * 7.5));
  const pillPop = popScale(dt - 0.08, 0.16) * pillPulse;
  const pillW = 824, pillH = 158;

  g.save();
  g.translate(540, by + 518);
  g.scale(pillPop, pillPop);

  if (inGlitch || outGlitch) {
    g.fillStyle = rgba(PAL.alert, 0.48);
    rr(-pillW / 2 - 12, -pillH / 2, pillW, pillH, pillH / 2); g.fill();
    g.fillStyle = rgba(PAL.cyan, 0.42);
    rr(-pillW / 2 + 12, -pillH / 2, pillW, pillH, pillH / 2); g.fill();
  }

  g.fillStyle = PAL.yellow;
  rr(-pillW / 2, -pillH / 2, pillW, pillH, pillH / 2); g.fill();
  /* Brilho interno discreto no topo da pilula */
  g.fillStyle = 'rgba(255,255,255,0.22)';
  rr(-pillW / 2 + 24, -pillH / 2 + 10, pillW - 48, 28, 14); g.fill();

  /* Texto da pilula com folga lateral ampla (136px total => >= 68px por lado) */
  g.fillStyle = PAL.ink;
  drawFittedText('COMENTE EU QUERO', 0, 4, pillW - 136, 74, COND, '900', 'center');
  g.restore();

  /* Icone vetorial minimalista de comentario + texto auxiliar claro */
  const infoY = by + 678;
  g.save();
  g.translate(226, infoY);
  g.strokeStyle = PAL.yellow;
  g.lineWidth = 4;
  rr(-18, -14, 36, 26, 7); g.stroke();
  g.beginPath(); g.moveTo(-6, 12); g.lineTo(-14, 21); g.lineTo(4, 12); g.stroke();
  g.restore();

  g.fillStyle = PAL.steelBright;
  drawFittedText('EU TE ENVIO TUDO NO DIRECT', 562, infoY + 2, bw - 220, 32, SANS, '700', 'center');

  /* Barra de retomada da historia (mostra que o elevador volta ja!) */
  const barW = bw - 160, barH = 10, barX = 540 - barW / 2, barY = by + 764;
  g.fillStyle = 'rgba(245, 247, 251, 0.14)';
  rr(barX, barY, barW, barH, 5); g.fill();
  g.fillStyle = PAL.yellow;
  rr(barX, barY, Math.max(12, barW * (1 - pct)), barH, 5); g.fill();

  g.fillStyle = PAL.dim;
  drawFittedText('A HISTÓRIA CONTINUA EM INSTANTES', 540, barY + 42, bw - 160, 24, MONO, '700', 'center');

  /* Linhas de interferencia fina somente nos frames de entrada/saida */
  if (inGlitch || outGlitch) {
    g.fillStyle = 'rgba(255,255,255,0.22)';
    for (let i = 0; i < 6; i++) {
      const sy = hash(i * 41 + Math.floor(t * 30)) * H;
      g.fillRect(0, sy, W, 6 + (i % 3) * 5);
    }
  }

  g.restore();
  return true;
}

function normalizeEvents(raw, audioDur){
  const e = { ...EV_PREVIEW, ...(raw || {}) };
  const dur = Math.max(audioDur || 0, Number(e.duracao_total) || EV_PREVIEW.duracao_total);
  e.duracao_total = dur;
  if (raw) {
    for (const k of Object.keys(EV_PREVIEW)) {
      if (typeof EV_PREVIEW[k] === 'number' && raw[k] !== undefined) e[k] = Number(raw[k]);
    }
    if (typeof raw.cta_modo === 'string') e.cta_modo = raw.cta_modo;
    if (typeof raw.cta_texto === 'string') e.cta_texto = raw.cta_texto;
    if (URL_PARTE === null && typeof window.parteLabel !== 'string' && typeof raw.parte_label === 'string' && raw.parte_label.trim()) {
      parteLabel = raw.parte_label.trim();
    }
  }
  EV = e;
  duration = dur;
  SHOTS = buildShots(EV);
  KATANA_HITS = buildKatanaHits(EV);

  /* Expressao do Rafael troca escondida na piscada 2 frames (0.067s) antes do evento */
  EXPR_CUES = [
    [0, 'neutral'],
    [EV.luz_pisca, 'worry'],
    [EV.trava_seco, 'fear'],
    [EV.reflexo_atrasado, 'shock'],
    [EV.luz_volta, 'worry'],
    [EV.botao_emergencia, 'fear'],
    [EV.visor_s3, 'shock'],
    [EV.lado_fora, 'fear'],
    [EV.cinco_minutos, 'shock'],
    [EV.voltou_terreo, 'worry'],
    [EV.igual_voce, 'fear'],
    [EV.impacto_twist, 'shock']
  ];
  const bl = [];
  let bt = 0.85, bi = 0;
  while (bt < duration + 1) { bl.push(bt); bt += 2.6 + hash(bi++ * 11.3) * 1.6; }
  for (const [ct] of EXPR_CUES) if (ct > 0.2) bl.push(Math.max(0.05, ct - 0.067));
  BLINKS = bl.sort((a, b) => a - b);
}

const exprAt = t => { let ex = 'neutral'; for (const [a, b] of EXPR_CUES) if (t >= a - 0.01) ex = b; return ex; };
function faceAt(t){
  let last = -1, prev = -1;
  for (const b of BLINKS) { if (b <= t) { prev = last; last = b; } else break; }
  const d = t - last;
  const closed = last >= 0 && d < 0.16 ? Math.sin((d / 0.16) * Math.PI) : 0;
  const ref = last < 0 ? 0 : (d < 0.08 ? (prev < 0 ? 0 : prev + 0.08) : last + 0.08);
  return { ex: exprAt(ref), closed };
}

/* ============================================================
   FUNDOS VIBRANTES PULSANTES + PARTICULAS CONTINUAS (V5)
   ============================================================ */
const PARTICLES = (() => {
  const rng = mulberry(202606);
  const arr = [];
  for (let i = 0; i < 42; i++) {
    arr.push({
      x: rng() * (W + 300) - 150,
      y: rng() * (H + 300) - 150,
      vx: (rng() - 0.48) * 24,
      vy: -(10 + rng() * 32),
      r: 2.0 + rng() * 4.8,
      layer: i < 21 ? 0 : 1,
      ph: rng() * Math.PI * 2,
      a: 0.12 + rng() * 0.24
    });
  }
  return arr;
})();

function drawParticles(t, mood){
  const colPrimary = mood === 'red' ? PAL.alert
    : (mood === 'yellow' ? PAL.yellow
      : (mood === 'cctv' ? PAL.cctvBright : PAL.cyan));
  const colAlt = mood === 'red' ? '#FF8A5B'
    : (mood === 'cctv' ? PAL.cctvPale : PAL.violet);
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < PARTICLES.length; i++) {
    const p = PARTICLES[i];
    const sp = p.layer === 1 ? 1.35 : 0.72;
    const spanW = W + 300, spanH = H + 300;
    const px = ((((p.x + p.vx * t * sp) + 150) % spanW) + spanW) % spanW - 150;
    const py = ((((p.y + p.vy * t * sp) + 150) % spanH) + spanH) % spanH - 150;
    const tw = 0.55 + 0.45 * Math.sin(t * (2.5 + p.layer * 1.3) + p.ph);
    const col = (i % 3 === 0) ? colAlt : colPrimary;
    const a = p.a * tw * (mood === 'dark' ? 0.36 : 1.0);
    g.fillStyle = rgba(col, a);
    circ(px, py, p.r);
  }
  g.restore();
}

function drawBackdrop(t, mood){
  const pulseSlow = 0.5 + 0.5 * Math.sin(t * 3.4);
  const pulseFast = 0.5 + 0.5 * Math.sin(t * 7.8);
  let top = PAL.bgNavy, bot = PAL.bgDeep, glowCol = PAL.cyan, glowA = 0.14;

  if (mood === 'cctv') {
    top = mixHex('#071418', PAL.bgNavy, pulseSlow * 0.35);
    bot = '#03080C';
    glowCol = PAL.cctvBright;
    glowA = 0.18;
  } else if (mood === 'violet') {
    top = mixHex(PAL.bgViolet, PAL.bgNavy, pulseSlow * 0.38);
    bot = PAL.bgDeep;
    glowCol = PAL.violet;
    glowA = 0.20;
  } else if (mood === 'yellow') {
    top = mixHex(PAL.bgNavy, PAL.bgYellow, 0.45 + 0.45 * pulseFast);
    bot = PAL.bgDeep;
    glowCol = PAL.yellow;
    glowA = 0.20;
  } else if (mood === 'red') {
    top = mixHex(PAL.bgViolet, PAL.bgRed, 0.55 + 0.45 * pulseFast);
    bot = mixHex(PAL.bgNavy, PAL.bgRed, 0.42 + 0.45 * pulseFast);
    glowCol = PAL.alert;
    glowA = 0.26 + 0.12 * pulseFast;
  } else if (mood === 'dark') {
    top = '#05070E';
    bot = '#020306';
    glowCol = PAL.alert;
    glowA = 0.09;
  } else {
    top = mixHex(PAL.bgNavy, '#111B33', pulseSlow * 0.35);
    bot = PAL.bgDeep;
  }

  vgrad(top, bot);
  glow(540 + Math.sin(t * 0.7) * 65, 740, 620, glowCol, glowA);
  drawParticles(t, mood);
}

/* ============================================================
   RIG FLAT EM CAPSULA (10 PONTOS IK) - RAFAEL (#0F766E)
   ============================================================ */
function solveIK(ax, ay, bx, by, l1, l2, bend){
  const dx = bx - ax, dy = by - ay;
  const dist = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + 0.5, l1 + l2 - 0.5);
  const a0 = Math.atan2(dy, dx);
  const cosA = clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
  const ang = a0 + bend * Math.acos(cosA);
  return [ax + Math.cos(ang) * l1, ay + Math.sin(ang) * l1];
}

function drawCapsule(ax, ay, bx, by, w, col, shadeCol){
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  g.save();
  g.translate(ax, ay);
  g.rotate(ang);
  g.fillStyle = col;
  rr(-w * 0.5, -w * 0.5, len + w, w, w * 0.5); g.fill();
  if (shadeCol) {
    g.fillStyle = shadeCol;
    rr(-w * 0.4, 0, len + w * 0.8, w * 0.48, w * 0.24); g.fill();
  }
  g.restore();
}

function drawEyes(cx, cy, r, ex, closed, lookX=0, lookY=0){
  const lift = { neutral: 0, worry: 0.06, fear: 0.11, shock: 0.14, sinister_smile: 0.05 }[ex] || 0;
  const tilt = { neutral: 0, worry: 0.11, fear: 0.10, shock: 0.06, sinister_smile: -0.10 }[ex] || 0;
  const eyePositions = [[cx - r * 0.24, 1], [cx + r * 0.24, -1]];
  g.lineCap = 'round';

  for (const [x, inner] of eyePositions) {
    const y = cy - r * 0.04;
    const browY = y - r * (0.27 + lift);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.068;
    g.beginPath();
    g.moveTo(x - inner * r * 0.15, browY + (ex === 'worry' || ex === 'fear' || ex === 'shock' ? r * 0.04 : 0));
    g.lineTo(x + inner * r * 0.15, browY - tilt * r);
    g.stroke();

    if (closed > 0.55) {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * 0.055;
      g.beginPath(); g.moveTo(x - r * 0.11, y); g.lineTo(x + r * 0.11, y); g.stroke();
      continue;
    }

    const scaleY = 1 - closed * 0.9;
    g.save();
    g.translate(x, y);
    g.scale(1, scaleY);

    if (ex === 'shock' || ex === 'fear' || ex === 'worry' || ex === 'sinister_smile') {
      const rx = ex === 'shock' ? r * 0.22 : (ex === 'sinister_smile' ? r * 0.18 : (ex === 'fear' ? r * 0.19 : r * 0.15));
      const ry = ex === 'shock' ? r * 0.25 : (ex === 'sinister_smile' ? r * 0.20 : (ex === 'fear' ? r * 0.21 : r * 0.17));
      g.fillStyle = PAL.white;
      ell(0, 0, rx, ry);
      const pr = ex === 'shock' ? r * 0.054 : (ex === 'sinister_smile' ? r * 0.058 : (ex === 'fear' ? r * 0.075 : r * 0.085));
      g.fillStyle = PAL.ink;
      circ(lookX * r * 0.06, lookY * r * 0.05, pr);
      g.fillStyle = PAL.white;
      circ(lookX * r * 0.06 - pr * 0.35, lookY * r * 0.05 - pr * 0.35, pr * 0.30);
    } else {
      g.fillStyle = PAL.white;
      ell(0, 0, r * 0.14, r * 0.15);
      g.fillStyle = PAL.ink;
      circ(lookX * r * 0.05, lookY * r * 0.04, r * 0.082);
      g.fillStyle = PAL.white;
      circ(lookX * r * 0.05 - r * 0.03, lookY * r * 0.04 - r * 0.03, r * 0.028);
    }
    g.restore();
  }
}

function drawMouth(cx, cy, r, ex, smileProg=1){
  const my = cy + r * 0.36;
  g.lineCap = 'round';
  if (ex === 'sinister_smile') {
    /* Sorriso largo e inquietante do reflexo no espelho */
    const sp = clamp(smileProg);
    const w = lerp(r * 0.18, r * 0.44, sp);
    const curve = lerp(r * 0.02, r * 0.24, sp);
    g.fillStyle = '#09090F';
    g.beginPath();
    g.moveTo(cx - w, my - curve * 0.35);
    g.quadraticCurveTo(cx, my + curve * 1.45, cx + w, my - curve * 0.35);
    g.quadraticCurveTo(cx, my + curve * 0.22, cx - w, my - curve * 0.35);
    g.closePath();
    g.fill();
    if (sp > 0.35) {
      g.strokeStyle = 'rgba(248, 250, 252, 0.85)';
      g.lineWidth = r * 0.042;
      g.beginPath();
      g.moveTo(cx - w * 0.72, my - curve * 0.06);
      g.quadraticCurveTo(cx, my + curve * 0.56, cx + w * 0.72, my - curve * 0.06);
      g.stroke();
    }
    return;
  }
  if (ex === 'shock') {
    g.fillStyle = '#190C0E';
    ell(cx, my + r * 0.02, r * 0.16, r * 0.21);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.042;
    g.beginPath(); g.ellipse(cx, my + r * 0.02, r * 0.16, r * 0.21, 0, 0, Math.PI * 2); g.stroke();
  } else if (ex === 'fear') {
    g.fillStyle = '#1E1114';
    ell(cx, my + r * 0.02, r * 0.14, r * 0.11);
  } else if (ex === 'worry') {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.052;
    g.beginPath();
    g.moveTo(cx - r * 0.14, my + r * 0.03);
    g.quadraticCurveTo(cx, my - r * 0.06, cx + r * 0.14, my + r * 0.03);
    g.stroke();
  } else {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.050;
    g.beginPath();
    g.moveTo(cx - r * 0.13, my);
    g.lineTo(cx + r * 0.13, my);
    g.stroke();
  }
}

function drawHeadRafael(cx, cy, r, ex, closed, opt={}){
  const {
    tilt = 0, rimA = 0.72, rimColor = PAL.cyan, rimAng = -0.35,
    lookX = 0, lookY = 0, isReflection = false, smileProg = 1, sweat = false
  } = opt;
  g.save();
  g.translate(cx, cy);
  g.rotate(tilt);

  /* Orelhas discretas */
  g.fillStyle = isReflection ? '#C4A288' : PAL.skinShadow;
  circ(-r * 0.92, r * 0.06, r * 0.18);
  circ(r * 0.92, r * 0.06, r * 0.18);

  /* Cabeca redonda flat limpa */
  g.fillStyle = isReflection ? '#CFAF96' : PAL.skin;
  circ(0, 0, r);

  /* Sombra sutil no lado oposto a rim light */
  g.save();
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
  g.fillStyle = rgba(PAL.skinShadow, isReflection ? 0.34 : 0.24);
  circ(-r * 0.36, r * 0.18, r * 0.96);

  /* Cabelo escuro curto moderno do Rafael (silhueta masculina limpa, sem capacete) */
  g.fillStyle = PAL.hair;
  g.beginPath();
  g.arc(0, -r * 0.14, r * 1.03, Math.PI * 1.04, Math.PI * 1.96);
  g.quadraticCurveTo(r * 0.62, -r * 0.42, r * 0.15, -r * 0.56);
  g.quadraticCurveTo(-r * 0.36, -r * 0.46, -r * 0.96, -r * 0.18);
  g.closePath();
  g.fill();
  g.restore();

  /* Topete/franja curta acima da testa */
  g.fillStyle = PAL.hair;
  g.beginPath();
  g.ellipse(0, -r * 0.72, r * 0.82, r * 0.36, -0.05, Math.PI, Math.PI * 2);
  g.fill();
  g.beginPath();
  g.ellipse(-r * 0.30, -r * 0.64, r * 0.42, r * 0.22, -0.22, 0, Math.PI * 2);
  g.fill();

  /* Rim light limpa */
  if (rimA > 0.01) {
    g.strokeStyle = rgba(rimColor, rimA);
    g.lineWidth = Math.max(4, r * 0.045);
    g.lineCap = 'round';
    g.beginPath();
    g.arc(0, 0, r - g.lineWidth * 0.4, rimAng - 0.82, rimAng + 0.82);
    g.stroke();
  }

  /* Olhos + boca */
  drawEyes(0, 0, r, ex, closed, lookX, lookY);
  drawMouth(0, 0, r, ex, smileProg);

  /* Gota de suor frio em choque/panico */
  if (sweat || ex === 'shock') {
    g.fillStyle = PAL.sweat;
    g.beginPath();
    g.moveTo(r * 0.58, -r * 0.28);
    g.quadraticCurveTo(r * 0.68, -r * 0.08, r * 0.58, -r * 0.02);
    g.quadraticCurveTo(r * 0.48, -r * 0.08, r * 0.58, -r * 0.28);
    g.fill();
  }

  g.restore();
}

function drawRafaelStanding(x, footY, sc, opt={}){
  const {
    t = 0, ex = 'neutral', closed = 0, face = 1, fastBreath = false,
    pose = {}, rimColor = PAL.cyan, rimA = 0.75, lookX = 0, lookY = 0,
    isReflection = false, smileProg = 1, backView = false
  } = opt;

  const breath = Math.sin(t * (fastBreath ? 6.8 : 2.3)) * (fastBreath ? 5.0 : 2.2);
  const walk = pose.walk ? Math.sin(t * 9.0) : 0;

  g.save();
  g.translate(x, footY);
  g.scale(sc * face, sc);

  /* Sombra de contato nos pes (garante pes sempre firmes no chao!) */
  if (!isReflection) {
    g.fillStyle = 'rgba(0,0,0,0.45)';
    ell(0, 6, 84, 18);
  }

  const hipY = -205 + breath * 0.35;
  const shY = -395 + breath;

  /* Pernas articuladas (quadril -> joelho -> tornozelo -> tenis firme no chao) */
  const lFootX = -32 + walk * 26, rFootX = 32 - walk * 26;
  const lFootY = -12 - Math.max(0, walk * 16), rFootY = -12 - Math.max(0, -walk * 16);
  const lKnee = solveIK(-24, hipY, lFootX, lFootY, 102, 102, 1);
  const rKnee = solveIK(24, hipY, rFootX, rFootY, 102, 102, 1);

  const pantsA = isReflection ? '#263448' : PAL.pantsDark;
  const pantsB = isReflection ? '#2F3F57' : PAL.pants;
  drawCapsule(-24, hipY, lKnee[0], lKnee[1], 36, pantsA);
  drawCapsule(lKnee[0], lKnee[1], lFootX, lFootY, 32, pantsA);
  drawCapsule(24, hipY, rKnee[0], rKnee[1], 36, pantsB);
  drawCapsule(rKnee[0], rKnee[1], rFootX, rFootY, 32, pantsB);

  /* Tenis escuros com sola clara firme em y=0 */
  for (const [fx, fy] of [[lFootX, lFootY], [rFootX, rFootY]]) {
    g.fillStyle = '#0B0F1A';
    rr(fx - 22, fy - 4, 52, 20, 9); g.fill();
    g.fillStyle = '#CBD5E1';
    rr(fx - 22, fy + 11, 52, 6, 3); g.fill();
  }

  /* Braco traseiro (ombro -> cotovelo -> mao) */
  const bHandX = pose.reach ? 116 : (pose.phone ? 64 : -68 - walk * 18);
  const bHandY = pose.reach ? (shY + 12) : (pose.phone ? (shY + 86) : (shY + 188));
  const bElbow = solveIK(-48, shY + 18, bHandX, bHandY, 92, 92, pose.reach || pose.phone ? -1 : 1);
  const topMain = isReflection ? '#146662' : PAL.top;
  const topSh = isReflection ? '#0E4C49' : PAL.topShade;
  drawCapsule(-48, shY + 18, bElbow[0], bElbow[1], 30, topSh);
  drawCapsule(bElbow[0], bElbow[1], bHandX, bHandY, 26, topSh);
  g.fillStyle = isReflection ? '#C7A68E' : PAL.skinShadow;
  circ(bHandX, bHandY, 16);

  /* Tronco flat em capsula (jaqueta verde-petroleo #0F766E com ziper sutil) */
  g.fillStyle = topMain;
  rr(-66, shY - 12, 132, 214, 58); g.fill();
  g.save();
  rr(-66, shY - 12, 132, 214, 58); g.clip();
  g.fillStyle = rgba(PAL.topDeep, 0.42);
  g.fillRect(-70, shY - 16, 48, 224);
  if (!backView) {
    /* Ziper e gola discreta */
    g.fillStyle = rgba(PAL.steelLight, 0.25);
    g.fillRect(-3, shY + 12, 6, 186);
    g.fillStyle = '#0F172A';
    rr(-22, shY - 14, 44, 24, 10); g.fill();
  }
  g.restore();

  /* Rim light no tronco */
  if (rimA > 0.01) {
    g.strokeStyle = rgba(rimColor, rimA * 0.75);
    g.lineWidth = 4;
    g.beginPath();
    g.moveTo(64, shY + 26); g.lineTo(64, shY + 158);
    g.stroke();
  }

  /* Pescoco */
  g.fillStyle = isReflection ? '#BA977E' : PAL.skinShadow;
  rr(-16, shY - 38, 32, 34, 12); g.fill();

  /* Cabeca */
  if (backView) {
    /* Vista de costas: cabelo escuro cobrindo a nuca + orelhas */
    g.fillStyle = PAL.skinShadow;
    circ(-62, shY - 86, 12); circ(62, shY - 86, 12);
    g.fillStyle = PAL.hair;
    circ(0, shY - 94, 68);
    g.fillStyle = '#1E2433';
    g.beginPath(); g.arc(0, shY - 94, 66, -0.7, 0.7); g.strokeStyle = rgba(rimColor, rimA * 0.65); g.lineWidth = 4; g.stroke();
  } else {
    drawHeadRafael(0, shY - 94, 68, ex, closed, {
      tilt: pose.headTilt || 0, rimA, rimColor, rimAng: 0.15,
      lookX, lookY, isReflection, smileProg, sweat: ex === 'shock'
    });
  }

  /* Braco frontal (relaxado ao lado do corpo em idle; articulado em press/phone/panic) */
  const fHandX = pose.press ? 128 : (pose.phone ? 78 : (pose.panic ? 84 + Math.sin(t * 28) * 14 : 70 + walk * 16));
  const fHandY = pose.press ? (shY + 8) : (pose.phone ? (shY + 74) : (pose.panic ? (shY - 18) : (shY + 188)));
  const fElbow = solveIK(48, shY + 20, fHandX, fHandY, 92, 92, pose.press || pose.phone || pose.panic ? 1 : -1);
  drawCapsule(48, shY + 20, fElbow[0], fElbow[1], 30, topMain, rgba(PAL.topDeep, 0.25));
  drawCapsule(fElbow[0], fElbow[1], fHandX, fHandY, 26, topMain, rgba(PAL.topDeep, 0.25));
  g.fillStyle = isReflection ? '#CFAF96' : PAL.skin;
  circ(fHandX, fHandY, 17);

  /* Celular aceso na mao se pose.phone */
  if (pose.phone && !backView) {
    g.save();
    g.translate(fHandX + 12, fHandY - 12);
    g.rotate(-0.22);
    g.fillStyle = PAL.phone;
    rr(-18, -32, 36, 64, 7); g.fill();
    g.fillStyle = PAL.cyan;
    rr(-14, -26, 28, 52, 4); g.fill();
    glow(0, 0, 120, PAL.cyan, 0.36);
    g.restore();
  }

  g.restore();
}

/* Visor LED vermelho compacto dentro da cabine */
function drawMiniLedVisor(cx, cy, label, isOn=true, arrow='down', redPulse=false){
  g.save();

  g.fillStyle = '#090B12';
  rr(-114, -36, 228, 72, 13); g.fill();
  g.strokeStyle = isOn ? rgba(PAL.ledRed, redPulse ? 0.85 : 0.45) : '#1E293B';
  g.lineWidth = 3;
  rr(-114, -36, 228, 72, 13); g.stroke();

  if (isOn) {
    glow(0, 0, 130, PAL.ledRed, redPulse ? 0.34 : 0.20);
    g.fillStyle = PAL.ledRed;
    drawFittedText(label, -18, 2, 124, 50, MONO, '900', 'center');
    /* Seta vetorial de descida */
    if (arrow === 'down') {
      g.beginPath();
      g.moveTo(54, -10); g.lineTo(80, -10); g.lineTo(67, 13); g.closePath();
      g.fill();
    } else if (arrow === 'stop') {

    }
  } else {
    g.fillStyle = PAL.ledDim;

  }

}

/* Interior do elevador brasileiro em aco inox com espelho amplo e reflexo controlavel */
function drawElevatorCabin(t, opt={}){
  const {
    light = 0.88,
    redAlert = false,
    visorText = '12',
    visorOn = true,
    visorArrow = 'down',
    doorOpen = 0,
    showMirror = true,
    mirrorRafael = null,
    cameraBlink = true
  } = opt;

  /* Paredes laterais de aco inox escovado */
  const wallBg = g.createLinearGradient(0, -180, W, H + 180);
  wallBg.addColorStop(0, mixHex('#0B101B', '#233044', light * 0.65));
  wallBg.addColorStop(0.5, mixHex('#0F172A', '#3B4C66', light * 0.62));
  wallBg.addColorStop(1, mixHex('#090D16', '#1D293B', light * 0.65));
  g.fillStyle = wallBg;
  g.fillRect(-240, -240, W + 480, H + 480);

  /* Reflexos verticais de aco escovado */
  g.fillStyle = `rgba(226, 232, 240, ${0.07 * light})`;
  g.fillRect(42, -160, 58, H + 320);
  g.fillRect(980, -160, 58, H + 320);

  /* Teto metalico com luminaria fluorescente central + camera dome no canto */
  g.fillStyle = '#0E1525';
  g.beginPath();
  g.moveTo(-120, -160); g.lineTo(W + 120, -160);
  g.lineTo(950, 275); g.lineTo(130, 275);
  g.closePath();
  g.fill();

  /* Placa luminosa no teto */
  const lampCol = redAlert ? mixHex('#FCA5A5', '#EF4444', 0.6) : '#E2F1FF';
  g.fillStyle = rgba(lampCol, clamp(0.14 + light * 0.78));
  g.beginPath();
  g.moveTo(270, 58); g.lineTo(810, 58);
  g.lineTo(750, 178); g.lineTo(330, 178);
  g.closePath();
  g.fill();
  if (light > 0.08) glow(540, 140, 560, redAlert ? PAL.alert : '#BAE6FD', 0.24 * light);

  /* Mini camera dome no canto superior direito do teto */
  g.fillStyle = '#1E293B';
  ell(860, 246, 42, 16);
  g.fillStyle = '#020617';
  g.beginPath(); g.arc(860, 250, 26, 0, Math.PI); g.fill();
  if (cameraBlink && Math.sin(t * 5.2) > 0.1) {
    g.fillStyle = PAL.ledRed;
    circ(860, 258, 5);
    glow(860, 258, 42, PAL.ledRed, 0.55);
  }

  /* Piso de granito escuro com reflexo suave */
  g.fillStyle = '#090D16';
  g.beginPath();
  g.moveTo(130, 1345); g.lineTo(950, 1345);
  g.lineTo(W + 180, H + 220); g.lineTo(-180, H + 220);
  g.closePath();
  g.fill();
  g.strokeStyle = 'rgba(148, 163, 184, 0.18)';
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(130, 1345); g.lineTo(950, 1345); g.stroke();

  /* Moldura da parede de fundo */
  g.fillStyle = mixHex('#0A0F1A', '#1E293B', light * 0.55);
  g.fillRect(130, 275, 820, 1070);
  g.strokeStyle = 'rgba(203, 213, 225, 0.20)';
  g.lineWidth = 4;
  g.strokeRect(130, 275, 820, 1070);

  /* ESPELHO AMPLO DO FUNDO (com reflexo proprio, bem abaixo do visor LED!) */
  if (showMirror) {
    const mx = 186, my = 414, mw = 708, mh = 710;
    g.fillStyle = mixHex('#070D17', '#162536', light * 0.72);
    rr(mx, my, mw, mh, 10); g.fill();

    g.save();
    rr(mx, my, mw, mh, 10); g.clip();

    /* Reflexo do teto e luz dentro do espelho */
    const mGrad = g.createLinearGradient(mx, my, mx + mw, my + mh);
    mGrad.addColorStop(0, `rgba(186, 230, 253, ${0.14 * light})`);
    mGrad.addColorStop(0.5, 'rgba(15, 23, 42, 0.08)');
    mGrad.addColorStop(1, `rgba(56, 189, 248, ${0.08 * light})`);
    g.fillStyle = mGrad;
    g.fillRect(mx, my, mw, mh);

    /* Desenho do reflexo do Rafael no espelho (pode ter atraso ou sorrir primeiro!) */
    if (mirrorRafael) {
      drawRafaelStanding(mirrorRafael.x, mirrorRafael.footY, mirrorRafael.sc, {
        ...mirrorRafael,
        t,
        isReflection: true
      });
    }

    /* Riscos diagonais sutis de vidro espelhado */
    g.fillStyle = `rgba(255, 255, 255, ${0.06 * (0.3 + light * 0.7)})`;
    g.beginPath();
    g.moveTo(mx + 60, my); g.lineTo(mx + 150, my);
    g.lineTo(mx - 40, my + mh); g.lineTo(mx - 130, my + mh);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(mx + 420, my); g.lineTo(mx + 475, my);
    g.lineTo(mx + 285, my + mh); g.lineTo(mx + 230, my + mh);
    g.closePath(); g.fill();
    g.restore();

    /* Moldura cromada do espelho + corrimao metalico */
    g.strokeStyle = 'rgba(203, 213, 225, 0.38)';
    g.lineWidth = 6;
    rr(mx, my, mw, mh, 10); g.stroke();

    /* Corrimao cilindrico de inox */
    const railY = my + mh - 74;
    const railG = g.createLinearGradient(0, railY - 12, 0, railY + 14);
    railG.addColorStop(0, '#E2E8F0');
    railG.addColorStop(0.5, '#64748B');
    railG.addColorStop(1, '#1E293B');
    g.fillStyle = railG;
    rr(mx - 14, railY - 11, mw + 28, 22, 11); g.fill();
  }

  /* Visor vermelho de andar acima do espelho (y=346: zero colisao com relogio HUD 01:42!) */
  drawMiniLedVisor(540, 346, visorText, visorOn, visorArrow, redAlert);

  /* Botoeira lateral na parede direita da cabine (em perspectiva) */
  g.fillStyle = '#0F172A';
  rr(964, 620, 72, 340, 10); g.fill();
  g.strokeStyle = 'rgba(203,213,225,0.28)'; g.lineWidth = 3;
  rr(964, 620, 72, 340, 10); g.stroke();
  for (let r = 0; r < 6; r++) {
    g.fillStyle = (r === 5) ? PAL.alert : (visorOn && r === 4 ? PAL.yellow : '#334155');
    circ(985, 658 + r * 44, 9);
    g.fillStyle = '#334155';
    circ(1015, 658 + r * 44, 9);
  }

  /* Portas de inox na frente (quando fechando/abrindo em primeiro plano) */
  if (doorOpen > 0.001 && doorOpen < 0.999) {
    const gap = lerp(0, 440, ease(doorOpen));
    const doorG = g.createLinearGradient(0, 0, W, 0);
    doorG.addColorStop(0, '#1E293B');
    doorG.addColorStop(0.5, '#475569');
    doorG.addColorStop(1, '#1E293B');
    g.fillStyle = doorG;
    g.fillRect(-100, 180, 640 - gap, 1460);
    g.fillRect(540 + gap, 180, 640 - gap, 1460);
    /* Borracha de encontro */
    g.fillStyle = '#020617';
    g.fillRect(532 - gap, 180, 12, 1460);
    g.fillRect(536 + gap, 180, 12, 1460);
  }

  /* Tint vermelho de emergencia quando alerta */
  if (redAlert) {
    g.fillStyle = `rgba(255, 42, 42, ${0.12 + 0.08 * Math.sin(t * 14)})`;
    g.fillRect(-240, -240, W + 480, H + 480);
  }
}

/* Macro da botoeira metalica do elevador brasileiro (12..T, G1, G2 + Emergencia + Fechar) */
function drawButtonPanelMacro(t, mode, localP){
  vgrad('#0D1422', '#050811');

  /* Placa escovada de aco inox */
  const px = 148, py = 265, pw = 784, ph = 1030;
  const plateG = g.createLinearGradient(px, py, px + pw, py + ph);
  plateG.addColorStop(0, '#334155');
  plateG.addColorStop(0.45, '#475569');
  plateG.addColorStop(0.75, '#1E293B');
  plateG.addColorStop(1, '#334155');
  g.fillStyle = plateG;
  rr(px, py, pw, ph, 28); g.fill();
  g.strokeStyle = 'rgba(226, 232, 240, 0.35)';
  g.lineWidth = 5;
  rr(px, py, pw, ph, 28); g.stroke();

  /* Parafusos nos 4 cantos */
  g.fillStyle = '#0F172A';
  for (const [sx, sy] of [[px + 34, py + 34], [px + pw - 34, py + 34], [px + 34, py + ph - 34], [px + pw - 34, py + ph - 34]]) {
    circ(sx, sy, 10);
  }

  /* Grade de botoes (3 colunas x 5 linhas): 12..01, T, G1, G2 */
  const labels = ['12', '11', '10', '09', '08', '07', '06', '05', '04', '03', '02', '01', 'T', 'G1', 'G2'];
  const dead = (mode === 'morta');
  const tLit = (mode === 'terreo' && localP > 0.35);

  for (let i = 0; i < labels.length; i++) {
    const col = i % 3;
    const row = Math.floor(i / 3);
    const bx = px + 175 + col * 216;
    const by = py + 148 + row * 138;
    const lbl = labels[i];
    const isT = lbl === 'T';
    const isLit = isT && tLit;

    /* Anel metalico externo */
    g.fillStyle = '#0F172A';
    circ(bx, by, 52);
    g.fillStyle = isLit ? '#3B2C06' : '#1E293B';
    circ(bx, by, 44);
    g.strokeStyle = isLit ? PAL.yellow : (dead ? '#1E293B' : '#94A3B8');
    g.lineWidth = isLit ? 6 : 3;
    g.beginPath(); g.arc(bx, by, 44, 0, Math.PI * 2); g.stroke();

    if (isLit) glow(bx, by, 105, PAL.yellow, 0.45);

    g.fillStyle = isLit ? PAL.yellow : (dead ? '#475569' : '#E2E8F0');
    drawFittedText(lbl, bx, by + 2, 68, 38, MONO, '900', 'center');
  }

  /* Fileira inferior: Botao FECHAR PORTA (esquerda) e EMERGENCIA VERMELHO (direita) */
  const closeX = px + 240, emergX = px + 544, botY = py + 878;
  const pressClose = (mode === 'morta');
  const pressEmerg = (mode === 'emergencia');

  /* Botao FECHAR PORTA (>| |<) */
  g.fillStyle = '#0F172A'; circ(closeX, botY, 64);
  g.fillStyle = '#1E293B'; circ(closeX, botY, 54);
  g.strokeStyle = dead ? '#334155' : '#94A3B8'; g.lineWidth = 4;
  g.beginPath(); g.arc(closeX, botY, 54, 0, Math.PI * 2); g.stroke();
  g.fillStyle = dead ? '#475569' : '#E2E8F0';
  /* Triangulos apontando para o centro */
  g.beginPath(); g.moveTo(closeX - 30, botY - 14); g.lineTo(closeX - 8, botY); g.lineTo(closeX - 30, botY + 14); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(closeX + 30, botY - 14); g.lineTo(closeX + 8, botY); g.lineTo(closeX + 30, botY + 14); g.closePath(); g.fill();
  g.fillRect(closeX - 2, botY - 18, 4, 36);

  /* Botao VERMELHO DE EMERGENCIA */
  const emFlash = pressEmerg && (Math.sin(t * 26) > 0);
  g.fillStyle = '#0F172A'; circ(emergX, botY, 66);
  g.fillStyle = emFlash ? '#FF4D4D' : (dead ? '#450A0A' : '#B91C1C');
  circ(emergX, botY, 56);
  g.strokeStyle = emFlash ? '#FFFFFF' : PAL.alert; g.lineWidth = 5;
  g.beginPath(); g.arc(emergX, botY, 56, 0, Math.PI * 2); g.stroke();
  if (pressEmerg) glow(emergX, botY, 165, PAL.alert, 0.50);
  /* Icone vetorial de sino de emergencia */
  g.fillStyle = '#FFFFFF';
  g.beginPath();
  g.arc(emergX, botY - 6, 18, Math.PI, 0);
  g.lineTo(emergX + 24, botY + 14);
  g.lineTo(emergX - 24, botY + 14);
  g.closePath(); g.fill();
  circ(emergX, botY + 20, 6);

  /* Legenda tecnica gravada no inox */
  g.fillStyle = '#94A3B8';
  drawFittedText('FECHAR', closeX, botY + 86, 160, 22, MONO, '800', 'center');
  g.fillStyle = PAL.alert;
  drawFittedText('EMERGÊNCIA', emergX, botY + 86, 180, 22, MONO, '800', 'center');

  /* Mao/dedo estilizado do Rafael pressionando o botao alvo! */
  let targetX = px + 175, targetY = py + 148 + 4 * 138;
  let push = 0;
  if (mode === 'terreo') {
    push = easeOut(clamp(localP * 2.2));
  } else if (mode === 'emergencia') {
    targetX = emergX; targetY = botY;
    push = 0.72 + 0.28 * Math.abs(Math.sin(t * 16));
  } else if (mode === 'morta') {
    targetX = closeX; targetY = botY;
    push = 0.70 + 0.30 * Math.abs(Math.sin(t * 20));
  }

  const hx = lerp(W + 140, targetX + 12, push);
  const hy = lerp(targetY + 260, targetY + 20, push);
  g.save();
  g.translate(hx, hy);
  g.rotate(-0.42);
  /* Manga verde-petroleo do Rafael */
  g.fillStyle = PAL.top;
  rr(120, -48, 340, 120, 44); g.fill();
  /* Palma e dedo indicador estendido */
  g.fillStyle = PAL.skin;
  rr(-10, -28, 175, 52, 26); g.fill();
  rr(64, -36, 108, 108, 38); g.fill();
  g.fillStyle = PAL.skinShadow;
  rr(60, 18, 92, 26, 12); g.fill();
  g.restore();
}

/* Macro dramatico no visor LED digital vermelho (11->10->09, 06, OFF, T->G1->G2, S3) */
function drawVisorMacro(t, digit, isOn, arrow, isDanger, glitchAmt=0){
  vgrad(isDanger ? '#1C0508' : '#080C17', '#020308');

  /* Lintel superior de aco inox */
  g.fillStyle = '#1E293B';
  g.fillRect(-180, 320, W + 360, 740);
  g.fillStyle = 'rgba(226, 232, 240, 0.06)';
  for (let y = 340; y < 1040; y += 22) g.fillRect(-180, y, W + 360, 4);

  /* Caixa preta do visor LED */
  const vx = 104, vy = 450, vw = 872, vh = 480;
  g.fillStyle = '#040508';
  rr(vx, vy, vw, vh, 32); g.fill();
  g.strokeStyle = isOn ? rgba(PAL.ledRed, isDanger ? 0.85 : 0.45) : '#1E293B';
  g.lineWidth = 8;
  rr(vx, vy, vw, vh, 32); g.stroke();

  /* Matriz de LEDs apagados no fundo (realismo de painel digital) */
  g.fillStyle = 'rgba(80, 12, 16, 0.34)';
  for (let gx = vx + 44; gx < vx + vw - 30; gx += 28) {
    for (let gy = vy + 44; gy < vy + vh - 30; gy += 28) {
      circ(gx, gy, 4);
    }
  }

  if (isOn) {
    const jx = glitchAmt > 0 ? noise(t * 60, 19) * 16 * glitchAmt : 0;
    const jy = glitchAmt > 0 ? noise(t * 55, 23) * 8 * glitchAmt : 0;
    glow(540 + jx, vy + vh * 0.5 + jy, 440, PAL.ledRed, isDanger ? 0.48 : 0.32);

    if (glitchAmt > 0.2) {
      g.fillStyle = rgba(PAL.cyan, 0.42);
      drawFittedText(digit, 455 + jx + 10, vy + vh * 0.52 + jy, 520, 290, MONO, '900', 'center');
    }

    g.fillStyle = PAL.ledRed;
    drawFittedText(digit, 455 + jx, vy + vh * 0.52 + jy, 520, 290, MONO, '900', 'center');
    g.fillStyle = 'rgba(255, 220, 220, 0.55)';
    drawFittedText(digit, 455 + jx, vy + vh * 0.52 + jy, 520, 286, MONO, '900', 'center');

    if (arrow === 'down') {
      const ay = vy + vh * 0.5 + Math.sin(t * 10) * 12;
      g.fillStyle = PAL.ledRed;
      g.beginPath();
      g.moveTo(760, ay - 52); g.lineTo(880, ay - 52); g.lineTo(820, ay + 64);
      g.closePath(); g.fill();
    } else if (arrow === 'warn') {
      g.fillStyle = PAL.yellow;
      g.beginPath();
      g.moveTo(820, vy + 166); g.lineTo(886, vy + 286); g.lineTo(754, vy + 286);
      g.closePath(); g.fill();
      g.fillStyle = PAL.ink;
      drawFittedText('!', 820, vy + 244, 60, 74, MONO, '900', 'center');
    }
  } else {
    g.fillStyle = '#24080A';
    drawFittedText('OFF', 540, vy + vh * 0.52, 480, 180, MONO, '900', 'center');
  }

  /* Etiqueta gravada abaixo do visor */
  g.fillStyle = '#94A3B8';
  drawFittedText(isDanger ? 'ANDAR NÃO IDENTIFICADO' : 'ELEVADOR SOCIAL', 540, vy + vh + 58, 760, 30, MONO, '800', 'center');
  g.drawImage(scanCv, 0, 0);
}

/* Corredor de concreto umido do Subsolo S3 + cadeira de metal isolada encarando o elevador */

  const cx = 540, cy = 1140;

  g.translate(cx, cy);
  g.scale(cScale, cScale);

  /* Sombra pesada sob a cadeira no concreto molhado */

  g.strokeStyle = '#64748B'; g.lineWidth = 12; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-78, -238); g.lineTo(-92, 62); g.stroke();
  g.beginPath(); g.moveTo(78, -238); g.lineTo(92, 62); g.stroke();

  /* Encosto metalico ripado */
  g.fillStyle = '#475569';
  rr(-86, -242, 172, 92, 10); g.fill();
  g.strokeStyle = '#94A3B8'; g.lineWidth = 4;
  rr(-86, -242, 172, 92, 10); g.stroke();
  g.fillStyle = 'rgba(226, 232, 240, 0.28)';
  g.fillRect(-74, -232, 148, 12);

  g.fillStyle = '#334155';
  g.beginPath();
  g.moveTo(-90, -56); g.lineTo(90, -56); g.lineTo(106, -10); g.lineTo(-106, -10);
  g.closePath(); g.fill();
  g.strokeStyle = '#CBD5E1'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(-90, -56); g.lineTo(90, -56); g.stroke();

  /* Pernas dianteiras + travessa */
  g.strokeStyle = '#94A3B8'; g.lineWidth = 13;

  g.beginPath(); g.moveTo(-99, 32); g.lineTo(99, 32); g.stroke();

  const frameW = zoomChair ? 88 : 138;

  g.fillRect(-160, -160, W + 320, 310);

  g.moveTo(frameW, 150); g.lineTo(frameW, H);
  g.moveTo(W - frameW, 150); g.lineTo(W - frameW, H);
  g.stroke();
}

/* Grade metalica do interfone da cabine chiando com ondas de audio */
function drawIntercomGrille(t){

  const bx = 130, by = 320, bw = 820, bh = 900;

  rr(bx, by, bw, bh, 30); g.stroke();

  /* Etiqueta superior + LED piscando */
  const ledOn = Math.sin(t * 14) > -0.2;
  g.fillStyle = ledOn ? PAL.ledRed : '#3F1111';
  circ(bx + 84, by + 78, 15);
  if (ledOn) glow(bx + 84, by + 78, 70, PAL.ledRed, 0.6);

  g.fillStyle = PAL.text;
  drawFittedText('INTERFONE  •  PORTARIA', bx + 440, by + 80, 620, 34, MONO, '900', 'center');

  /* Fendas horizontais do alto-falante metalico */
  for (let i = 0; i < 11; i++) {
    const sy = by + 168 + i * 44;
    g.fillStyle = '#04060B';
    rr(bx + 90, sy, bw - 180, 22, 11); g.fill();
    g.fillStyle = 'rgba(226, 232, 240, 0.14)';
    g.fillRect(bx + 96, sy + 20, bw - 192, 3);
  }

  /* Ondas reativas de chiado/voz dentro de visor inferior (termina acima de y=1160!) */
  const wx = bx + 84, wy = by + 686, ww = bw - 168, wh = 148;
  g.fillStyle = '#050B10';
  rr(wx, wy, ww, wh, 16); g.fill();
  g.strokeStyle = rgba(PAL.cctvBright, 0.45); g.lineWidth = 3;
  rr(wx, wy, ww, wh, 16); g.stroke();

  g.fillStyle = PAL.cctvBright;
  const nBars = 32;
  for (let i = 0; i < nBars; i++) {
    const env = 0.25 + 0.75 * Math.sin((i / (nBars - 1)) * Math.PI);
    const amp = (0.18 + 0.82 * Math.abs(noise(t * 24 + i * 0.7, 71))) * env;

  g.drawImage(scanCv, 0, 0);
}

/* Tela CCTV da Portaria mostrando o elevador parado no Terreo com figura encarando a camera */
function drawCctvPortaria(t, zoomIn=false, localP=0){
  vgrad('#060D12', '#020508');

  /* sy=294 garante folga limpa abaixo do selo PARTE 2 (y=165..217) mesmo sob zoom 1.15x! */
  const sx = 64, sy = 294, sw = W - 128, sh = 986;
  g.fillStyle = '#0B1418';
  rr(sx, sy, sw, sh, 28); g.fill();

  g.save();
  rr(sx, sy, sw, sh, 28); g.clip();

  /* Fundo CCTV esverdeado-frio do interior do elevador visto do alto */
  const z = zoomIn ? lerp(1.06, 1.28, easeOut(localP)) : lerp(1.00, 1.08, localP);
  g.save();
  g.translate(sx + sw * 0.5, sy + sh * 0.52);
  g.scale(z, z);
  g.translate(-(sx + sw * 0.5), -(sy + sh * 0.52));

  g.fillStyle = '#0F1E24';
  g.fillRect(sx, sy, sw, sh);
  /* Paredes da cabine em grande-angular CCTV */
  g.strokeStyle = 'rgba(125, 211, 252, 0.24)'; g.lineWidth = 4;
  g.strokeRect(sx + 130, sy + 150, sw - 260, sh - 300);
  g.beginPath();
  g.moveTo(sx, sy + 60); g.lineTo(sx + 130, sy + 150);
  g.moveTo(sx + sw, sy + 60); g.lineTo(sx + sw - 130, sy + 150);
  g.moveTo(sx, sy + sh - 70); g.lineTo(sx + 130, sy + sh - 150);
  g.moveTo(sx + sw, sy + sh - 70); g.lineTo(sx + sw - 130, sy + sh - 150);
  g.stroke();

  /* Figura identica ao Rafael parada completamente imovel no centro encarando reto a lente IR */
  const px = sx + sw * 0.5, py = sy + sh * 0.72;
  /* Sombra pesada no piso */
  g.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ell(px, py + 72, 118, 30);
  /* Tronco em capsula de jaqueta escura */
  g.fillStyle = '#071418';
  rr(px - 96, py - 245, 192, 310, 78); g.fill();
  g.strokeStyle = 'rgba(125, 211, 252, 0.22)'; g.lineWidth = 4;
  rr(px - 96, py - 245, 192, 310, 78); g.stroke();
  /* Gola e ziper fraco sob visao noturna */
  g.fillStyle = 'rgba(125, 211, 252, 0.14)';
  g.fillRect(px - 3, py - 225, 6, 265);
  /* Cabeca erguida olhando diretamente para cima na lente */
  g.fillStyle = '#182C34';
  circ(px, py - 322, 82);
  /* Cabelo escuro curto do Rafael */
  g.save();
  g.beginPath(); g.arc(px, py - 322, 82, 0, Math.PI * 2); g.clip();
  g.fillStyle = '#03070A';
  g.beginPath();
  g.arc(px, py - 336, 84, Math.PI * 1.05, Math.PI * 1.95);
  g.quadraticCurveTo(px + 20, py - 355, px - 78, py - 332);
  g.closePath(); g.fill();
  g.restore();
  g.strokeStyle = rgba(PAL.cctvBright, 0.34); g.lineWidth = 3;
  g.beginPath(); g.arc(px, py - 322, 82, 0, Math.PI * 2); g.stroke();

  /* Olheiras fundas e olhos palidos arregalados sem piscar mirando a camera */
  g.fillStyle = 'rgba(2, 6, 9, 0.75)';
  ell(px - 26, py - 328, 22, 18);
  ell(px + 26, py - 328, 22, 18);
  g.fillStyle = PAL.cctvPale;
  ell(px - 26, py - 330, 14, 15);
  ell(px + 26, py - 330, 14, 15);
  g.fillStyle = '#020609';
  circ(px - 26, py - 333, 5.5);
  circ(px + 26, py - 333, 5.5);
  /* Boca reta e gelida (o sorriso fica guardado para o espelho final!) */
  g.strokeStyle = 'rgba(2, 6, 9, 0.85)';
  g.lineWidth = 5;
  g.beginPath(); g.moveTo(px - 18, py - 286); g.lineTo(px + 18, py - 286); g.stroke();

  g.restore();

  /* Interferencia horizontal sutil de sinal CCTV */

/* Contra-plongee da camera dome no teto com LED vermelho piscando */
function drawCeilingCamera(t){
  vgrad('#0A101E', '#04070E');

  /* Placas metalicas do teto em perspectiva */
  g.strokeStyle = 'rgba(148, 163, 184, 0.20)';
  g.lineWidth = 5;
  g.strokeRect(120, 220, 840, 1080);
  g.beginPath();
  g.moveTo(540, 220); g.lineTo(540, 1300);
  g.moveTo(120, 760); g.lineTo(960, 760);
  g.stroke();

  /* Base circular metalica da camera dome */
  const cx = 540, cy = 760;
  g.fillStyle = '#1E293B'; circ(cx, cy, 260);
  g.strokeStyle = '#64748B'; g.lineWidth = 8;
  g.beginPath(); g.arc(cx, cy, 260, 0, Math.PI * 2); g.stroke();

  /* Cupula de vidro fumê escura */
  const domeG = g.createRadialGradient(cx - 60, cy - 60, 20, cx, cy, 210);
  domeG.addColorStop(0, '#1E293B');
  domeG.addColorStop(0.55, '#070B14');
  domeG.addColorStop(1, '#020409');
  g.fillStyle = domeG; circ(cx, cy, 205);

  /* Lente interna acompanhando Rafael */
  const lx = cx + Math.sin(t * 1.6) * 18;
  const ly = cy + Math.cos(t * 1.2) * 10;
  g.fillStyle = '#0F172A'; circ(lx, ly, 76);
  g.strokeStyle = '#334155'; g.lineWidth = 6;
  g.beginPath(); g.arc(lx, ly, 76, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#020617'; circ(lx, ly, 42);
  g.fillStyle = 'rgba(56, 217, 255, 0.35)'; circ(lx - 14, ly - 14, 12);

  /* Pontinho vermelho piscando da gravacao */
  const blink = Math.sin(t * 6.5) > -0.25;
  if (blink) {
    glow(cx + 128, cy - 88, 170, PAL.ledRed, 0.72);
    g.fillStyle = PAL.ledRed;
    circ(cx + 128, cy - 88, 18);
    g.fillStyle = '#FFFFFF';
    circ(cx + 124, cy - 92, 6);
  } else {
    g.fillStyle = '#450A0A';
    circ(cx + 128, cy - 88, 16);
  }
}

/* Close final duplo: Rafael congelado de frente pro espelho enquanto o reflexo SORRI PRIMEIRO */
function drawFinalMirrorSmile(t, localP){
  vgrad('#09050B', '#020205');

  /* Moldura ampla do espelho cobrindo ate a base para nao criar faixa preta atras da legenda */
  const mx = 74, my = 246, mw = W - 148, mh = 1620;
  g.fillStyle = '#0D1724';
  rr(mx, my, mw, mh, 16); g.fill();

  g.save();
  rr(mx, my, mw, mh, 16); g.clip();

  /* Fundo sombrio refletido com pulso vermelho sinistro */
  const p = 0.5 + 0.5 * Math.sin(t * 10);
  vgrad(mixHex('#121E2E', '#3A0A10', 0.45 + 0.35 * p), '#060A12', my, my + mh);
  glow(580, 760, 460, PAL.alert, 0.30 + 0.14 * p);

  /* O REFLEXO NO ESPELHO: olha fixo e abre o sorriso largo primeiro! */
  const smileP = easeOut(clamp(prog(t, EV.final_espelho + 0.35, EV.reflexo_sorri + 0.18)));
  const rJitter = Math.sin(t * 42) * 3.5 * smileP;

  g.save();
  g.translate(585 + rJitter, 860);
  /* Ombros refletidos (jaqueta #0F766E escura) */
  g.fillStyle = '#0D5C58';
  rr(-240, 210, 480, 880, 145); g.fill();
  g.fillStyle = '#073A38';
  rr(-240, 210, 150, 880, 90); g.fill();
  /* Pescoco */
  g.fillStyle = '#A88770';
  rr(-46, 146, 92, 92, 32); g.fill();
  /* Cabeca grande do reflexo abrindo o sorriso sinistro! */
  drawHeadRafael(0, -18, 224, 'sinister_smile', 0, {
    tilt: lerp(0.0, 0.06, smileP),
    rimA: 0.92,
    rimColor: PAL.alert,
    rimAng: -0.25,
    lookX: -0.15,
    lookY: 0.05,
    isReflection: true,
    smileProg: Math.max(0.25, smileP)
  });
  g.restore();

  /* Riscos frios de vidro do espelho */
  g.fillStyle = 'rgba(224, 242, 254, 0.09)';
  g.beginPath();
  g.moveTo(mx + 120, my); g.lineTo(mx + 220, my);
  g.lineTo(mx - 40, my + mh); g.lineTo(mx - 140, my + mh);
  g.closePath(); g.fill();
  g.restore();

  /* Moldura cromada do espelho */
  g.strokeStyle = rgba(PAL.alert, 0.65);
  g.lineWidth = 6;
  rr(mx, my, mw, mh, 16); g.stroke();

  /* Primeiro plano esquerdo (fora do espelho): nuca e ombro rigido do Rafael real paralisado */
  g.save();
  g.fillStyle = '#050A0E';
  rr(-95, 1080, 430, 860, 130); g.fill();
  g.fillStyle = PAL.topDeep;
  rr(-70, 1110, 380, 830, 120); g.fill();
  g.fillStyle = PAL.hair;
  circ(132, 1015, 148);
  g.strokeStyle = rgba(PAL.alert, 0.60);
  g.lineWidth = 6;
  g.beginPath(); g.arc(132, 1015, 146, -0.8, 0.7); g.stroke();
  g.restore();
}

/* ============================================================
   SELO DINAMICO V5 ("PARTE 1" -> "PARTE 2") E RELOGIO 01:42
   ============================================================ */
function getActiveParteLabel(t){
  if (!parteLabel) return '';
  const base = parteLabel.toUpperCase();
  const cP2 = Number(EV.corte_parte_2);
  if (isFinite(cP2) && cP2 > 0 && t >= cP2 - 0.001) {
    if (/\b1\b/.test(base)) return base.replace(/\b1\b/, '2');
    return 'PARTE 2';
  }
  return base;
}

function drawParteBadge(t){
  if (isFullScreenCtaActive(t)) return;
  const label = getActiveParteLabel(t);
  if (!label) return;
  const isP2 = label.includes('2');

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  const fs = 26;
  g.font = `800 ${fs}px ${SANS}`;
  const tw = g.measureText(label).width;
  const bw = Math.max(132, Math.min(280, Math.ceil(tw + 48)));
  const bh = 52;
  const bx = 64, by = 165;

  g.fillStyle = 'rgba(10, 15, 29, 0.74)';
  rr(bx, by, bw, bh, 12); g.fill();
  g.strokeStyle = isP2 ? rgba(PAL.yellow, 0.65) : 'rgba(245, 247, 251, 0.30)';
  g.lineWidth = 2;
  rr(bx, by, bw, bh, 12); g.stroke();

  g.fillStyle = isP2 ? PAL.yellow : PAL.text;
  drawFittedText(label, bx + bw / 2, by + bh / 2 + 1, bw - 28, fs, SANS, '800', 'center');
  g.restore();
}

function drawClock(t, shot){
  if (DEVICE_SCENES.has(shot.scene)) return;
