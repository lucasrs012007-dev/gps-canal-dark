<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Baba Eletronica: player V4 Katana</title>
<link rel="icon" href="data:,">
<style>
/* Camada unica de tokens, espelhando tokens/colors.json (dark), spacing, typography, motion, borders, opacity. */
:root{
  --surface-page:#030712; --surface-sunken:#000000; --surface-raised:#1f2937;
  --text-primary:#f9fafb; --text-secondary:#9ca3af;
  --border-default:#1f2937; --border-strong:#6b7280; --focus-ring:#60a5fa;
  --action-primary:#2563eb; --action-primary-hover:#1d4ed8;
  --action-secondary:#111827; --action-secondary-hover:#374151;
  --space-1:4px; --space-2:8px; --space-3:12px;
  --radius-button:6px; --radius-card:8px; --border-width:1px; --focus-width:2px;
  --font-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
  --font-size-xs:12px; --font-size-sm:14px; --weight-medium:500;
  --duration-fast:100ms; --ease-out:cubic-bezier(0,0,.2,1);
  --opacity-disabled:.45; --target-min:44px; --chrome-h:128px; --press-offset:1px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}
.app{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding:var(--space-2)}
.stage{width:min(100%,calc((100dvh - var(--chrome-h)) * 9 / 16));aspect-ratio:9/16}
canvas{display:block;width:100%;height:100%;border-radius:var(--radius-card);background:var(--surface-sunken)}
.controls{width:100%;max-width:calc(var(--target-min) * 12);display:flex;align-items:center;gap:var(--space-2)}
.btn{min-height:var(--target-min);min-width:var(--target-min);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);
  padding:0 var(--space-3);border:var(--border-width) solid var(--border-default);border-radius:var(--radius-button);
  background:var(--action-secondary);color:var(--text-primary);font:var(--weight-medium) var(--font-size-sm)/1 var(--font-sans);cursor:pointer;
  transition:background-color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out)}
.btn svg{width:var(--font-size-sm);height:var(--font-size-sm);fill:currentColor}
.btn:hover{background:var(--action-secondary-hover)}
.btn-primary{background:var(--action-primary);border-color:var(--action-primary)}
.btn-primary:hover{background:var(--action-primary-hover)}
.btn:focus-visible,.seek:focus-visible{outline:var(--focus-width) solid var(--focus-ring);outline-offset:var(--focus-width)}
.btn:active{transform:translateY(var(--press-offset))}
.btn:disabled{opacity:var(--opacity-disabled);cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress}
.btn[aria-pressed="true"]{background:var(--surface-raised);border-color:var(--border-strong)}
.seek{flex:1;min-width:0;min-height:var(--target-min);accent-color:var(--action-primary);cursor:pointer}
.seek:disabled{opacity:var(--opacity-disabled)}
.time{font:var(--font-size-xs)/1 var(--font-mono);color:var(--text-secondary);white-space:nowrap}
.status{margin:0;font-size:var(--font-size-xs);color:var(--text-secondary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="app">
  <h1 class="sr-only">Previa do Short V4 Katana: A Baba Eletronica</h1>
  <div class="stage"><canvas id="c" width="1080" height="1920" role="img" aria-label="Animacao do Short A Baba Eletronica"></canvas></div>
  <div class="controls" role="group" aria-label="Controles do player">
    <button id="play" class="btn btn-primary" type="button" disabled aria-busy="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path id="playIcon" d="M4 2l10 6-10 6z"/></svg><span id="playLbl">Carregando</span>
    </button>
    <input id="seek" class="seek" type="range" min="0" max="40" step="0.01" value="0" aria-label="Progresso" disabled>
    <output id="time" class="time" for="seek">0,0 / 40,0</output>
    <button id="cc" class="btn" type="button" aria-pressed="false">Legendas</button>
  </div>
  <p id="status" class="status" aria-live="polite">Procurando audio/mix_final.mp3 e audio/eventos.json...</p>
</main>
<script>
(() => {
'use strict';
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const main = cv.getContext('2d');
let g = main;

/* Paleta V4 (Dopamina Visual + Visao Noturna + Katana) - Video 04 "A Baba Eletronica" */
const PAL = {
  bgNavy: '#0A0F1D',
  bgViolet: '#130926',
  bgRed: '#3B0A0A',
  bgYellow: '#261E0A',
  bgDeep: '#04060D',
  bgWarmTop: '#33251A',
  bgWarmBot: '#1E1510',
  wall: '#12182B',
  wallDark: '#090D18',
  wallWarm: '#3E2F23',
  wallWarmTrim: '#574333',
  floor: '#080B14',
  floorWarm: '#241A13',
  wood: '#2B1D16',
  woodLight: '#6B4E3B',
  woodLine: '#422D23',
  cribWarm: '#E7DFD3',
  cribShade: '#C4B6A4',
  blanketBlue: '#5BA4CF',
  blanketShade: '#3D7CA3',
  skin: '#DEB08E',
  skinShadow: '#B58462',
  babySkin: '#ECC4A6',
  hair: '#171923',
  ink: '#080A11',
  /* Cor de destaque fixa do protagonista Tiago: camiseta azul-petroleo vibrante */
  top: '#0EA5A4',
  topShade: '#0B7C7B',
  topDeep: '#064E4E',
  pants: '#1D253D',
  pantsDark: '#12182A',
  /* Visao noturna da baba eletronica */
  nvBg: '#09140D',
  nvMid: '#152A1D',
  nvBright: '#4ADE80',
  nvPale: '#BBF7D0',
  nvDim: '#1E3A28',
  nvCase: '#161C2B',
  nvBezel: '#2C3752',
  cyan: '#38D9FF',
  violet: '#8B5CF6',
  warmGlow: '#FDE68A',
  yellow: '#FFD400',
  alert: '#FF3B30',
  alertKatana: '#E11D2E',
  text: '#F5F7FB',
  white: '#FFFFFF',
  dim: '#94A3B8',
  sweat: '#9AE6FF'
};

const MONO = '"JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace';
const SANS = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const COND = '"Arial Narrow","Roboto Condensed","Liberation Sans Narrow",Impact,Arial,sans-serif';

/* Selo permanente PARTE 1 (configuravel via ?parte=, window.parteLabel ou eventos.json) */
const URL_PARTE = new URLSearchParams(location.search).get('parte');
let parteLabel = (URL_PARTE !== null ? URL_PARTE : (typeof window.parteLabel === 'string' ? window.parteLabel : 'PARTE 1')).trim();

/* Utilidades deterministicas */
const clamp = (v, a=0, b=1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const prog = (t, a, b) => clamp((t - a) / Math.max(0.001, b - a));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise = (t, seed=0) => {
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57), hash(i + 1 + seed * 57), u) * 2 - 1;
};
const hexRgb = h => {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgba = (hex, a) => {
  const [r, gr, b] = hexRgb(hex);
  return `rgba(${r},${gr},${b},${a})`;
};
function mixHex(h1, h2, k){
  k = clamp(k);
  const a = hexRgb(h1), b = hexRgb(h2);
  return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
}
function mulberry(a){
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(x, y, w, h, r){
  const rad = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rad, y);
  g.arcTo(x + w, y, x + w, y + h, rad);
  g.arcTo(x + w, y + h, x, y + h, rad);
  g.arcTo(x, y + h, x, y, rad);
  g.arcTo(x, y, x + w, y, rad);
  g.closePath();
}
function circ(x, y, r){ g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ell(x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function glow(x, y, r, col, a){
  if (a <= 0.002) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a));
  gr.addColorStop(1, rgba(col, 0));
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gr;
  g.fillRect(x - r, y - r, r * 2, r * 2);
  g.restore();
}
function vgrad(c1, c2, y0=-320, y1=H+320){
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, c1);
  gr.addColorStop(1, c2);
  g.fillStyle = gr;
  g.fillRect(-420, y0, W + 840, y1 - y0);
}
function popScale(age, dur=0.11){
  if (age <= 0) return 0.68;
  const k = clamp(age / dur);
  if (k < 0.62) return lerp(0.68, 1.10, easeOut(k / 0.62));
  return lerp(1.10, 1.0, ease((k - 0.62) / 0.38));
}

/* Helper anti-vazamento: mede sempre com a fonte real instalada (Windows/Linux/Colab) */
function drawFittedText(text, x, y, maxW, maxFs, family, weight='900', align='center'){
  let fs = maxFs;
  g.font = `${weight} ${fs}px ${family}`;
  const w = g.measureText(text).width;
  if (w > maxW && w > 0) {
    fs = Math.max(18, Math.floor(maxFs * (maxW / w)));
    g.font = `${weight} ${fs}px ${family}`;
  }
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(text, x, y);
  return fs;
}

/* ============================================================
   OTIMIZACAO V3/V4 (video-director):
   1) Depth of Field ultrarrapido em 1/8 resolucao (135x240)
   2) Vinheta pre-renderizada 1 unica vez em offscreen (vigCv)
   3) Padrao de scanlines de visao noturna pre-renderizado 1 vez
   ============================================================ */
const DOF_SCALE = 0.125;
const DOF_PAD = 4;
const dofCv = document.createElement('canvas');
dofCv.width = Math.round(W * DOF_SCALE) + DOF_PAD * 2;
dofCv.height = Math.round(H * DOF_SCALE) + DOF_PAD * 2;
const dofCtx = dofCv.getContext('2d');

const dofBlurCv = document.createElement('canvas');
dofBlurCv.width = dofCv.width;
dofBlurCv.height = dofCv.height;
const dofBlurCtx = dofBlurCv.getContext('2d');

function withBlur(px, fn){
  const m = main.getTransform();
  dofCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofCtx.globalAlpha = 1;
  dofCtx.globalCompositeOperation = 'source-over';
  dofCtx.filter = 'none';
  dofCtx.fillStyle = PAL.bgNavy;
  dofCtx.fillRect(0, 0, dofCv.width, dofCv.height);
  dofCtx.translate(DOF_PAD, DOF_PAD);
  dofCtx.scale(DOF_SCALE, DOF_SCALE);
  dofCtx.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g = dofCtx;
  fn();
  g = main;

  const r = Math.max(1.2, px * DOF_SCALE * 1.45);
  dofBlurCtx.setTransform(1, 0, 0, 1, 0, 0);
  dofBlurCtx.clearRect(0, 0, dofBlurCv.width, dofBlurCv.height);
  dofBlurCtx.filter = `blur(${r.toFixed(2)}px)`;
  dofBlurCtx.drawImage(dofCv, 0, 0);
  dofBlurCtx.filter = 'none';

  main.save();
  main.setTransform(1, 0, 0, 1, 0, 0);
  main.imageSmoothingEnabled = true;
  main.imageSmoothingQuality = 'high';
  const padOut = DOF_PAD / DOF_SCALE;
  main.drawImage(dofBlurCv, -padOut, -padOut, W + padOut * 2, H + padOut * 2);
  main.restore();
}

const vigCv = document.createElement('canvas');
vigCv.width = W; vigCv.height = H;
(() => {
  const vx = vigCv.getContext('2d');
  const gr = vx.createRadialGradient(540, 960, 260, 540, 960, 1220);
  gr.addColorStop(0, 'rgba(0,0,0,0)');
  gr.addColorStop(1, 'rgba(0,0,0,1)');
  vx.fillStyle = gr;
  vx.fillRect(0, 0, W, H);
})();

/* Scanlines pre-renderizadas para a tela da baba eletronica (zero loop pesado por quadro) */
const scanCv = document.createElement('canvas');
scanCv.width = 760; scanCv.height = 560;
(() => {
  const sx = scanCv.getContext('2d');
  sx.fillStyle = 'rgba(0,0,0,0.22)';
  for (let y = 0; y < scanCv.height; y += 6) sx.fillRect(0, y, scanCv.width, 2);
})();

/* ============================================================
   TIMELINE ORIENTADA A eventos.json + FALLBACK MODO PREVIA V4
   ============================================================ */
const EV_PREVIEW = {
  video_id: 4,
  slug: 'a-baba-eletronica',
  titulo: 'A Baba Eletronica',
  parte_label: 'PARTE 1',
  gancho: 0.0,
  acorda_sussurro: 1.9,
  baba_som: 2.6,
  sussurro: 4.2,
  sussurro_duracao: 1.2,
  olha_tela: 5.5,
  berco_vazio: 8.2,
  coracao_dispara: 9.0,
  sombra_corredor: 11.2,
  passos_corredor: 12.8,
  passos_corredor_duracao: 1.3,
  corre_quarto: 14.1,
  abre_porta: 15.8,
  acende_luz: 17.1,
  bebe_dormindo: 18.2,
  alivio: 20.9,
  olha_volta: 22.7,
  camera_vazio: 24.4,
  alguem_parado: 26.2,
  atras_porta: 27.1,
  plot_twist: 27.1,
  olha_lente: 28.4,
  impacto_twist: 28.9,
  impacto_twist_duracao: 1.4,
  luz_apaga: 30.4,
  apaga_hit: 31.3,
  cta: 32.8,
  cta_acao: 35.1,
  duracao_total: 36.8
};

let EV = { ...EV_PREVIEW };
let duration = EV.duracao_total;
let audio = null;
let captionGroups = [];
let BLINKS = [];
let EXPR_CUES = [];
let SHOTS = [];
let KATANA_HITS = [];

const MONITOR_SCENES = new Set([
  'baba_sussurro_fx',
  'baba_berco_vazio',
  'baba_berco_zoom',
  'baba_sombra',
  'baba_sombra_zoom',
  'baba_passos_fx',
  'baba_ainda_vazio',
  'baba_vulto_porta',
  'baba_olhos_lente'
]);

/* Divide cada segmento em sub-planos garantidos entre ~1.0s e 1.7s (Motor V4) */
function splitShots(a, b, specs){
  const span = Math.max(0.05, b - a);
  let count = Math.ceil(span / 1.66);
  if (count < 1) count = 1;
  while (count > 1 && (span / count) < 0.90) count--;
  const out = [];
  for (let i = 0; i < count; i++) {
    const s0 = a + (span * i) / count;
    const s1 = i === count - 1 ? b : a + (span * (i + 1)) / count;
    const sp = specs[i % specs.length];
    out.push({
      start: +s0.toFixed(3),
      end: +s1.toFixed(3),
      dur: +(s1 - s0).toFixed(3),
      ...sp
    });
  }
  return out;
}

function buildShots(e){
  const end = e.duracao_total;
  const raw = [];
  const push = arr => { for (const s of arr) raw.push(s); };

  // 1. 02:40 Tiago acorda com sussurro vindo da baba eletronica
  push(splitShots(0, e.sussurro, [
    { scene: 'quarto_tiago_acorda', mood: 'navy',   vig: 0.56, cam0: [1.00, 540, 960], cam1: [1.10, 525, 935] },
    { scene: 'baba_cabeceira',      mood: 'violet', vig: 0.60, cam0: [1.02, 540, 940], cam1: [1.14, 540, 910] },
    { scene: 'tiago_escuta',        mood: 'violet', vig: 0.62, cam0: [1.04, 540, 945], cam1: [1.15, 555, 920] }
  ]));

  // 2. Bloco SFX puro [SFX:sussurro:1.2]: macro na baba eletronica chiando em visao noturna
  push(splitShots(e.sussurro, e.olha_tela, [
    { scene: 'baba_sussurro_fx', mood: 'nv', vig: 0.66, cam0: [1.00, 540, 930], cam1: [1.14, 540, 905] }
  ]));

  // 3. Ele olha a tela -> berco do filho de 2 anos esta vazio (+ Katana Hit "VAZIO")
  push(splitShots(e.olha_tela, e.coracao_dispara, [
    { scene: 'tiago_olha_tela',  mood: 'navy', vig: 0.60, cam0: [1.00, 540, 945], cam1: [1.11, 540, 920] },
    { scene: 'baba_berco_vazio', mood: 'nv',   vig: 0.66, cam0: [1.00, 540, 925], cam1: [1.13, 540, 895] },
    { scene: 'baba_berco_zoom',  mood: 'red',  vig: 0.72, cam0: [1.08, 540, 910], cam1: [1.20, 540, 885] }
  ]));

  // 4. O coracao dispara -> na tela, uma sombra cruza o corredor escuro (+ Katana Hit "SOMBRA")
  push(splitShots(e.coracao_dispara, e.passos_corredor, [
    { scene: 'tiago_coracao',    mood: 'red', vig: 0.68, cam0: [1.04, 540, 935], cam1: [1.15, 540, 910] },
    { scene: 'baba_sombra',      mood: 'nv',  vig: 0.72, cam0: [1.00, 540, 925], cam1: [1.13, 540, 895] },
    { scene: 'baba_sombra_zoom', mood: 'red', vig: 0.74, cam0: [1.08, 540, 915], cam1: [1.19, 540, 890] }
  ]));

  // 5. Bloco SFX puro [SFX:passos_corredor:1.3]: sombra caminhando no corredor na camera
  push(splitShots(e.passos_corredor, e.corre_quarto, [
    { scene: 'baba_passos_fx', mood: 'nv', vig: 0.76, cam0: [1.02, 540, 920], cam1: [1.16, 540, 895] }
  ]));

  // 6. Ele corre ate o quarto, abre a porta com forca e acende a luz
  push(splitShots(e.corre_quarto, e.bebe_dormindo, [
    { scene: 'tiago_corre_corredor', mood: 'red',  vig: 0.70, cam0: [1.00, 510, 965], cam1: [1.12, 570, 940] },
    { scene: 'porta_abre_forca',     mood: 'warm', vig: 0.50, cam0: [1.02, 540, 955], cam1: [1.14, 540, 925] },
    { scene: 'luz_acende_quarto',    mood: 'warm', vig: 0.44, cam0: [1.00, 540, 950], cam1: [1.10, 540, 925] }
  ]));

  // 7. O filho esta dormindo tranquilo no berco (contraste quente de alivio)
  push(splitShots(e.bebe_dormindo, e.alivio, [
    { scene: 'bebe_berco_paz',   mood: 'warm', vig: 0.42, cam0: [1.00, 540, 950], cam1: [1.10, 540, 925] },
    { scene: 'bebe_berco_close', mood: 'warm', vig: 0.44, cam0: [1.06, 540, 935], cam1: [1.16, 540, 910] }
  ]));

  // 8. Tiago respira aliviado e olha de volta pra tela na sua mao
  push(splitShots(e.alivio, e.camera_vazio, [
    { scene: 'tiago_alivio',   mood: 'warm', vig: 0.46, cam0: [1.00, 540, 945], cam1: [1.09, 540, 925] },
    { scene: 'tiago_olha_mao', mood: 'navy', vig: 0.60, cam0: [1.04, 540, 940], cam1: [1.15, 540, 910] }
  ]));

  // 9. Na camera o quarto ainda aparece vazio... e alguem esta parado atras da porta, olhando pra lente
  push(splitShots(e.camera_vazio, e.impacto_twist, [
    { scene: 'baba_ainda_vazio', mood: 'nv',  vig: 0.70, cam0: [1.00, 540, 925], cam1: [1.12, 540, 900] },
    { scene: 'baba_vulto_porta', mood: 'red', vig: 0.76, cam0: [1.04, 540, 915], cam1: [1.17, 540, 890] },
    { scene: 'baba_olhos_lente', mood: 'red', vig: 0.80, cam0: [1.12, 540, 895], cam1: [1.26, 540, 870] }
  ]));

  // 10. Bloco SFX puro [SFX:impacto_twist:1.4]: modulo bigFace de Tiago em choque extremo
  push(splitShots(e.impacto_twist, e.luz_apaga, [
    { scene: 'big_face', mood: 'red', vig: 0.80, cam0: [1.04, 540, 930], cam1: [1.19, 540, 900] }
  ]));

  // 11. A luz do quarto apaga sozinha (+ Katana Hit "APAGA" -> blecaute total + olhos)
  push(splitShots(e.luz_apaga, e.cta, [
    { scene: 'quarto_blecaute', mood: 'dark', vig: 0.84, cam0: [1.00, 540, 940], cam1: [1.12, 540, 915] },
    { scene: 'blecaute_olhos',  mood: 'dark', vig: 0.88, cam0: [1.08, 540, 915], cam1: [1.22, 540, 885] }
  ]));

  // 12. CTA final (ultimos ~3.5s, selo PARTE 1 e relogio ocultos, pilula amarela blindada)
  push(splitShots(e.cta, end, [
    { scene: 'cta_engine',        mood: 'violet', vig: 0.48, cam0: [1.00, 540, 940], cam1: [1.07, 540, 925] },
    { scene: 'cta_comente',       mood: 'yellow', vig: 0.46, cam0: [1.01, 540, 940], cam1: [1.08, 540, 925] },
    { scene: 'cta_comente_pulse', mood: 'yellow', vig: 0.44, cam0: [1.04, 540, 935], cam1: [1.10, 540, 920] }
  ]));

  return raw.map((s, idx) => ({ id: idx + 1, ...s }));
}

/* ============================================================
   MOTOR V4 KATANA: TIPOGRAFIA CINETICA DE IMPACTO REUTILIZAVEL
   ============================================================ */
function buildKatanaHits(e){
  const list = [
    {
      id: 'katana_vazio',
      start: +Number(e.berco_vazio).toFixed(3),
      dur: 0.44,
      lines: ['VAZIO'],
      accentIdx: 0,
      accent: PAL.alertKatana,
      tilt: -0.044,
      punch: 0.18,
      shake: 20
    },
    {
      id: 'katana_sombra',
      start: +Number(e.sombra_corredor).toFixed(3),
      dur: 0.42,
      lines: ['SOMBRA'],
      accentIdx: 0,
      accent: PAL.alertKatana,
      tilt: 0.038,
      punch: 0.16,
      shake: 18
    },
    {
      id: 'katana_atras_da_porta',
      start: +Number(e.atras_porta).toFixed(3),
      dur: 0.50,
      lines: ['ATRÁS', 'DA PORTA'],
      accentIdx: 1,
      accent: PAL.alertKatana,
      tilt: -0.036,
      punch: 0.22,
      shake: 26
    },
    {
      id: 'katana_apaga',
      start: +Number(e.apaga_hit).toFixed(3),
      dur: 0.42,
      lines: ['APAGA'],
      accentIdx: 0,
      accent: PAL.alertKatana,
      tilt: 0.046,
      punch: 0.20,
      shake: 24
    }
  ];
  return list.map(h => ({ ...h, end: +(h.start + h.dur).toFixed(3) }));
}

function katanaStateAt(t){
  for (let i = 0; i < KATANA_HITS.length; i++) {
    const h = KATANA_HITS[i];
    if (t >= h.start && t < h.end) return { hit: h, dt: t - h.start };
  }
  return null;
}

function drawKatanaOverlay(t){
  const st = katanaStateAt(t);
  if (!st) return false;
  const { hit, dt } = st;
  const frame = Math.floor(dt * 30);
  const p = clamp(dt / hit.dur);

  /* Flashes curtos de 2 a 4 quadros (frames 0..3): branco -> preto -> vermelho -> branco -> carvao */
  let bg = '#05070E';
  let mainTextCol = '#FFFFFF';
  let accentTextCol = PAL.alert;
  let slashCol = PAL.alertKatana;
  let strokeCol = '#000000';
  let borderGlow = true;

  if (frame === 0) {
    bg = '#F8FAFC';
    mainTextCol = '#05070E';
    accentTextCol = '#05070E';
    slashCol = PAL.alertKatana;
    strokeCol = 'transparent';
    borderGlow = false;
  } else if (frame === 1) {
    bg = '#05070E';
    mainTextCol = '#FFFFFF';
    accentTextCol = PAL.yellow;
    slashCol = '#FFFFFF';
    borderGlow = false;
  } else if (frame === 2) {
    bg = PAL.alertKatana;
    mainTextCol = '#FFFFFF';
    accentTextCol = '#FFFFFF';
    slashCol = '#05070E';
    borderGlow = false;
  } else if (frame === 3) {
    bg = '#F8FAFC';
    mainTextCol = PAL.alertKatana;
    accentTextCol = '#05070E';
    slashCol = '#05070E';
    strokeCol = 'transparent';
    borderGlow = false;
  }

  /* Fundo de impacto em tela cheia */
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  if (borderGlow) {
    const gr = g.createRadialGradient(540, 960, 140, 540, 960, 1080);
    gr.addColorStop(0, 'rgba(225,29,46,0.22)');
    gr.addColorStop(0.65, 'rgba(59,10,10,0.45)');
    gr.addColorStop(1, 'rgba(5,7,14,0.96)');
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
  }

  /* Barras cinematicas superior/inferior + linhas diagonais estilo corte de lamina Katana */
  const slashProg = easeOut(clamp(dt / 0.12));
  g.save();
  g.translate(540, 960);
  g.rotate(hit.tilt * 2.2);
  const slashW = lerp(120, 1520, slashProg);
  const slashH = frame <= 3 ? 28 : lerp(18, 6, p);
  g.fillStyle = slashCol;
  g.globalAlpha = frame <= 3 ? 0.95 : 0.72;
  g.fillRect(-slashW / 2, -slashH / 2, slashW, slashH);
  /* Segundo risco fino paralelo */
  g.globalAlpha = frame <= 3 ? 0.65 : 0.35;
  g.fillRect(-slashW * 0.44, -slashH / 2 - 220, slashW * 0.88, 6);
  g.fillRect(-slashW * 0.44, slashH / 2 + 214, slashW * 0.88, 6);
  g.restore();

  /* Animacao elastica com overshoot e squash-and-stretch derivada exclusivamente de dt */
  let scaleX = 1, scaleY = 1;
  if (dt < 0.11) {
    const k = easeOut(dt / 0.11);
    scaleX = lerp(1.58, 1.00, k);
    scaleY = lerp(0.56, 1.12, k);
  } else {
    const d = dt - 0.11;
    const osc = Math.exp(-15 * d) * Math.cos(40 * d);
    scaleX = 1.0 + 0.11 * osc;
    scaleY = 1.0 - 0.08 * osc;
  }
  /* Snap rapido nos ultimos 2 quadros */
  const rem = hit.dur - dt;
  if (rem < 0.06) {
    const ek = 1 - rem / 0.06;
    scaleX *= lerp(1.0, 1.18, ek);
    scaleY *= lerp(1.0, 0.82, ek);
  }

  const jitterX = Math.sin(dt * 120) * (frame <= 3 ? 14 : 5) * Math.exp(-dt * 6);
  const jitterY = Math.cos(dt * 105) * (frame <= 3 ? 10 : 4) * Math.exp(-dt * 6);

  g.translate(540 + jitterX, 955 + jitterY);
  g.rotate(hit.tilt);
  g.scale(scaleX, scaleY);

  const lines = hit.lines;
  const maxW = 920;
  const maxFs = lines.length === 1 ? 265 : 192;
  const stepY = lines.length === 1 ? 0 : 186;
  const startY = lines.length === 1 ? 0 : -stepY * 0.5;

  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.miterLimit = 2;

  for (let i = 0; i < lines.length; i++) {
    const txt = lines[i];
    let fs = maxFs;
    g.font = `900 ${fs}px ${COND}`;
    const mw = g.measureText(txt).width;
    if (mw > maxW && mw > 0) {
      fs = Math.max(48, Math.floor(maxFs * (maxW / mw)));
      g.font = `900 ${fs}px ${COND}`;
    }
    const ly = startY + i * stepY;
    const col = (i === hit.accentIdx && frame >= 4) ? accentTextCol : (i === hit.accentIdx ? accentTextCol : mainTextCol);

    /* Sombra dura deslocada para legibilidade extrema em celular */
    if (frame >= 4) {
      g.fillStyle = 'rgba(0,0,0,0.82)';
      g.fillText(txt, 10, ly + 12);
    }
    if (strokeCol !== 'transparent') {
      g.strokeStyle = strokeCol;
      g.lineWidth = Math.max(14, Math.round(fs * 0.10));
      g.strokeText(txt, 0, ly);
    }
    g.fillStyle = col;
    g.fillText(txt, 0, ly);
  }

  g.restore();
  return true;
}

function normalizeEvents(raw, audioDur){
  const e = { ...EV_PREVIEW, ...(raw || {}) };
  const dur = Math.max(audioDur || 0, Number(e.duracao_total) || EV_PREVIEW.duracao_total);
  e.duracao_total = dur;
  if (raw) {
    for (const k of Object.keys(EV_PREVIEW)) {
      if (typeof EV_PREVIEW[k] === 'number' && raw[k] !== undefined) e[k] = Number(raw[k]);
    }
    if (URL_PARTE === null && typeof window.parteLabel !== 'string' && typeof raw.parte_label === 'string' && raw.parte_label.trim()) {
      parteLabel = raw.parte_label.trim();
    }
  }
  EV = e;
  duration = dur;
  SHOTS = buildShots(EV);
  KATANA_HITS = buildKatanaHits(EV);

  /* Troca de expressao escondida na piscada 2 frames (0.067s) antes do evento */
  EXPR_CUES = [
    [0, 'neutral'],
    [EV.acorda_sussurro, 'worry'],
    [EV.berco_vazio, 'shock'],
    [EV.coracao_dispara, 'fear'],
    [EV.alivio, 'relief'],
    [EV.camera_vazio, 'worry'],
    [EV.plot_twist, 'shock']
  ];
  const bl = [];
  let bt = 0.85, bi = 0;
  while (bt < duration + 1) { bl.push(bt); bt += 2.5 + hash(bi++ * 9.7) * 1.5; }
  for (const [ct] of EXPR_CUES) if (ct > 0.2) bl.push(Math.max(0.05, ct - 0.067));
  BLINKS = bl.sort((a, b) => a - b);
}

const exprAt = t => { let ex = 'neutral'; for (const [a, b] of EXPR_CUES) if (t >= a - 0.01) ex = b; return ex; };
function faceAt(t){
  let last = -1, prev = -1;
  for (const b of BLINKS) { if (b <= t) { prev = last; last = b; } else break; }
  const d = t - last;
  const closed = last >= 0 && d < 0.16 ? Math.sin((d / 0.16) * Math.PI) : 0;
  const ref = last < 0 ? 0 : (d < 0.08 ? (prev < 0 ? 0 : prev + 0.08) : last + 0.08);
  return { ex: exprAt(ref), closed };
}

/* ============================================================
   FUNDOS VIBRANTES PULSANTES + PARTICULAS CONTINUAS (V4)
   ============================================================ */
const PARTICLES = (() => {
  const rng = mulberry(202604);
  const arr = [];
  for (let i = 0; i < 40; i++) {
    arr.push({
      x: rng() * (W + 300) - 150,
      y: rng() * (H + 300) - 150,
      vx: (rng() - 0.45) * 26,
      vy: -(12 + rng() * 34),
      r: 2.2 + rng() * 5.2,
      layer: i < 20 ? 0 : 1,
      ph: rng() * Math.PI * 2,
      a: 0.13 + rng() * 0.26
    });
  }
  return arr;
})();

function drawParticles(t, mood){
  const colPrimary = mood === 'red' ? PAL.alert
    : (mood === 'yellow' ? PAL.yellow
      : (mood === 'nv' ? PAL.nvBright
        : (mood === 'warm' ? PAL.warmGlow : PAL.cyan)));
  const colAlt = mood === 'red' ? '#FF8A5B'
    : (mood === 'nv' ? PAL.nvPale
      : (mood === 'warm' ? '#FBBF24' : PAL.violet));
  g.save();
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < PARTICLES.length; i++) {
    const p = PARTICLES[i];
    const sp = p.layer === 1 ? 1.35 : 0.7;
    const spanW = W + 300, spanH = H + 300;
    const px = ((((p.x + p.vx * t * sp) + 150) % spanW) + spanW) % spanW - 150;
    const py = ((((p.y + p.vy * t * sp) + 150) % spanH) + spanH) % spanH - 150;
    const tw = 0.55 + 0.45 * Math.sin(t * (2.5 + p.layer * 1.3) + p.ph);
    const col = (i % 3 === 0) ? colAlt : colPrimary;
    const a = p.a * tw * (mood === 'dark' ? 0.35 : 1.0);
    g.fillStyle = rgba(col, a);
    circ(px, py, p.r);
  }
  g.restore();
}

function drawBackdrop(t, mood){
  const pulseSlow = 0.5 + 0.5 * Math.sin(t * 3.6);
  const pulseFast = 0.5 + 0.5 * Math.sin(t * 7.8);
  let top = PAL.bgNavy, bot = PAL.bgViolet, glowCol = PAL.cyan, glowA = 0.14;

  if (mood === 'nv') {
    top = mixHex('#07130C', PAL.bgNavy, pulseSlow * 0.35);
    bot = '#030806';
    glowCol = PAL.nvBright;
    glowA = 0.18;
  } else if (mood === 'warm') {
    top = PAL.bgWarmTop;
    bot = PAL.bgWarmBot;
    glowCol = PAL.warmGlow;
    glowA = 0.24;
  } else if (mood === 'violet') {
    top = mixHex(PAL.bgViolet, PAL.bgNavy, pulseSlow * 0.35);
    bot = PAL.bgNavy;
    glowCol = PAL.violet;
    glowA = 0.20;
  } else if (mood === 'yellow') {
    top = mixHex(PAL.bgNavy, PAL.bgYellow, 0.48 + 0.46 * pulseFast);
    bot = mixHex(PAL.bgViolet, PAL.bgYellow, 0.36 + 0.42 * pulseFast);
    glowCol = PAL.yellow;
    glowA = 0.24;
  } else if (mood === 'red') {
    top = mixHex(PAL.bgViolet, PAL.bgRed, 0.54 + 0.46 * pulseFast);
    bot = mixHex(PAL.bgNavy, PAL.bgRed, 0.44 + 0.46 * pulseFast);
    glowCol = PAL.alert;
    glowA = 0.28 + 0.12 * pulseFast;
  } else if (mood === 'dark') {
    top = PAL.bgDeep;
    bot = '#020307';
    glowCol = PAL.nvBright;
    glowA = 0.06;
  } else {
    top = mixHex(PAL.bgNavy, PAL.bgViolet, pulseSlow * 0.35);
    bot = PAL.bgDeep;
  }

  vgrad(top, bot);
  glow(540 + Math.sin(t * 0.8) * 70, 740, 620, glowCol, glowA);
  drawParticles(t, mood);
}

/* ============================================================
   RIG FLAT EM CAPSULA (10 PONTOS IK) - TIAGO (CAMISETA #0EA5A4)
   ============================================================ */
function drawEyes(cx, cy, r, ex, closed, lookX=0){
  const lift = { neutral: 0, relief: -0.02, worry: 0.07, fear: 0.13, shock: 0.21 }[ex] || 0;
  const tilt = { neutral: 0, relief: -0.04, worry: 0.12, fear: 0.11, shock: 0.05 }[ex] || 0;
  const eyePositions = [[cx + r * 0.06, 1], [cx + r * 0.52, -1]];
  g.lineCap = 'round';

  for (const [x, inner] of eyePositions) {
    const y = cy - r * 0.05;
    const browY = y - r * (0.28 + lift);
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.072;
    g.beginPath();
    g.moveTo(x - inner * r * 0.14, browY + (ex === 'worry' || ex === 'fear' ? r * 0.04 : 0));
    g.lineTo(x + inner * r * 0.14, browY - tilt * r);
    g.stroke();

    if (closed > 0.55) {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * 0.055;
      g.beginPath(); g.moveTo(x - r * 0.11, y); g.lineTo(x + r * 0.11, y); g.stroke();
      continue;
    }

    if (ex === 'relief') {
      g.strokeStyle = PAL.ink;
      g.lineWidth = r * 0.064;
      g.beginPath(); g.arc(x, y + r * 0.05, r * 0.11, Math.PI * 1.12, Math.PI * 1.88); g.stroke();
      continue;
    }

    const scaleY = 1 - closed * 0.9;
    g.save();
    g.translate(x, y);
    g.scale(1, scaleY);

    if (ex === 'shock' || ex === 'fear' || ex === 'worry') {
      const rx = ex === 'shock' ? r * 0.23 : ex === 'fear' ? r * 0.19 : r * 0.15;
      const ry = ex === 'shock' ? r * 0.26 : ex === 'fear' ? r * 0.21 : r * 0.17;
      g.fillStyle = PAL.white;
      ell(0, 0, rx, ry);
      const pr = ex === 'shock' ? r * 0.054 : ex === 'fear' ? r * 0.075 : r * 0.085;
      g.fillStyle = PAL.ink;
      circ(r * 0.03 + lookX * r * 0.05, 0, pr);
      g.fillStyle = PAL.white;
      circ(r * 0.05 + lookX * r * 0.05, -pr * 0.45, pr * 0.34);
    } else {
      g.fillStyle = PAL.ink;
      ell(0, 0, r * 0.095, r * 0.12);
      g.fillStyle = PAL.white;
      circ(r * 0.03 + lookX * r * 0.03, -r * 0.045, r * 0.028);
    }
    g.restore();
  }

  if (ex === 'relief') {
    g.strokeStyle = PAL.ink;
    g.lineWidth = r * 0.052;
    g.beginPath(); g.arc(cx + r * 0.30, cy + r * 0.24, r * 0.16, Math.PI * 0.14, Math.PI * 0.78); g.stroke();
  } else if (ex === 'shock') {
    g.fillStyle = rgba(PAL.ink, 0.85);
    ell(cx + r * 0.29, cy + r * 0.40, r * 0.095, r * 0.13);
    /* Gota de suor frio */
    g.fillStyle = rgba(PAL.sweat, 0.92);
    const sx = cx + r * 0.82, sy = cy - r * 0.34;
    g.beginPath();
    g.moveTo(sx, sy - r * 0.18);
    g.quadraticCurveTo(sx + r * 0.09, sy + r * 0.02, sx, sy + r * 0.08);
    g.quadraticCurveTo(sx - r * 0.09, sy + r * 0.02, sx, sy - r * 0.18);
    g.fill();
  } else if (ex === 'fear' || ex === 'worry') {
    g.strokeStyle = rgba(PAL.ink, 0.72);
    g.lineWidth = r * 0.050;
    g.beginPath();
    g.moveTo(cx + r * 0.18, cy + r * 0.36);
    g.lineTo(cx + r * 0.40, cy + r * (ex === 'fear' ? 0.33 : 0.36));
    g.stroke();
  }
}

function drawHeadTiago(cx, cy, r, ex, closed, o={}){
  const tilt = o.tilt || 0;
  g.save();
  g.translate(cx, cy);
  g.rotate(tilt);

  /* Cabeca redonda flat sem contorno preto pesado */
  g.fillStyle = PAL.skin;
  circ(0, 0, r);

  g.save();
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
  g.fillStyle = rgba(PAL.ink, 0.14);
  circ(-r * 1.08, r * 0.16, r * 0.96);
  g.restore();

  /* Cabelo curto masculino limpo sem costura (zero efeito capacete) */
  g.fillStyle = PAL.hair;
  g.beginPath();
  g.arc(-r * 0.06, -r * 0.08, r * 1.03, Math.PI * 0.82, -Math.PI * 0.16, false);
  g.quadraticCurveTo(r * 0.52, -r * 0.52, -r * 0.10, -r * 0.58);
  g.quadraticCurveTo(-r * 0.56, -r * 0.50, -r * 0.68, -r * 0.08);
  g.quadraticCurveTo(-r * 0.76, r * 0.22, -r * 0.84, r * 0.46);
  g.closePath();
  g.fill();

  /* Topete curto natural */
  g.beginPath();
  g.ellipse(r * 0.22, -r * 0.82, r * 0.36, r * 0.18, -0.22, 0, Math.PI * 2);
  g.fill();

  /* Orelha flat limpa */
  g.fillStyle = PAL.skin;
  circ(-r * 0.66, r * 0.12, r * 0.18);
  g.fillStyle = rgba(PAL.skinShadow, 0.6);
  circ(-r * 0.67, r * 0.13, r * 0.08);

  if (o.rimA > 0) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';
    g.strokeStyle = rgba(o.rimColor || PAL.nvBright, o.rimA);
    g.lineWidth = r * 0.078;
    g.beginPath();
    g.arc(0, 0, r * 0.97, (o.rimAng || 0) - 0.85, (o.rimAng || 0) + 0.85);
    g.stroke();
    g.restore();
  }

  drawEyes(0, 0, r, ex, closed, o.lookX || 0);
  g.restore();
}

function ik(sx, sy, hx, hy, l1, l2, flip=1){
  const dx = hx - sx, dy = hy - sy;
  const d = Math.min(Math.hypot(dx, dy), l1 + l2 - 0.01);
  const a = Math.atan2(dy, dx);
  const c = clamp((l1*l1 + d*d - l2*l2) / (2*l1*d), -1, 1);
  const an = a + flip * Math.acos(c);
  return [sx + Math.cos(an) * l1, sy + Math.sin(an) * l1];
}
function drawLimb(s, h, l1, l2, w, col, handCol, flip=1){
  const e = ik(s[0], s[1], h[0], h[1], l1, l2, flip);
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(s[0], s[1]); g.lineTo(e[0], e[1]); g.lineTo(h[0], h[1]); g.stroke();
  if (handCol) { g.fillStyle = handCol; circ(h[0], h[1], w * 0.52); }
  return e;
}
const mix = (a, b, k) => { if (k) { a[0] = lerp(a[0], b[0], k); a[1] = lerp(a[1], b[1], k); } };

/* Tiago corpo inteiro (rig 10 pontos IK com pes travados no chao gy) */
function drawTiagoStanding(x, gy, s, o){
  const t = o.t, P = o.pose || {};
  const run = P.run || 0;
  const br = Math.sin(t * 2 * Math.PI / (o.fastBreath ? 1.35 : 3.0));
  const step = Math.sin(t * 11.2) * run;

  g.save();
  g.translate(x, gy);
  g.scale(s * (o.face || 1), s);

  /* Sombra de contato firme no plano do chao (y = 0) */
  g.fillStyle = 'rgba(0,0,0,.55)';
  ell(4, 0, 118, 15);

  const hipY = -226 - Math.abs(step) * 10;
  const shY = -438 - br * 5;
  const hx = 6, hy = shY - 102 - br * 2;

  const footF = [-24 - step * 52, -14];
  const footN = [24 + step * 52, -14];
  drawLimb([-16, hipY + 8], footF, 110, 108, 35, PAL.pantsDark, null, -1);
  drawLimb([16, hipY + 8], footN, 110, 108, 37, PAL.pants, null, -1);

  for (const [fx, fy, dark] of [[footF[0] + 10, -11, true], [footN[0] + 10, -11, false]]) {
    g.fillStyle = dark ? '#161B2B' : '#252E47';
    ell(fx, fy, 42, 12);
  }

  const SN = [-8, shY + 46], SF = [24, shY + 44];
  const hn = [-4, hipY + 26], hf = [38, hipY + 24];
  mix(hn, [94, shY + 132], P.monitor); mix(hf, [68, shY + 142], P.monitor);
  mix(hn, [152, shY + 52], P.push);    mix(hf, [126, shY + 95], P.push);
  mix(hn, [72 + step * 44, hipY - 14], run); mix(hf, [-34 - step * 44, hipY - 14], run);
  const handMinY = hy + 96;
  hn[1] = Math.max(hn[1], handMinY);
  hf[1] = Math.max(hf[1], handMinY);

  drawLimb(SF, hf, 114, 110, 34, PAL.topShade, PAL.skinShadow, 1);

  /* Tronco em capsula flat limpo (camiseta azul-petroleo fixa) */
  g.fillStyle = PAL.top;
  rr(-68, shY - 10, 136, (hipY - shY) + 34, 62); g.fill();
  g.save();
  rr(-68, shY - 10, 136, (hipY - shY) + 34, 62); g.clip();
  g.fillStyle = rgba(PAL.topDeep, 0.36);
  g.fillRect(-76, shY - 18, 44, 290);
  g.restore();

  g.fillStyle = PAL.skinShadow;
  rr(-11, shY - 36, 32, 36, 12); g.fill();

  drawHeadTiago(hx, hy, 78, o.ex, o.closed, {
    tilt: (o.tilt || 0) + br * 0.015,
    rimA: o.rimA ?? 0.72,
    rimColor: o.rimColor || PAL.nvBright,
    rimAng: o.rimAng ?? 0.1,
    lookX: o.lookX || 0
  });

  drawLimb(SN, hn, 114, 110, 34, PAL.top, PAL.skin, 1);

  /* Monitor portatil da baba eletronica na mao de Tiago */
  if (P.monitor > 0.5) {
    g.fillStyle = PAL.nvCase; rr(hn[0] - 24, hn[1] - 32, 62, 46, 10); g.fill();
    g.fillStyle = PAL.nvMid; rr(hn[0] - 18, hn[1] - 26, 50, 34, 5); g.fill();
    g.fillStyle = rgba(PAL.nvBright, 0.82); rr(hn[0] - 15, hn[1] - 23, 44, 28, 4); g.fill();
    glow(hn[0] + 8, hn[1] - 8, 220, PAL.nvBright, 0.32);
  }
  g.restore();
}

/* Tiago na cama acordando de madrugada */
function drawTiagoBed(x, y, s, o){
  const t = o.t;
  const br = Math.sin(t * 2 * Math.PI / (o.fastBreath ? 1.35 : 3.0));
  g.save();
  g.translate(x, y);
  g.scale(s, s);

  /* Cabeceira e travesseiro */
  g.fillStyle = PAL.wood; rr(-255, -320, 440, 380, 28); g.fill();
  g.fillStyle = '#2B3659'; rr(-195, -210, 220, 155, 42); g.fill();

  const shY = -175 - br * 5;
  const hx = 10, hy = shY - 98;
  const SN = [-18, shY + 46], SF = [28, shY + 44];
  const hold = o.holdMonitor ? 1 : 0;
  const hn = [lerp(52, 134, hold), lerp(shY + 135, shY + 104, hold)];
  const hf = [lerp(90, 158, hold), lerp(shY + 138, shY + 108, hold)];

  drawLimb(SF, hf, 106, 100, 33, PAL.topShade, PAL.skinShadow, 1);

  /* Tronco em capsula */
  g.fillStyle = PAL.top;
  rr(-68, shY - 10, 136, 225, 62); g.fill();
  g.save();
  rr(-68, shY - 10, 136, 225, 62); g.clip();
  g.fillStyle = rgba(PAL.topDeep, 0.36);
  g.fillRect(-76, shY - 14, 44, 240);
  g.restore();

  g.fillStyle = PAL.skinShadow;
  rr(-10, shY - 34, 32, 34, 12); g.fill();

  drawHeadTiago(hx, hy, 80, o.ex, o.closed, {
    tilt: (o.tilt || 0) + br * 0.015,
    rimA: o.rimA ?? 0.85,
    rimColor: o.rimColor || PAL.nvBright,
    rimAng: 0.14,
    lookX: o.lookX || 0.15
  });

  drawLimb(SN, hn, 106, 100, 33, PAL.top, PAL.skin, 1);

  if (hold) {
    g.fillStyle = PAL.nvCase; rr(hn[0] - 10, hn[1] - 42, 74, 54, 12); g.fill();
    g.fillStyle = PAL.nvMid; rr(hn[0] - 2, hn[1] - 34, 58, 38, 6); g.fill();
    g.fillStyle = rgba(PAL.nvBright, 0.85); rr(hn[0] + 2, hn[1] - 30, 50, 30, 4); g.fill();
    glow(hn[0] + 25, hn[1] - 14, 280, PAL.nvBright, 0.42);
  }

  /* Lencol por cima das pernas */
  g.fillStyle = '#1E2744'; rr(-290, 15, 660, 260, 44); g.fill();
  g.fillStyle = '#2B3860'; rr(-290, 15, 660, 56, 28); g.fill();
  g.restore();
}

/* ============================================================

/* Quarto REAL do bebe (iluminado quente de alivio OU em blecaute total) */
function drawRealNursery(t, o={}){
  const dark = !!o.dark;
  g.fillStyle = dark ? '#04060C' : PAL.wallWarm;
  g.fillRect(-200, -100, W + 400, 1460);
  g.fillStyle = dark ? '#020308' : PAL.floorWarm;
  g.fillRect(-200, 1340, W + 400, 780);

  if (!dark) {
    /* Faixa decorativa infantil calma + lustre quente aceso no teto */
    g.fillStyle = rgba(PAL.wallWarmTrim, 0.55);
    g.fillRect(-200, 1140, W + 400, 200);
    g.fillStyle = '#4B3A2C';
    g.fillRect(-200, 1136, W + 400, 12);

    /* Lustre pendente deslocado para longe do relogio central */
    g.strokeStyle = '#6B5544'; g.lineWidth = 6;
    g.beginPath(); g.moveTo(815, 0); g.lineTo(815, 340); g.stroke();
    g.fillStyle = '#FEF3C7';
    g.beginPath(); g.arc(815, 380, 60, Math.PI, 0, false); g.closePath(); g.fill();
    glow(720, 420, 760, PAL.warmGlow, 0.36);

    /* Porta aberta a esquerda */
    g.fillStyle = '#2B1F17'; g.fillRect(42, 460, 210, 880);
    g.fillStyle = '#533B2A'; rr(48, 468, 175, 872, 6); g.fill();
    g.fillStyle = '#D4AF37'; circ(194, 920, 11);
  } else {
    /* Blecaute total: contorno quase invisivel da porta atras */
    g.fillStyle = '#080B14'; g.fillRect(42, 460, 220, 880);
  }

  /* Berco real a direita/centro com o bebe dormindo tranquilo */
  const bx = o.cribX ?? 540, by = o.cribY ?? 1090, bs = o.cribScale ?? 1.0;
  g.save();
  g.translate(bx, by);
  g.scale(bs, bs);

  /* Sombra do berco */
  g.fillStyle = 'rgba(0,0,0,0.42)';
  ell(0, 250, 270, 26);

  /* Fundo e cabeceiras do berco */
  const cMain = dark ? '#111622' : PAL.cribWarm;
  const cShade = dark ? '#090D16' : PAL.cribShade;
  g.fillStyle = cShade;
  rr(-240, -140, 480, 340, 24); g.fill();

  /* Colchao + bebe dormindo tranquilo */
  g.fillStyle = dark ? '#0D1320' : '#F8FAFC';
  rr(-215, 25, 430, 120, 18); g.fill();

  if (o.showBaby !== false && !dark) {
    const breath = Math.sin(t * 2.1) * 5;
    /* Travesseirinho */
    g.fillStyle = '#FFFFFF'; rr(-195, 18, 110, 64, 24); g.fill();
    /* Cabecinha calma do bebe de 2 anos dormindo */
    g.fillStyle = PAL.babySkin;
    circ(-125, 36, 46);
    /* Cabelinho ralo macio */
    g.fillStyle = '#2D241F';
    g.beginPath(); g.arc(-132, 26, 44, Math.PI * 0.9, Math.PI * 1.85); g.fill();
    /* Olhos fechados serenos */
    g.strokeStyle = PAL.ink; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.arc(-112, 38, 9, Math.PI * 0.12, Math.PI * 0.88); g.stroke();
    g.beginPath(); g.arc(-94, 38, 8, Math.PI * 0.12, Math.PI * 0.88); g.stroke();
    /* Sorrisinho calmo */
    g.beginPath(); g.arc(-104, 54, 7, Math.PI * 0.15, Math.PI * 0.82); g.stroke();

    /* Cobertor azul claro subindo e descendo com a respiracao */
    g.fillStyle = PAL.blanketBlue;
    rr(-88, 14 - breath, 270, 122 + breath, 36); g.fill();
    g.fillStyle = PAL.blanketShade;
    rr(-88, 76, 270, 60, 24); g.fill();

    /* Ursinho de pelucia encostado no canto do berco */
    g.fillStyle = '#9C6B43';
    circ(160, 12, 26);
    circ(142, -10, 10); circ(178, -10, 10);
    ell(160, 46, 28, 30);
  }

  /* Grades frontais do berco */
  g.fillStyle = cMain;
  rr(-246, -152, 28, 405, 12); g.fill();
  rr(218, -152, 28, 405, 12); g.fill();
  rr(-246, -106, 492, 24, 10); g.fill();
  rr(-246, 152, 492, 28, 10); g.fill();
  for (let gx = -185; gx <= 185; gx += 46) {
    rr(gx - 7, -92, 14, 250, 6); g.fill();
  }

  /* Mobile infantil acima do berco */
  if (!dark) {
    const sw = Math.sin(t * 1.4) * 14;
    g.strokeStyle = PAL.cribShade; g.lineWidth = 6;
    g.beginPath(); g.moveTo(228, -150); g.quadraticCurveTo(220, -320, 40, -305); g.stroke();
    g.strokeStyle = '#94A3B8'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(40, -305); g.lineTo(40 + sw, -245); g.stroke();
    g.fillStyle = '#FBBF24'; circ(40 + sw, -236, 15);
    g.fillStyle = '#60A5FA'; circ(40 + sw - 38, -225, 12);
    g.fillStyle = '#F472B6'; circ(40 + sw + 38, -225, 12);
  }
  g.restore();
}

/* ============================================================
   TELA REALISTA DE BABA ELETRONICA (VISAO NOTURNA VERDE/CINZA)
   ============================================================ */
function drawBabyMonitor(t, mode, localP){
  const mw = 880, mh = 760;
  const mx = 540 - mw / 2, my = 505;

  g.save();
  /* Antena fisica dobravel no canto superior direito */
  g.fillStyle = '#1D2538';
  rr(mx + mw - 86, my - 190, 32, 210, 16); g.fill();
  g.fillStyle = '#334155';
  circ(mx + mw - 70, my - 186, 18);

  /* Corpo arredondado do aparelho portatil */
  g.fillStyle = 'rgba(0,0,0,0.62)';
  rr(mx + 14, my + 24, mw, mh, 56); g.fill();
  g.fillStyle = PAL.nvCase;
  rr(mx, my, mw, mh, 56); g.fill();
  g.strokeStyle = PAL.nvBezel; g.lineWidth = 6;
  rr(mx, my, mw, mh, 56); g.stroke();

  /* LEDs de status e marca no topo do chassi */
  const ledPulse = 0.55 + 0.45 * Math.sin(t * 7);
  const dangerLed = (mode === 'vulto_porta' || mode === 'olhos_lente' || mode === 'berco_vazio');
  g.fillStyle = dangerLed ? PAL.alert : PAL.nvBright;
  circ(mx + 74, my + 48, 10);
  glow(mx + 74, my + 48, 42, dangerLed ? PAL.alert : PAL.nvBright, 0.55 * ledPulse);

  /* Barra de nivel de som (LEDs piscando no sussurro/passos) */
  const audioHot = (mode === 'sussurro' || mode === 'passos' || mode === 'vulto_porta');
  for (let i = 0; i < 5; i++) {
    const active = audioHot ? (i < Math.floor(2 + 3.5 * Math.abs(Math.sin(t * 14 + i)))) : (i === 0);
    g.fillStyle = active ? (i >= 3 ? PAL.alert : PAL.nvBright) : '#263147';
    rr(mx + 116 + i * 24, my + 40, 16, 16, 4); g.fill();
  }
  g.fillStyle = PAL.dim;
  drawFittedText('BABÁ CAM HD', mx + mw - 72, my + 48, 220, 22, MONO, '700', 'right');

  /* Area da tela de visao noturna */
  const sx = mx + 52, sy = my + 86, sw = mw - 104, sh = 550;
  g.save();
  rr(sx, sy, sw, sh, 22); g.clip();

  /* Fundo verde/cinza infravermelho */
  const ng = g.createRadialGradient(sx + sw * 0.5, sy + sh * 0.48, 40, sx + sw * 0.5, sy + sh * 0.5, sw * 0.72);
  ng.addColorStop(0, '#223A2B');
  ng.addColorStop(0.55, '#112117');
  ng.addColorStop(1, '#050C08');
  g.fillStyle = ng;
  g.fillRect(sx, sy, sw, sh);

  /* Conteudo interno da camera conforme o momento da historia */
  if (mode === 'sussurro' || mode === 'berco_vazio' || mode === 'ainda_vazio' || mode === 'vulto_porta' || mode === 'olhos_lente') {
    const isClose = (mode === 'olhos_lente');
    const zoomIn = isClose ? lerp(1.28, 1.55, ease(localP)) : (mode === 'vulto_porta' ? lerp(1.06, 1.20, ease(localP)) : 1.0);

    g.save();
    g.translate(sx + sw * (isClose ? 0.28 : 0.5), sy + sh * (isClose ? 0.52 : 0.5));
    g.scale(zoomIn, zoomIn);
    g.translate(-(sx + sw * 0.5), -(sy + sh * 0.5));

    /* Parede e piso em visao noturna */
    g.fillStyle = '#0D1B12'; g.fillRect(sx, sy + sh - 120, sw, 140);
    g.strokeStyle = '#254231'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(sx, sy + sh - 120); g.lineTo(sx + sw, sy + sh - 120); g.stroke();

    /* Porta do quarto a esquerda na camera */
    const dx = sx + 56, dy = sy + 95, dw = 178, dh = 338;
    g.fillStyle = '#040906'; g.fillRect(dx, dy, dw, dh);
    g.strokeStyle = '#2D4F3B'; g.lineWidth = 4; g.strokeRect(dx, dy, dw, dh);
    /* Folha da porta entreaberta */
    g.fillStyle = '#193022';
    g.beginPath();
    g.moveTo(dx, dy); g.lineTo(dx + 74, dy + 22); g.lineTo(dx + 74, dy + dh - 14); g.lineTo(dx, dy + dh);
    g.closePath(); g.fill();

    /* Berco do bebe a direita: SEMPRE VAZIO na visao noturna! */
    const cx = sx + 475, cy = sy + 325;
    g.fillStyle = '#162B1E'; rr(cx - 175, cy - 88, 350, 200, 12); g.fill();
    /* Lencol amassado vazio (sem bebe!) */
    g.fillStyle = '#2A4A36';
    g.beginPath();
    g.moveTo(cx - 155, cy + 52);
    g.quadraticCurveTo(cx - 60, cy + 16, cx + 22, cy + 44);
    g.quadraticCurveTo(cx + 105, cy + 68, cx + 155, cy + 32);
    g.lineTo(cx + 155, cy + 95); g.lineTo(cx - 155, cy + 95); g.closePath(); g.fill();
    /* Grades claras em infravermelho */
    g.fillStyle = '#4B7A5D';
    rr(cx - 180, cy - 95, 16, 225, 6); g.fill();
    rr(cx + 164, cy - 95, 16, 225, 6); g.fill();
    rr(cx - 180, cy - 72, 360, 14, 5); g.fill();
    rr(cx - 180, cy + 90, 360, 16, 5); g.fill();
    for (let bar = -140; bar <= 140; bar += 35) {
      g.fillRect(cx + bar - 4, cy - 62, 8, 155);
    }

    /* Mobile balancando sozinho no quarto vazio */
    const mb = Math.sin(t * 2.2) * 12;
    g.strokeStyle = '#3C664C'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(cx + 160, cy - 95); g.quadraticCurveTo(cx + 145, cy - 205, cx + 15, cy - 195); g.stroke();
    g.beginPath(); g.moveTo(cx + 15, cy - 195); g.lineTo(cx + 15 + mb, cy - 148); g.stroke();
    g.fillStyle = '#6EE7B7'; circ(cx + 15 + mb, cy - 142, 8);

    /* Etiqueta de alerta no berco vazio nos momentos de descoberta */
    if (mode === 'berco_vazio' || mode === 'ainda_vazio') {
      const blink = Math.sin(t * 12) > -0.2;
      if (blink) {
        g.strokeStyle = rgba(PAL.alert, 0.85); g.lineWidth = 4;
        g.setLineDash([16, 10]);
        g.strokeRect(cx - 195, cy - 108, 390, 232);
        g.setLineDash([]);
      }
    }

    /* CLIMAX: ALGUEM PARADO ATRAS DA PORTA OLHANDO DIRETO PRA LENTE! */
    if (mode === 'vulto_porta' || mode === 'olhos_lente') {
      const vx = dx + 124, vy = dy + 122;
      /* Silhueta escura alta atras da folha da porta */
      g.fillStyle = '#020503';
      ell(vx, vy + 150, 56, 128);
      circ(vx, vy, 44);
      /* Mao longa agarrando a borda da porta */
      g.fillStyle = '#0A160F';
      for (let f = 0; f < 4; f++) rr(dx + 64, dy + 178 + f * 15, 22, 10, 5);
      g.fill();
      /* Dois olhos refletindo infravermelho direto na lente */
      const eyeGlow = mode === 'olhos_lente' ? 1.0 : lerp(0.5, 1.0, easeOut(localP));
      glow(vx - 15, vy - 4, 38, PAL.nvPale, 0.72 * eyeGlow);
      glow(vx + 15, vy - 4, 38, PAL.nvPale, 0.72 * eyeGlow);
      g.fillStyle = '#ECFDF5';
      ell(vx - 15, vy - 4, 10, 6);
      ell(vx + 15, vy - 4, 10, 6);
      g.fillStyle = '#040906';
      circ(vx - 15, vy - 4, 3);
      circ(vx + 15, vy - 4, 3);
    }

    g.restore();
  } else if (mode === 'sombra' || mode === 'passos') {
    /* Corredor escuro captado pela camera com sombra alta cruzando */
    g.fillStyle = '#07110B'; g.fillRect(sx, sy, sw, sh);
    /* Perspectiva do corredor */
    g.strokeStyle = '#254431'; g.lineWidth = 4;
    g.beginPath();
    g.moveTo(sx, sy); g.lineTo(sx + 210, sy + 130); g.lineTo(sx + 210, sy + 420); g.lineTo(sx, sy + sh);
    g.moveTo(sx + sw, sy); g.lineTo(sx + sw - 210, sy + 130); g.lineTo(sx + sw - 210, sy + 420); g.lineTo(sx + sw, sy + sh);
    g.stroke();
    g.fillStyle = '#122419';
    g.beginPath(); g.moveTo(sx, sy + sh); g.lineTo(sx + 210, sy + 420); g.lineTo(sx + sw - 210, sy + 420); g.lineTo(sx + sw, sy + sh); g.closePath(); g.fill();

    /* Sombra humana caminhando da esquerda para a direita */
    const shadowX = mode === 'sombra'
      ? lerp(sx + 160, sx + 470, ease(localP))
      : lerp(sx + 380, sx + 640, ease(localP));
    const stride = Math.sin(t * 7.8) * 30;
    const bob = Math.abs(Math.sin(t * 7.8)) * 9;
    g.fillStyle = '#020604';
    ell(shadowX, sy + 432, 76, 14);
    /* Pernas caminhando em passo firme */
    g.strokeStyle = '#020604'; g.lineWidth = 28; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(shadowX - 16, sy + 318 - bob); g.lineTo(shadowX - 18 - stride, sy + 424);
    g.moveTo(shadowX + 16, sy + 318 - bob); g.lineTo(shadowX + 18 + stride, sy + 424);
    g.stroke();
    /* Tronco e cabeca da silhueta */
    rr(shadowX - 54, sy + 188 - bob, 108, 152, 44); g.fill();
    circ(shadowX + 4, sy + 140 - bob, 44);
    /* Contorno infravermelho sutil nas costas da sombra */
    g.strokeStyle = rgba(PAL.nvBright, 0.28); g.lineWidth = 4;
    g.beginPath(); g.arc(shadowX + 4, sy + 140 - bob, 45, -0.7, 0.7); g.stroke();
  }

  /* Ondas de audio posicionadas com folga limpa acima do rodape HUD */
  if (mode === 'sussurro') {
    const wx = sx + 178, wy = sy + sh - 178, ww = sw - 356, wh = 76;
    g.fillStyle = rgba('#040A06', 0.78);
    rr(wx, wy, ww, wh, 16); g.fill();
    g.strokeStyle = rgba(PAL.nvBright, 0.65); g.lineWidth = 3;
    rr(wx, wy, ww, wh, 16); g.stroke();
    const bars = 19;
    for (let i = 0; i < bars; i++) {
      const h = 10 + 44 * Math.abs(Math.sin(t * 16 + i * 0.75)) * (0.4 + 0.6 * hash(Math.floor(t * 15) * 31 + i));
      g.fillStyle = h > 39 ? PAL.alert : PAL.nvBright;
      rr(wx + 24 + i * 19.5, wy + wh / 2 - h / 2, 10, h, 4); g.fill();
    }
  }

  /* Chuvisco / estatica deterministica leve (apenas 26 micropontos + faixa de glitch) */
  const fr = Math.floor(t * 30);
  g.fillStyle = rgba(PAL.nvPale, 0.16);
  for (let i = 0; i < 26; i++) {
    const nx = sx + hash(fr * 19 + i * 7.3) * sw;
    const ny = sy + hash(fr * 23 + i * 11.7) * sh;
    g.fillRect(nx, ny, 4 + hash(i) * 14, 3);
  }
  if (mode === 'sussurro' || mode === 'passos' || mode === 'vulto_porta' || mode === 'olhos_lente') {
    if (hash(fr * 3.7) > 0.62) {
      const gy = sy + hash(fr * 13.1) * (sh - 34);
      g.fillStyle = rgba(PAL.nvPale, 0.20);
      g.fillRect(sx, gy, sw, 8 + hash(fr * 5.9) * 18);
    }
  }

  /* Scanlines pre-renderizadas */
  g.drawImage(scanCv, sx, sy, sw, sh);

  /* HUD autentico de visao noturna dentro do visor (UNICO relogio 02:40 neste quadro!) */
  g.strokeStyle = rgba(PAL.nvPale, 0.58); g.lineWidth = 4;
  const brk = 28;
  for (const [cx, cy, dx, dy] of [
    [sx + 20, sy + 20, 1, 1],
    [sx + sw - 20, sy + 20, -1, 1],
    [sx + 20, sy + sh - 20, 1, -1],
    [sx + sw - 20, sy + sh - 20, -1, -1]
  ]) {
    g.beginPath();

  /* Ponto REC piscando + CAM 01 + horario 02:40 */
  if (Math.floor(t * 2.2) % 2 === 0) {

  drawFittedText(statusTag, sx + sw - 34, sy + sh - 36, 230, 24, MONO, '800', 'right');

  g.restore();

  /* Borda interna da tela + grade do alto-falante + botoes na base do aparelho */
  g.strokeStyle = '#090D16'; g.lineWidth = 5; rr(sx, sy, sw, sh, 22); g.stroke();
  g.fillStyle = '#0D121F';
  for (let i = 0; i < 7; i++) circ(mx + 120 + i * 24, my + mh - 58, 6);
  g.fillStyle = '#25304A';
  circ(mx + mw / 2, my + mh - 58, 28);

  g.fillStyle = '#25304A';
  rr(mx + mw - 230, my + mh - 74, 62, 32, 16); g.fill();
  rr(mx + mw - 146, my + mh - 74, 62, 32, 16); g.fill();
  g.restore();
}

/* ============================================================
   CAMERA VIVA V4 + PUNCH-IN KATANA + SCREEN SHAKE AMORTECIDO
   ============================================================ */
function pickShot(t){
  for (let i = 0; i < SHOTS.length; i++) {
    const s = SHOTS[i];
    if (t < s.end || i === SHOTS.length - 1) return s;
  }
  return SHOTS[0];
}

function cameraFor(shot, t){
  const k = ease(prog(t, shot.start, shot.end));
  let z = lerp(shot.cam0[0], shot.cam1[0], k);
  const cx = lerp(shot.cam0[1], shot.cam1[1], k);
  const cy = lerp(shot.cam0[2], shot.cam1[2], k);

  const handAmp = shot.scene.startsWith('cta_') ? 2.0 : 4.5;
  let sx = noise(t * 2.1, 11) * handAmp;
  let sy = noise(t * 1.9, 29) * handAmp;

  /* Punch-in de camera e shake seco disparados pelos hits Katana */
  for (let i = 0; i < KATANA_HITS.length; i++) {
    const kh = KATANA_HITS[i];
    if (t >= kh.start && t < kh.end + 0.40) {
      const dt = t - kh.start;
      z += kh.punch * Math.exp(-dt * 7.2);
      const env = Math.exp(-dt * 10.5);
      sx += Math.sin(dt * 108) * kh.shake * env;
      sy += Math.cos(dt * 94) * kh.shake * 0.72 * env;
    }
  }

  const impacts = [
    [EV.baba_som, 10, 8.0],
    [EV.abre_porta, 20, 6.5],
    [EV.impacto_twist, 26, 5.2],
    [EV.cta_acao, 8, 9.5]
  ];
  for (const [ti, amp, dec] of impacts) {
    if (t >= ti && t < ti + 0.90) {
      const dt = t - ti;
      const env = Math.exp(-dt * dec);
      sx += Math.sin(dt * 95) * amp * env;
      sy += Math.cos(dt * 83) * amp * 0.72 * env;
    }
  }
  return { z, cx, cy, sx, sy };
}

function finish(vig){
  g.save();
  g.globalAlpha = clamp(vig, 0, 1);
  g.drawImage(vigCv, 0, 0);
  g.restore();
}

function normWord(w){
  return w.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/gi, '').toLowerCase();

  const lines = [
    [e.gancho, e.acorda_sussurro - 0.15, 'Duas e quarenta da manhã.'],
    [e.acorda_sussurro - 0.1, e.sussurro - 0.12, 'O Tiago acorda com um sussurro vindo da babá eletrônica.'],
    [e.olha_tela, e.berco_vazio - 1.4, 'Ele olha a tela.'],
    [e.berco_vazio - 1.3, e.coracao_dispara - 0.16, 'O berço do filho de dois anos está vazio.'],
    [e.coracao_dispara, e.sombra_corredor - 0.5, 'O coração dispara.'],
    [e.sombra_corredor - 0.45, e.passos_corredor - 0.08, 'Na tela, uma sombra cruza o corredor escuro.'],
    [e.corre_quarto, e.bebe_dormindo - 0.16, 'Ele corre até o quarto do bebê, abre a porta com força e acende a luz.'],
    [e.bebe_dormindo, e.alivio - 0.22, 'O filho está dormindo tranquilo no berço.'],
    [e.alivio, e.camera_vazio - 0.34, 'Tiago respira aliviado e olha de volta pra tela na sua mão.'],
    [e.camera_vazio, e.impacto_twist - 0.08, 'Na câmera, o quarto ainda aparece vazio... e alguém está parado atrás da porta, olhando direto pra lente.'],
    [e.luz_apaga, e.cta - 0.40, 'A luz do quarto apaga sozinha.'],
    [e.cta, e.cta_acao - 0.16, 'Quer aprender a fazer vídeos assim no automático?'],
    [e.cta_acao, e.duracao_total - 0.45, 'Comente EU QUERO.']
  ];
  const groups = [];
  for (const [t0, t1, txt] of lines) {
    const words = txt.split(' ');
    const span = Math.max(0.25, t1 - t0);
    const weights = words.map(w => Math.max(2, w.length) + 1.2);
    const sum = weights.reduce((a, b) => a + b, 0);
    let cur = t0;
    const timed = words.map((w, i) => {
      const d = span * (weights[i] / sum);
      const item = { palavra: w, inicio: cur, fim: cur + d, duracao: d };
      cur += d;
      return item;
    });
    const clauses = [];
    let cl = [];
    timed.forEach((p, idx) => {
      cl.push(p);
      const rem = timed.length - idx - 1;
      if (/[:,]$/.test(p.palavra) && cl.length >= 2 && rem >= 2) { clauses.push(cl); cl = []; }
    });
    if (cl.length) clauses.push(cl);
    for (const c of clauses) {
      let i = 0;
      while (i < c.length) {
        const rem = c.length - i;
        const sz = rem <= 3 ? rem : (rem === 4 ? 2 : 3);
        const sl = c.slice(i, i + sz);
        groups.push({ inicio: sl[0].inicio, fim: sl[sl.length - 1].fim, palavras: sl });
        i += sz;
      }
    }
  }
  captionGroups = groups;
}

function drawCaptions(t){
  /* Durante um Katana Hit em tela cheia, a palavra gigante ja protagoniza a tela */
  if (katanaStateAt(t) !== null) return;

  let grp = null;
  for (const c of captionGroups) {
    if (t >= c.inicio - 0.04 && t <= c.fim + 0.14) { grp = c; break; }
  }
  if (!grp || !grp.palavras || !grp.palavras.length) return;

  const words = grp.palavras.map(p => ({
    txt: String(p.palavra || '').toUpperCase(),
    key: normWord(String(p.palavra || '')),
    inicio: Number(p.inicio),
    fim: Number(p.fim ?? (Number(p.inicio) + Number(p.duracao || 0.25)))
  }));
  let active = 0;
  for (let i = 0; i < words.length; i++) if (t >= words[i].inicio - 0.02) active = i;

  const grpPop = popScale(t - grp.inicio + 0.02, 0.11);

  g.save();
  let fs = 78;
  g.font = `900 ${fs}px ${COND}`;
  g.textBaseline = 'middle';
  g.textAlign = 'center';
  let sp = Math.max(30, Math.round(fs * 0.44));
  let wds = words.map(w => g.measureText(w.txt).width);
  let tw = wds.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  if (tw > 900) {
    fs = Math.floor(fs * 900 / tw);
    g.font = `900 ${fs}px ${COND}`;
    sp = Math.max(22, Math.round(fs * 0.44));
    wds = words.map(w => g.measureText(w.txt).width);
    tw = wds.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  }

  const y = 1495;
  g.translate(540, y);
  g.scale(grpPop, grpPop);
  g.translate(-540, -y);

  let x = 540 - tw / 2;
  g.lineJoin = 'round';
  g.miterLimit = 2;

  words.forEach((w, i) => {
    const cx = x + wds[i] / 2;
    const isAct = i === active;
    const isRed = RED_WORDS.has(w.key);
    const fill = isAct ? (isRed ? PAL.alert : PAL.yellow) : '#FFFFFF';
    const wPop = isAct ? lerp(1.13, 1.06, easeOut(clamp((t - w.inicio) / 0.09))) : 1.0;

    g.save();
    g.translate(cx, y);
    g.scale(wPop, wPop);
    g.shadowColor = 'rgba(0,0,0,.88)';
    g.shadowBlur = 16;
    g.shadowOffsetY = 6;
    g.strokeStyle = '#000000';
    g.lineWidth = Math.max(12, Math.round(fs * 0.21));
    g.strokeText(w.txt, 0, 0);
    g.shadowBlur = 0; g.shadowOffsetY = 0;
    g.fillStyle = fill;
    g.fillText(w.txt, 0, 0);
    g.restore();

    x += wds[i] + sp;
  });
  g.restore();
}

let ccOn = false;
function renderAt(t){
  t = clamp(+t || 0, 0, duration);
  g = main;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  g.filter = 'none';
  g.shadowBlur = 0;
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);

  if (t >= duration - 0.20) return;

  const shot = pickShot(t);
  const katanaActive = drawKatanaOverlay(t);

  if (!katanaActive) {
    const cam = cameraFor(shot, t);
    g.save();
    g.translate(W / 2 + cam.sx, H / 2 + cam.sy);
    g.scale(cam.z, cam.z);
    g.translate(-cam.cx, -cam.cy);
    drawScene(shot, t);
    g.restore();

    finish(shot.vig || 0.60);
    drawClock(t, shot);

    const cutAge = t - shot.start;
    if (shot.id > 1 && cutAge >= 0 && cutAge < 0.06) {
      const k = 1 - cutAge / 0.06;
      g.fillStyle = shot.mood === 'red' ? `rgba(255,59,48,${k * 0.16})` : `rgba(0,0,0,${k * 0.35})`;
      g.fillRect(0, 0, W, H);
    }
  }

  /* Selo permanente "PARTE 1" na zona segura superior esquerda (oculto na CTA) */
  drawParteBadge(t);

  if (ccOn) drawCaptions(t);
}

window.renderAt = renderAt;
window.getDuration = () => duration;
window.getShots = () => SHOTS.map(s => ({ id: s.id, scene: s.scene, mood: s.mood, start: s.start, end: s.end, dur: s.dur }));
window.getKatanaHits = () => KATANA_HITS.map(h => ({ id: h.id, lines: h.lines, start: h.start, end: h.end, dur: h.dur }));
window.getParteLabel = () => parteLabel;
window.setParteLabel = v => { parteLabel = String(v ?? '').trim(); renderAt(cur); };

/* Controles do player */
const $ = id => document.getElementById(id);
const btn = $('play'), seek = $('seek'), out = $('time'), cc = $('cc'), status = $('status');
let playing = false, cur = 0, t0 = 0, p0 = 0;
const fmt = v => v.toFixed(1).replace('.', ',');

function ui(){
  seek.value = cur;
  out.textContent = `${fmt(cur)} / ${fmt(duration)}`;
  seek.setAttribute('aria-valuetext', `${fmt(cur)} de ${fmt(duration)} segundos`);
  $('playLbl').textContent = playing ? 'Pausar' : 'Play';
  $('playIcon').setAttribute('d', playing ? 'M3 2h4v12H3zM9 2h4v12H9z' : 'M4 2l10 6-10 6z');
}
function tick(){
  if (!playing) return;
  cur = Math.min(t0 + (performance.now() - p0) / 1000, duration);
  if (audio && cur < audio.duration && Math.abs(audio.currentTime - cur) > 0.2) audio.currentTime = cur;
  renderAt(cur); ui();
  if (cur >= duration) pause(); else requestAnimationFrame(tick);
}
function play(){
  if (cur >= duration) cur = 0;
  playing = true; t0 = cur; p0 = performance.now();
  if (audio) { audio.currentTime = cur; audio.play().catch(() => {}); }
  ui(); requestAnimationFrame(tick);
}
function pause(){ playing = false; if (audio) audio.pause(); ui(); }
btn.addEventListener('click', () => playing ? pause() : play());
seek.addEventListener('input', () => {
  cur = +seek.value; t0 = cur; p0 = performance.now();
  if (audio && cur < audio.duration) audio.currentTime = cur;
  renderAt(cur); ui();
});
cc.addEventListener('click', () => {
  ccOn = !ccOn; cc.setAttribute('aria-pressed', String(ccOn)); renderAt(cur);
});

async function fetchJson(url){
  if (location.protocol === 'file:') return null;
  try { const r = await fetch(url, { cache: 'no-store' }); if (r.ok) return await r.json(); } catch {}
  return null;
}
function probeAudio(src){
  return new Promise(res => {
    const el = new Audio(); let done = false;
    const fin = v => { if (!done) { done = true; res(v); } };
    el.preload = 'auto';
    el.addEventListener('loadedmetadata', () => fin(el), { once: true });
    el.addEventListener('error', () => fin(null), { once: true });
    setTimeout(() => fin(null), 3500);
    el.src = src;
  });
}

async function load(){
  const [evData, tsData] = await Promise.all([
    fetchJson('audio/eventos.json'),
    fetchJson('audio/timestamps.json')
  ]);
  let a = await probeAudio('audio/mix_final.mp3');
  let audioSrc = 'audio/mix_final.mp3';
  if (!a) { a = await probeAudio('audio/narracao.mp3'); audioSrc = 'audio/narracao.mp3'; }

  if (a && isFinite(a.duration)) audio = a;
  normalizeEvents(evData, audio ? audio.duration : null);

  if (tsData && Array.isArray(tsData.grupos) && tsData.grupos.length) {
    captionGroups = tsData.grupos;
  } else {
    buildPreviewCaptions();
  }

  if (audio && evData) {
    status.textContent = `Audio (${audioSrc}) sincronizado com eventos.json e timestamps.json (${fmt(duration)} s).`;
  } else if (audio) {
    status.textContent = `Audio (${audioSrc}) carregado sem eventos.json (${fmt(duration)} s).`;
  } else {
    status.textContent = `Modo Previa V4: sem audio, usando marcos padrao do roteiro_04 (0 a ${fmt(duration)} s).`;
  }
  seek.max = duration;
  btn.disabled = false; seek.disabled = false; btn.removeAttribute('aria-busy');
  renderAt(cur); ui();
}

normalizeEvents(null, null);
buildPreviewCaptions();
renderAt(0); ui(); load();
})();
</script>
